# Forgejo — git source of truth + CI runner (ADR-0035, supersedes ADR-0033's GitLab).
#
# STAGE 1 of the migration (ROADMAP "GitLab -> Forgejo migration" list): stands this
# stack up ADDITIVE, alongside the still-live GitLab stack (gitlab/docker-compose.yml).
# GitLab remains the actual git source ArgoCD/CI use until the later migration steps
# (Terraform module, CI pipeline port, ArgoCD repoint, script/Makefile rename) land and
# are verified live — do NOT point anything at this instance yet.
#
# Runs OUTSIDE the cluster, same architectural tier as GitLab was (ADR-0033/ADR-0035),
# reachable from the Mac at http://localhost:3300 and from cluster pods at
# http://host.k3d.internal:3300 (both hit the same container via Colima's docker).
# Distinct ports from GitLab's 8929/2222 so both stacks can run side by side during
# the migration window.
services:
  forgejo:
    # Pinned explicit version (not `:latest` — Forgejo doesn't even publish that tag)
    # per ADR-0030's precedent. v16.0.2 is the newest stable release as of 2026-08-11
    # (confirmed via the Codeberg API tags list). Bump deliberately via a future PR.
    image: codeberg.org/forgejo/forgejo:16.0.2
    container_name: forgejo
    hostname: forgejo.local
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      # Unattended install (no setup wizard): sqlite3 is enough for this lab's scale
      # (single user, a handful of repos) and keeps the footprint down — the whole
      # point of this migration (ADR-0035's measured 3.7 GiB GitLab cost). Disable
      # public self-registration; this is a single-operator lab instance.
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3300/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "2223"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      # Found live 2026-08-13, first `make forgejo-up`: the GITEA__* env vars above
      # generate a mostly-complete app.ini, but nothing here actually skips Forgejo's
      # own setup wizard — that's a distinct flag, not implied by "database type is
      # configured". Without it INSTALL_LOCK stays `false`, the web process serves
      # the interactive install page instead of running DB migrations, and every
      # `forgejo admin ...` CLI call fails ("Unable to load config file for a
      # installed Forgejo instance" — MustInstalled() check). This is the actual
      # unattended-install switch; setting it makes the container's first boot run
      # migrations and start serving normally instead of waiting on the wizard.
      GITEA__security__INSTALL_LOCK: "true"
      # GOMAXPROCS=1 + GODEBUG=asyncpreemptoff=1 — same QEMU-emulation root cause and
      # fix as Harbor's core/jobservice (gitops/platform/harbor.yaml's identical
      # comment): this host is Apple Silicon (arm64), Forgejo's image is amd64-only
      # ("requested image's platform (linux/amd64) does not match the detected host
      # platform (linux/arm64/v8)" — logged on every `docker compose up`), so the
      # binary runs under QEMU user-mode x86_64 emulation the whole time it's up.
      # Found live 2026-08-13, first real `make forgejo-up` after fixing INSTALL_LOCK:
      # a genuine Go runtime crash inside the GC's background mark workers on
      # startup (`goroutine ... [GC worker (active/idle)]`, gcBgMarkWorker /
      # gcBgMarkStartWorkers) — the same async-preemption-under-emulation memory-
      # corruption class Harbor hit, not an application bug. Same fix, same live
      # verification requirement before assuming it's actually resolved.
      GOMAXPROCS: "1"
      GODEBUG: "asyncpreemptoff=1"
    ports:
      - "3300:3000"
      - "2223:2223"
    # Named volume (NOT a Mac bind mount): GitLab's omnibus image hit a Colima
    # virtiofs setgid bug on bind-mounted repo storage (see gitlab/docker-compose.yml's
    # comment) — using a named volume here from the start avoids needing to rediscover
    # that the same way.
    volumes:
      - forgejo_data:/data
    healthcheck:
      # Forgejo doesn't ship a Docker-level HEALTHCHECK (unlike the gitlab/gitlab-ce
      # image) — /api/healthz is Forgejo/Gitea's own liveness endpoint.
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # CI runner for .forgejo/workflows/*.yml (ported from .gitlab-ci.yml in a later
  # migration step). Docker executor so job-declared services can run. Registered
  # against this Forgejo instance via config.yml (gitignored — carries a live runner
  # registration token, generated by `make forgejo-runner-up`, not committed).
  # GitLab's own history is the cautionary precedent here (ADR-0035): it ran with no
  # runner at all for a long stretch before that gap was found (#631, #1026) — the
  # runner's presence and registration must be verified live once wired, not assumed.
  #
  # Found live 2026-08-13: the image ships no entrypoint script and no default
  # CMD ("register has been deprecated" is only a warning, not a removal — but
  # without an explicit command the raw `forgejo-runner` binary just prints usage
  # and exits, which `restart: unless-stopped` turns into a crash-restart loop).
  # `daemon` is the actual long-running process; it needs config.yml's registration
  # (written by `forgejo-runner register`, run once via `make forgejo-runner-up`,
  # not at container start — registration writes a live token-derived `.runner`
  # file that must not be regenerated on every restart).
  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:13.0.0
    container_name: forgejo-runner
    command: ["forgejo-runner", "daemon", "--config", "/data/config.yml"]
    restart: unless-stopped
    depends_on:
      forgejo:
        condition: service_healthy
    # Found live 2026-08-13: this image's default user is 1000:1000, not root
    # (the predecessor CI runner this migration replaces never hit this — its own
    # image runs as root) — mounting the host's docker.sock without group access
    # hits "permission denied ... at unix:///var/run/docker.sock" on every job,
    # since the socket is owned root:docker mode 660 and UID 1000 isn't in that
    # group. group_add joins the docker group by GID (verified live via
    # `colima ssh -- getent group docker`) without needing to run the whole
    # container as root. GID is Colima-assigned, not guaranteed identical on a
    # different host — re-check with the same command if this ever needs to move.
    group_add:
      - "991"
    volumes:
      - ./runner-config:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  forgejo_data:
