# Capstone CI pipeline: builds the hello demo image, pushes it to the in-lab
# Harbor Docker registry, and cosign-signs the pushed image.
# Runs on the local GitLab instance.
#
# Credential prerequisites (no plaintext stored here — all values live in Vault):
#   1. make vault-bootstrap          seeds secret/harbor/registry in Vault
#   2. Retrieve the generated password:
#        vault kv get secret/harbor/registry
#   3. In GitLab → Settings → CI/CD → Variables, add masked + protected variables:
#        HARBOR_USER          ← username field from step 2
#        HARBOR_PASSWORD      ← password field from step 2
#      (repoints the pipeline at Harbor creds — these GitLab CI/CD variables are
#      not GitOps-managed, so the maintainer must set them outside this repo)
#
# Cosign signing prerequisites (RFC #214 — Objective O4):
#   4. make cosign-bootstrap         generates infra/secrets/cosign/cosign.key + cosign.pub
#   5. In GitLab → Settings → CI/CD → Variables, add a masked variable of type File:
#        COSIGN_KEY           ← contents of infra/secrets/cosign/cosign.key
#      (type = File, masked, protected — GitLab writes the value to a temp file
#       and exposes its path in $COSIGN_KEY; never store the raw key as a plain variable)
#
# Component prerequisites:
#   make harbor-up                   Harbor must be running before first push
#   Images push to the "library" project — Harbor's built-in default project,
#   no manual repository creation needed.
#
# The in-cluster ESO ExternalSecret (gitops/secrets/harbor-registry-externalsecret.yaml)
# makes the same credentials available to pods as an imagePullSecret in namespace capstone.
# The Kyverno verifyImages ClusterPolicy (gitops/kyverno/policies/verify-image-signatures.yaml)
# enforces that only cosign-signed images are admitted once $COSIGN_KEY is set here.

stages:
  - build
  - sign

variables:
  # :8080 is required — that's the actual published host port for the k3d gateway
  # (infra/modules/k3d-cluster/variables.tf http_port, fixed at 8080). Without an
  # explicit port, `docker login`/`push` default to port 80 over plain HTTP, which
  # nothing listens on from the runner's job containers (found live 2026-08-03: they
  # run as Docker siblings, not on the Mac host, so the bare hostname resolves to the
  # gitlab_default bridge gateway on port 80, not the k3d LB's published :8080).
  REGISTRY: "harbor.127.0.0.1.nip.io:8080"
  IMAGE_NAME: "library/hello"

build-and-push:
  stage: build
  # Bumped docker:24 -> docker:29 (2026-07-28, executor currency check): the official
  # `docker` image's `24`/`24-dind` tags last received an update 2024-07-26 (2 years
  # stale, verified via the real Docker Hub API -- Docker no longer patches that major
  # line) while `29`/`29-dind` is the actively-maintained tag (last updated 11 days
  # before this check). This job only uses docker build/push/tag/login/logout, the
  # DOCKER_HOST/DOCKER_TLS_CERTDIR env vars, and dockerd's --insecure-registry flag --
  # all stable across every Docker Engine major release; this remote session cannot
  # run a real GitLab pipeline regardless (no live GitLab), so make ci's clusterless
  # structural bats coverage is the verification ceiling here, same as every other
  # .gitlab-ci.yml change in this repo's history. Flip condition for the next audit:
  # revisit when `docker`'s `29` tag itself goes stale (no update in the last year).
  image: docker:29
  services:
    # Allow HTTP pushes to the in-lab registry (no TLS on the nip.io route).
    - name: docker:29-dind
      alias: docker
      command: ["--insecure-registry=harbor.127.0.0.1.nip.io:8080"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USER" --password-stdin
  script:
    - docker build -t "$REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" gitops/apps/demo/
    - docker push "$REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker tag "$REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$REGISTRY/$IMAGE_NAME:latest"
    - docker push "$REGISTRY/$IMAGE_NAME:latest"
  after_script:
    - docker logout "$REGISTRY" || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

sign-image:
  stage: sign
  # Digest-pinned 2026-07-28 (executor currency check): the `bitnami/cosign:2` tag
  # this job pinned no longer exists -- verified directly against the real Docker
  # Hub API (`GET /v2/repositories/bitnami/cosign/tags/2` returns a 404 "tag '2' not
  # found"). Bitnami has moved this image to its "Secure Images" model, which only
  # publishes `latest` and content-addressed `sha256-<digest>` tags -- no more
  # semver-numbered tags at all, so there is no looser floating tag to fall back to.
  # Same reasoning as the cloudlena/s3manager digest-pin (PR #796): pin the real
  # digest behind the current `latest` tag rather than a tag that will drift or
  # vanish again. Digest below = bitnami/cosign:latest's manifest-list digest as of
  # 2026-07-28 (last_updated 2026-07-17 per the Docker Hub API), covering both amd64
  # and arm64 GitLab runners. Flip condition: revisit if Bitnami ever republishes
  # numbered tags, or when this digest's underlying image goes stale.
  image: bitnami/cosign@sha256:db4d480f96235bca0433be791ea156cf51c3c7b62874618d8fcacecc86555aee
  # COSIGN_KEY must be a GitLab CI variable of type File (masked, protected).
  # GitLab writes the file content to a temp path and exposes it as $COSIGN_KEY.
  # Set it in: GitLab → Settings → CI/CD → Variables → Add variable
  #   Key:   COSIGN_KEY
  #   Type:  File
  #   Value: contents of infra/secrets/cosign/cosign.key  (from make cosign-bootstrap)
  #   Mask:  enabled   Protected: enabled
  variables:
    COSIGN_PASSWORD: ""
    # Disable Rekor transparency-log upload — no outbound internet in the lab.
    COSIGN_EXPERIMENTAL: "0"
  before_script:
    - mkdir -p /tmp/cosign
    - cp "$COSIGN_KEY" /tmp/cosign/cosign.key
  # Only the $CI_COMMIT_SHORT_SHA tag is signed here, even though build-and-push
  # also pushes :latest (which is what gitops/apps/capstone/deployment.yaml and
  # rollout.yaml actually reference). This is NOT a gap: cosign's signature is
  # attached to the image's content digest (pushed as a "sha256-<digest>.sig"
  # tag in the same repo), not to the tag name used at sign time. Since `docker
  # tag` in build-and-push makes :latest an alias for the exact same digest as
  # :$CI_COMMIT_SHORT_SHA, signing either tag produces one signature that both
  # tags resolve to -- and Kyverno's verifyImages (gitops/kyverno/policies/
  # verify-image-signatures.yaml) verifies by resolving the deployed image
  # reference to its digest first, the same way. Don't "fix" this into signing
  # both tags -- it would be redundant, not a correctness improvement.
  script:
    - cosign sign
        --key /tmp/cosign/cosign.key
        --allow-insecure-registry
        --registry-username "$HARBOR_USER"
        --registry-password "$HARBOR_PASSWORD"
        "$REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  after_script:
    - rm -rf /tmp/cosign
  needs:
    - build-and-push
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
