# Capstone CI pipeline: builds the hello demo image, pushes it to the in-lab
# Harbor Docker registry, and cosign-signs the pushed image.
# Runs on the Forgejo instance (ADR-0035 migration stage 3 of 6) — a straight port
# of the CI pipeline file at the repo root this migration supersedes, translated to
# Forgejo Actions syntax. The prior pipeline keeps running unmodified until
# migration item 6; this file is additive and not yet what actually builds/pushes
# capstone images (that switchover, and its own live verification, is a later
# migration item once ArgoCD/CI are actually re-pointed at this Forgejo instance).
#
# Credential prerequisites (no plaintext stored here — all values live in Vault,
# same as the predecessor pipeline's prerequisites, just a different UI to paste
# them into):
#   1. make vault-bootstrap          seeds secret/harbor/registry in Vault
#   2. Retrieve the generated password:
#        vault kv get secret/harbor/registry
#   3. In Forgejo → repo Settings → Actions → Secrets, add:
#        HARBOR_USER          ← username field from step 2
#        HARBOR_PASSWORD      ← password field from step 2
#      (these Forgejo Actions secrets are not GitOps-managed, so the maintainer
#      must set them outside this repo, exactly like the predecessor pipeline's
#      CI/CD variables)
#
# Cosign signing prerequisites (RFC #214 — Objective O4):
#   4. make cosign-bootstrap         generates infra/secrets/cosign/cosign.key + cosign.pub
#   5. In Forgejo → repo Settings → Actions → Secrets, add:
#        COSIGN_KEY           ← contents of infra/secrets/cosign/cosign.key
#      Forgejo Actions secrets have no "File type" variant the way the predecessor
#      pipeline's platform did — every secret is a plain string, so the sign-image
#      job below writes it to a temp file itself (see its first step) instead of
#      relying on a platform-provided temp path.
#
# Checkout prerequisite (found live 2026-08-17 — see the checkout step's own
# comment for the full "why not actions/checkout@v4" story):
#   6. In Forgejo, generate a personal access token for the repo's admin account
#      (Settings → Applications → Generate New Token, write:repository scope is
#      enough) and add it as a repo Actions secret:
#        CHECKOUT_TOKEN       ← the generated token value
#
# Component prerequisites:
#   make harbor-up                   Harbor must be running before first push
#   Images push to the "library" project — Harbor's built-in default project,
#   no manual repository creation needed.
#
# The in-cluster ESO ExternalSecret (gitops/secrets/harbor-registry-externalsecret.yaml)
# makes the same credentials available to pods as an imagePullSecret in namespace capstone.
# The Kyverno verifyImages ClusterPolicy (gitops/kyverno/policies/verify-image-signatures.yaml)
# enforces that only cosign-signed images are admitted once $COSIGN_KEY is set here.
#
# ADR-0004 caveat (this item's own "verify live" requirement — see ROADMAP.md): this
# file was authored and structurally validated (YAML shape, tests/forgejo-ci.bats)
# from a clusterless remote session with no live Forgejo/forgejo-runner instance to
# actually execute it against. Mechanics needing a real run to confirm, each called
# out at its own step:
#   (a) `container.options: --privileged` is permitted by forgejo-runner's config.yml
#       (gitignored, not yet committed — see forgejo/docker-compose.yml's comment).
#   (b) manually starting dockerd with --insecure-registry inside the job container
#       works the same way the predecessor pipeline's Docker-in-Docker *service*
#       command-override did (Forgejo/GitHub Actions' `services:` schema has no
#       command-override field, which is why this uses a privileged single-container
#       Docker-in-Docker pattern instead of a companion service container — a
#       deliberate structural difference from the predecessor pipeline, not an
#       oversight).
#
# `actions/checkout@v4` deliberately NOT used (found live 2026-08-17, the same
# session that completed the git-source cutover): Forgejo's default actions-proxy
# resolves marketplace actions by git-cloning them from data.forgejo.org at run
# time, and that host was consistently unreachable from this lab's job containers
# (`docker run --rm curlimages/curl ... https://data.forgejo.org` timed out
# repeatedly, alongside github.com — the same class of Colima-VM egress flakiness
# documented elsewhere in this repo, while the exact same host was reachable in
# under 150ms from the Mac host directly. Every run through #13 failed at the "Set up job" step trying to
# fetch this one marketplace action, before any of the job's own logic ever ran.
# Replaced with a plain `git clone` against Forgejo's own internal HTTP endpoint
# (no external network hop at all) using a repo-scoped access token — see the
# checkout step below and its own CHECKOUT_TOKEN prerequisite note.

name: build-sign-push

on:
  push:
    branches: [main]

env:
  # :8080 is required — the k3d gateway's published host port.
  #
  # Kept as harbor.127.0.0.1.nip.io, NOT switched to host.docker.internal — found
  # live 2026-08-17-18, the hard way: nip.io's 127.0.0.1 resolution is only correct
  # from the *host's* perspective (from inside this job's own container, 127.0.0.1
  # means the job container itself — "connection refused", nothing listens there),
  # so a first attempt renamed REGISTRY to host.docker.internal. That built and
  # "pushed" without error, but the artifact silently never landed in Harbor:
  # Envoy Gateway's HTTPRoute for Harbor matches on the `Host` header
  # (harbor.127.0.0.1.nip.io), and swapping the hostname changed that header too —
  # every push request fell through to Envoy's wildcard/default route (Grafana, as
  # it happened) instead, which happily 302-redirected the PUTs and made docker
  # push exit 0 with nothing ever reaching Harbor. The `Host` header the client
  # sends and the address it dials are two different things — this only needed
  # fixing the *second* one. See "Resolve host bridge" below: it now overrides
  # harbor.127.0.0.1.nip.io's own resolution in /etc/hosts to point at this
  # container's default-route gateway IP, instead of introducing a second hostname.
  REGISTRY: harbor.127.0.0.1.nip.io:8080
  IMAGE_NAME: library/hello

jobs:
  build-and-push:
    runs-on: docker
    timeout-minutes: 20
    container:
      # Pinned the floating `29` tag to the exact patch `29.7.2` (2026-08-17,
      # planner-fallback gap analysis): Docker Hub's tags API confirms `docker:29`'s
      # amd64-layer digest is byte-identical to `docker:29.7.2`'s digest -- a
      # pin-what's-already-running change, not a version bump.
      image: docker:29.7.2
      # Privileged so dockerd can run inside this same container (Docker-in-Docker)
      # instead of a companion service container — see ADR-0004 caveat (c) above.
      options: --privileged
    steps:
      # Plain git clone against Forgejo's own internal HTTP endpoint, not
      # actions/checkout@v4 — see the file-header comment above for why.
      # CHECKOUT_TOKEN prerequisite: a Forgejo access token (write:repository scope
      # is enough — checkout only needs read, but that's the narrowest scope the
      # token API groups it under) added as a repo Actions secret. Generated via
      # POST /api/v1/users/{user}/tokens with the admin account, scoped to this
      # single purpose — distinct from HARBOR_USER/HARBOR_PASSWORD and COSIGN_KEY.
      - name: Checkout
        run: |
          git clone --no-checkout "http://lab-admin:${{ secrets.CHECKOUT_TOKEN }}@forgejo:3000/${GITHUB_REPOSITORY}.git" .
          git checkout "$GITHUB_SHA"

      - name: Resolve $REGISTRY's host to this container's default gateway
        # /etc/hosts entries win over nip.io's own DNS answer, so this overrides
        # harbor.127.0.0.1.nip.io's resolution *without* changing the hostname
        # itself — the Host header docker/cosign send has to stay
        # harbor.127.0.0.1.nip.io for Envoy Gateway's HTTPRoute to match it (see
        # the REGISTRY env var's own comment for the full story of getting this
        # wrong the first time). Parses /proc/net/route directly instead of
        # shelling out to `ip route` — portable across both job containers in this
        # workflow (docker:29.7.2 has `ip`; the sign-image job's bitnami/cosign
        # image, a minimal Photon OS image, does not) without needing two
        # different implementations.
        run: |
          gw_hex="$(awk '$2 == "00000000" {print $3; exit}' /proc/net/route)"
          [ -n "$gw_hex" ] || { echo "could not determine default gateway"; exit 1; }
          gw="$(printf '%d.%d.%d.%d' 0x${gw_hex:6:2} 0x${gw_hex:4:2} 0x${gw_hex:2:2} 0x${gw_hex:0:2})"
          echo "$gw harbor.127.0.0.1.nip.io" >> /etc/hosts

      - name: Start dockerd (insecure registry for the in-lab Harbor route)
        run: |
          dockerd --insecure-registry="$REGISTRY" &
          for i in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 1
          done
          docker info >/dev/null 2>&1 || { echo "dockerd did not come up in time"; exit 1; }

      # retry_cmd ported from the predecessor pipeline's identical before_script
      # function (6 attempts, 15s backoff) — found live 2026-08-18 that this
      # workflow had dropped it entirely during the port to Forgejo Actions syntax,
      # so every network-facing step (login, base-image pull during build, push)
      # had zero retry coverage. Confirmed missing the hard way: a real run failed
      # outright on `docker build`'s base-image pull hitting the documented
      # Colima-VM egress flakiness against auth.docker.io (same class this repo has
      # hit against quay.io, mirror.gcr.io, data.forgejo.org — see this file's other
      # comments for the fuller history) — a transient blip that a bare retry
      # would have absorbed.
      - name: Login to Harbor
        run: |
          # Found live 2026-08-19 (#633 verification): max=6/delay=15s gives only
          # ~75s of total retry budget. Harbor's core/registry containers run under
          # QEMU x86_64 emulation on this arm64 host (see harbor.yaml's own
          # GOMAXPROCS/GODEBUG comments) and crash under real sustained I/O load;
          # observed live recovery time from a crash back to genuinely stable is
          # routinely 2-4+ minutes, not seconds -- so the old budget reliably ran
          # out mid-recovery, failing the whole job even though Harbor came back up
          # moments later. Bumped to max=14/delay=30s (~6.5 minutes of budget),
          # comfortably outlasting the observed recovery window.
          retry_cmd() {
            local n=0 max=14 delay=30
            until "$@"; do
              n=$((n+1))
              [ "$n" -ge "$max" ] && { echo "retry_cmd: giving up after $n attempts: $*" >&2; return 1; }
              echo "retry_cmd: attempt $n failed, retrying in ${delay}s: $*" >&2
              sleep "$delay"
            done
          }
          retry_cmd sh -c 'echo "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USER" --password-stdin'
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build, tag, and push
        run: |
          # See "Login to Harbor" step's comment: same host-recovery-time-vs-budget
          # mismatch, same fix (max=14/delay=30s).
          retry_cmd() {
            local n=0 max=14 delay=30
            until "$@"; do
              n=$((n+1))
              [ "$n" -ge "$max" ] && { echo "retry_cmd: giving up after $n attempts: $*" >&2; return 1; }
              echo "retry_cmd: attempt $n failed, retrying in ${delay}s: $*" >&2
              sleep "$delay"
            done
          }
          sha="${GITHUB_SHA:0:8}"
          # --build-arg REGISTRY: gitops/apps/demo/Dockerfile's FROM now pulls the
          # base image from Harbor's own mirror (found live 2026-08-18: docker.io's
          # auth-token endpoint was the one consistently-unreachable hop in this whole
          # pipeline, unlike the Login to Harbor step a few lines above, which was
          # solid) — see that Dockerfile's own comment for the full story. Passing
          # REGISTRY here keeps the two in sync instead of hardcoding it twice.
          retry_cmd docker build --build-arg "REGISTRY=$REGISTRY" -t "$REGISTRY/$IMAGE_NAME:$sha" gitops/apps/demo/
          retry_cmd docker push "$REGISTRY/$IMAGE_NAME:$sha"
          docker tag "$REGISTRY/$IMAGE_NAME:$sha" "$REGISTRY/$IMAGE_NAME:latest"
          retry_cmd docker push "$REGISTRY/$IMAGE_NAME:latest"

      - name: Logout
        if: always()
        run: docker logout "$REGISTRY" || true

  sign-image:
    needs: build-and-push
    runs-on: docker
    timeout-minutes: 10
    # Digest-pinned, same rationale and same digest as the predecessor pipeline's
    # sign-image job (bitnami/cosign no longer publishes semver tags — see that
    # job's comment for the full explanation). Keep these two pins moving together.
    container:
      image: bitnami/cosign@sha256:db4d480f96235bca0433be791ea156cf51c3c7b62874618d8fcacecc86555aee
      # Found live 2026-08-17 (run #26): bitnami images default to a non-root UID
      # (1001), unlike build-and-push's docker:29.7.2 (root by default) — the
      # identically-named "Resolve $REGISTRY's host" step below failed outright
      # with `/etc/hosts: Permission denied` since that file is root-owned.
      # --user root matches this job to build-and-push's effective privilege
      # level for the one step that needs to write to it.
      options: --user root
    env:
      COSIGN_PASSWORD: ""
      # Disable Rekor transparency-log upload — no outbound internet in the lab.
      COSIGN_EXPERIMENTAL: "0"
    steps:
      - name: Write cosign key from the Forgejo Actions secret
        run: |
          mkdir -p /tmp/cosign
          printf '%s' "${{ secrets.COSIGN_KEY }}" > /tmp/cosign/cosign.key

      # Same fix, same reason as build-and-push's identically-named step — a
      # separate job runs in a separate container, so REGISTRY's host needs
      # resolving here too. bitnami/cosign's minimal Photon OS base has no `ip`
      # command, which is exactly why this parses /proc/net/route instead.
      - name: Resolve $REGISTRY's host to this container's default gateway
        run: |
          gw_hex="$(awk '$2 == "00000000" {print $3; exit}' /proc/net/route)"
          [ -n "$gw_hex" ] || { echo "could not determine default gateway"; exit 1; }
          gw="$(printf '%d.%d.%d.%d' 0x${gw_hex:6:2} 0x${gw_hex:4:2} 0x${gw_hex:2:2} 0x${gw_hex:0:2})"
          echo "$gw harbor.127.0.0.1.nip.io" >> /etc/hosts

      # Only the short-SHA tag is signed here, even though build-and-push also
      # pushes :latest — same reasoning as the predecessor pipeline's sign-image
      # job: `docker tag` makes :latest an alias for the exact same digest as the
      # short-SHA tag, so cosign's digest-based signature covers both tags from one
      # signing call. Don't "fix" this into signing both tags — it would be
      # redundant.
      # --tlog-upload=false and --use-signing-config=false: found live 2026-08-18
      # (run #27, the first attempt to ever reach this step — see this file's other
      # comments for the chain of prerequisite bugs that blocked every earlier
      # attempt). cosign's default behavior tries to fetch a TUF-provided signing
      # config from the public Sigstore infra (tuf-repo-cdn.sigstore.dev) even for
      # pure local-key signing with no Fulcio/Rekor involved — irrelevant to this
      # flow and unreachable from this lab (`dial tcp ...:443: i/o timeout`, no
      # outbound internet by design). Both flags are cosign's own documented way to
      # opt out (`cosign sign --help`'s own example line is literally `cosign sign
      # --key cosign.key --tlog-upload=false <IMAGE DIGEST>`).
      #
      # --allow-http-registry: found live 2026-08-18 (run #28, one step further
      # again): --allow-insecure-registry alone was NOT enough — per cosign's own
      # --help text, that flag only relaxes TLS *certificate* validation (expired/
      # self-signed certs), it doesn't switch the scheme from HTTPS to HTTP. cosign
      # still tried `https://harbor.127.0.0.1.nip.io:8080/v2/` and got `server gave
      # HTTP response to HTTPS client`. --allow-http-registry is the distinct flag
      # that actually speaks plain HTTP, matching how docker login/build/push
      # already talk to this same plain-HTTP-behind-Envoy-Gateway route elsewhere
      # in this workflow.
      - name: Sign the pushed image
        run: |
          sha="${GITHUB_SHA:0:8}"
          cosign sign \
            --key /tmp/cosign/cosign.key \
            --allow-insecure-registry \
            --allow-http-registry \
            --tlog-upload=false \
            --use-signing-config=false \
            --registry-username "${{ secrets.HARBOR_USER }}" \
            --registry-password "${{ secrets.HARBOR_PASSWORD }}" \
            "$REGISTRY/$IMAGE_NAME:$sha"

      - name: Clean up
        if: always()
        run: rm -rf /tmp/cosign
