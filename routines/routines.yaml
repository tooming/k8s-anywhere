# Declarative source of truth for the scheduled remote agents ("routines") that
# develop this repo. The claude.ai backend is the RUNNING state; this file is the
# DESIRED state. Edit here + the referenced *.prompt.md, open a PR, and after merge
# ask Claude Code to "apply the routines" — it syncs the backend to match. See README.md.

environment_id: env_014NJKuQoEb7PAi3PXaFW2B9   # Anthropic cloud (Default)
source: https://github.com/tooming/k8s-lab     # repo cloned into each run

# Quota math (WAYS-OF-WORKING.md §5 — 5 runs / rolling 24h free):
#   executor 3/day baseline, plus one daily routine-of-the-day:
#   Mon=planner, Tue=architect, Wed=triager, Thu=upgrade-drafter + planner,
#   Fri=doc-drift, Sat=triager, Sun=industry-news-writer.
#   Thursday hits the 5/day cap (3+upgrade+planner); other days run at 4/5.
#   The standalone reviewer routine was RETIRED (its daily slot funded the executor's
#   return to 3/day): cron-based review kept lagging PR-open — PRs were merged between
#   slots and the reviewer filed idle issues (see #160). First-pass review now happens
#   IN the producing run: every PR-producing routine (executor/planner/architect/
#   upgrade-drafter) self-reviews its diff and posts a `[self-review]` comment +
#   `self-reviewed` label before its run ends. Merge stays human (Red-tier).
#   learning-post-writer was replaced by industry-news-writer (Sun slot) to unblock
#   the architect's ADR audit cycle (see issue #94 / docs/industry/).

routines:
  # The EXECUTOR — implements one ROADMAP item per run.
  - name: k8s-lab autonomous dev
    trigger_id: trig_01CRtpmaS1scBQL74xKqmfvS
    cron: "0 */8 * * *"            # every 8h = 3/day (restored from 2/day — reviewer retirement freed the slot)
    model: claude-sonnet-4-6
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: executor.prompt.md
    branch_prefix: auto/           # PRs land on auto/<slug>
    max_tier: green                # WAYS-OF-WORKING.md autonomy tier

  # The PLANNER — grooms CHARTER gaps + GitHub issues into ROADMAP items.
  - name: k8s-lab planner
    trigger_id: trig_015uWP3Hv1LTREpKzzkMkpUE
    cron: "0 6 * * 1,4"           # twice weekly, Mon + Thu 06:00 UTC (~09:00 Europe/Tallinn) — bumped from weekly after PR #124
    model: claude-opus-4-7
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: planner.prompt.md
    branch_prefix: plan/           # plan-only PRs land on plan/<slug>
    max_tier: green

  # The ARCHITECT — researches best practices and opens RFC issues for 🟡 backlog items.
  - name: k8s-lab architect
    trigger_id: trig_01SpewghyraZDSrLoGA32nBe
    cron: "0 6 * * 2"             # weekly, Tuesdays 06:00 UTC (day after the planner)
    model: claude-opus-4-7
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: architect.prompt.md
    branch_prefix: arch/           # PRs land on arch/<slug>
    max_tier: green                # ROADMAP grooming + GitHub issues only

  # The REVIEWER was retired 2026-06-10: first-pass review now happens inside each
  # PR-producing run (the `[self-review]` step in executor/planner/architect/
  # upgrade-drafter prompts). The backend trigger trig_01Dw7US6aZmJo8XZwDikoNkG is
  # kept DISABLED (the trigger API has no delete) so this file remains the audit trail.

  # The TRIAGER — labels open GitHub issues with domain / tier / priority.
  - name: k8s-lab triager
    trigger_id: trig_01E6ugxYJY6yGzwvSHSgFaCx
    cron: "0 12 * * 3,6"           # Wed + Sat 12:00 UTC (~15:00 Europe/Tallinn), 2/week
    model: claude-sonnet-4-6
    enabled: true
    allowed_tools: [Bash, Read, Glob, Grep]   # labels-only — no Write/Edit, no PRs
    prompt_file: triager.prompt.md
    branch_prefix: ""              # no branch — labels via gh
    max_tier: green                # labels only

  # The UPGRADE DRAFTER — bumps existing chart/image versions, one PR per run.
  - name: k8s-lab upgrade-drafter
    trigger_id: trig_01UyN9qcTFvWD14k38tn49K1
    cron: "0 9 * * 4"              # weekly, Thursdays 09:00 UTC
    model: claude-sonnet-4-6
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: upgrade-drafter.prompt.md
    branch_prefix: upgrade/        # PRs land on upgrade/<component>-<from>-to-<to>
    max_tier: green                # same-source bumps only (see prompt's tier note)

  # The DOC-DRIFT AUTHOR — reconciles README + dependency-tree + lab-UI drift.
  - name: k8s-lab doc-drift-author
    trigger_id: trig_01AibRNtdZLqLu3a58jDxnFk
    cron: "0 9 * * 5"              # weekly, Fridays 09:00 UTC
    model: claude-sonnet-4-6
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: doc-drift-author.prompt.md
    branch_prefix: sync/           # PRs land on sync/docs-drift-YYYY-WW
    max_tier: green

  # The INDUSTRY-NEWS-WRITER — produces docs/industry/YYYY-W##-digest.md each week.
  # Runs Sundays so the digest is ready when the architect runs on Tuesdays.
  # Replaced the learning-post-writer in the Sun quota slot to unblock ADR audits.
  - name: k8s-lab industry-news-writer
    trigger_id: trig_01GNuyixzT3TBDF7Mk4ZeSTr
    cron: "0 8 * * 0"              # weekly, Sundays 08:00 UTC (before architect's Tue 06:00)
    model: claude-sonnet-4-6
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: industry-news-writer.prompt.md
    branch_prefix: digest/         # PRs land on digest/YYYY-W##
    max_tier: green

# Local-only roles (NOT remote routines — they need Colima and the live cluster).
# Invoked on demand by the maintainer; not registered with the backend, no cron,
# no quota cost. Documented here so the family is discoverable in one place.
local_roles:
  - name: verifier
    prompt_file: verifier.prompt.md
    purpose: end-to-end verify an auto/* PR by bringing the lab up on its branch
    invoke: claude --prompt routines/verifier.prompt.md "verify auto/<slug>"

  - name: operator
    prompt_file: operator.prompt.md
    purpose: on-call pulse check, DR drills, incident-issue filing
    invoke: claude --prompt routines/operator.prompt.md "check the lab"
