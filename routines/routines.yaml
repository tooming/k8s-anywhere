# Declarative source of truth for the scheduled remote agents ("routines") that
# develop this repo. The claude.ai backend is the RUNNING state; this file is the
# DESIRED state. Edit here + the referenced *.prompt.md, open a PR, and after merge
# ask Claude Code to "apply the routines" — it syncs the backend to match. See README.md.

environment_id: env_014NJKuQoEb7PAi3PXaFW2B9   # Anthropic cloud (Default)
source: https://github.com/tooming/k8s-anywhere  # repo cloned into each run (renamed from k8s-lab 2026-07-13)

# Quota math (WAYS-OF-WORKING.md §5 — 5 runs / rolling 24h free):
#   NO ACTIVE TRIGGER RIGHT NOW — see "AWAITING REPLACEMENT" below. Once
#   recreated: one trigger, cron "0 21,22,23,0,1 * * *" — fires at 21:00, 22:00,
#   23:00, 00:00, 01:00 UTC every day. Exactly 5 runs/day, 7 days/week.
#
# NIGHT-TIME SCHEDULE + CREDIT SAFETY (rolling-24h-proof):
#   All runs fire in a fixed nightly window (Europe/Tallinn: ~23:00–04:00 local).
#   Because the set of fire-times is identical every day, every rolling 24h window
#   contains exactly 5 runs — the schedule can never spill past the free cap.
#
# FALLBACK CHAIN (executor.prompt.md STEP 6b):
#   When the ROADMAP lane is empty the executor escalates through:
#   planner → architect → upgrade-drafter → doc-drift → triager → janitor → idle issue.
#   Specialist prompt files are kept in-repo as fallback targets and for on-demand
#   local invocations (see local_roles below). They are no longer separate triggers.
#
# AWAITING REPLACEMENT (2026-07-15, see #423): trig_01CRtpmaS1scBQL74xKqmfvS was
# disabled and retired below. It was created via the raw claude.ai HTTP API back
# in May, before the Routines UI's repo-selector flow existed, and never had
# GitHub API/repo access attached to the session — git clone/push worked fine,
# but every `gh` call (gh pr list/create, gh issue create, ...) was denied with
# "GitHub access to this repository is not enabled for this session. Use
# add_repo to request access", and no add_repo tool was reachable from inside
# that session to self-remediate. Since the executor contract is entirely
# gh-dependent (STEP 2, STEP 6, STEP 7, every fallback role), no run could ever
# deliver a PR or issue. The replacement must be created through the Routines
# UI's own repo-selector (confirmed to grant working repo/API access to ad-hoc
# dispatched sessions), not via RemoteTrigger create — recreating through the
# API would reproduce the same gap. Once the new trigger is created and verified
# (a manual run that gets past `gh pr list`), add it below with the same cron/
# model/allowed_tools/prompt_file as the retired entry.

routines:
