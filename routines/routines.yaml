# Declarative source of truth for the scheduled remote agents ("routines") that
# develop this repo. The claude.ai backend is the RUNNING state; this file is the
# DESIRED state. Edit here + the referenced *.prompt.md, open a PR, and after merge
# ask Claude Code to "apply the routines" — it syncs the backend to match. See README.md.

environment_id: env_014NJKuQoEb7PAi3PXaFW2B9   # Anthropic cloud (Default)
source: https://github.com/tooming/k8s-lab     # repo cloned into each run

# Quota math (WAYS-OF-WORKING.md §5 — 5 runs / rolling 24h free; ALL slots filled):
#   Two executor triggers cover all 5 daily slots, every day of the week.
#     21:00 / 22:00 / 23:00 UTC = trigger 1 (3/day)
#     00:00 / 01:00 UTC         = trigger 2 (2/day)
#   Total: exactly 5 executor runs/day, 7 days/week. One prompt, one model.
#
# NIGHT-TIME SCHEDULE + CREDIT SAFETY (rolling-24h-proof):
#   All runs fire in a fixed nightly window — five FIXED clock-times every day:
#     21:00, 22:00, 23:00, 00:00, 01:00 UTC.
#   In the maintainer's TZ (Europe/Tallinn) that is ~23:00–04:00 local year-round
#   — 21:00–01:00 UTC lands at night in both EET (UTC+2, winter) and EEST (UTC+3,
#   summer), so no slot ever drifts into the working day across a DST flip.
#   Why these EXACT times: the free cap is 5 runs per ROLLING 24h, not per calendar
#   day. Because the set of fire-times is identical every day, every rolling 24h
#   window contains exactly 5 runs — the schedule can never spill past the free cap.
#
# FALLBACK CHAIN (executor.prompt.md STEP 6b):
#   The executor prompt has a full fallback chain for when its ROADMAP lane is empty:
#   planner → architect → upgrade-drafter → doc-drift → triager → idle issue.
#   Specialist role prompts (planner.prompt.md, architect.prompt.md, etc.) are kept
#   in-repo as the fallback chain targets and on-demand invocations. They are no longer
#   registered as dedicated scheduled triggers — their slots were absorbed here.

routines:
  # THE EXECUTOR — implements one ROADMAP item per run, or falls back through the
  # role chain (STEP 6b): planner → architect → upgrade-drafter → doc-drift →
  # triager. Every run ends with a self-reviewed PR, a fallback deliverable, or —
  # only when the entire chain is empty — a refreshed maintainer-prompt issue.
  - name: k8s-lab autonomous dev
    trigger_id: trig_01CRtpmaS1scBQL74xKqmfvS
    cron: "0 21-23 * * *"          # 21:00/22:00/23:00 UTC — 3/day, all 7 days
    model: claude-sonnet-4-6
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: executor.prompt.md
    branch_prefix: auto/           # PRs land on auto/<slug>
    max_tier: green                # WAYS-OF-WORKING.md autonomy tier

  # THE EXECUTOR'S 4th + 5th DAILY SLOTS — same prompt, fires 00:00 and 01:00 UTC
  # every day (cron hour range 0-1). Covers the slots previously held by the
  # slot-filler (00:00), the triager (Wed+Sat 01:00), the industry-news-writer
  # (Sun 01:00), the planner (Mon+Thu 01:00), the architect (Tue 01:00), and the
  # doc-drift-author (Fri 01:00). All retired 2026-06-13 (see disabled entries below).
  - name: k8s-lab autonomous dev (daily 00:00+01:00)
    trigger_id: trig_011X276UrgGJWLsgC9Apneok
    cron: "0 0-1 * * *"            # 00:00+01:00 UTC — 2/day, all 7 days
    model: claude-sonnet-4-6
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: executor.prompt.md   # SAME prompt — keep triggers in lockstep
    branch_prefix: auto/           # PRs land on auto/<slug>
    max_tier: green

  # ── RETIRED TRIGGERS (no delete API — kept as audit trail) ──────────────────
  # All retired triggers are DISABLED in the backend. Their slots are absorbed by
  # the two executor triggers above. Their prompt files are kept in-repo as fallback
  # chain targets (executor STEP 6b) and on-demand local invocations.
  #
  # Reviewer    trig_01Dw7US6aZmJo8XZwDikoNkG  retired 2026-06-10 (see #160)
  # Planner     trig_015uWP3Hv1LTREpKzzkMkpUE  retired 2026-06-13 (absorbed)
  # Architect   trig_01SpewghyraZDSrLoGA32nBe  retired 2026-06-13 (absorbed)
  # Upgrade     trig_01UyN9qcTFvWD14k38tn49K1  retired 2026-06-13 (absorbed)
  # Doc-drift   trig_01AibRNtdZLqLu3a58jDxnFk  retired 2026-06-13 (absorbed)
  # Triager     trig_01E6ugxYJY6yGzwvSHSgFaCx  retired 2026-06-13 (see #191)
  # News-writer trig_01GNuyixzT3TBDF7Mk4ZeSTr  retired 2026-06-13 (absorbed into architect STEP 1)
  # Wed/Sat/Sun trig_012iaXwG6Pf8XeKCCEshY351  retired 2026-06-13 (superseded by 0 0-1 * * *)
  # Roundup     trig_01RJfm9AC8YJqFqc4KKQWxJb  retired (orphan)

# Local-only roles (NOT remote routines — they need Colima and the live cluster).
# Invoked on demand by the maintainer; not registered with the backend, no cron,
# no quota cost. Documented here so the family is discoverable in one place.
local_roles:
  - name: verifier
    prompt_file: verifier.prompt.md
    purpose: end-to-end verify an auto/* PR by bringing the lab up on its branch
    invoke: claude --prompt routines/verifier.prompt.md "verify auto/<slug>"

  - name: operator
    prompt_file: operator.prompt.md
    purpose: on-call pulse check, DR drills, incident-issue filing
    invoke: claude --prompt routines/operator.prompt.md "check the lab"
