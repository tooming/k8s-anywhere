# Declarative source of truth for the scheduled remote agents ("routines") that
# develop this repo. The claude.ai backend is the RUNNING state; this file is the
# DESIRED state.
#
# POINTER ARCHITECTURE (2026-07-15): the live trigger's actual content is
# `live_prompt` below — a short, effectively-static instruction to read
# `prompt_file` (e.g. executor.prompt.md) from this already-checked-out repo and
# follow it in full. The real operating contract lives ONLY in `prompt_file` and
# is read fresh every run — it is never baked into the trigger, so editing it is
# a normal PR with NO apply step. Only THIS file (routines.yaml) is ever pushed
# to the live API (cron/model/enabled/tools/live_prompt/environment), so it's the
# only thing `make routines-check`/`routines-mark-applied` track and the only
# thing `routines-author-check` still protects from executor-authored edits. See
# "Changing a routine" in README.md for the up-to-date procedure.

environment_id: env_014NJKuQoEb7PAi3PXaFW2B9   # Anthropic cloud (Default)
source: https://github.com/tooming/k8s-anywhere  # repo cloned into each run (renamed from k8s-lab 2026-07-13)

# Quota math (WAYS-OF-WORKING.md §5 — 5 runs / rolling 24h free; ALL slots filled):
#   One trigger, cron "0 0,5,10,14,19 * * *" — fires at 00:00, 05:00, 10:00, 14:00,
#   19:00 UTC every day. Exactly 5 runs/day, 7 days/week. One prompt, one model.
#
# SPREAD-ACROSS-THE-DAY SCHEDULE + CREDIT SAFETY (rolling-24h-proof, changed 2026-07-16
# from the original all-night 21/22/23/0/1 UTC clustering, at the maintainer's explicit
# request — "spread out the routines across the day"):
#   Fire times are evenly spaced across the full 24h (gaps of 5,5,4,5,5 hours) instead of
#   clustered in one nightly window. Because the set of fire-times is still identical
#   every day (only their *distribution* changed, not the count), every rolling 24h
#   window still contains exactly 5 runs — the schedule still can never spill past the
#   free cap; that invariant only needs fixed clock-times, not a particular time-of-day.
#   Trade-off accepted deliberately: PRs can now land and self-merge during the
#   maintainer's daytime, not only overnight — consistent with WAYS-OF-WORKING.md §0.1's
#   full-autonomy model, but worth knowing about. Each run now also loops through many
#   items back-to-back (executor.prompt.md STEP 8, added the same day) instead of
#   stopping after one, so a run's real wall-clock length is no longer ~one item's worth
#   of work — if two spread-out fire times ever end up overlapping an still-running prior
#   run in practice, STEP 1b's stale-PR recovery and STEP 2's in-flight check are the
#   existing mechanical guards against duplicate/racing work; this has not yet been
#   observed and should be watched for as the new cadence + loop model run in practice.
#
# FALLBACK CHAIN (executor.prompt.md STEP 6b):
#   When the ROADMAP lane is empty the executor escalates through:
#   planner → architect → upgrade-drafter → doc-drift → triager → janitor → idle issue.
#   Specialist prompt files are kept in-repo as fallback targets and for on-demand
#   local invocations (see local_roles below). They are no longer separate triggers.
#
# REPLACEMENT TRIGGER (2026-07-15, see #423): trig_01CRtpmaS1scBQL74xKqmfvS (the
# original, created via the raw claude.ai HTTP API back in May) never had GitHub
# API/repo access attached — git clone/push worked, but every `gh` call was denied
# with "GitHub access to this repository is not enabled for this session. Use
# add_repo to request access", with no add_repo tool reachable from inside that
# session to self-remediate. Since the executor contract is entirely gh-dependent
# (STEP 2, STEP 6, STEP 7, every fallback role), no run could ever deliver a PR or
# issue. A same-day attempt to recreate it via RemoteTrigger create
# (trig_015neX4v6RifyiVgyC8TCwNc, retired below) produced a trigger with the
# identical JSON shape (no repo-binding field of any kind) — its own run's outcome
# was never actually confirmed (no session-transcript access, no GitHub activity
# either way to check), so it was retired on suspicion/redundancy once the proper
# fix existed, NOT on confirmed failure. trig_01XxtSdkPdRNjBfAidUXTwos below was
# created through the Routines UI's own repo-selector flow instead
# (tooming/k8s-anywhere explicitly attached as a Repository, visible in the
# routine's own settings page). NOT YET VERIFIED — 0 runs completed at the time
# this was wired in. Confirm the next scheduled or manual run actually gets past
# `gh pr list` before treating this as settled; if it hits the same denial,
# retire it too and escalate #423 further.

routines:
  # THE EXECUTOR — one trigger, five slots spread across the day, one prompt.
  # Implements ROADMAP items back-to-back (STEP 8 loop) or falls back through the
  # role chain (STEP 6b). Every run ends with a self-reviewed PR, a fallback
  # deliverable, or — only when the entire chain is empty — a refreshed
  # maintainer-prompt issue.
  - name: k8s-anywhere autonomous dev
    trigger_id: trig_01XxtSdkPdRNjBfAidUXTwos
    cron: "0 0,5,10,14,19 * * *"   # 00:00/05:00/10:00/14:00/19:00 UTC — 5/day, spread, all 7 days
    model: claude-sonnet-5
    enabled: true
    allowed_tools: [Bash, Read, Write, Edit, Glob, Grep]
    prompt_file: executor.prompt.md   # the real contract — read live every run, no apply needed
    live_prompt: |
      You are the autonomous executor for tooming/k8s-anywhere, running in this
      already-checked-out repository. Read `routines/executor.prompt.md` in full —
      every STEP, every hard rule, the STEP 6b fallback chain, and STEP 7's
      self-review + self-merge contract — and execute it exactly as your complete
      operating instructions for this run. Do not summarize, paraphrase, or skip
      any part of it; treat its content as this prompt's actual body.
    branch_prefix: auto/           # PRs land on auto/<slug>
    repository: tooming/k8s-anywhere   # attached via the Routines UI's repo-selector (see note above)

  # ── RETIRED TRIGGERS (no delete API — kept as audit trail) ──────────────────
  # Slot-filler  trig_011X276UrgGJWLsgC9Apneok  retired 2026-06-13 (absorbed into single trigger)
  # Reviewer     trig_01Dw7US6aZmJo8XZwDikoNkG  retired 2026-06-10 (see #160)
  # Planner      trig_015uWP3Hv1LTREpKzzkMkpUE  retired 2026-06-13 (absorbed)
  # Architect    trig_01SpewghyraZDSrLoGA32nBe  retired 2026-06-13 (absorbed)
  # Upgrade      trig_01UyN9qcTFvWD14k38tn49K1  retired 2026-06-13 (absorbed)
  # Doc-drift    trig_01AibRNtdZLqLu3a58jDxnFk  retired 2026-06-13 (absorbed)
  # Triager      trig_01E6ugxYJY6yGzwvSHSgFaCx  retired 2026-06-13 (see #191)
  # News-writer  trig_01GNuyixzT3TBDF7Mk4ZeSTr  retired 2026-06-13 (absorbed into architect STEP 1)
  # Wed/Sat/Sun  trig_012iaXwG6Pf8XeKCCEshY351  retired 2026-06-13 (superseded)
  # Roundup      trig_01RJfm9AC8YJqFqc4KKQWxJb  retired (orphan)
  # Executor     trig_01CRtpmaS1scBQL74xKqmfvS  retired 2026-07-15 (no gh/API access — see #423)
  # Executor (API test)  trig_015neX4v6RifyiVgyC8TCwNc  retired 2026-07-15 (recreated via RemoteTrigger create to test whether that path grants gh/API access; outcome unverified — no session-transcript access and no GitHub activity to check either way — retired as redundant once trig_01XxtSdkPdRNjBfAidUXTwos was created properly through the UI, see #423)

# Local-only roles (NOT remote routines — they need Colima and the live cluster).
# Invoked on demand by the maintainer; not registered with the backend, no cron,
# no quota cost. Documented here so the family is discoverable in one place.
local_roles:
  - name: verifier
    prompt_file: verifier.prompt.md
    purpose: end-to-end verify an auto/* PR by bringing the lab up on its branch
    invoke: claude --prompt routines/verifier.prompt.md "verify auto/<slug>"

  - name: operator
    prompt_file: operator.prompt.md
    purpose: on-call pulse check, DR drills, incident-issue filing
    invoke: claude --prompt routines/operator.prompt.md "check the lab"
