# Route the Kiali service mesh UI through Traefik at
# http://kiali.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# ON-DEMAND: synced as part of make kiali-up (via kiali-extras Application).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kiali
  namespace: istio-system
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`kiali.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: kiali
          port: 20001
  tls: {}
