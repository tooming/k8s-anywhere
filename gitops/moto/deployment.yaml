# moto — token-free AWS API mock (S3/KMS/IAM/SQS/...). Single endpoint on :5000.
# Ephemeral (no persistence) — fine for ACK demos. This is the endpoint ACK
# controllers target instead of real AWS (replaces LocalStack).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
  namespace: moto
  labels:
    app: moto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moto
  template:
    metadata:
      labels:
        app: moto
    spec:
      # k8s injects MOTO_PORT=tcp://<svc-ip>:5000 from the same-named Service,
      # which moto_server misreads as its listen port and crashes. Disable the
      # service-link env vars and set MOTO_PORT explicitly.
      enableServiceLinks: false
      containers:
        - name: moto
          image: motoserver/moto:5.2.1
          env:
            - name: MOTO_PORT
              value: "5000"
            # ACK reaches moto at host "moto.moto.svc", which moto otherwise
            # greedily parses as <bucket>.<domain> (bucket="moto") -> every S3
            # call 404s NoSuchBucket. Force path-style bucket parsing instead.
            - name: S3_IGNORE_SUBDOMAIN_BUCKETNAME
              value: "true"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /moto-api/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
