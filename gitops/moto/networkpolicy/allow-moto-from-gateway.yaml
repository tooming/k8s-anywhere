# Allow ingress to the moto pod from Traefik's data-plane pods (ADR-0016, ADR-0040 —
# supersedes Envoy Gateway/ADR-0008). The moto IngressRoute (moto.127.0.0.1.nip.io)
# routes HTTP traffic through Traefik in kube-system to the moto server on TCP 5000.
# Without this allow, default-deny-all blocks the IngressRoute and the moto web
# console is unreachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-moto-from-gateway
  namespace: moto
spec:
  podSelector:
    matchLabels:
      app: moto
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5000
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
