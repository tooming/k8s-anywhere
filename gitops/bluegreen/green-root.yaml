# Blue/green DR: the app-of-apps planted (from local disk, like bootstrap/root-app)
# on the GREEN cluster's ArgoCD. While blue runs the full stack, green recovers only
# the always-available SERVING tier from the same GitLab repo — the Envoy gateway,
# the lab Gateway (which includes the ArgoCD HTTPRoute), and the demo app — so two
# environments fit the 16 GB budget. The drill's canary is the ArgoCD UI
# (argocd.127.0.0.1.nip.io), served by both clusters; the point is the zero-downtime
# cluster CUTOVER, not duplicating the heavy LGTMP tier. Reuses gitops/platform via
# directory.include (no copies); green's ArgoCD itself is helm-installed by the script.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/platform
    directory:
      include: '{envoy-gateway,lab-gateway,demo}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
