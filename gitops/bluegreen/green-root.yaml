# Blue/green DR: the app-of-apps planted (from local disk, like bootstrap/root-app)
# on the GREEN cluster's ArgoCD. While blue runs the full stack, green recovers only
# the always-available SERVING tier from the same Forgejo repo (ADR-0035) — the lab-gateway
# Application (Traefik's shared TLSStore + the ArgoCD IngressRoute, ADR-0040), and
# the demo app — so two environments fit the 16 GB budget. No separate ingress-
# controller Application is needed any more: Traefik ships with k3s itself, so it's
# already present on green the moment the cluster boots. The drill's canary is the
# ArgoCD UI (argocd.127.0.0.1.nip.io), served by both clusters; the point is the
# zero-downtime cluster CUTOVER, not standing up every platform Application (the
# observability stack this comment used to name has since been removed entirely,
# ADR-0041 — the constraint that motivated a serving-only green predates that and
# still holds for the rest of the platform tier). Reuses gitops/platform via
# directory.include (no copies); green's ArgoCD itself is helm-installed by the script.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/platform
    directory:
      include: '{lab-gateway,demo}.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
