# Route the Longhorn storage UI through Traefik at
# http://longhorn.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# ON-DEMAND: synced as part of make longhorn-up (via longhorn-extras Application).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`longhorn.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: longhorn-frontend
          port: 80
  tls: {}
