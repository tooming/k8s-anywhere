# Allow ingress to longhorn-system pods from the observability namespace on TCP 9500
# (ADR-0016). Longhorn exposes Prometheus metrics at :9500/metrics via the
# longhorn-manager DaemonSet Service; Alloy scrapes this endpoint for the Longhorn
# metrics dashboard. Without this allow the default-deny floor blocks the Alloy
# scrape when Longhorn is running.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-metrics-ingress
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9500
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
