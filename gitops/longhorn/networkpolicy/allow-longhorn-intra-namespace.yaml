# Allow all pods within the longhorn-system namespace to communicate with each other
# (ADR-0016). This is a documented carve-out from ADR-0016's general "no catch-all
# 'allow same namespace'" rule — see ADR-0016 §"Scope & exceptions" → Carve-outs
# table (the argocd/harbor/istio-system/longhorn-system/tidb row) for the
# binding rationale and flip condition. The Longhorn cluster has dense intra-namespace flows:
#   longhorn-manager (DaemonSet) ↔ longhorn-engine ↔ longhorn-csi-plugin;
#   CSI driver gRPC socket → replica-manager / engine-manager sidecars;
#   replica-process ↔ engine-process across the Longhorn control plane.
# A single broad intra-namespace allow is correct here — all components are
# intentionally coupled in the distributed block storage architecture.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-longhorn-intra-namespace
  namespace: longhorn-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
