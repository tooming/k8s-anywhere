# Route the Longhorn storage UI through Envoy at
# http://longhorn.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# ON-DEMAND: synced as part of make longhorn-up (via longhorn-extras Application).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "longhorn.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
