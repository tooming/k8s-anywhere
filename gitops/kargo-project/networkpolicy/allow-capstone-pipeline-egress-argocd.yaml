# Egress: promotion-step pods → argocd-server TCP 80 (argocd-update promotion step).
# The argocd-update step in the capstone Stage promotion template (project.yaml) calls
# the ArgoCD Server API to refresh and sync the capstone Application with the new
# image digest produced by Kargo Warehouse.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-capstone-pipeline-egress-argocd
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      ports:
        - protocol: TCP
          port: 80
