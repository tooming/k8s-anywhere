# Interim lab auto-unsealer: watches vault and unseals it from the vault-keys
# Secret whenever it's sealed (e.g. after a pod restart). LAB-ONLY — the unseal
# key sits in a k8s Secret, so this drops seal protection to "who can read that
# Secret". Replace with KMS auto-unseal (seal "awskms" -> LocalStack) later.
#
# Found live 2026-07-29: vault-0 restarted during a cluster-wide network outage
# (Cilium agents down) and came back sealed, and the unsealer's own `vault status`
# call — with no timeout — hung on that dead connection instead of failing fast,
# wedging the `while true` loop forever. The container never crashed (the shell
# process was still "running"), so kubelet had no signal to restart it — Vault
# stayed sealed for 4+ days, silently breaking every ExternalSecret refresh
# cluster-wide (ClusterSecretStore "vault" reported not-ready the whole time, but
# nothing surfaced that anywhere visible). Fixed two ways: `timeout` bounds each
# vault call so a dead connection can't wedge the loop, and a heartbeat file +
# liveness probe give kubelet a way to detect and restart a wedged loop even if
# some other hang mode slips past the timeout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-unsealer
  namespace: vault
  labels:
    app: vault-unsealer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-unsealer
  template:
    metadata:
      labels:
        app: vault-unsealer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unsealer
          image: hashicorp/vault:2.0.4
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-keys
                  key: unseal-key
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "vault-unsealer watching $VAULT_ADDR";
              while true; do
                if timeout 5 vault status 2>/dev/null | grep -E '^Sealed' | grep -q true; then
                  echo "$(date) vault is sealed -> unsealing";
                  timeout 5 vault operator unseal "$UNSEAL_KEY" >/dev/null 2>&1 || echo "unseal attempt failed (vault not ready?)";
                fi
                date +%s > /tmp/last-check;
                sleep 10;
              done
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "[ $(( $(date +%s) - $(cat /tmp/last-check 2>/dev/null || echo 0) )) -lt 60 ]"
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: home
              mountPath: /home/vault
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
