# Vault UI via Envoy. Uses a nip.io hostname (vault.127.0.0.1.nip.io resolves to
# 127.0.0.1) so we get a per-app hostname WITHOUT editing /etc/hosts. Reach it at
# http://vault.127.0.0.1.nip.io:8080  (root token is in the vault-keys Secret).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-ui
  namespace: vault
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "vault.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vault
          port: 8200
