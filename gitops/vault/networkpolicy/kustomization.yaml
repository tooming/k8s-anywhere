# NetworkPolicy Kustomize overlay for the vault namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds vault-specific allow rules for
# the real ingress flows: ingress from ESO controller (k8s auth + secret reads
# on TCP 8200), ingress from Envoy Gateway proxy (UI HTTPRoute on TCP 8200),
# ingress from the same-namespace vault-unsealer pod (TCP 8200 — found missing
# live 2026-08-06, see allow-vault-from-unsealer.yaml's own header for the story),
# and ingress from Alloy in observability (TCP 8200 — Vault's own internal
# telemetry scrape, see allow-vault-metrics-from-observability.yaml).
# The allow-dns-and-apiserver baseline already covers Vault's k8s-auth API calls.
# Wired into gitops/platform/vault-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-vault-from-eso.yaml
  - allow-vault-from-gateway.yaml
  - allow-vault-from-unsealer.yaml
  - allow-vault-metrics-from-observability.yaml
