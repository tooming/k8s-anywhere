# Allow ingress to the Vault server pod from Traefik's data-plane pods (ADR-0016,
# ADR-0040 — supersedes Envoy Gateway/ADR-0008).
# The vault.127.0.0.1.nip.io IngressRoute (gitops/vault/ingressroute.yaml) routes traffic
# from Traefik pods in kube-system to the Vault UI on TCP 8200.
# Without this allow, the default-deny-all floor blocks proxied UI traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-from-gateway
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8200
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
