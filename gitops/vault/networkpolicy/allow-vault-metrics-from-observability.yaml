# Allow Alloy in the observability namespace to scrape Vault's own internal
# telemetry on TCP 8200 (ADR-0016). Vault exposes real Prometheus metrics at
# GET /v1/sys/metrics?format=prometheus once vault.yaml's telemetry stanza +
# unauthenticated_metrics_access are set; the vault scrape job in
# observability-alloy.yaml targets this same port and feeds the "Lab — Vault"
# dashboard with real vault_core_unsealed / vault_core_active /
# vault_core_in_flight_requests / vault_expire_num_leases series (ADR-0004).
# Same port as allow-vault-from-eso.yaml/allow-vault-from-gateway.yaml (Vault
# has one listener), different source namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-metrics-from-observability
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
      component: server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8200
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
