# NetworkPolicy Kustomize overlay for the velero namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds velero-specific allow rules for:
# - egress TCP 3900 to storage namespace for Garage S3 backup writes/reads
#   (the Alloy metrics-scrape ingress rule this overlay used to also carry was
#   removed 2026-09-06, ADR-0041, observability stack removed with no replacement)
# - egress (any port) to backed-up namespace pods for Kopia PV reads (data/capstone/vault)
# The allow-dns-and-apiserver baseline covers the controller's k8s API calls
# (workload watch, backup CRD emit, leader election).
# Wired into gitops/platform/velero-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velero

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-velero-egress-storage.yaml
  - allow-velero-egress-kopia-pv.yaml
