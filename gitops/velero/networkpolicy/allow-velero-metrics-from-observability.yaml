# Allow Alloy in the observability namespace to scrape Velero metrics on TCP 8085
# (ADR-0016). Velero exposes Prometheus metrics at :8085/metrics; the velero
# scrape job in observability-alloy.yaml targets this port and feeds the
# "Lab — Velero" dashboard with real backup age and phase counters (ADR-0004,
# ADR-0021). podSelector {} covers every velero pod's :8085 metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-velero-metrics-from-observability
  namespace: velero
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8085
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
