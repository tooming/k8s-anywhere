# Allow Velero node-agent to reach pods in backed-up namespaces for Kopia PV reads
# (ADR-0016, ADR-0021 §"NetworkPolicy + PSS"). Kopia FS-snapshot reads PV contents
# directly from the node's filesystem overlay; the node-agent pod uses a hostPath
# volume and does NOT open TCP connections to application pods — this rule is a
# belt-and-suspenders allow for any Kopia coordination traffic between the agent
# and the backed-up namespace pods during live backup (e.g., freeze hooks).
# Scoped to the five stateful namespaces: data, tidb, capstone, vault,
# observability (added 2026-07-29 alongside the observability-daily Schedule —
# ADR-0021 §Re-evaluation log). storage/Garage is deliberately excluded from
# both the Schedule set and this list — see ADR-0021 §Scope & exceptions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-velero-egress-kopia-pv
  namespace: velero
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - data
                  - tidb
                  - capstone
                  - vault
                  - observability
