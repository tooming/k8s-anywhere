# Allow Velero node-agent to reach pods in backed-up namespaces for Kopia PV reads
# (ADR-0016, ADR-0021 §"NetworkPolicy + PSS"). Kopia FS-snapshot reads PV contents
# directly from the node's filesystem overlay; the node-agent pod uses a hostPath
# volume and does NOT open TCP connections to application pods — this rule is a
# belt-and-suspenders allow for any Kopia coordination traffic between the agent
# and the backed-up namespace pods during live backup (e.g., freeze hooks).
# Scoped to the three stateful namespaces: data, capstone, vault (tidb and
# observability were both removed 2026-09-06 — TiDB removed from the lab
# entirely with no replacement; the observability namespace removed alongside
# the rest of the observability stack, ADR-0041). storage/Garage is
# deliberately excluded from both the Schedule set and this list — see
# ADR-0021 §Scope & exceptions.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-velero-egress-kopia-pv
  namespace: velero
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - data
                  - capstone
                  - vault
