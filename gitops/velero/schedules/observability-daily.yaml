# observability-daily — Velero Schedule for the always-on observability namespace
# (Mimir/Loki/Tempo PVCs). RFC (architect decision 2026-07-29): CHARTER O3 says
# "every stateful namespace" is covered by `make dr-restore`, but `observability`
# held real PVCs (5Gi each for Loki/Mimir/Tempo) with no Schedule at all — this
# closes that gap using the identical pattern as the other four schedules. Cron
# 01:00 UTC, ahead of data-daily's 02:00 so the single node still snapshots one
# namespace at a time across all five windows. defaultVolumesToFsBackup: true
# captures the three PVCs via Kopia regardless of CSI driver. 7-day (168h)
# retention, matching the existing schedule set (ADR-0021 §Scope: single-host
# disk pressure bounds retention, not backup breadth).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: observability-daily
  namespace: velero
spec:
  schedule: "0 1 * * *"
  template:
    ttl: 168h
    includedNamespaces:
    - observability
    defaultVolumesToFsBackup: true
