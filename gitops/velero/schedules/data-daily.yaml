# data-daily — Velero Schedule for the always-on data namespace (RabbitMQ + Valkey
# PVCs). ADR-0021 §"Schedule set" + CHARTER Objective O3 (every stateful namespace
# has a backup the < 10 min dr-restore path can recover from). Cron 02:00 UTC, first
# of the four spread windows so the single node never snapshots two namespaces at once.
# defaultVolumesToFsBackup: true captures PVCs via Kopia FS-snapshot regardless of the
# CSI driver (local-path today; Longhorn when on-demand). 7-day (168h) retention bounds
# single-host disk pressure (ADR-0021 §Scope).
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: data-daily
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    ttl: 168h
    includedNamespaces:
    - data
    defaultVolumesToFsBackup: true
