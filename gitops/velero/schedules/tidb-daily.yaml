# tidb-daily — Velero Schedule for the on-demand tidb namespace (PD/TiKV/TiDB PVCs).
# ADR-0021 §"Schedule set" + CHARTER Objective O3. Cron 02:30 UTC, offset 30 min from
# data-daily so the node snapshots one namespace at a time. The Schedule manifest is
# present even though tidb is on-demand: once `make tidb-up` brings the cluster up the
# backups start on the next window without further wiring. defaultVolumesToFsBackup
# captures the TiKV/PD volumes via Kopia. 7-day (168h) retention.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: tidb-daily
  namespace: velero
spec:
  schedule: "30 2 * * *"
  template:
    ttl: 168h
    includedNamespaces:
    - tidb
    defaultVolumesToFsBackup: true
