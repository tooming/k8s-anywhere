# Route the TiDB demo app through Traefik at http://tidb-demo.127.0.0.1.nip.io:8000
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tidb-demo
  namespace: tidb
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`tidb-demo.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: tidb-demo
          port: 80
  tls: {}
