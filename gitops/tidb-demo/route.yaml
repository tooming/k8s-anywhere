# Route the TiDB demo app through Envoy at http://tidb-demo.127.0.0.1.nip.io:8000
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tidb-demo
  namespace: tidb
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "tidb-demo.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tidb-demo
          port: 80
