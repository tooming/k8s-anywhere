# Demo workload: nginx serving a static page, with TiDB credentials injected via
# the tidb-demo-creds Secret (rendered by ESO from Vault secret/tidb/demo).
# optional:true lets the pod start even when the ExternalSecret hasn't synced yet.
#
# image pinned explicitly 2026-08-13 (planner-fallback currency sweep): was the
# floating tag `nginx:alpine`, unlike every other version-sensitive pin in this
# repo. Verified directly via Docker Hub's tags API: `nginx:alpine`'s content
# digest is byte-identical to `nginx:mainline-alpine`, which matches the exact
# tag `1.31.3-alpine` -- nginx's mainline line, NOT the stable line
# (`1.30.4-alpine`, a distinct digest). This is a pin-what's-already-running
# change, not a version bump -- the floating tag already resolved to this exact
# content; explicit pinning only makes that fact durable and inspectable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tidb-demo
  namespace: tidb
  labels:
    app: tidb-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tidb-demo
  template:
    metadata:
      labels:
        app: tidb-demo
    spec:
      containers:
        - name: demo
          image: nginx:1.31.3-alpine
          ports:
            - containerPort: 80
          env:
            - name: TIDB_USER
              valueFrom:
                secretKeyRef:
                  name: tidb-demo-creds
                  key: username
                  optional: true
            - name: TIDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tidb-demo-creds
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: tidb-demo-html
---
apiVersion: v1
kind: Service
metadata:
  name: tidb-demo
  namespace: tidb
spec:
  selector:
    app: tidb-demo
  ports:
    - port: 80
      targetPort: 80
