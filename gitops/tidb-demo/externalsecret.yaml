# Pull TiDB demo credentials from Vault (secret/tidb/demo, seeded by vault-bootstrap.sh)
# and render them as the Kubernetes Secret 'tidb-demo-creds'.
# The demo Deployment mounts this Secret as TIDB_USER / TIDB_PASSWORD env vars.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tidb-demo-creds
  namespace: tidb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: tidb-demo-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: tidb/demo
        property: username
    - secretKey: password
      remoteRef:
        key: tidb/demo
        property: password
