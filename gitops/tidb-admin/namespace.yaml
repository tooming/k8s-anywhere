# PSA carve-out: the TiDB Operator controller and scheduler pods need elevated
# capabilities (admission webhook, privileged job runners). ADR-0017 §Per-namespace
# profile records tidb-admin as baseline-only.
apiVersion: v1
kind: Namespace
metadata:
  name: tidb-admin
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
