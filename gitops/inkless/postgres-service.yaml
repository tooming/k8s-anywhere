# Headless + ClusterIP service for the inkless-postgres StatefulSet.
# The broker connects via: jdbc:postgresql://inkless-postgres.inkless.svc.cluster.local:5432/inkless
apiVersion: v1
kind: Service
metadata:
  name: inkless-postgres
  namespace: inkless
  labels:
    app: inkless-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: inkless-postgres
