# ExternalSecrets for Aiven Inkless — pull credentials from Vault via ESO.
#
# inkless-postgres-creds: PostgreSQL admin password (seeded by vault-bootstrap.sh
#   at secret/inkless/postgres). Used by both the postgres StatefulSet and the
#   Inkless broker's JDBC connection string.
#
# inkless-broker-creds: Garage S3 key pair (seeded by garage-bootstrap.sh at
#   secret/inkless/s3). Only available after garage-bootstrap runs — the
#   ExternalSecret will not-ready until then (acceptable for an on-demand component).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inkless-postgres-creds
  namespace: inkless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: inkless-postgres-creds
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: inkless/postgres
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inkless-broker-creds
  namespace: inkless
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: inkless-broker-creds
    creationPolicy: Owner
  data:
    - secretKey: s3-access-key-id
      remoteRef:
        key: inkless/s3
        property: access-key-id
    - secretKey: s3-secret-access-key
      remoteRef:
        key: inkless/s3
        property: secret-access-key
