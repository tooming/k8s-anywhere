# Aiven Inkless broker — single-node KRaft (broker+controller combined), diskless
# mode using Garage as the S3 backend (ADR-0002, ADR-0015). Credentials come from:
#   inkless-postgres-creds  → postgres password
#   inkless-broker-creds    → Garage S3 key pair (s3-access-key-id, s3-secret-access-key)
# Both rendered by ESO from Vault (seeded at bootstrap time). ON-DEMAND.
#
# KRaft single-node note (ADR-0005): quorum-of-one is acceptable for a lab demo.
# Production deployments use 3+ controller nodes for fault tolerance.
#
# Storage formatting: the image entrypoint reads CLUSTER_ID and auto-formats the
# log directory on first boot (idempotent — skips if already formatted).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inkless
  namespace: inkless
  labels:
    app: inkless
spec:
  serviceName: inkless-headless
  replicas: 1
  selector:
    matchLabels:
      app: inkless
  template:
    metadata:
      labels:
        app: inkless
    spec:
      containers:
        - name: inkless
          # Pinned 2026-08-18 (was ghcr.io/aiven/inkless:latest since this
          # component's introduction — see docs/decisions/adr-0015-inkless-
          # diskless-kafka.md's Re-evaluation log for the full finding).
          # aiven/inkless now publishes real, stable, pinnable named release
          # tags (<kafka-version>-<inkless-build>, e.g. this one — verified
          # directly via ghcr.io/v2/aiven/inkless/tags/list: 673 tags, a clear
          # X.Y.Z-B.BB numbering line alongside the rotating edge-<hash>
          # builds, `4.2.1-0.46` newest), closing the flip condition
          # gitops/kyverno/policies/disallow-latest-tag.yaml's own header
          # comment named for removing this component's admission-policy
          # carve-out. NOT a pin-what's-running no-op — `latest`'s digest at
          # verification time didn't match this (or any other numbered) tag,
          # so this is a real version pin, called out honestly rather than
          # asserted equivalent (ADR-0004).
          image: ghcr.io/aiven/inkless:4.2.1-0.47
          ports:
            - name: kafka
              containerPort: 9092
            - name: internal
              containerPort: 19092
            - name: controller
              containerPort: 29090
          env:
            # KRaft cluster identity — fixed ID so the PVC survives pod restarts
            - name: CLUSTER_ID
              value: "4L6g3nShT-eMCtK--X86sw"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            # Single-node quorum: only this pod votes (ADR-0005)
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@inkless-0.inkless-headless.inkless.svc.cluster.local:29090"

            # Listener map
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
            - name: KAFKA_LISTENERS
              value: "CONTROLLER://:29090,PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:19092"
            # PLAINTEXT (9092) is for in-cluster clients; PLAINTEXT_INTERNAL (19092)
            # is used as the inter-broker listener (single-node; pod's stable DNS name).
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://inkless.inkless.svc.cluster.local:9092,PLAINTEXT_INTERNAL://inkless-0.inkless-headless.inkless.svc.cluster.local:19092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT_INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # Replication factors: 1 for single-node lab (ADR-0005)
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            # KRaft local log directory (mounted from PVC)
            - name: KAFKA_LOG_DIRS
              value: "/opt/kafka-data"

            # Inkless diskless mode (KIP-1150)
            - name: KAFKA_DISKLESS_STORAGE_SYSTEM_ENABLE
              value: "true"
            - name: KAFKA_LOG_DISKLESS_ENABLE
              value: "true"
            - name: KAFKA_INKLESS_CONSUME_CACHE_MAX_COUNT
              value: "100"

            # Control plane: PostgreSQL batch coordinator
            - name: KAFKA_INKLESS_CONTROL_PLANE_CLASS
              value: "io.aiven.inkless.control_plane.postgres.PostgresControlPlane"
            - name: KAFKA_INKLESS_CONTROL_PLANE_CONNECTION_STRING
              value: "jdbc:postgresql://inkless-postgres.inkless.svc.cluster.local:5432/inkless"
            - name: KAFKA_INKLESS_CONTROL_PLANE_USERNAME
              value: "admin"
            - name: KAFKA_INKLESS_CONTROL_PLANE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inkless-postgres-creds
                  key: password

            # Object storage backend: Garage S3 (ADR-0002)
            - name: KAFKA_INKLESS_STORAGE_BACKEND_CLASS
              value: "io.aiven.inkless.storage_backend.s3.S3Storage"
            - name: KAFKA_INKLESS_STORAGE_S3_PATH_STYLE_ACCESS_ENABLED
              value: "true"
            - name: KAFKA_INKLESS_STORAGE_S3_BUCKET_NAME
              value: "inkless"
            - name: KAFKA_INKLESS_STORAGE_S3_REGION
              value: "us-east-1"
            - name: KAFKA_INKLESS_STORAGE_S3_ENDPOINT_URL
              value: "http://garage.storage.svc.cluster.local:3900"
            - name: KAFKA_INKLESS_STORAGE_AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: inkless-broker-creds
                  key: s3-access-key-id
            - name: KAFKA_INKLESS_STORAGE_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: inkless-broker-creds
                  key: s3-secret-access-key

            # JVM heap — reduced from upstream 2G for 12 GB lab budget (ADR-0005)
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx768M -Xms512M"

          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10

          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10

          volumeMounts:
            - name: data
              mountPath: /opt/kafka-data
        - name: exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args:
            - --kafka.server=localhost:9092
            - --web.listen-address=:9308
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
