# Services for the Inkless broker StatefulSet.
# - inkless-headless: headless service for stable pod DNS (StatefulSet serviceName);
#   used by the KRaft controller quorum voters and the internal listener.
# - inkless: ClusterIP service for in-cluster Kafka clients (port 9092).
---
apiVersion: v1
kind: Service
metadata:
  name: inkless-headless
  namespace: inkless
  labels:
    app: inkless
spec:
  clusterIP: None
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: internal
      port: 19092
      targetPort: 19092
    - name: controller
      port: 29090
      targetPort: 29090
  selector:
    app: inkless
---
apiVersion: v1
kind: Service
metadata:
  name: inkless
  namespace: inkless
  labels:
    app: inkless
spec:
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
  selector:
    app: inkless
