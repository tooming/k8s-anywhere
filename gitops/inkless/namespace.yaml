# Explicit inkless namespace manifest with Pod Security Admission labels (ADR-0017).
# PSA profile is `baseline` (not `restricted`) because the Aiven Inkless broker
# image (see gitops/inkless/inkless-statefulset.yaml for the current pin) runs as
# root UID 0 by default — `baseline` blocks privileged containers and host-namespace
# use while permitting the root UID.
# Flip condition to `restricted`: two-part — (a) ghcr.io/aiven/inkless ships an
# explicit non-root USER directive (met as of the 2026-07-18 audit, per ADR-0017's
# Re-evaluation log) AND (b) a live cluster verifies the broker actually starts and
# operates correctly running as that non-root user (still outstanding — this is a
# remote clusterless session's ceiling, ADR-0004). See ADR-0017 §Per-namespace
# profile, inkless row, for the full two-part condition and its own Re-evaluation
# log entries.
apiVersion: v1
kind: Namespace
metadata:
  name: inkless
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
