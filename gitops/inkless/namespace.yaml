# Explicit inkless namespace manifest with Pod Security Admission labels (ADR-0017).
# PSA profile is `baseline` (not `restricted`) because the Aiven Inkless broker
# image (ghcr.io/aiven/inkless:latest) runs as root UID 0 — no USER directive in the
# base image. `baseline` blocks privileged containers and host-namespace use while
# permitting the root UID.
# Flip condition to `restricted`: when ghcr.io/aiven/inkless ships with an explicit
# non-root USER directive (see ADR-0017 §Per-namespace profile, inkless row).
apiVersion: v1
kind: Namespace
metadata:
  name: inkless
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
