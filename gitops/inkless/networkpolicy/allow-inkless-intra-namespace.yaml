# Allow all pods within the inkless namespace to communicate with each other (ADR-0016).
# The Inkless stack has multiple intra-namespace flows:
#   kafka-load -> broker on TCP 9092 (Kafka client);
#   broker <-> postgres on TCP 5432 (JDBC control-plane coordinator);
#   broker inter-broker listener on TCP 19092 (KRaft inter-broker replication);
#   broker KRaft controller listener on TCP 29090 (single-node quorum; ADR-0005).
# A single broad intra-namespace allow is correct here — all components are
# intentional couplings of the Inkless diskless Kafka cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inkless-intra-namespace
  namespace: inkless
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
