# NetworkPolicy Kustomize overlay for the inkless namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates (default-deny-all + allow-dns-and-apiserver)
# and adds three inkless-specific allow rules: intra-namespace (broker↔postgres, kafka-load),
# egress to Garage S3 in storage (port 3900, ADR-0002), and ingress from observability
# for Kafka exporter metrics (port 9308). Wired into gitops/platform/networkpolicy-appset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inkless

resources:
  - ../../../network/policies/default-deny.yaml
  - ../../../network/policies/allow-dns-and-apiserver.yaml
  - allow-inkless-intra-namespace.yaml
  - allow-inkless-garage-egress.yaml
  - allow-inkless-metrics-ingress.yaml
