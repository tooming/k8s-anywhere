# Allow ingress from the observability namespace to scrape the Kafka exporter container
# on the inkless broker pod (ADR-0016). The kafka-exporter container listens on TCP 9308
# and is already wired into the Alloy scrape config in observability-alloy.yaml.
# Only the exporter port is exposed to observability; no Kafka client port is opened.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inkless-metrics-ingress
  namespace: inkless
spec:
  podSelector:
    matchLabels:
      app: inkless
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9308
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
