# Dedicated namespace for the Prometheus node-exporter DaemonSet, with a Pod
# Security Admission `privileged` carve-out (ADR-0017).
#
# Why its own namespace: node-exporter must mount the host `/proc` and `/sys` via
# hostPath to read node metrics. hostPath volumes are forbidden by BOTH PSS
# `restricted` AND PSS `baseline` (verified against baseline:latest / restricted:latest
# on this cluster) — only `privileged` permits them. So node-exporter cannot run in the
# `restricted` observability namespace (the DaemonSet sat at desired=2 / ready=0,
# rejected at admission on the hostPath volumes). Splitting it out keeps the LGTMP
# observability stack on `restricted` while giving node-exporter the one profile that
# admits its host mounts — same reasoning as longhorn-system / istio-system.
#
# `privileged` is the tier hostPath requires, not a request for extra power: the
# workload itself is still hardened by its own securityContext (non-root UID 65534,
# drop ALL, readOnlyRootFilesystem, seccomp RuntimeDefault, hostPID/hostNetwork=false).
# The `enforce=privileged` label also excludes the namespace from the
# require-pod-security-restricted Kyverno backstop (which skips baseline/privileged).
#
# Pre-created by the auto-synced node-exporter-extras Application (wave 0) so the PSA
# floor is in place before the node-exporter DaemonSet (wave 2) admits any pod.
apiVersion: v1
kind: Namespace
metadata:
  name: node-exporter
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
