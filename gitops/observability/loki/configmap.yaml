apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    # Single-binary, multi-tenant Loki backed by Garage S3 (loki bucket).
    auth_enabled: true
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        s3:
          endpoint: garage.storage.svc.cluster.local:3900
          region: garage
          bucketnames: loki
          access_key_id: ${S3_ACCESS_KEY_ID}
          secret_access_key: ${S3_SECRET_ACCESS_KEY}
          s3forcepathstyle: true
          insecure: true
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 168h
      reject_old_samples: false
    compactor:
      working_directory: /loki/compactor
      delete_request_store: s3
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
