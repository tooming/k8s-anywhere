# Allow ingress to Grafana pods from Traefik's data-plane pods (ADR-0016, ADR-0040 —
# supersedes Envoy Gateway/ADR-0008). The Grafana IngressRoute (defined as an
# extraObject in observability-grafana.yaml) routes grafana.127.0.0.1.nip.io
# traffic through Traefik pods in kube-system to Grafana pods on TCP 3000 (the
# container port; the Service maps port 80 → container port 3000).
# Without this allow, the default-deny floor blocks the proxied HTTP traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress-from-gateway
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
