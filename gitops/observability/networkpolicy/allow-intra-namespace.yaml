# Allow all pods within the observability namespace to communicate with each other.
# This is a documented carve-out from ADR-0016's general "no catch-all 'allow same
# namespace'" rule — see ADR-0016 §"Scope & exceptions" → Carve-outs table, the
# `observability` row, for the binding rationale and flip condition. The LGTMP stack
# has many intra-namespace flows:
#   Alloy → Mimir/Loki/Pyroscope (remote_write / push);
#   Alloy ← KSM / LGTMP self-metric scrapes (ports 9009, 3100, 3200, 4040, 8080, 8081, 80);
#   Grafana → Mimir / Loki / Tempo / Pyroscope (datasource reads);
#   pprof scrapes between Pyroscope and co-located services.
# A single broad intra-namespace allow is correct here — every component is an
# intentional coupling of the same purpose-built observability stack.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-intra-namespace
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
