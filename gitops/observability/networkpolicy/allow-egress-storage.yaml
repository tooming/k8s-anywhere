# Allow all observability pods to reach the storage namespace (ADR-0016).
# Two distinct flows share this destination:
#   Mimir, Loki, Tempo, Pyroscope → Garage S3 API (:3900) for persistent backend writes;
#   Alloy → Garage admin metrics endpoint (:3903) for the "Lab — Garage S3" dashboard.
# Using podSelector: {} covers both sets of pods without enumerating each component.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-egress-storage
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 3900
          protocol: TCP
        - port: 3903
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
