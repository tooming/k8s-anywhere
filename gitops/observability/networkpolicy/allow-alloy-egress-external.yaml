# Allow Alloy to reach all external scrape targets outside the observability namespace
# (ADR-0016). Each egress rule targets one destination namespace or IP class.
# podSelector matches only Alloy pods — other observability pods do not inherit
# these broad egress permissions (they use allow-egress-storage.yaml for Garage).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-egress-external
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Egress
  egress:
    # ArgoCD component metrics: app-controller :8082, server :8083,
    # repo-server :8084, applicationset-controller :8080.
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8084
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    # data layer: RabbitMQ Prometheus plugin (:15692), redis_exporter (:9121).
    - ports:
        - port: 15692
          protocol: TCP
        - port: 9121
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
    # Envoy Gateway controller (:19001) and data-plane proxy (:19000).
    - ports:
        - port: 19000
          protocol: TCP
        - port: 19001
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
    # Inkless kafka-exporter (:9308) — on-demand; idle unless inkless is synced.
    - ports:
        - port: 9308
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inkless
    # Kyverno admission engine metrics (:8000) — four controller Services.
    - ports:
        - port: 8000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kyverno
    # Trivy Operator metrics (:8080) — supply-chain CVE / SBOM scanner.
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trivy-system
    # Velero backup/restore controller metrics (:8085).
    - ports:
        - port: 8085
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velero
    # kubelet + cAdvisor on cluster nodes (:10250). Alloy uses the node-role
    # Kubernetes discovery which resolves to per-node IP addresses outside
    # the pod CIDR, so an ipBlock CIDR covers the entire address space.
    - ports:
        - port: 10250
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
