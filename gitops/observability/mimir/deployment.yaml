apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
  labels:
    app: mimir
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
      annotations:
        # Bump when mimir.yaml changes so the pod restarts to read it
        # (plain manifest has no auto-checksum like Helm charts do).
        checksum/config: s3-garage-v4-ruler-rule-path
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mimir
          # Pinned image tag — see ADR-0034's Re-evaluation log for the
          # currency-check history. 3.1.5 (2026-08-20): Go 1.26.6 stdlib CVE
          # bump (CVE-2026-33818, CVE-2026-39821, CVE-2026-46600,
          # CVE-2026-56853, CVE-2026-56858, CVE-2026-56859, CVE-2026-56860,
          # CVE-2026-56862), zero config/flag changes — same 3.1.x line as
          # the prior pin. The newer `3.2.0` minor carries a long list of
          # `[CHANGE]` entries (query-frontend default-behavior flips,
          # alertmanager UI removal, opaque-gRPC-type querier/store-gateway
          # coupling requiring both sides on 3.1 first) deliberately not
          # picked up here — those need live-cluster upgrade verification
          # this clusterless session cannot do (ADR-0004).
          image: grafana/mimir:3.1.5
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
            - -target=all
          env:
            - name: GARAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: access-key-id
            - name: GARAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: secret-access-key
          ports:
            - name: http
              containerPort: 9009
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Found 2026-08-11 (systemic probe-timeout audit): no timeoutSeconds at all,
          # which falls back to Kubernetes' own 1s default -- the same chart-default-
          # too-tight footgun already found and fixed for Harbor (PR #1040/#1102),
          # ArgoCD (PR #1103/#1121), Kyverno (PR #1115), and others in this same
          # sweep. Mimir has no livenessProbe (only readiness), so this can't trigger
          # a restart -- but it can flap readiness under this host's real CPU
          # contention, breaking Alloy's remote_write and the dashboards it feeds.
          readinessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data
        - name: tmp
          emptyDir: {}
