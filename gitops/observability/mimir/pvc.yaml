# Persistent disk for Mimir's ingester WAL + head block (recent, not-yet-flushed
# data). Long-term blocks live in Garage S3; this keeps recent data across restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
