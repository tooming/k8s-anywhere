apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    # Monolithic single-node Mimir (Grafana's documented single-process layout).
    # Multi-tenant: every write/read must carry the X-Scope-OrgID header.
    multitenancy_enabled: true
    # readOnlyRootFilesystem (ADR-0017 PSS restricted) makes the working dir
    # read-only, so the activity tracker's default ./metrics-activity.log can't be
    # created and the process exits 1 on boot. Point it at the writable PVC (/data).
    activity_tracker:
      filepath: /data/metrics-activity.log
    server:
      http_listen_port: 9009
      log_level: warn
    blocks_storage:
      backend: s3
      s3:
        endpoint: garage.storage.svc.cluster.local:3900
        bucket_name: mimir
        region: garage
        insecure: true
        access_key_id: ${GARAGE_ACCESS_KEY_ID}
        secret_access_key: ${GARAGE_SECRET_ACCESS_KEY}
      bucket_store:
        sync_dir: /data/tsdb-sync
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: memberlist
        replication_factor: 1
    ruler_storage:
      backend: s3
      s3:
        endpoint: garage.storage.svc.cluster.local:3900
        bucket_name: mimir-ruler
        region: garage
        insecure: true
        access_key_id: ${GARAGE_ACCESS_KEY_ID}
        secret_access_key: ${GARAGE_SECRET_ACCESS_KEY}
    ruler:
      # Same read-only-root trap as activity_tracker: the ruler's local rule-group
      # scratch dir defaults to ./data-ruler/ (working dir), which is unwritable under
      # readOnlyRootFilesystem and crashes -target=all on boot. Pin it to the PVC.
      rule_path: /data/ruler
    store_gateway:
      sharding_ring:
        replication_factor: 1
