# Allow all pods within the tidb namespace to communicate with each other (ADR-0016).
# This is a documented carve-out from ADR-0016's general "no catch-all 'allow same
# namespace'" rule — see ADR-0016 §"Scope & exceptions" → Carve-outs table (the
# argocd/harbor/istio-system/longhorn-system/tidb row) for the binding
# rationale and flip condition.
# The TiDB cluster has many intra-namespace flows:
#   PD peers on TCP 2379 (client) and 2380 (peer);
#   TiKV storage nodes on TCP 20160 (server) and 20180 (status);
#   TiDB SQL servers on TCP 4000 (server) and 10080 (status);
#   tidb-demo app → TiDB SQL server on TCP 4000.
# A single broad intra-namespace allow is correct here — every component is an
# intentional coupling of the TiDB distributed database cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tidb-intra-namespace
  namespace: tidb
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
