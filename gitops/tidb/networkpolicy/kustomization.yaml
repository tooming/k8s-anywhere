# NetworkPolicy Kustomize overlay for the tidb namespace (ADR-0016 §4 fan-out).
# TiDB is on-demand (manual-sync only) but the NetworkPolicy manifests are cheap
# (no pods) so this overlay is auto-synced, ensuring the default-deny floor and
# per-workload allows are already in place before `make tidb-up` brings pods up.
# Wired into gitops/platform/networkpolicy-appset.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tidb

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-tidb-intra-namespace.yaml
  - allow-tidb-from-tidb-admin.yaml
  - allow-tidb-kubelet-egress.yaml
  - allow-tidb-from-observability.yaml
