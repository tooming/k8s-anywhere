# Allow ingress to tidb pods from the observability namespace on TCP 10080 (ADR-0016).
# Alloy scrapes the TiDB status endpoint (:10080/metrics) for the existing
# TiDB scrape job already configured in gitops/platform/observability-alloy.yaml.
# Without this allow the default-deny floor blocks the Alloy scrape, breaking
# the TiDB metrics panels in Grafana when the cluster is running.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tidb-from-observability
  namespace: tidb
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 10080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
