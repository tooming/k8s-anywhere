# Allow ingress from and egress to the tidb-admin namespace (ADR-0016).
# The TiDB Operator controller (in tidb-admin) reconciles TidbCluster CRs by
# directly managing PD, TiKV, and TiDB pods in the tidb namespace — it reads
# pod status, patches StatefulSets, and issues rolling restarts. Without this
# allow the default-deny floor blocks operator reconciliation entirely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tidb-from-tidb-admin
  namespace: tidb
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tidb-admin
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tidb-admin
