# TiDB Cluster — minimal single-instance lab setup.
# ADR-0003: production uses ≥3 PD + ≥3 TiKV + 2 TiDB; the 12 GB VM budget forces
# single replicas here (ADR-0005 escape hatch — call out the trade-off explicitly).
# ADR-0005: single host accepts SPOFs; optimises for recoverability.
# ON-DEMAND: bring up with `make tidb-up` (requires tidb-operator running first).
#
# Bumped v8.1.2 -> v8.5.7 (upgrade-drafter, 2026-07-23): no dedicated ADR pins the
# TiDB database version (only pingcap/tidb-operator's own chart is version-pinned,
# unaffected here), so this is a routine same-major currency bump, not an
# architect decision. v8.5.7 is the newest stable tag on pingcap/tidb's GitHub
# releases (published 2026-07-09; v9.0.0-beta.1 exists but is a pre-release,
# skipped per policy). No major bump (stays on TiDB major `8`). ADR-0004 caveat:
# this remote clusterless session cannot verify tidb-operator 1.6.5 reconciles
# this version cleanly on a live cluster (TiDB is on-demand, `make tidb-up`) —
# rollback is a one-line revert of this field; ADR-0005's recreate-over-HA means
# `make tidb-down && make tidb-up` rebuilds the cluster from manifest with no
# state to lose beyond the demo data itself.
#
# Bumped v8.5.7 -> v8.5.8 (upgrade-drafter fallback, 2026-09-01): ADR-0032
# explicitly holds the database at the v8.5.x LINE, not a specific patch --
# "a future v8.5.z patch ... remains in scope for a routine upgrade-drafter
# bump" -- so this stays clear of that ADR's own scope. Verified directly (not
# assumed, ADR-0004) via the real Atom tags/releases feeds
# (github.com/pingcap/tidb/tags.atom, .../releases.atom -- the HTML release
# page's rendered publish date is unreliable in this sandbox, the raw XML's
# ISO-8601 <updated> field is not): "TiDB v8.5.8" published
# 2026-08-27T09:06:37Z, the newest plain release tag on the v8.5.x line (only
# nightly/commit-titled build tags like v8.5.8-20260829-... exist beyond it,
# not stable releases). docs.pingcap.com's release-notes page is proxy-blocked
# in this sandbox and the GitHub compare view (39 commits, 156 files) was too
# large to render specific fix content -- this is treated as routine currency,
# not a claimed security fix, matching the same evidence bar this repo used
# for the original v8.1.2 -> v8.5.7 bump. No major bump (stays on TiDB major
# `8`, same v8.5.x line ADR-0032 holds). ADR-0004 caveat: this remote
# clusterless session cannot verify tidb-operator 1.6.6 reconciles this
# version cleanly on a live cluster (TiDB is on-demand, `make tidb-up`) --
# rollback is a one-line revert of this field.
apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: lab
  namespace: tidb
spec:
  version: "v8.5.8"
  timezone: UTC
  pvReclaimPolicy: Delete
  enableDynamicConfiguration: true
  configUpdateStrategy: RollingUpdate

  pd:
    baseImage: pingcap/pd
    replicas: 1
    # maxFailoverCount=0: do not spin up extra replicas on node failure in a 1-node lab.
    maxFailoverCount: 0
    storageClassName: local-path
    requests:
      storage: "1Gi"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    config:
      replication:
        # 1 replica per region matches the single TiKV node.
        max-replicas: 1

  tikv:
    baseImage: pingcap/tikv
    replicas: 1
    maxFailoverCount: 0
    storageClassName: local-path
    requests:
      storage: "2Gi"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    config:
      storage:
        # Don't reserve space for snapshots in a lab — avoids disk pressure.
        reserve-space: "0MB"

  tidb:
    baseImage: pingcap/tidb
    replicas: 1
    maxFailoverCount: 0
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      type: ClusterIP
