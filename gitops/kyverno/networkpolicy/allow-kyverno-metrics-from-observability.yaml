# Allow Alloy in the observability namespace to scrape Kyverno metrics on TCP 8000
# (ADR-0016). Each Kyverno 3.x controller exposes Prometheus metrics at :8000/metrics
# via its own `kyverno-<controller>-controller-metrics` Service; the kyverno scrape
# job in observability-alloy.yaml targets all four and feeds the "Lab — Kyverno"
# dashboard with real policy-result counters (ADR-0004). podSelector {} keeps this
# allow Service-name-agnostic — it covers every kyverno pod's :8000 metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kyverno-metrics-from-observability
  namespace: kyverno
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
