# NetworkPolicy Kustomize overlay for the kyverno namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds a kyverno-specific allow rule for
# the admission webhook callback from the kube-apiserver (TCP 9443). (The Alloy
# metrics-scrape ingress rule this overlay used to also carry was removed
# 2026-09-06, ADR-0041, observability stack removed with no replacement.)
# The allow-dns-and-apiserver baseline covers Kyverno's k8s API calls (policy
# reconcile, leader election, and admission review fan-out to the apiserver).
# Wired into gitops/platform/kyverno-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kyverno

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-kyverno-webhook-from-apiserver.yaml
