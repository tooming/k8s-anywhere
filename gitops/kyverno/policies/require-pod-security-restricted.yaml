# Backstop for ADR-0017 (PSS-restricted): reject pods that omit the required
# security fields at admission time. Skips namespaces with a PSA baseline or
# privileged label so ADR-0017 carve-out namespaces (vault, storage, tidb, etc.)
# are excluded automatically — no hard-coded namespace list to maintain.
# background: true generates PolicyReports for already-running resources.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security-restricted
  annotations:
    policies.kyverno.io/severity: medium
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/description: >-
      Ensures every pod meets PSS-restricted requirements (ADR-0017). Excludes
      namespaces labelled pod-security.kubernetes.io/enforce=baseline or =privileged.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: require-pss-restricted
    match:
      any:
      - resources:
          kinds: [Pod]
    exclude:
      any:
      - resources:
          namespaces: [kube-system, kube-public, kube-node-lease]
      - resources:
          namespaceSelector:
            matchExpressions:
            - key: pod-security.kubernetes.io/enforce
              operator: In
              values: [baseline, privileged]
    validate:
      message: >-
        Pod must satisfy PSS-restricted: runAsNonRoot=true, allowPrivilegeEscalation=false,
        capabilities.drop=[ALL], seccompProfile.type=RuntimeDefault (ADR-0017).
      # runAsNonRoot + seccompProfile are checked at the POD level — that's where PSS,
      # the built-in PSA enforce=restricted label, AND every lab manifest set them (the
      # kubelet enforces pod-level runAsNonRoot on all containers, so it's equivalent to
      # container-level for security). The previous pattern demanded runAsNonRoot at the
      # CONTAINER level only, which no lab workload sets — so while the admission
      # controller was down nothing noticed, but the moment it recovered it rejected
      # every plain-manifest pod (mimir, loki, tempo, moto, rabbitmq, valkey, …) on
      # restart. allowPrivilegeEscalation + capabilities stay container-level (where the
      # manifests set them, and where PSS scopes them).
      pattern:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
