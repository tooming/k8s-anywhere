# Reject pod images that use ':latest' tag or specify no tag at all.
# Objective O4 pre-requisite: every lab image must be pinned so cosign signatures
# are verifiable. background: true generates PolicyReports for existing resources
# (background scan does NOT evict running pods; only new admissions are blocked).
#
# capstone carve-out (issue #498): capstone/{deployment,rollout}.yaml still hardcode
# a floating `:latest` placeholder pending Kargo wiring a real CI-pinned tag to
# capstone's image ref. Without this exclusion, any Pod creation after the initial
# from-scratch sync (crash/restart, node evict, Rollout scale event) is rejected and
# ArgoCD's selfHeal keeps retrying the same failing reconcile. Remove this exclusion
# once capstone's manifests reference a real, CI-pinned tag instead of `:latest`.
#
# argocd carve-out — REMOVED 2026-08-06 (issue #999). History: infra/modules/argocd/
# values.yaml used to pin `global.image.tag: latest` deliberately (needed the
# /applicationsets UI route from argoproj/argo-cd#26666, which only ships from
# v3.5.0 onward). `auto/argocd-chart-10-2-3` bumped the chart to `10.2.3`
# (appVersion `v3.5.0`) and dropped the `latest` pin from values.yaml. Issue #999
# tracked the remaining live-cluster gate: `infra/modules/argocd` is
# Terraform-bootstrap-only (ADR-0001) and doesn't auto-apply, so the exclusion
# stayed until a real `terraform apply` picked up the pin. Ran it live 2026-08-06:
# `terragrunt apply` against infra/live/local/argocd (found and fixed a real,
# separate bug along the way — the `provider "helm" { kubernetes { ... } }` block
# syntax broke against the already-locked hashicorp/helm v3.2.0 provider, which
# changed `kubernetes` from a block to an attribute; fixed in both
# infra/live/local/argocd/terragrunt.hcl and infra/live/oracle/argocd/terragrunt.hcl).
# Verified live: every argocd Pod (application-controller, applicationset-controller,
# redis, repo-server, server) runs `quay.io/argoproj/argocd:v3.5.0`, confirmed via
# `kubectl get pods -n argocd -o jsonpath='{.items[*].spec.containers[*].image}'`.
#
# inkless carve-out (found 2026-07-28, structural sweep for the same conflict class
# as issue #498/the argocd carve-out above): gitops/inkless/inkless-statefulset.yaml
# hardcodes `ghcr.io/aiven/inkless:latest`. Unlike the demo/s3manager fix landed the
# same day (which pinned real tags), Aiven Inkless publishes no stable named release —
# only rotating `edge-<commit>` builds (confirmed live against the package's own
# GitHub Packages page) — so there is no real tag to pin to without committing to a
# manual re-pin on every bump, the same "intentional follow-the-stream" situation this
# repo already accepts for Garage's `main` tag. Per ADR-0004/issue #498's own
# precedent, guessing a specific `edge-<hash>` tag to hardcode would be fabricating
# state this remote session cannot verify against the live registry. inkless is
# on-demand (`gitops/platform/inkless.yaml` carries no `syncPolicy.automated`), so
# this exclusion only matters when a user runs `make inkless-up` — without it, that
# command would fail admission entirely on every attempt, not just on recreation.
# Flip condition: remove the exclusion once ghcr.io/aiven/inkless ships a stable,
# pinnable named release tag.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/severity: medium
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Rejects any container image using ':latest' tag or with no tag (ADR-0019).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: disallow-latest-tag
    match:
      any:
      - resources:
          kinds: [Pod]
    exclude:
      any:
      - resources:
          namespaces: [capstone, inkless]
    validate:
      message: "Image tag is required and must not be ':latest'."
      foreach:
      - list: "request.object.spec.containers"
        deny:
          conditions:
            any:
            - key: "{{ ends_with(element.image, ':latest') }}"
              operator: Equals
              value: true
            - key: "{{ contains(element.image, ':') }}"
              operator: Equals
              value: false
