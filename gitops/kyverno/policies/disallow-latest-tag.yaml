# Reject pod images that use ':latest' tag or specify no tag at all.
# Objective O4 pre-requisite: every lab image must be pinned so cosign signatures
# are verifiable. background: true generates PolicyReports for existing resources
# (background scan does NOT evict running pods; only new admissions are blocked).
#
# capstone carve-out (issue #498): capstone/{deployment,rollout}.yaml still hardcode
# a floating `:latest` placeholder pending Kargo wiring a real CI-pinned tag to
# capstone's image ref. Without this exclusion, any Pod creation after the initial
# from-scratch sync (crash/restart, node evict, Rollout scale event) is rejected and
# ArgoCD's selfHeal keeps retrying the same failing reconcile. Remove this exclusion
# once capstone's manifests reference a real, CI-pinned tag instead of `:latest`.
#
# argocd carve-out (found 2026-07-24, #632 investigation): infra/modules/argocd/
# values.yaml used to pin `global.image.tag: latest` deliberately (documented
# TODO — needed the /applicationsets UI route from argoproj/argo-cd#26666,
# which only ships from v3.5.0 onward). Without this exclusion every
# ArgoCD-managed Pod this applies to (application-controller, repo-server,
# server, the chart's bundled cache-init hook Job, …) is rejected on any
# recreation — this silently went undetected for days because the running
# Pods predated Kyverno enforcing the policy and container restarts don't
# re-trigger admission, until application-controller OOMKilled (separate fix,
# same investigation) and could never come back: Kyverno blocked every
# recreation attempt, and `helm upgrade` (via `make argocd`) failed
# identically on its pre-upgrade hook Job.
#
# UPDATE (janitor cleanup, 2026-08-05): `auto/argocd-chart-10-2-3` bumped the
# chart to `10.2.3` (appVersion `v3.5.0`, confirmed the first stable tag
# containing #26666) and this cleanup dropped the `latest` pin from
# `infra/modules/argocd/values.yaml` entirely — the chart's own
# `global.image.tag` default now resolves to the real, stable `v3.5.0` tag.
# **This exclusion is NOT yet safe to remove**, even though the code-level
# TODO is resolved: `infra/modules/argocd` is Terraform-bootstrap-only
# (ADR-0001) and does not auto-apply to the live cluster, so removing this
# exclusion before a live `terraform apply` actually picks up the new pin
# would reintroduce the exact OOMKilled-recreation-loop failure described
# above (the live Pods would still be running `:latest`). Standing
# maintainer-confirmation gate: [Issue
# #999](https://github.com/tooming/k8s-anywhere/issues/999) — remove `argocd`
# from the `namespaces:` list below (and this whole carve-out comment, and the
# matching `tests/kyverno.bats` assertion) once that issue confirms a live
# `terraform apply` has run and every ArgoCD Pod is actually running a
# `v3.5.0`-tagged image, not `:latest`.
#
# inkless carve-out (found 2026-07-28, structural sweep for the same conflict class
# as issue #498/the argocd carve-out above): gitops/inkless/inkless-statefulset.yaml
# hardcodes `ghcr.io/aiven/inkless:latest`. Unlike the demo/s3manager fix landed the
# same day (which pinned real tags), Aiven Inkless publishes no stable named release —
# only rotating `edge-<commit>` builds (confirmed live against the package's own
# GitHub Packages page) — so there is no real tag to pin to without committing to a
# manual re-pin on every bump, the same "intentional follow-the-stream" situation this
# repo already accepts for Garage's `main` tag. Per ADR-0004/issue #498's own
# precedent, guessing a specific `edge-<hash>` tag to hardcode would be fabricating
# state this remote session cannot verify against the live registry. inkless is
# on-demand (`gitops/platform/inkless.yaml` carries no `syncPolicy.automated`), so
# this exclusion only matters when a user runs `make inkless-up` — without it, that
# command would fail admission entirely on every attempt, not just on recreation.
# Flip condition: remove the exclusion once ghcr.io/aiven/inkless ships a stable,
# pinnable named release tag.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/severity: medium
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Rejects any container image using ':latest' tag or with no tag (ADR-0019).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
  - name: disallow-latest-tag
    match:
      any:
      - resources:
          kinds: [Pod]
    exclude:
      any:
      - resources:
          namespaces: [capstone, argocd, inkless]
    validate:
      message: "Image tag is required and must not be ':latest'."
      foreach:
      - list: "request.object.spec.containers"
        deny:
          conditions:
            any:
            - key: "{{ ends_with(element.image, ':latest') }}"
              operator: Equals
              value: true
            - key: "{{ contains(element.image, ':') }}"
              operator: Equals
              value: false
