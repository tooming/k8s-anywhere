# Mutate: inject pod-level runAsNonRoot=true when a pod ALREADY declares a
# non-zero runAsUser (at pod OR container level) but forgot to state
# runAsNonRoot. Defence-in-depth alongside require-pod-security-restricted
# (ADR-0017) and add-default-seccomp (ADR-0019) — same mutate-default pattern.
#
# Why this exists: some upstream charts set a non-root UID plus a compliant
# CONTAINER securityContext (runAsNonRoot=true, drop ALL, seccomp) yet never set
# runAsNonRoot at the POD level — goharbor/harbor 1.16.0 is the reference case
# (pod securityContext = runAsUser:10000/fsGroup:10000 only, hardcoded in the
# chart templates with no override key). require-pod-security-restricted checks
# runAsNonRoot at the POD level (see its comment for why pod-level is the lab
# convention), so those charts are rejected at admission even though every process
# genuinely runs non-root. This mutate closes that gap structurally, so no chart
# has to be forked and no namespace has to be carved down to `baseline`.
#
# akuity/kargo 1.2.3 is the second reference case, and a stricter variant: the
# chart exposes NO pod-level securityContext knob at all (only a per-component
# `<component>.securityContext` value that templates onto the CONTAINER, never
# the pod) — so unlike Harbor there is no pod-level runAsUser to key off either.
# The precondition below therefore also matches when the FIRST container
# declares runAsUser > 0, which is exactly Kargo's shape once its chart values
# set api/controller/webhooksServer/etc. securityContext.runAsUser.
#
# containers[0], not a `[?...]` JMESPath filter over all containers: verified
# live against the running cluster that Kyverno's `{{ }}` precondition
# evaluator does not fire a filter-projection expression
# (`containers[?securityContext.runAsUser > \`0\`] | length(@)`) the way
# standard JMESPath does — it silently evaluates as no-match instead of
# erroring, so the whole rule just never fired. A plain index lookup does
# work. This is a narrower heuristic (only the first container's UID counts),
# but that only ever makes the mutate LESS likely to fire — a false negative
# here means require-pod-security-restricted still rejects the pod exactly as
# it did before this policy existed, never a false positive that admits
# something it shouldn't.
#
# Safety — this only ever ASSERTS a truth, never forces a root workload non-root:
#   1. preconditions gate on runAsUser > 0 declared at the pod level OR on the
#      first container — either way, a non-root UID the pod actually runs as.
#      Root pods (runAsUser:0 or unset everywhere) never match, so they are
#      untouched.
#   2. the exclude block mirrors require-pod-security-restricted: baseline /
#      privileged carve-out namespaces (vault, istio-system, tidb, …) are skipped,
#      so their deliberately root-running init/JVM containers are never forced
#      runAsNonRoot. No hard-coded namespace list — driven by the PSA enforce label.
#   3. the +(runAsNonRoot) conditional anchor patches ONLY when the field is absent,
#      so a workload that already sets runAsNonRoot (either value) is not overwritten.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-runasnonroot
  annotations:
    policies.kyverno.io/severity: low
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/description: >-
      Injects pod-level runAsNonRoot=true when a pod declares a non-zero runAsUser
      — at the pod level OR on its first container — but omits runAsNonRoot
      (ADR-0019 defence-in-depth). Unblocks charts like goharbor/harbor (pod-level
      UID, no pod-level runAsNonRoot) and akuity/kargo (container-level UID only,
      no pod-level securityContext knob at all), which require-pod-security-restricted
      (ADR-0017) checks at the pod level.
spec:
  rules:
  - name: add-runasnonroot-when-nonroot-uid
    match:
      any:
      - resources:
          kinds: [Pod]
    # Same carve-out set as require-pod-security-restricted: never mutate pods in
    # namespaces that are deliberately baseline/privileged (root workloads live there).
    exclude:
      any:
      - resources:
          namespaces: [kube-system, kube-public, kube-node-lease]
      - resources:
          namespaceSelector:
            matchExpressions:
            - key: pod-security.kubernetes.io/enforce
              operator: In
              values: [baseline, privileged]
    preconditions:
      any:
      # A non-root UID declared at the pod level. `|| ` + backtick 0 backtick
      # defaults the value to 0 when securityContext/runAsUser is absent.
      - key: "{{ request.object.spec.securityContext.runAsUser || `0` }}"
        operator: GreaterThan
        value: 0
      # ...or on the first container (charts with no pod-level knob, e.g. Kargo).
      - key: "{{ request.object.spec.containers[0].securityContext.runAsUser || `0` }}"
        operator: GreaterThan
        value: 0
    mutate:
      patchStrategicMerge:
        spec:
          securityContext:
            +(runAsNonRoot): true
