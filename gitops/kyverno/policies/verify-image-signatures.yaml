# Verifies cosign signatures on images pushed to the in-cluster Harbor
# registry (ADR-0019, CHARTER Objective O4; scope repointed to Harbor's host
# per ADR-0024 / auto/harbor-capstone-rewire). Scoped to
# harbor.127.0.0.1.nip.io/** so upstream chart images (Grafana, Vault, etc.)
# that are NOT lab-signed are never rejected. The cosign public key is seeded
# by scripts/cosign-bootstrap.sh into the Secret cosign-public-key in
# namespace kyverno.
#
# Audit mode + failurePolicy: Ignore. The cosign signing step (sign-image stage) is
# already wired in .gitlab-ci.yml — this policy stays Audit/Ignore pending the
# separate auto/cosign-enforce-flip ROADMAP item, which requires a maintainer to
# confirm on a live cluster that at least one CI run actually pushed a signed
# `.sig` tag to Harbor before flipping to Enforce + failurePolicy: Fail (a
# remote clusterless session cannot verify that condition itself). background:
# false because image verification requires the live registry manifest during
# admission; background scans cannot verify signatures without a running
# registry connection.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/severity: high
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/description: >-
      Verifies cosign signatures on Harbor images (ADR-0019, Objective O4).
      Audit + failurePolicy Ignore until the cosign CI signing pipeline lands.
spec:
  validationFailureAction: Audit
  failurePolicy: Ignore
  background: false
  rules:
  - name: verify-harbor-signatures
    match:
      any:
      - resources:
          kinds: [Pod]
    verifyImages:
    - imageReferences:
      - "harbor.127.0.0.1.nip.io/**"
      attestors:
      - entries:
        - keys:
            publicKeySecret:
              name: cosign-public-key
              namespace: kyverno
