# Verifies cosign signatures on images pushed to the in-cluster Harbor
# registry (ADR-0019, CHARTER Objective O4; scope repointed to Harbor's host
# per ADR-0024 / auto/harbor-capstone-rewire). Scoped to
# harbor.127.0.0.1.nip.io/** so upstream chart images (Vault, cert-manager, etc.)
# that are NOT lab-signed are never rejected. The cosign public key is seeded
# by scripts/cosign-bootstrap.sh into the Secret cosign-public-key in
# namespace kyverno.
#
# Enforce mode + failurePolicy: Fail (flipped from Audit/Ignore 2026-08-18,
# `auto/cosign-enforce-flip`, RFC #214 Item 3). The cosign signing step
# (sign-image job, now in .forgejo/workflows/build-sign-push.yml per ADR-0035's
# CI-source migration) was already wired and merged; this flip was gated on a
# maintainer confirming on a live cluster that a real CI run pushed a signed
# image to Harbor — confirmed in issue #631 (2026-08-18): the Forgejo Actions
# run #29 attempt 2 (commit b388df5c) completed sign-image green, and Harbor's
# own artifact API independently showed a real `type: signature.cosign`
# accessory attached to harbor.127.0.0.1.nip.io/library/hello (digest
# sha256:2f9ca51a..., subject sha256:91d52ea9..., created
# 2026-08-18T05:30:10Z) — not just the workflow's own success status
# (ADR-0004: verify before asserting). background: false because image
# verification requires the live registry manifest during admission;
# background scans cannot verify signatures without a running registry
# connection.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/severity: high
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/description: >-
      Verifies cosign signatures on Harbor images (ADR-0019, Objective O4).
      Enforce + failurePolicy Fail since 2026-08-18 — a real signed image was
      confirmed landing in Harbor via the cosign CI signing pipeline (issue #631).
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: false
  rules:
  - name: verify-harbor-signatures
    match:
      any:
      - resources:
          kinds: [Pod]
    verifyImages:
    - imageReferences:
      - "harbor.127.0.0.1.nip.io/**"
      attestors:
      - entries:
        - keys:
            publicKeySecret:
              name: cosign-public-key
              namespace: kyverno
