# Route the ArgoCD UI through Envoy at http://argocd.127.0.0.1.nip.io:8080
# (ArgoCD server runs insecure/HTTP, so it sits cleanly behind the gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "argocd.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
