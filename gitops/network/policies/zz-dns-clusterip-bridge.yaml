# Shared ClusterIP egress bridge (ADR-0014 Cilium, ADR-0016 default-deny).
#
# Why this is needed: with default-deny egress, per-service egress rules
# select destination *pods* by namespace/label selector. But clients connect
# to the Kubernetes *Service ClusterIP* (e.g. vault.vault.svc → 10.43.x.x),
# and Cilium's socket-LB may evaluate egress policy against that ClusterIP
# *before* translating it to the backend pod IP. A pod-selector egress rule
# never matches a ClusterIP, so the connection is dropped and pods see
# `dial tcp <clusterip>:PORT: i/o timeout` (DNS still works because Cilium
# answers it via its node-local proxy, masking the real cause; #315).
#
# Scope: the Service ClusterIP CIDR only (10.43.0.0/16). It does not widen
# pod-to-pod reachability — per-service pod-selector egress rules still gate
# which backends a pod may actually reach; this merely lets the ClusterIP
# frontend be evaluated before Cilium's socket-LB translates it.
#
# Every namespace that carries the default-deny overlay MUST also include this
# shared template (or an equivalent per-namespace file). The CI drift guard in
# tests/networkpolicy.bats enforces this: a kustomization.yaml that references
# default-deny.yaml but not zz-dns-clusterip-bridge fails make ci.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zz-dns-clusterip-bridge
  annotations:
    # Same reasoning as allow-dns-and-apiserver.yaml's sync-wave: must land before
    # default-deny.yaml (wave 0), not after, or Service ClusterIP egress (including
    # DNS's own Service frontend) breaks in the window before this policy exists.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    - toCIDR:
        - 10.43.0.0/16
