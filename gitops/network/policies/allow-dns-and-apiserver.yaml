# Reusable allow-DNS-and-apiserver egress policy (ADR-0016).
# Permits every pod in the namespace to resolve DNS (kube-dns UDP/TCP 53) and
# reach the Kubernetes API server. The consuming namespace's Kustomize overlay
# sets the namespace. Without this a deny-all namespace cannot start workloads.
#
# This is a CiliumNetworkPolicy, NOT a plain NetworkPolicy, on purpose (ADR-0014):
# under Cilium's kube-proxy-free datapath the API server is given Cilium's reserved
# `kube-apiserver` identity, and the ClusterIP (10.43.0.1) is socket-LB-translated to
# the real endpoint BEFORE egress policy is evaluated. A plain NetworkPolicy `ipBlock`
# rule (whether 10.43.0.1/32 or the node IP) therefore never matches API-server
# traffic, and every deny-all namespace is silently cut off from the apiserver.
# `toEntities: kube-apiserver` is the only rule Cilium matches for that traffic.
#
# DNS is the inverse footgun in this lab: pods send DNS to the kube-dns Service
# frontend (10.43.0.10), and Cilium may evaluate that service IP before matching
# the CoreDNS pod identity. Keep the pod-identity rule, but also allow only
# TCP/UDP 53 to the service CIDR so DNS works on fresh `make up` rebuilds without
# a live-only bridge policy. The Kubernetes API has the same service-frontend
# shape for in-cluster clients (10.43.0.1:443), so that exact ClusterIP is allowed
# alongside Cilium's reserved kube-apiserver identity.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns-and-apiserver
  annotations:
    # Must land strictly before default-deny.yaml (wave 0) in every namespace that
    # includes both: neither ArgoCD's own sync-wave-4 NetworkPolicy Applications nor
    # kubectl apply order guarantee CiliumNetworkPolicy (this) lands before/with a
    # plain NetworkPolicy (default-deny-all) in the same sync — observed applying
    # default-deny-all first cuts the namespace's own pods off from the apiserver
    # and DNS before this policy exists, and if that namespace is argocd itself the
    # controller can never finish the sync that would have added this rule (found on
    # a from-scratch `make up`: argocd-networkpolicy landed default-deny-all only,
    # then argocd-application-controller lost apiserver access mid-sync — #440-follow-up).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector: {}
  egress:
    # DNS: every pod must resolve names via CoreDNS (kube-dns) in kube-system.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # DNS service frontend: kube-proxy-free Cilium can evaluate the ClusterIP
    # before pod identity, so permit DNS ports to Service CIDRs only.
    - toCIDR:
        - 10.43.0.0/16
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API service frontend used by in-cluster clients.
    - toCIDR:
        - 10.43.0.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Kubernetes API server: reserved identity, survives kube-proxy-free translation.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
