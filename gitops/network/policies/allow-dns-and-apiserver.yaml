# Reusable allow-DNS-and-apiserver egress policy (ADR-0016).
# Permits every pod in the namespace to resolve DNS (kube-dns UDP/TCP 53) and
# reach the Kubernetes API server. The consuming namespace's Kustomize overlay
# sets the namespace. Without this a deny-all namespace cannot start workloads.
#
# Plain networking.k8s.io/v1 NetworkPolicy — Cilium (ADR-0014) was removed
# entirely 2026-09-07, no replacement; k3s's bundled Flannel + kube-router is
# the CNI now. Under kube-router's iptables enforcement, kube-proxy's ClusterIP
# DNAT happens in the nat table's PREROUTING chain, strictly before the FORWARD
# chain kube-router uses to enforce NetworkPolicy — so by the time a policy is
# evaluated, a pod's request to a Service ClusterIP has ALREADY been rewritten
# to the real backend pod's IP. A plain podSelector/namespaceSelector rule
# targeting the real destination pods (CoreDNS) therefore works correctly and
# needs none of the socket-LB, pre-DNAT ClusterIP-CIDR workarounds this file
# and zz-dns-clusterip-bridge.yaml (dropped entirely, no replacement) used to
# carry under Cilium's kube-proxy-free datapath.
#
# The kube-apiserver is the one exception: k3s embeds the apiserver in the
# server node's own process rather than running it as a selectable pod, so no
# pod/namespace selector can ever match it — post-DNAT the real destination is
# the node's own IP on TCP 6443, which isn't practically pinnable from a
# Kustomize template (it varies per k3d/Colima environment and across
# rebuilds; this repo confirmed live, while removing the equivalent Cilium
# rule for webhook callbacks, that the observed node IP is neither the
# ClusterIP nor a fixed value — see allow-eso-webhook-from-apiserver.yaml).
# Following this repo's own established pattern for not-practically-pinnable
# targets (allow-argocd-repo-server-egress-charts.yaml), this uses an ipBlock
# 0.0.0.0/0 egress scoped strictly to the apiserver's own ports — not a security regression versus the Cilium `toEntities:
# kube-apiserver` rule it replaces (that matched traffic to ANY node too; the
# real access boundary for the apiserver is its own TLS/RBAC layer, not
# NetworkPolicy). NEEDS LIVE VERIFICATION on the next cluster rebuild (ADR-0004)
# — flagged explicitly here rather than asserted as confirmed-working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-apiserver
  annotations:
    # Must land strictly before default-deny.yaml (wave 0) in every namespace
    # that includes both — kubectl/ArgoCD apply order doesn't guarantee this
    # policy lands before the deny-all floor in the same sync, and if it lands
    # after, the namespace's own pods lose DNS/apiserver access in the gap
    # (self-fatal if the namespace is argocd itself — #440-follow-up).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS: every pod must resolve names via CoreDNS (kube-dns) in kube-system.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server: node IP isn't pinnable here (see header comment).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
