# Shared north-south entrypoint for the lab. Apps attach HTTPRoutes to this
# Gateway from their own namespaces (allowedRoutes: All). Envoy Gateway sees the
# GatewayClass and provisions an Envoy proxy + LoadBalancer Service for the Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: lab-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # ADR-0028 follow-up: additive HTTPS listener alongside HTTP — existing
    # HTTP routes/URLs keep working unchanged, HTTPS becomes available, not
    # mandatory. HTTPRoutes with no sectionName attach to both listeners
    # automatically, so argocd-route.yaml (and every future route) is reachable
    # over HTTPS with no per-route change. certificateRefs points at the Secret
    # the wildcard Certificate (gitops/network/certificates/) produces, in this
    # same namespace — no ReferenceGrant needed.
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-127-0-0-1-nip-io-tls
      allowedRoutes:
        namespaces:
          from: All
