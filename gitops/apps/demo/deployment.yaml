apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      # PSS restricted (ADR-0017): nginx-unprivileged's own default UID is
      # non-root, but we pin an explicit UID/GID here anyway, matching this
      # repo's per-workload default (ADR-0017 Layer 1) -- both writable paths
      # nginx needs are emptyDir mounts below, so fsGroup ownership on them
      # is all that matters, not any UID baked into the image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          # Swapped 2026-09-08 from jaegertracing/example-hotrod: HotROD's own
          # distributed-tracing demo was orphaned once the observability stack
          # (its OTLP receiver) was removed 2026-09-06, ADR-0041 -- its tracing
          # functionality was already dead weight, and no Service/IngressRoute
          # ever existed to reach its web UI either. nginx-unprivileged serves
          # the same "Hello from GitOps" message the (previously orphaned)
          # lab-demo-hello ConfigMap already carried, now actually wired up,
          # and runs non-root by default -- meeting ADR-0017's lab-demo flip
          # condition, PSA baseline -> restricted (see this namespace's own
          # namespace.yaml and ADR-0017's Re-evaluation log).
          image: nginxinc/nginx-unprivileged:1.31.5-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx-unprivileged redirects its pid file and every http-context
            # temp path (client/proxy/fastcgi/uwsgi/scgi) under /tmp by default
            # specifically so a read-only root filesystem works -- one emptyDir
            # covers all of them.
            - name: tmp
              mountPath: /tmp
            # Default nginx.conf's proxy/fastcgi cache paths -- unused by this
            # static-only config, but nginx validates/creates the directory at
            # startup regardless, so it must be writable.
            - name: cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: lab-demo-hello
            items:
              - key: index.html
                path: index.html
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
