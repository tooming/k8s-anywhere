apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          # Pinned 2026-07-28 (recreate-from-code / no-floating-tag hardening): `latest`
          # currently resolves to 2.20.0 (Docker Hub tags API, confirmed live) — this is
          # a pin-what's-already-running change, not a version bump, same reasoning as
          # the Vault image-tag pin. Also closes a real Kyverno gap: the
          # `disallow-latest-tag` ClusterPolicy (Enforce mode) only excludes
          # capstone/argocd, not lab-demo — a floating tag here risked the same
          # "admission blocked on next Pod recreation" incident already hit ArgoCD
          # (see gitops/kyverno/policies/disallow-latest-tag.yaml's header comments).
          image: jaegertracing/example-hotrod:2.20.0
          ports:
            - containerPort: 8080
          # OTEL_EXPORTER_OTLP_ENDPOINT (pointed at Tempo) removed 2026-09-06 (ADR-0041,
          # observability stack removed with no replacement) — Tempo no longer exists to
          # receive traces; hotrod runs with its own default (no-op) exporter behavior.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
