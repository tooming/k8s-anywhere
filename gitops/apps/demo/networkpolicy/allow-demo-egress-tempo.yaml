# Allow egress from HotROD demo pods to Tempo for OTLP HTTP traces (ADR-0016).
# The HotROD app sends spans via OTEL_EXPORTER_OTLP_ENDPOINT pointing to
# tempo.observability.svc.cluster.local:4318 (OTLP HTTP). The default-deny-all
# floor blocks this egress without an explicit allow. The observability namespace
# has a matching ingress allow in allow-tempo-ingress-otlp.yaml that already
# lists lab-demo as a permitted source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-demo-egress-tempo
  namespace: lab-demo
spec:
  podSelector:
    matchLabels:
      app: hello
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 4318
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: tempo
