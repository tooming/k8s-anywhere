# Explicit lab-demo namespace manifest with Pod Security Admission labels (ADR-0017).
# PSA profile is `restricted` since 2026-09-08: the Deployment's image was swapped
# from the root-running jaegertracing/example-hotrod to nginx-unprivileged (a
# non-root-by-default static web server), meeting the flip condition ADR-0017's
# lab-demo row named (see ADR-0017 §Per-namespace profile + §Re-evaluation log).
apiVersion: v1
kind: Namespace
metadata:
  name: lab-demo
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
