apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.1
          ports:
            - containerPort: 3000
          env:
            # Homepage v1 blocks unknown Host headers; allow the Envoy-routed host.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "localhost:8080,localhost:3000"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          configMap:
            name: homepage-config
        # writable logs dir layered over the read-only config mount
        - name: logs
          emptyDir: {}
