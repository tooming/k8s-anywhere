# Allow ingress to the capstone pod from Traefik's data-plane pods (ADR-0016,
# ADR-0040 — supersedes Envoy Gateway/ADR-0008). Traefik pods
# (app.kubernetes.io/name=traefik) in kube-system forward requests from the
# IngressRoute capstone.127.0.0.1.nip.io to TCP 8080. Without this allow, the
# default-deny-all floor blocks the proxied traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-capstone-ingress-from-gateway
  namespace: capstone
spec:
  podSelector:
    matchLabels:
      app: capstone
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
