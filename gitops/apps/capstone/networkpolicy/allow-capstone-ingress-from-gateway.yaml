# Allow ingress to the capstone pod from Envoy Gateway proxy pods (ADR-0016).
# Envoy proxy pods (app.kubernetes.io/component=proxy) in envoy-gateway-system
# forward requests from the HTTPRoute capstone.127.0.0.1.nip.io to TCP 8080.
# Without this allow, the default-deny-all floor blocks the proxied traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-capstone-ingress-from-gateway
  namespace: capstone
spec:
  podSelector:
    matchLabels:
      app: capstone
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
