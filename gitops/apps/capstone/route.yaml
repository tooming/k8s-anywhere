# Route the capstone app (pipeline-built image) through Envoy at
# http://capstone.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# Always-on: auto-synced as part of the capstone Application (gitops/platform/capstone.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: capstone
  namespace: capstone
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "capstone.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: capstone
          port: 8080
