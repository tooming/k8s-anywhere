# Route the capstone app (pipeline-built image) through Traefik at
# http://capstone.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# Always-on: auto-synced as part of the capstone Application (gitops/platform/capstone.yaml).
#
# Routes to the capstone TraefikService (not a plain Service) — the weighted
# split between capstone-stable/capstone-canary that the Rollout controller
# rewrites on every canary step (see rollout.yaml's trafficRouting.traefik).
#
# Split into two IngressRoute objects (2026-09-06 fix) — see
# gitops/network/argocd-ingressroute.yaml's header comment for the full finding:
# a `tls: {}` stanza on an object that also lists `web` silently breaks plain-HTTP
# matching on `web` entirely.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: capstone
  namespace: capstone
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`capstone.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: capstone
          kind: TraefikService
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: capstone-tls
  namespace: capstone
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`capstone.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: capstone
          kind: TraefikService
  tls: {}
---
# Weighted split target for the capstone canary (ADR-0020, ADR-0040). Argo
# Rollouts rewrites the two services[].weight values on each canary step —
# the 100/0 split below is only the at-rest default, same role the HTTPRoute
# backendRefs weights played under the former Envoy Gateway plugin.
#
# KNOWN RISK (ADR-0040 "Known risk" section, not live-verified): Argo Rollouts'
# own published example for this integration still shows this object under the
# legacy `traefik.containo.us/v1alpha1` API group, while Traefik v3 (this lab's
# k3s-bundled version) registers CRDs under `traefik.io/v1alpha1` — a known
# upstream compatibility gap (argoproj/argo-rollouts#3615). This object is
# defined under `traefik.io/v1alpha1` for consistency with every other Traefik
# CRD in this repo; the first live canary run after this migration must confirm
# Argo Rollouts (chart 2.43.0) actually reconciles it under this group.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: capstone
  namespace: capstone
spec:
  weighted:
    services:
      - name: capstone-stable
        port: 8080
        weight: 100
      - name: capstone-canary
        port: 8080
        weight: 0
