# Allow ingress to ArgoCD metrics endpoints from Alloy in the observability namespace
# (ADR-0016). Alloy scrapes four ArgoCD *-metrics Services already configured in
# gitops/platform/observability-alloy.yaml:
#   argocd-applicationset-controller-metrics :8080  job=argocd-applicationset-controller
#   argocd-application-controller-metrics    :8082  job=argocd-metrics
#   argocd-server-metrics                    :8083  job=argocd-server-metrics
#   argocd-repo-server-metrics               :8084  job=argocd-repo-server
# The observability NetworkPolicy already allows Alloy egress to the argocd namespace
# on these ports; this policy is the matching argocd-side ingress allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd-from-alloy
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8084
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
