# Allow ingress to the argocd-server pod from Traefik's data-plane pods
# (ADR-0016, ADR-0040 — supersedes Envoy Gateway/ADR-0008). The
# argocd.127.0.0.1.nip.io IngressRoute (gitops/network/argocd-ingressroute.yaml)
# routes traffic from Traefik pods in kube-system to the ArgoCD UI and API on
# TCP 8080 (the container port; the argocd-server Service maps 80→8080 externally).
# server.insecure=true is set in infra/modules/argocd/values.yaml, so plain HTTP.
#
# Shares allow-dns-and-apiserver.yaml's sync-wave (-1) for uniformity with this
# overlay's other allow rules (allow-argocd-intra-namespace.yaml,
# allow-argocd-repo-server-egress-charts.yaml — see their headers for why THEY
# must not land late) — this one is ingress-only so it isn't itself on the
# repo-server-deadlock critical path, but landing it a wave behind its siblings
# would leave the argocd-server UI unreachable through the gateway for one wave
# with no corresponding benefit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd-server-from-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
