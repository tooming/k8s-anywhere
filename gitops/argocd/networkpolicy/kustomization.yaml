# NetworkPolicy Kustomize overlay for the argocd namespace (ADR-0016 §4 fan-out).
# ArgoCD is the entire GitOps reconcile plane — the highest blast-radius non-secrets
# namespace. Pulls the two shared baseline templates and adds argocd-specific allow rules:
# ingress from Traefik's data-plane pods (argocd.127.0.0.1.nip.io IngressRoute on TCP 8080, ADR-0040);
# intra-namespace allow-all (controller ↔ repo-server ↔ argocd-cache ↔ server ↔ appset —
# this alone now also covers what allow-argocd-service-frontends.yaml used to carry
# separately, see below);
# (the Alloy metrics-scrape ingress rule this overlay used to also carry was
# removed 2026-09-06, ADR-0041, observability stack removed with no replacement)
# egress from argocd-repo-server to public Helm chart registries and this repo's own
# git remote (TCP 443 — self-hosted git source-of-truth options were removed
# 2026-09-06/07, no replacement; the repo now lives only on the public git host).
# The allow-dns-and-apiserver baseline covers all pods' k8s API calls.
# zz-dns-clusterip-bridge.yaml (Cilium socket-LB workaround) and
# allow-argocd-service-frontends.yaml (its namespace-scoped counterpart, covering
# ArgoCD's own cache/repo-server/webhook Service frontends on TCP 6379/7000/8080/8081)
# were both dropped 2026-09-07 alongside Cilium itself, no replacement — kube-router
# enforces NetworkPolicy post-DNAT, so Service-ClusterIP traffic already resolves to
# the real backend pod IP by the time policy is evaluated, and
# allow-argocd-intra-namespace.yaml's existing podSelector:{} egress rule already
# matches those same backend pods (see allow-dns-and-apiserver.yaml's header for the
# full reasoning).
# Wired into gitops/platform/networkpolicy-appset.yaml (the "argocd-networkpolicy"
# ApplicationSet element, auto-synced, wave 4) — NOT a standalone
# gitops/platform/argocd-networkpolicy.yaml Application; that file doesn't exist,
# this namespace's fan-out was consolidated into the appset alongside every other
# namespace's (see networkpolicy-appset.yaml's own header).
#
# Sync-wave shape within this overlay's own resources: allow-dns-and-apiserver.yaml
# and every argocd-specific allow rule (allow-argocd-intra-namespace.yaml,
# allow-argocd-repo-server-egress-charts.yaml, allow-argocd-server-from-gateway.yaml)
# share wave -1; default-deny.yaml stays at the implicit wave 0, landing last but
# adding no further restriction once the wave -1 rules exist (their podSelector:{}
# rules already establish the same default-deny-except-explicitly-allowed semantics).
# This is deliberate, not incidental: argocd hosts argocd-repo-server, which every
# Application (including this one's own next sync) needs reachable to generate
# manifests — if any wave -1 rule landed a wave late, the resulting gap would cut
# repo-server off from the controller (or from its own chart/git egress) before its
# own allow-rule existed, deadlocking the whole bootstrap rather than just this
# namespace. Confirmed live on a from-scratch `make up` post-Cilium-removal
# (2026-09-07). See the individual files' headers for the full mechanism.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - allow-argocd-server-from-gateway.yaml
  - allow-argocd-intra-namespace.yaml
  - allow-argocd-repo-server-egress-charts.yaml
