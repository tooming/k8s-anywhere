# Allow argocd-repo-server to pull Helm charts from upstream registries, and to
# fetch this repo's own manifests from its public GitHub remote (ADR-0016). Platform
# Applications source public Helm repos, OCI registries, and this repo's git-over-
# HTTPS source; repo-server runs the `helm pull`/`git fetch` calls that reach them.
# Without this, the argocd default-deny floor blocks all of it and `make up` never
# converges.
#
# Chart repositories, OCI blob stores, and GitHub itself are CDN-backed with
# rotating IPs not practically pinnable from a static NetworkPolicy — allow only
# TCP 443 to external IPs instead (an FQDN-based allow isn't available with plain
# networking.k8s.io/v1 NetworkPolicy). This keeps the blast radius scoped to HTTPS
# egress from repo-server while preserving a reliable rebuild path.
#
# Wired into gitops/argocd/networkpolicy/kustomization.yaml (auto-synced, wave 4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argocd-repo-server-egress-charts
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
