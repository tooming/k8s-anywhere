# argocd namespace — Phase 1 PSA labels (RFC #205, ADR-0017 §Per-namespace profile).
# Sets warn + audit at restricted to surface non-compliant pods in cluster events and
# audit logs before Phase 2 adds securityContext fields to the ArgoCD Helm values
# and flips the enforce label to restricted.
# The argocd namespace is created by Terraform bootstrap (infra/modules/argocd) — this
# manifest patches only the PSA warn/audit labels via ArgoCD SSA (argocd-extras App).
# Phase 2: add global.podSecurityContext + global.containerSecurityContext overrides in
# infra/modules/argocd/values.yaml and flip enforce: restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
