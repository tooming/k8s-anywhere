# Valkey password, pulled from Vault (secret/valkey/default, seeded by vault-bootstrap.sh)
# and rendered as the Kubernetes Secret 'valkey-creds'. Valkey runs with --requirepass so
# it is never open without auth; the exporter and the demo client read the same Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-creds
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: valkey-creds
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: valkey/default
        property: password
