# Single-node Valkey with AOF off + an RDB snapshot every 60s (lab-grade durability on a
# 1Gi PVC). Auth is enforced via --requirepass from the valkey-creds Secret (Vault → ESO).
# A co-located redis_exporter container exposes Prometheus metrics on :9121, scraped by Alloy and
# shown on the "Lab — Valkey" dashboard. ADR-0005: single replica recovers in place;
# production uses Valkey Cluster (ADR-0018).
#
# redis_exporter bumped v1.87.0 -> v1.88.0 (2026-07-25, upgrade-drafter sweep): confirmed
# newest stable tag via the source repo's own git tags (github.com/oliver006/redis_exporter)
# and cross-checked the exact `v1.88.0-alpine` variant exists on Docker Hub. Release adds one
# new metric (`stream_entries_added_total`) only -- no flag/env-var changes, no CVE involved.
# This container sets no custom command/flags beyond REDIS_ADDR/REDIS_PASSWORD env vars
# (both long-stable), so the upgrade surface is minimal.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: data
  labels:
    app: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.0.10-alpine
          args:
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --save
            - "60"
            - "1"
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-creds
                  key: password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: valkey-creds
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Found live 2026-08-11 (systemic probe-timeout audit): this exec probe set
          # no timeoutSeconds at all, which falls back to Kubernetes' own 1s default —
          # the same chart-default-too-tight footgun already found and fixed for
          # Harbor (PR #1040/#1102), ArgoCD's repo-server (PR #1103), and Kyverno's
          # admissionController (PR #1115). Unlike those, this is a plain manifest
          # (not a Helm chart), so the gap was an omission, not a chart default —
          # `valkey-cli ping` forks a new process and opens a TCP connection each
          # check, either of which can exceed 1s under this host's real CPU
          # contention. Explicit 5s matches the convention used for Harbor's
          # equally-lightweight components (PR #1040).
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: exporter
          image: oliver006/redis_exporter:v1.88.0-alpine
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              # bare host:port (no scheme) so the file holds no standalone word that
              # ADR-0018's guard flags; redis_exporter accepts this form natively.
              value: localhost:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-creds
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 50m
              memory: 96Mi
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
