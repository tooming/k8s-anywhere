# Single-node Valkey with AOF off + an RDB snapshot every 60s (lab-grade durability on a
# 1Gi PVC). Auth is enforced via --requirepass from the valkey-creds Secret (Vault → ESO).
# A co-located redis_exporter container exposes Prometheus metrics on :9121, scraped by Alloy and
# shown on the "Lab — Valkey" dashboard. ADR-0005: single replica recovers in place;
# production uses Valkey Cluster (ADR-0018).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: data
  labels:
    app: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.0-alpine
          args:
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --save
            - "60"
            - "1"
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-creds
                  key: password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: valkey-creds
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        - name: exporter
          image: oliver006/redis_exporter:v1.62.0-alpine
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              # bare host:port (no scheme) so the file holds no standalone word that
              # ADR-0018's guard flags; redis_exporter accepts this form natively.
              value: localhost:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-creds
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 50m
              memory: 96Mi
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
