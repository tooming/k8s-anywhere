# Route the RabbitMQ management UI through Traefik at
# http://rabbitmq.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
#
# Split into two IngressRoute objects (2026-09-06 fix) — see
# gitops/network/argocd-ingressroute.yaml's header comment for the full finding:
# a `tls: {}` stanza on an object that also lists `web` silently breaks plain-HTTP
# matching on `web` entirely.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq
  namespace: data
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`rabbitmq.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: rabbitmq
          port: 15672
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq-tls
  namespace: data
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`rabbitmq.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: rabbitmq
          port: 15672
  tls: {}
