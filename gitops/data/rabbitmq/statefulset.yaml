# Single-node RabbitMQ with a persistent data dir (mnesia + the Erlang cookie survive
# restarts, so the node recovers in place — ADR-0005 recreate-over-HA). The default
# user/password come from the rabbitmq-creds Secret (Vault → ESO); plugins/config come
# from the rabbitmq-config ConfigMap. ADR-0003 note: production runs a 3-node cluster
# with quorum queues — see ADR-0009.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: data
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        # Without this, kubelet's fsGroup volume-ownership fixup runs on EVERY pod
        # (re)mount — not just the first — and force-adds group read/write to every
        # file under the PVC, including the erlang cookie RabbitMQ itself creates at
        # 0600. RabbitMQ's own security check refuses to start against a
        # group-readable cookie file ("Cookie file .../.erlang.cookie must be
        # accessible by owner only"), so any pod recreation (not just a container
        # restart within the same pod) permanently crashloops it — found live
        # 2026-08-05 recovering an unrelated resource-exhaustion incident that forced
        # this pod to be recreated for the first time in weeks. OnRootMismatch skips
        # the recursive fixup once the volume's root already has the right group
        # ownership, which is the documented fix for exactly this RabbitMQ+fsGroup
        # interaction (kubernetes/kubernetes#82405).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: logs
              mountPath: /var/log/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
