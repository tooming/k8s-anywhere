# RabbitMQ default-user credentials, pulled from Vault (secret/rabbitmq/default,
# seeded by vault-bootstrap.sh) and rendered as the Kubernetes Secret 'rabbitmq-creds'.
# The StatefulSet reads RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS from it, so the
# broker never boots on the well-known guest/guest default.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-creds
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: rabbitmq-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: rabbitmq/default
        property: username
    - secretKey: password
      remoteRef:
        key: rabbitmq/default
        property: password
