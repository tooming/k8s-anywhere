# RabbitMQ static config. enabled_plugins turns on the management UI (:15672) and
# the Prometheus plugin (:15692, scraped by Alloy). return_per_object_metrics emits
# per-queue series (e.g. rabbitmq_queue_messages_ready{queue="demo"}) so the
# "Lab — RabbitMQ" dashboard can show real per-queue depth, not just aggregates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: data
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
  rabbitmq.conf: |
    prometheus.return_per_object_metrics = true
