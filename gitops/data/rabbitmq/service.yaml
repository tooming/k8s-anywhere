# RabbitMQ service: amqp for clients (the demo publisher/consumer), management for the
# UI/HTTP API (routed by Envoy + used by the demo), prometheus for Alloy scraping.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: data
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
    - name: prometheus
      port: 15692
      targetPort: 15692
