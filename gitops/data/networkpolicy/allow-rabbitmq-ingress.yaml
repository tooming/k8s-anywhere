# Allow ingress to RabbitMQ pods in the data namespace (ADR-0016).
# Permits traffic on the AMQP port (5672), the management HTTP API (15672),
# and the Prometheus metrics endpoint (15692) that Alloy scrapes.
# Source: any pod in the data namespace (data-demo producers/consumers)
# and any pod in the observability namespace (Alloy scraper).
# A second, narrower rule permits the KEDA operator (namespace keda) to poll the
# management API on 15672 only -- the rabbitmq-load-scaler ScaledObject's rabbitmq
# trigger (ADR-0029 §"Scope & exceptions" ScaledObject-demo follow-up) -- kept as its
# own rule instead of widening the block above so keda gets no access to AMQP (5672)
# or the metrics port (15692) it has no need for.
# A third rule permits Traefik (namespace kube-system, ADR-0040 -- supersedes Envoy
# Gateway/ADR-0008) to reach the management API on 15672 only -- `gitops/data/rabbitmq/ingressroute.yaml`
# proxies rabbitmq.127.0.0.1.nip.io through it. Found missing live 2026-08-05 while
# recovering an unrelated resource-exhaustion incident: this policy predates
# the HTTPRoute (or the HTTPRoute predates this policy's last edit) and the two
# were never reconciled, so the front-door UI has likely never actually worked
# -- same bug class as the harbor carve-out. Scoped to Traefik's own pods (not the
# whole kube-system namespace) via the podSelector below, added on the ADR-0040
# migration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5672
          protocol: TCP
        - port: 15672
          protocol: TCP
        - port: 15692
          protocol: TCP
      from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
    - ports:
        - port: 15672
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
    - ports:
        - port: 15672
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
