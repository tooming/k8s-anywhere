# Allow ingress to Valkey pods in the data namespace (ADR-0016).
# Permits traffic on the Valkey port (6379) from other pods in the data namespace
# (valkey-load client) and the redis_exporter metrics port (9121) from Alloy
# in the observability namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-valkey-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
      from:
        - podSelector: {}
    - ports:
        - port: 9121
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
