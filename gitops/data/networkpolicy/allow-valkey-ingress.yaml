# Allow ingress to Valkey pods in the data namespace (ADR-0016).
# Permits traffic on the Valkey port (6379) from other pods in the data namespace
# (valkey-load client) and from the harbor namespace (Harbor uses Valkey as its
# cache/session store per ADR-0018/ADR-0024 — harbor-core/jobservice/registry),
# plus the redis_exporter metrics port (9121) from Alloy in the observability
# namespace. The harbor side already permits the matching egress (allow-harbor-
# valkey-egress, RFC #297); default-deny in the data namespace still needs this
# ingress counterpart or harbor-core crashloops on a Valkey i/o timeout.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-valkey-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
      from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
    - ports:
        - port: 9121
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
