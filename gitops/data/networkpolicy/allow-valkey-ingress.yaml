# Allow ingress to Valkey pods in the data namespace (ADR-0016).
# Permits traffic on the Valkey port (6379) from other pods in the data namespace
# (valkey-load client), plus the redis_exporter metrics port (9121) from Alloy in
# the observability namespace.
#
# Harbor is NOT a Valkey client (removed 2026-07-21, #632): Harbor's chart
# renders its external-Redis wiring via Helm `lookup()`, which always returns nil
# under ArgoCD's `helm template` rendering, crashing manifest generation. Harbor
# now runs its own bundled redis-photon cache instead (gitops/platform/harbor.yaml
# ADR-0018 exception note) and never reaches this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-valkey-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: valkey
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
      from:
        - podSelector: {}
    - ports:
        - port: 9121
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
