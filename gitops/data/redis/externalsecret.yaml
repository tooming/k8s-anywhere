# Redis password, pulled from Vault (secret/redis/default, seeded by vault-bootstrap.sh)
# and rendered as the Kubernetes Secret 'redis-creds'. Redis runs with --requirepass so
# it is never open without auth; the exporter and the demo client read the same Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-creds
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: redis-creds
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: redis/default
        property: password
