# Redis service: 'redis' for clients (the demo + any app), 'metrics' for Alloy to
# scrape the redis_exporter sidecar. No HTTPRoute — Redis has no web UI.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 9121
      targetPort: 9121
