# Valkey traffic generator: a tiny shell loop using valkey-cli against the 'valkey' service.
# It SETs/GETs/INCRs keys (hits) and GETs a missing key (miss) every few seconds, so the
# redis_exporter metrics — commands processed, keyspace hits/misses, connected clients —
# carry real movement on the "Lab — Valkey" dashboard. Auth via REDISCLI_AUTH (no
# password on the command line).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-load
  namespace: data
  labels:
    app: valkey-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-load
  template:
    metadata:
      labels:
        app: valkey-load
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey-load
          image: valkey/valkey:8.0-alpine
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: data-demo-creds
                  key: valkey-password
          command:
            - /bin/sh
            - -c
            - |
              echo "valkey-load: generating traffic against valkey:6379"
              n=0
              while true; do
                n=$((n + 1))
                valkey-cli -h valkey SET "demo:last" "$(date -u +%FT%TZ)" >/dev/null
                valkey-cli -h valkey INCR "demo:counter" >/dev/null
                valkey-cli -h valkey GET "demo:last" >/dev/null      # keyspace hit
                valkey-cli -h valkey GET "demo:missing:$n" >/dev/null # keyspace miss
                valkey-cli -h valkey SETEX "demo:tmp" 30 "ephemeral" >/dev/null
                sleep 3
              done
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: tmp
          emptyDir: {}
