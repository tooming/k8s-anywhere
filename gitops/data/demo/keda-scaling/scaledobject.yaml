# ScaledObject demonstrating real event-driven autoscaling (ADR-0029 §"Scope &
# exceptions" ScaledObject-demo follow-up; CHARTER "event-driven autoscaling" Goal —
# the actual pedagogical payoff: scaling *demonstrated*, not just installed). Scales
# the rabbitmq-load Deployment on the real depth of the 'demo' queue it drives, via
# RabbitMQ's management HTTP API (protocol: http; the KEDA operator polls this from
# its own pod in the keda namespace, not from rabbitmq-load itself -- see
# gitops/keda/networkpolicy/allow-keda-egress-rabbitmq.yaml for the cross-namespace
# egress this requires).
#
# queueLength: "1" means any queue depth beyond one message drives desired replicas
# up (ceil(currentQueueLength / 1), capped at maxReplicaCount). rabbitmq-load.yaml's
# burst/drain script (publish 5, hold 40s, drain, hold 20s) gives KEDA a real,
# sustained backlog of ~5 messages to observe during each 40s hold -- an
# always-near-zero queue would make this demo structurally unobservable, not just
# untested (ADR-0004).
#
# Trigger metadata values are always strings per the KEDA CRD schema (a generic
# map[string]string), including queueLength -- not a YAML-native number.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rabbitmq-load-scaler
  namespace: data
spec:
  scaleTargetRef:
    name: rabbitmq-load
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: rabbitmq
      metadata:
        queueName: demo
        host: http://rabbitmq.data.svc.cluster.local:15672
        protocol: http
        queueLength: "1"
      authenticationRef:
        name: rabbitmq-trigger-auth
