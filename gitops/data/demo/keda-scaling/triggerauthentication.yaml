# TriggerAuthentication for the KEDA rabbitmq-load-scaler ScaledObject (ADR-0029
# §"Scope & exceptions" ScaledObject-demo follow-up). Reads the RabbitMQ
# management-API credentials from the existing data-demo-creds Secret (rendered by
# gitops/data/demo/externalsecret.yaml from Vault rabbitmq/default) -- the same
# credentials rabbitmq-load itself already uses -- so this adds no new credential
# seam. secretTargetRef.parameter names (username/password) map to the rabbitmq
# scaler's metadata fields of the same name, per the pinned KEDA v2.18.0 source
# (pkg/scalers/rabbitmq_scaler.go: Username/Password, order=authParams).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: data
spec:
  secretTargetRef:
    - parameter: username
      name: data-demo-creds
      key: rabbitmq-username
    - parameter: password
      name: data-demo-creds
      key: rabbitmq-password
