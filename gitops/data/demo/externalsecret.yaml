# Credentials for the demo traffic generators: RabbitMQ default user/password and the
# Valkey password, all from Vault via ESO, rendered into one Secret 'data-demo-creds'.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-demo-creds
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: data-demo-creds
    creationPolicy: Owner
  data:
    - secretKey: rabbitmq-username
      remoteRef:
        key: rabbitmq/default
        property: username
    - secretKey: rabbitmq-password
      remoteRef:
        key: rabbitmq/default
        property: password
    - secretKey: valkey-password
      remoteRef:
        key: valkey/default
        property: password
