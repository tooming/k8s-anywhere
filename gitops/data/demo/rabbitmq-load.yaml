# RabbitMQ traffic generator: a shell loop (curl) that talks to the management HTTP API.
# It declares a durable 'demo' queue, then runs a burst/drain cycle: publish 5 messages
# back-to-back, hold for 40s, drain them, hold empty for 20s, repeat. The 40s hold is
# deliberate — it's longer than KEDA's default 30s ScaledObject pollingInterval, so the
# rabbitmq-load-scaler ScaledObject (ADR-0029 ScaledObject demo follow-up,
# gitops/data/demo/scaledobject.yaml) is guaranteed to observe a non-zero queue depth at
# least once per cycle. An immediate publish-then-drain pattern (the prior version of
# this script) leaves the queue non-empty for only a network round-trip — far too brief
# for any 30s-interval poller to reliably see, which would make the ScaledObject demo
# structurally unable to ever demonstrate a scale event (ADR-0004: a demo that can never
# actually be observed is as good as fabricated). The burst pattern still keeps the
# rabbitmq_prometheus metrics — messages published/delivered, queue depth,
# connections/channels — showing real, non-zero movement on the "Lab — RabbitMQ"
# dashboard, just in bursts rather than a flat trickle.
# Waits for the management API before looping so it tolerates a cold start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-load
  namespace: data
  labels:
    app: rabbitmq-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-load
  template:
    metadata:
      labels:
        app: rabbitmq-load
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq-load
          image: curlimages/curl:8.10.1
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: data-demo-creds
                  key: rabbitmq-username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: data-demo-creds
                  key: rabbitmq-password
          command:
            - /bin/sh
            - -c
            - |
              Q=demo
              API=http://rabbitmq:15672/api
              AUTH="$RABBITMQ_USER:$RABBITMQ_PASSWORD"
              echo "rabbitmq-load: waiting for the management API..."
              until curl -fsS -u "$AUTH" "$API/overview" >/dev/null 2>&1; do sleep 5; done
              curl -fsS -u "$AUTH" -H 'content-type: application/json' \
                -XPUT "$API/queues/%2f/$Q" -d '{"durable":true}' >/dev/null
              echo "rabbitmq-load: burst-publishing/draining on queue '$Q'"
              while true; do
                for i in 1 2 3 4 5; do
                  curl -fsS -u "$AUTH" -H 'content-type: application/json' \
                    -XPOST "$API/exchanges/%2f/amq.default/publish" \
                    -d "{\"properties\":{},\"routing_key\":\"$Q\",\"payload\":\"hello\",\"payload_encoding\":\"string\"}" >/dev/null || true
                done
                sleep 40
                curl -fsS -u "$AUTH" -H 'content-type: application/json' \
                  -XPOST "$API/queues/%2f/$Q/get" \
                  -d '{"count":10,"ackmode":"ack_requeue_false","encoding":"auto"}' >/dev/null || true
                sleep 20
              done
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 48Mi
      volumes:
        - name: tmp
          emptyDir: {}
