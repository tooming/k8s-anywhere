# Allow ingress to Garage pods from the Inkless broker (ADR-0016, ADR-0015).
# Aiven Inkless (KIP-1150 diskless Kafka) stores Kafka log segments in Garage S3 (TCP 3900).
# Inkless is on-demand (manual sync only) but its NetworkPolicy allow lands here so the
# storage namespace's policy is complete when Inkless is brought up. When Inkless is not
# running, this policy matches no pods and has no effect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garage-s3-from-inkless
  namespace: storage
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3900
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: inkless
          podSelector:
            matchLabels:
              app: inkless
