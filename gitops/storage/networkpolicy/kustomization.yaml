# NetworkPolicy Kustomize overlay for the storage namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds per-workload allow rules for
# Garage's real ingress flows: from Harbor's registry in
# the harbor namespace (blob storage S3 writes on TCP 3900 — found live
# 2026-08-18, see allow-garage-s3-from-harbor.yaml's own comment: this
# ingress-side rule was missing even though harbor's egress-side rule existed,
# silently dropping every Harbor blob upload). Also allows Traefik
# (kube-system, ADR-0040) to reach s3manager on TCP 8080 for the
# s3.127.0.0.1.nip.io front-door route.
# No egress allows needed beyond the baseline — Garage does not reach other namespaces.
# Wired into gitops/platform/storage-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: storage

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-garage-s3-from-harbor.yaml
  - allow-s3manager-ingress.yaml
