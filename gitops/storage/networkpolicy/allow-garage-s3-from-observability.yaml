# Allow ingress to Garage pods from the observability namespace (ADR-0016).
# Two distinct flows share this rule:
#   Mimir, Loki, Tempo, Pyroscope → Garage S3 API (:3900) for persistent backend writes;
#   Alloy → Garage admin metrics endpoint (:3903) for the "Lab — Garage S3" dashboard.
# Using a namespace-level selector mirrors the symmetric allow-observability-egress-storage
# rule in the observability overlay, which uses podSelector: {} to cover all obs pods without
# enumerating each LGTMP component — both sides of the flow use the same broad scope.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garage-s3-from-observability
  namespace: storage
spec:
  podSelector:
    matchLabels:
      app: garage
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3900
          protocol: TCP
        - port: 3903
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
