# Split into two IngressRoute objects (2026-09-06 fix) — see
# gitops/network/argocd-ingressroute.yaml's header comment for the full finding:
# a `tls: {}` stanza on an object that also lists `web` silently breaks plain-HTTP
# matching on `web` entirely.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: s3manager
  namespace: storage
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`s3.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: s3manager
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: s3manager-tls
  namespace: storage
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`s3.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: s3manager
          port: 8080
  tls: {}
