# s3manager — lightweight web UI to browse S3 buckets + objects. Pointed at Garage
# (using the garage-s3 key). Reach it at http://s3.127.0.0.1.nip.io:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3manager
  namespace: storage
  labels:
    app: s3manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3manager
  template:
    metadata:
      labels:
        app: s3manager
    spec:
      enableServiceLinks: false
      containers:
        - name: s3manager
          # Pinned 2026-07-28 (recreate-from-code / no-floating-tag hardening),
          # bumped 2026-08-18 (upgrade-drafter fallback currency sweep). Original
          # pin's digest (sha256:f666e6fc...) predated any matching version tag —
          # Docker Hub's tags API at the time showed `latest` one build ahead of
          # `v0.7.0`. Upstream has since tagged that build and moved past it:
          # `v0.8.0` (published 2026-08-11) is now the newest tag, and its digest
          # matches `latest`'s current digest — verified directly against a full
          # clone of github.com/cloudlena/s3manager (ADR-0004): `git log
          # v0.7.0..v0.8.0` contains three real features (per-object version
          # listing, per-object metadata display, local-timezone Last-Modified
          # rendering) plus two "Update dependencies" commits that bump the Go
          # toolchain 1.26.2→1.26.5 (the same stdlib-CVE-fixing release this repo's
          # own Tempo 2.10.8 bump already cited: CVE-2026-39822, CVE-2026-27145,
          # CVE-2026-42504, CVE-2026-42505, CVE-2026-42507) and
          # golang.org/x/{crypto,net,sys,text} + this app's S3-client SDK
          # dependency (v7.1.0→v7.2.1). Still pinned by digest, not tag, per this
          # file's own no-floating-tag convention above (the Kyverno
          # `disallow-latest-tag` ClusterPolicy gap this pin already closes) —
          # `v0.8.0` is cited here for provenance only.
          image: cloudlena/s3manager@sha256:9ed3a8ecf10381031b19afa4e5ff863efddb81aeac2f84b142a2190d7973e68b
          env:
            - name: ENDPOINT
              value: "garage.storage.svc.cluster.local:3900"
            - name: REGION
              value: "garage"
            - name: USE_SSL
              value: "false"
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: access-key-id
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: secret-access-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
