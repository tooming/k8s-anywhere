# s3manager — lightweight web UI to browse S3 buckets + objects. Pointed at Garage
# (using the garage-s3 key). Reach it at http://s3.127.0.0.1.nip.io:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3manager
  namespace: storage
  labels:
    app: s3manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3manager
  template:
    metadata:
      labels:
        app: s3manager
    spec:
      enableServiceLinks: false
      containers:
        - name: s3manager
          # Full version-bump history (digest pin -> v0.8.0 -> v0.9.0) moved to
          # ADR-0039's own Re-evaluation log (2026-09-03) — this comment used to
          # carry that history inline, same shape ADR-0038 fixed for ack-s3.yaml;
          # see ADR-0039 for the complete trail. Still pinned by digest, not tag
          # (the Kyverno `disallow-latest-tag` ClusterPolicy gap this pin already
          # closes) — `v0.9.0` is cited here for provenance only.
          image: cloudlena/s3manager@sha256:cc4b81ea29fb59610e29df6707ab6646e36e32744bbb700cffd5d2d6bf60c03f
          env:
            - name: ENDPOINT
              value: "garage.storage.svc.cluster.local:3900"
            - name: REGION
              value: "garage"
            - name: USE_SSL
              value: "false"
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: access-key-id
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: secret-access-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
