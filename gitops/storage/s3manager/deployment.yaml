# s3manager — lightweight web UI to browse S3 buckets + objects. Pointed at Garage
# (using the garage-s3 key). Reach it at http://s3.127.0.0.1.nip.io:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3manager
  namespace: storage
  labels:
    app: s3manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3manager
  template:
    metadata:
      labels:
        app: s3manager
    spec:
      enableServiceLinks: false
      containers:
        - name: s3manager
          # Pinned 2026-07-28 (recreate-from-code / no-floating-tag hardening) by
          # digest, not tag: Docker Hub's tags API (confirmed live) shows `latest`'s
          # manifest-list digest does NOT match any published version tag (`v0.7.0`
          # is one build older, per last_updated timestamps) — pinning by digest is
          # the only way to keep this a true no-op (identical image to what's
          # running today) rather than an unverified version change. Also closes a
          # real Kyverno gap: the `disallow-latest-tag` ClusterPolicy (Enforce mode)
          # only excludes capstone/argocd, not storage — a floating tag here risked
          # the same "admission blocked on next Pod recreation" incident already hit
          # ArgoCD (see gitops/kyverno/policies/disallow-latest-tag.yaml's header).
          image: cloudlena/s3manager@sha256:f666e6fca127ec07b90c3c207eeb6730817b6ad0807356db6eb63fbda6bdacb2
          env:
            - name: ENDPOINT
              value: "garage.storage.svc.cluster.local:3900"
            - name: REGION
              value: "garage"
            - name: USE_SSL
              value: "false"
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: access-key-id
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: secret-access-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
