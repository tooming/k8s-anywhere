# Allow the kube-apiserver to reach the cert-manager webhook on TCP 10250
# (ADR-0016). cert-manager registers MutatingWebhookConfiguration and
# ValidatingWebhookConfiguration resources for its own CRDs (Certificate,
# Issuer, ...); the API server calls back on TCP 10250 (the chart's
# webhook.securePort default) for every admission request against them.
# Without this allow, the default-deny-all floor blocks webhook callbacks and
# every Certificate/Issuer/ClusterIssuer create/update fails.
#
# Plain networking.k8s.io/v1 NetworkPolicy — Cilium (ADR-0014) was removed
# entirely 2026-09-07, no replacement. The prior CiliumNetworkPolicy used
# `fromEntities: remote-node` because k3s embeds the apiserver in the server
# node's own process: its outbound webhook call arrives with the *node's* real
# pod-network IP as source, never the apiserver Service ClusterIP
# (10.43.0.1) — confirmed live with `cilium monitor --type drop` on a
# from-scratch cluster (see allow-eso-webhook-from-apiserver.yaml's header for
# the full repro, observed source 10.0.0.194). Plain NetworkPolicy has no
# "remote-node" equivalent — only podSelector/namespaceSelector/ipBlock — and
# the node's real IP isn't practically pinnable from a Kustomize template (it
# varies per k3d/Colima environment and across rebuilds). This uses an
# ipBlock 0.0.0.0/0 ingress scoped strictly to TCP 10250, the same
# not-practically-pinnable-target pattern this repo already uses elsewhere
# (allow-argocd-repo-server-egress-charts.yaml).
# Not a security regression versus the Cilium rule it replaces (that matched
# ANY node too) — the real access boundary for admission webhooks is mTLS via
# the CA cert-manager itself issues, not NetworkPolicy. NEEDS LIVE
# VERIFICATION on the next cluster rebuild (ADR-0004) — flagged explicitly
# rather than asserted as confirmed-working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cert-manager-webhook-from-apiserver
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 10250
          protocol: TCP
