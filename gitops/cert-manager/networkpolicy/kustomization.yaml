# NetworkPolicy Kustomize overlay for the cert-manager namespace (ADR-0016 §4
# fan-out). Pulls the shared baseline templates and adds a cert-manager-specific
# allow rule for the admission webhook callback from the kube-apiserver
# (TCP 10250). The Alloy metrics-scrape ingress rule this overlay used to also
# carry was removed 2026-09-06 (ADR-0041, observability stack removed with no
# replacement).
# The allow-dns-and-apiserver baseline covers cert-manager's k8s API calls
# (Certificate/Issuer reconcile, leader election, admission review fan-out).
# zz-dns-clusterip-bridge.yaml (Cilium socket-LB workaround) dropped 2026-09-07
# alongside Cilium itself, no replacement — kube-router enforces NetworkPolicy
# post-DNAT, so it never needed the bridge (see allow-dns-and-apiserver.yaml's
# own header for the full reasoning).
# Wired into gitops/platform/cert-manager-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - allow-cert-manager-webhook-from-apiserver.yaml
