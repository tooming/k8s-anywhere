# Allow Alloy in the observability namespace to scrape cert-manager metrics on
# TCP 9402 (ADR-0016). All three components — controller, webhook, cainjector —
# expose Prometheus metrics at :9402/metrics; the cert_manager scrape job in
# observability-alloy.yaml targets the controller Service and feeds the
# "Lab — cert-manager" dashboard with real certificate-lifecycle counters
# (ADR-0004). podSelector {} keeps this allow Service-name-agnostic — it covers
# every cert-manager pod's :9402 metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cert-manager-metrics-from-observability
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9402
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
