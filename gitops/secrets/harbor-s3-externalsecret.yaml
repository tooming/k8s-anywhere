# Harbor S3 credentials Secret rendered from Vault path secret/harbor/s3
# (seeded by scripts/garage-bootstrap.sh: harbor-key + harbor-registry bucket).
# The Harbor registry component (Docker Distribution registry2) reads S3 credentials
# from REGISTRY_STORAGE_S3_ACCESSKEY and REGISTRY_STORAGE_S3_SECRETKEY environment
# variables, overriding the empty accesskey/secretkey values in the chart config.
# These env vars are injected via registry.registry.extraEnvVars[].valueFrom.secretKeyRef
# against this Secret (harbor-s3-creds) in gitops/platform/harbor.yaml -- NOT via
# `extraEnvVarsSecret`, a field that doesn't exist in the goharbor/harbor chart and was
# a silent no-op the whole time it sat there (found live 2026-08-11, fixed in PR #1114 --
# see gitops/platform/harbor.yaml's own comment for the full root-cause writeup).
# See ADR-0002 (Garage S3) and ADR-0024.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-s3
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-s3-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REGISTRY_STORAGE_S3_ACCESSKEY: "{{ .access_key_id }}"
        REGISTRY_STORAGE_S3_SECRETKEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: harbor/s3
        property: access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: harbor/s3
        property: secret-access-key
