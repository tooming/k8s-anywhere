# Harbor admin credential Secret rendered from Vault path secret/harbor/admin
# (seeded by scripts/vault-bootstrap.sh — idempotent, parallel to the grafana/admin
# pattern). The Harbor chart consumes this Secret when existingSecretAdminPassword is
# set, replacing the hard-coded default password Harbor12345 with a Vault-generated
# random credential. HARBOR_ADMIN_USER is exposed for completeness (always "admin").
# See gitops/platform/harbor.yaml existingSecretAdminPassword / existingSecretAdminPasswordKey.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-admin-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        HARBOR_ADMIN_USER: "{{ .admin_user }}"
        HARBOR_ADMIN_PASSWORD: "{{ .admin_password }}"
  data:
    - secretKey: admin_user
      remoteRef:
        key: harbor/admin
        property: admin-user
    - secretKey: admin_password
      remoteRef:
        key: harbor/admin
        property: admin-password
