# Velero cloud-credentials Secret rendered from Vault path secret/velero/s3
# (seeded by scripts/garage-bootstrap.sh). The Velero Helm chart expects a Secret
# named cloud-credentials with key "cloud" containing an AWS-style credentials INI
# file. The ESO template stitches the two raw Vault fields into that format.
# See ADR-0021 §"ExternalSecret shape" and ADR-0002 (Garage S3 backend).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloud-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key_id }}
          aws_secret_access_key={{ .secret_access_key }}
  data:
    - secretKey: access_key_id
      remoteRef:
        key: velero/s3
        property: access-key-id
    - secretKey: secret_access_key
      remoteRef:
        key: velero/s3
        property: secret-access-key
