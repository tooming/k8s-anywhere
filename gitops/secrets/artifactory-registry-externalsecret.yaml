# Registry credentials for the in-lab Artifactory Docker registry, synced from
# Vault (secret/artifactory/registry) via ESO. Creates namespace capstone and
# a kubernetes.io/dockerconfigjson Secret consumed as imagePullSecrets by the
# capstone Deployment (step 2). The same Vault path supplies masked GitLab CI
# variables ARTIFACTORY_USER / ARTIFACTORY_PASSWORD for the build pipeline.
apiVersion: v1
kind: Namespace
metadata:
  name: capstone
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-registry
  namespace: capstone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: artifactory-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"artifactory.127.0.0.1.nip.io":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: artifactory/registry
        property: username
    - secretKey: password
      remoteRef:
        key: artifactory/registry
        property: password
