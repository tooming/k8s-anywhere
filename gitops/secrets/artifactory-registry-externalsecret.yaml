# Registry credentials for the in-lab Artifactory Docker registry, synced from
# Vault (secret/artifactory/registry) via ESO. Creates namespace capstone and
# an opaque Secret (username + password) used as imagePullSecret material by the
# capstone app (step 2). The same Vault path supplies masked GitLab CI variables
# ARTIFACTORY_USER / ARTIFACTORY_PASSWORD for the build pipeline (.gitlab-ci.yml).
apiVersion: v1
kind: Namespace
metadata:
  name: capstone
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artifactory-registry
  namespace: capstone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: artifactory-registry
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: artifactory/registry
        property: username
    - secretKey: password
      remoteRef:
        key: artifactory/registry
        property: password
