# Registry credentials for the in-lab Harbor Docker registry, synced from
# Vault (secret/harbor/registry — seeded by scripts/vault-bootstrap.sh, see
# auto/harbor-bootstrap-credentials) via ESO. Mirrors the existing legacy-registry
# ExternalSecret's shape exactly (gitops/secrets/), targeting Harbor instead.
# Renders a kubernetes.io/dockerconfigjson Secret for harbor.127.0.0.1.nip.io in
# the capstone namespace (already created elsewhere in gitops/apps/capstone/).
#
# Prep-only (RFC #297 / ADR-0024, ROADMAP.md split-the-gate slice of
# auto/harbor-capstone-rewire): NOT yet referenced by any Deployment/Rollout
# imagePullSecrets — capstone still pulls via the pre-existing registry Secret
# until the gated cutover item flips it. This Secret existing early does not
# change any running workload's behavior; it only shrinks the size of that
# later, still-gated PR.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry
  namespace: capstone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"harbor.127.0.0.1.nip.io":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: harbor/registry
        property: username
    - secretKey: password
      remoteRef:
        key: harbor/registry
        property: password
