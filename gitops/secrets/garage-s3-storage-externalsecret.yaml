# garage-s3 creds in the storage namespace (for s3manager), sourced from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garage-s3
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: garage/s3
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: garage/s3
        property: secret-access-key
