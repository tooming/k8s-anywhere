# App-level credential for the capstone workload, synced from Vault
# (secret/capstone/app, seeded by vault-bootstrap.sh) via ESO.
# Renders the Kubernetes Secret 'capstone-app-creds' in namespace capstone,
# consumed by the capstone Deployment as APP_KEY env var (optional: true so
# the pod starts even before ESO syncs on a cold bootstrap).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: capstone-app-creds
  namespace: capstone
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: capstone-app-creds
    creationPolicy: Owner
  data:
    - secretKey: app-key
      remoteRef:
        key: capstone/app
        property: app-key
