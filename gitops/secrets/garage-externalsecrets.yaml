# Vault-sourced replacements for the kubectl-created bootstrap secrets.
# ESO reads Vault and (re)creates these native k8s Secrets, now owned by ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garage-secrets
    creationPolicy: Owner
  data:
    - secretKey: rpc-secret
      remoteRef:
        key: garage/server
        property: rpc-secret
    - secretKey: admin-token
      remoteRef:
        key: garage/server
        property: admin-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-s3
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garage-s3
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: garage/s3
        property: access-key-id
    - secretKey: secret-access-key
      remoteRef:
        key: garage/s3
        property: secret-access-key
