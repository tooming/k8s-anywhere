# Vault-sourced replacements for the kubectl-created bootstrap secrets.
# ESO reads Vault and (re)creates these native k8s Secrets, now owned by ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garage-secrets
    creationPolicy: Owner
  data:
    - secretKey: rpc-secret
      remoteRef:
        key: garage/server
        property: rpc-secret
    - secretKey: admin-token
      remoteRef:
        key: garage/server
        property: admin-token

# The observability-namespace garage-s3 ExternalSecret (used by Mimir/Loki/Tempo/
# Pyroscope to reach Garage) was removed 2026-09-06 (ADR-0041, observability stack
# removed with no replacement).
