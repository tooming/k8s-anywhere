# Kargo admin account credentials rendered from Vault path secret/kargo/admin
# (properties: password-hash, token-signing-key), seeded by
# scripts/vault-bootstrap.sh. The Kargo Helm chart does NOT support a
# secretKeyRef-style indirection for these values — it only ever reads a whole
# existing Secret via `api.secret.name` (gitops/platform/kargo.yaml), which the
# chart's own deployment.yaml wires in wholesale via `envFrom.secretRef`. That
# means the key names in `target.template` below (ADMIN_ACCOUNT_PASSWORD_HASH,
# ADMIN_ACCOUNT_TOKEN_SIGNING_KEY) must match the chart's expected env var
# names exactly (see charts/kargo/templates/api/deployment.yaml upstream).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: kargo-admin-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef:
        key: kargo/admin
        property: password-hash
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef:
        key: kargo/admin
        property: token-signing-key
