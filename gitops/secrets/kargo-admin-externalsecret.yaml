# Kargo admin account credentials rendered from Vault path secret/kargo/admin
# (property: password-hash). The Kargo Helm chart reads this Secret via
# api.adminAccount.passwordHashSecretKeyRef (ADR-0023 §"Admin credentials").
# Seed the Vault path before make kargo-up:
#   vault kv put secret/kargo/admin password-hash='<bcrypt-hash>'
#   # generate: htpasswd -bnBC 14 "" <password> | tr -d ':\n'
# See scripts/vault-bootstrap.sh for the seeding pattern used by other components.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: kargo-admin-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password-hash
      remoteRef:
        key: kargo/admin
        property: password-hash
