# Harbor cache-auth Secret: the Valkey password (ADR-0018), rendered from Vault path
# secret/valkey/default — the same credential the Valkey StatefulSet consumes via
# valkey-creds. Harbor uses Valkey as its external cache/session store (ADR-0024
# §"Relationship to existing ADRs"), and Valkey runs with `--requirepass`, so Harbor
# MUST authenticate or harbor-core/jobservice crashloop on `NOAUTH Authentication
# required`.
#
# The goharbor chart consumes an existing Secret whose key is REDIS_PASSWORD (the
# chart's fixed cache-password env name, which points at the Valkey instance per
# ADR-0018). harbor.yaml wires external.existingSecret: harbor-valkey-creds.
# Same Vault-via-ESO pattern as harbor-s3 (never inline a secret — ADR-0002/ADR-0024).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-valkey
  namespace: harbor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: harbor-valkey-creds
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REDIS_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: valkey/default
        property: password
