# AWS credentials for the ACK controllers, pointed at moto (any value works —
# moto ignores them, but the AWS SDK credential chain still needs *some* creds).
# Sourced from Vault (secret/aws/moto) via ESO and rendered into the shared
# credentials-file (INI) format the ACK chart mounts (aws.credentials.secretName).
# Namespace lives here (wave 2) so it + the secret exist before the wave-3 controller.
apiVersion: v1
kind: Namespace
metadata:
  name: ack-system
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ack-aws-creds
  namespace: ack-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: ack-aws-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Key name must match aws.credentials.secretKey ("credentials").
        credentials: |
          [default]
          aws_access_key_id = {{ .accessKeyId }}
          aws_secret_access_key = {{ .secretAccessKey }}
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: aws/moto
        property: access-key-id
    - secretKey: secretAccessKey
      remoteRef:
        key: aws/moto
        property: secret-access-key
