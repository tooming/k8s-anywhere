# Explicit keda namespace.yaml (PSA restricted labels, ADR-0017/ADR-0029).
# The KEDA chart's operator/metricServer/webhooks components all default to the
# full restricted securityContext (verified against the pinned chart's
# values.yaml, see ADR-0029 §"PSA profile") — no valuesObject override needed,
# second component after cert-manager to land at restricted with zero carve-out.
apiVersion: v1
kind: Namespace
metadata:
  name: keda
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
