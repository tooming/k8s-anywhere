# NetworkPolicy Kustomize overlay for the keda namespace (ADR-0016 §4 fan-out).
# Pulls the shared baseline templates and adds keda-specific allow rules for
# the admission webhook callback from the kube-apiserver (TCP 9443) and the
# Alloy metrics scrape from the observability namespace (TCP 8080).
# The allow-dns-and-apiserver baseline covers KEDA's k8s API calls (ScaledObject/
# ScaledJob reconcile, leader election, HPA management, admission review fan-out).
# Wired into gitops/platform/keda-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keda

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-keda-webhook-from-apiserver.yaml
  - allow-keda-metrics-from-observability.yaml
