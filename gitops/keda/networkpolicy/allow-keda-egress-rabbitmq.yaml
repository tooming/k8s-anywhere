# Egress from the KEDA operator pod (namespace keda) to RabbitMQ's management HTTP
# API in the data namespace (ADR-0029 §"Scope & exceptions" ScaledObject-demo
# follow-up). The rabbitmq scaler runs in-process in the operator, polling
# http://rabbitmq.data.svc.cluster.local:15672 directly from its own pod -- not from
# the rabbitmq-load Deployment it scales -- so this is the operator's own egress rule,
# not a rabbitmq-load NetworkPolicy change.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keda-egress-rabbitmq
  namespace: keda
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 15672
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
