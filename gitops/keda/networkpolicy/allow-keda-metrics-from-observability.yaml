# Allow Alloy in the observability namespace to scrape KEDA metrics on TCP 8080
# (ADR-0016). All three components — operator, metricServer, webhooks — expose
# Prometheus metrics at :8080/metrics (confirmed in the pinned chart's
# values.yaml: prometheus.operator.port / prometheus.metricsServer.port, each
# in its own pod so there is no port conflict); the keda scrape job in
# observability-alloy.yaml targets these Services and feeds the "Lab — KEDA"
# dashboard with real scaler-activity counters (ADR-0004). podSelector {} keeps
# this Service-name-agnostic — it covers every KEDA pod's :8080 metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keda-metrics-from-observability
  namespace: keda
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
