# Allow the kube-apiserver to reach the KEDA admission webhook on TCP 9443
# (ADR-0016). KEDA registers a ValidatingWebhookConfiguration for ScaledObject/
# ScaledJob/TriggerAuthentication CRs; the API server calls back on TCP 9443
# (the chart's webhooks.port default — confirmed in the pinned chart's
# values.yaml) for every admission request against them.
# Without this allow, the default-deny-all floor blocks webhook callbacks and
# every ScaledObject/ScaledJob create/update fails.
#
# This is a CiliumNetworkPolicy with `fromEntities: remote-node`, NOT a plain
# NetworkPolicy `ipBlock: 10.43.0.1/32` (the shape this file used before).
# Verified live with `cilium monitor --type drop` on a from-scratch cluster: k3s
# embeds the apiserver in the server node's own process, so its outbound
# webhook call arrives with Cilium's `remote-node` identity and the *node's*
# pod-network IP as source — the apiserver Service ClusterIP (10.43.0.1) is
# never the real source address on an outbound connection, so the old ipBlock
# rule silently never matched (found while fixing the identical bug for
# external-secrets' webhook — gitops/external-secrets/networkpolicy/
# allow-eso-webhook-from-apiserver.yaml — on a from-scratch `make up`).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-keda-webhook-from-apiserver
  namespace: keda
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
