# An instance of the KRO-generated API. This single object makes KRO create an
# ACK Bucket (kro-demo-bucket -> moto) AND a kro-demo-bucket-catalog ConfigMap.
# SkipDryRunOnMissingResource lets ArgoCD apply this before the S3BucketClaim CRD
# (generated by the RGD above) is registered; it converges on retry.
apiVersion: kro.run/v1alpha1
kind: S3BucketClaim
metadata:
  name: app-data
  namespace: ack-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  name: kro-demo-bucket
  owner: team-data
