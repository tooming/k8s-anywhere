# NetworkPolicy Kustomize overlay for the external-secrets namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds ESO-specific allow rules for:
# - ingress TCP 8080 from Alloy (observability) for Prometheus metrics scrape
# - egress TCP 8200 to vault namespace for ClusterSecretStore token review calls
# - ingress TCP 10250 from the apiserver to the admission webhook (every namespace's
#   ExternalSecret/ClusterSecretStore create/update is validated through it — without
#   this rule the webhook call times out cluster-wide the moment default-deny lands)
# The allow-dns-and-apiserver baseline covers the *controller's* own k8s API calls
# (SecretStore watch, ExternalSecret reconcile, leader election) — it does NOT cover
# the apiserver calling back into the webhook, which is the opposite direction.
# Wired into gitops/platform/networkpolicy-appset.yaml (auto-synced, wave 4 via appset).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-eso-metrics-ingress.yaml
  - allow-eso-vault-egress.yaml
  - allow-eso-webhook-from-apiserver.yaml
