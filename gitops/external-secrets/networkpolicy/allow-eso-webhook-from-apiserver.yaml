# Allow the kube-apiserver to reach the ESO admission webhook on TCP 10250
# (ADR-0016). external-secrets registers a ValidatingWebhookConfiguration for
# ExternalSecret/SecretStore/ClusterSecretStore; the API server calls back on
# TCP 10250 (the chart's webhook container port) for every admission request
# against them — every namespace's ExternalSecret/ClusterSecretStore create/
# update goes through this ONE webhook, so a missing rule here breaks
# ExternalSecret sync cluster-wide, not just in this namespace.
#
# This is a CiliumNetworkPolicy with `fromEntities: remote-node`, NOT the
# `ipBlock: 10.43.0.1/32` pattern used by gitops/kyverno, gitops/cert-manager,
# and gitops/keda's equivalent files. Verified live with `cilium monitor --type
# drop` on a from-scratch cluster: k3s embeds the apiserver in the server
# node's own process, so its outbound webhook call arrives with Cilium's
# `remote-node` identity and the *node's* pod-network IP as source (observed
# 10.0.0.194, not 10.43.0.1) — the ClusterIP is never the real source address
# on an outbound connection, so the ipBlock rule silently never matches. Found
# via "failed calling webhook ... context deadline exceeded" on
# rabbitmq-creds/valkey-creds/garage-secrets on a from-scratch `make up`; the
# other three webhook-from-apiserver.yaml files carry the same latent bug
# (untested until this webhook's traffic was actually exercised end-to-end) —
# tracked for a follow-up fix, not fixed here to keep this PR's blast radius
# to the ESO issue actually hit.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-eso-webhook-from-apiserver
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  ingress:
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
