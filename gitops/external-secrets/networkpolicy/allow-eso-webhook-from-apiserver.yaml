# Allow the kube-apiserver to reach the ESO admission webhook on TCP 10250
# (ADR-0016). external-secrets registers a ValidatingWebhookConfiguration for
# ExternalSecret/SecretStore/ClusterSecretStore; the API server calls back on
# TCP 10250 (the chart's webhook container port) for every admission request
# against them — every namespace's ExternalSecret/ClusterSecretStore create/
# update goes through this ONE webhook, so a missing rule here breaks
# ExternalSecret sync cluster-wide, not just in this namespace.
#
# Plain networking.k8s.io/v1 NetworkPolicy — Cilium (ADR-0014) was removed
# entirely 2026-09-07, no replacement. The prior CiliumNetworkPolicy used
# `fromEntities: remote-node`: k3s embeds the apiserver in the server node's
# own process, so its outbound webhook call arrives with the *node's* real
# pod-network IP as source (observed live 10.0.0.194 with `cilium monitor
# --type drop` on a from-scratch cluster), never the apiserver Service
# ClusterIP (10.43.0.1) — an ipBlock on the ClusterIP silently never matches.
# Plain NetworkPolicy has no "remote-node" equivalent — only podSelector/
# namespaceSelector/ipBlock — and the node's real IP isn't practically
# pinnable from a Kustomize template (it varies per k3d/Colima environment and
# across rebuilds). This uses an ipBlock 0.0.0.0/0 ingress scoped strictly to
# TCP 10250, the same not-practically-pinnable-target pattern this repo
# already uses elsewhere (allow-argocd-repo-server-egress-charts.yaml).
# Not a security regression
# versus the Cilium rule it replaces (that matched ANY node too) — the real
# access boundary for admission webhooks is mTLS via the CA the chart itself
# issues, not NetworkPolicy. NEEDS LIVE VERIFICATION on the next cluster
# rebuild (ADR-0004) — flagged explicitly rather than asserted as
# confirmed-working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-webhook-from-apiserver
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 10250
          protocol: TCP
