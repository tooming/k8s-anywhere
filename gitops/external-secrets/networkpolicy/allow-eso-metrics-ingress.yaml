# Allow Alloy in the observability namespace to scrape ESO controller-runtime metrics
# on TCP 8080. The external_secrets Alloy scrape job (observability-alloy.yaml) targets
# external-secrets.external-secrets.svc.cluster.local:8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-metrics-ingress
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
