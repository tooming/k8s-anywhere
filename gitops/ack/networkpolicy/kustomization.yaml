# NetworkPolicy Kustomize overlay for the ack-system namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds the ACK S3 controller's single
# outbound flow: egress to moto on TCP 5000 (the AWS-compatible HTTP API configured
# via endpoint_url in the ack-s3 Application valuesObject).
# The allow-dns-and-apiserver baseline already covers the controller's k8s API calls
# (watching Bucket CRs, managing leader-election ConfigMaps).
# Wired into gitops/platform/ack-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ack-system

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - allow-ack-egress-moto.yaml
