# Allow ACK S3 controller pods in ack-system to egress to moto on TCP 5000 (ADR-0016).
# The ACK controller reconciles kind: Bucket CRs by calling moto.moto.svc:5000 —
# the AWS-compatible HTTP API configured via endpoint_url in the ack-s3 Application.
# Without this allow, default-deny-all blocks ACK from reaching moto, causing every
# Bucket reconcile (ack-demo-bucket and kro-demo-bucket) to fail with a network error.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ack-egress-moto
  namespace: ack-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 5000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: moto
