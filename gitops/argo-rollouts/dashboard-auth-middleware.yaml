# Traefik basicAuth Middleware protecting the Argo Rollouts dashboard.
# Closes GHSA-366v-5xmx-36vh/CVE-2026-82277 (RFC #1479, audit #1478) — the
# dashboard exposes mutating Rollout operations (promote/abort/restart/
# retry/set-image) with zero authentication upstream, and no fixed version
# exists yet. Compensating control at the ingress layer: both IngressRoute
# route entries in ingressroute.yaml reference this Middleware.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: argo-rollouts-dashboard-auth
  namespace: argo-rollouts
spec:
  basicAuth:
    secret: argo-rollouts-dashboard-auth
