# success-rate AnalysisTemplate — Mimir-backed SLO gate for canary promotions (ADR-0020).
# Queries Mimir (the lab's long-term-metrics store, scraped by Alloy) via the prometheus
# provider. X-Scope-OrgID: lab matches the single-tenant config used by the existing Mimir
# Application (same header the Kiali datasource uses). Referenced by the capstone Rollout's
# analysis steps (gitops/apps/capstone/rollout.yaml) to gate each weight increment at
# ≥ 95% HTTP success rate. Success condition evaluated per 30s interval, for 5 measurements
# (count: 5 — a ~2.5min gate window); 3 consecutive failures trigger a rollback before that.
#
# `count` is REQUIRED here, not optional tuning: this template is referenced from
# steps[].analysis (a step-gating analysis, not a background one — see
# gitops/apps/capstone/rollout.yaml), and Argo Rollouts rejects a step-gating
# AnalysisTemplate whose metric has `interval` but no `count` as "runs indefinitely" —
# every reconcile of the capstone Rollout then errors and the controller pod eventually
# crashloops on OOM/backoff. A background analysis (spec.strategy.canary.analysis) is the
# only place an interval-only, indefinite metric is valid — see
# scripts/analysistemplate-step-count-check.sh, the mechanical guard against this
# recurring (regression: 145 controller restarts / 45h before this fix).
# Namespace: capstone — must be co-located with the Rollout that references it by name.
# Synced by the capstone-rollout Application (gitops/platform/capstone-rollout.yaml).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: capstone
spec:
  args:
  - name: namespace
  metrics:
  - name: success-rate
    interval: 30s
    count: 5
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://mimir-query-frontend.observability.svc.cluster.local:8080/prometheus
        headers:
        - key: X-Scope-OrgID
          value: lab
        query: |
          sum(rate(http_requests_total{namespace="{{args.namespace}}",code!~"5.."}[1m]))
          /
          sum(rate(http_requests_total{namespace="{{args.namespace}}"}[1m]))
