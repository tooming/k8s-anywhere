# success-rate AnalysisTemplate — Mimir-backed SLO gate for canary promotions (ADR-0020).
# Queries Mimir (the lab's long-term-metrics store, scraped by Alloy) via the prometheus
# provider. X-Scope-OrgID: lab matches the single-tenant config used by the existing Mimir
# Application (same header the Kiali datasource uses). Referenced by the capstone Rollout's
# analysis steps (gitops/apps/capstone/rollout.yaml) to gate each weight increment at
# ≥ 95% HTTP success rate. Success condition evaluated per 30s interval; 3 consecutive
# failures trigger a rollback.
# Namespace: capstone — must be co-located with the Rollout that references it by name.
# Synced by the capstone-rollout Application (gitops/platform/capstone-rollout.yaml).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: capstone
spec:
  args:
  - name: namespace
  metrics:
  - name: success-rate
    interval: 30s
    successCondition: result[0] >= 0.95
    failureLimit: 3
    provider:
      prometheus:
        address: http://mimir-query-frontend.observability.svc.cluster.local:8080/prometheus
        headers:
        - key: X-Scope-OrgID
          value: lab
        query: |
          sum(rate(http_requests_total{namespace="{{args.namespace}}",code!~"5.."}[1m]))
          /
          sum(rate(http_requests_total{namespace="{{args.namespace}}"}[1m]))
