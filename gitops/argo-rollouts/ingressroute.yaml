# Route the Argo Rollouts dashboard through Traefik at
# http://rollouts.127.0.0.1.nip.io:8000 (front door). The dashboard visualises
# canary step progress and AnalysisTemplate pass/fail in real time — the primary
# "see the canary" learning artifact per ADR-0020. Listed in the Grafana "Lab UIs"
# panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# ALWAYS-ON: synced by the argo-rollouts-extras Application (wave 0).
#
# Split into two IngressRoute objects (2026-09-06 fix) — see
# gitops/network/argocd-ingressroute.yaml's header comment for the full finding:
# a `tls: {}` stanza on an object that also lists `web` silently breaks plain-HTTP
# matching on `web` entirely.
#
# Both routes require HTTP Basic Auth (dashboard-auth-middleware.yaml, RFC #1479)
# — closes GHSA-366v-5xmx-36vh/CVE-2026-82277 (audit #1478): the dashboard
# exposes mutating Rollout operations with zero authentication upstream, and no
# fixed version exists yet. Retrieve the credential via
# `vault kv get secret/argo-rollouts/dashboard` (username `admin`; see
# scripts/vault-bootstrap.sh for how it's seeded).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argo-rollouts
  namespace: argo-rollouts
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`rollouts.127.0.0.1.nip.io`) && PathPrefix(`/`)
      middlewares:
        - name: argo-rollouts-dashboard-auth
      services:
        - name: argo-rollouts-dashboard
          port: 3100
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argo-rollouts-tls
  namespace: argo-rollouts
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`rollouts.127.0.0.1.nip.io`) && PathPrefix(`/`)
      middlewares:
        - name: argo-rollouts-dashboard-auth
      services:
        - name: argo-rollouts-dashboard
          port: 3100
  tls: {}
