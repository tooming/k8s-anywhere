# Allow Argo Rollouts controller to reach the Mimir query frontend on TCP 8080
# (ADR-0016). The controller queries Mimir when evaluating AnalysisTemplates —
# the success-rate template in ADR-0020 §AnalysisTemplate calls
# mimir-query-frontend.observability.svc.cluster.local:8080/prometheus with
# the X-Scope-OrgID: lab header. Without this allow the default-deny-all floor
# blocks every analysis query and canaries auto-fail immediately.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argo-rollouts-egress-mimir
  namespace: argo-rollouts
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 8080
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
