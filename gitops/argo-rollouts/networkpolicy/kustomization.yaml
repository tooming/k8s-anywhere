# NetworkPolicy Kustomize overlay for the argo-rollouts namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds argo-rollouts-specific allow rules
# for: Alloy metrics scrape from observability on TCP 8090; Envoy proxy dashboard
# access on TCP 3100; egress to Mimir on TCP 8080 for AnalysisTemplate SLO queries.
# The allow-dns-and-apiserver baseline covers the controller's k8s API calls (Rollout
# and AnalysisTemplate reconciliation, leader election, and canary weight patching).
# Wired into gitops/platform/argo-rollouts-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - allow-argo-rollouts-metrics-from-observability.yaml
  - allow-argo-rollouts-dashboard-from-gateway.yaml
  - allow-argo-rollouts-egress-mimir.yaml
