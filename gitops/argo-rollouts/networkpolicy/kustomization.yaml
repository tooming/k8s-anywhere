# NetworkPolicy Kustomize overlay for the argo-rollouts namespace (ADR-0016 §4 fan-out).
# Pulls the two shared baseline templates and adds an argo-rollouts-specific allow
# rule for Traefik dashboard access on TCP 3100. The Alloy metrics-scrape ingress
# rule and the Mimir-egress AnalysisTemplate-query rule this overlay used to also
# carry were removed 2026-09-06 (ADR-0041, observability stack removed with no
# replacement — Argo Rollouts' canary AnalysisTemplate gate went with it).
# The allow-dns-and-apiserver baseline covers the controller's k8s API calls (Rollout
# and AnalysisTemplate reconciliation, leader election, and canary weight patching).
#
# allow-argo-rollouts-controller-egress-plugins.yaml REMOVED 2026-09-06 (ADR-0040,
# supersedes Envoy Gateway/ADR-0008): that rule existed only so the controller could
# fetch the argoproj-labs/gatewayAPI traffic-router plugin binary from GitHub at
# boot. Traefik's traffic routing is built into Argo Rollouts core (no plugin to
# download), so the egress path no longer exists.
#
# Wired into gitops/platform/argo-rollouts-networkpolicy.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-argo-rollouts-dashboard-from-gateway.yaml
