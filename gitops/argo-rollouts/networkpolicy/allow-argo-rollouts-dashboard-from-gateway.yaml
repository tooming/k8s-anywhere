# Allow Traefik's data-plane pods to reach the Argo Rollouts dashboard on TCP 3100
# (ADR-0016, ADR-0040 — supersedes Envoy Gateway/ADR-0008). Traefik pods serve the
# rollouts.127.0.0.1.nip.io IngressRoute by forwarding to the argo-rollouts-dashboard
# Service on port 3100. The name label selects Traefik's own pods in kube-system only
# (not the whole namespace, which also hosts CoreDNS, metrics-server, etc.).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-argo-rollouts-dashboard-from-gateway
  namespace: argo-rollouts
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3100
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
