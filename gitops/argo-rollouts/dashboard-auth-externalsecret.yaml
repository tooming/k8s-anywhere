# Traefik basicAuth credential Secret for the Argo Rollouts dashboard, rendered
# from Vault path secret/argo-rollouts/dashboard (properties: username,
# password-hash), seeded by scripts/vault-bootstrap.sh. RFC #1479 (closing
# audit #1478, GHSA-366v-5xmx-36vh/CVE-2026-82277 — the dashboard exposes
# mutating operations with zero authentication, and no upstream fix exists
# yet). Traefik's basicAuth Middleware (dashboard-auth-middleware.yaml) expects
# its referenced Secret to hold one or more "user:bcrypt-hash" lines under any
# key name — the ESO template below stitches the two raw Vault fields into
# that exact shape, mirroring gitops/secrets/velero-s3-externalsecret.yaml's
# own INI-templating pattern.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-rollouts-dashboard-auth
  namespace: argo-rollouts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: argo-rollouts-dashboard-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        users: "{{ .username }}:{{ .passwordHash }}"
  data:
    - secretKey: username
      remoteRef:
        key: argo-rollouts/dashboard
        property: username
    - secretKey: passwordHash
      remoteRef:
        key: argo-rollouts/dashboard
        property: password-hash
