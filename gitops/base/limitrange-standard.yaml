# Standard-tier LimitRange — shared base for every governance overlay (RFC #294).
# Container defaults so any pod without explicit requests/limits inherits a sane
# floor + ceiling on the 16 GB host. Values are the RFC #294 "standard" tier.
#
# Namespace-agnostic on purpose: each gitops/governance/<ns>/kustomization.yaml pulls
# this file and sets its own `namespace:`, which kustomize's namespace transformer
# stamps onto this LimitRange. Consolidates the 17 previously-identical per-namespace
# limitrange.yaml files into one source of truth.
apiVersion: v1
kind: LimitRange
metadata:
  name: standard-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "2000m"
        memory: "4Gi"
