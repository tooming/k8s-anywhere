# Governance overlay for the kro namespace (RFC #294 standard tier).
# Applies the standard-tier LimitRange container defaults. Delivered by the
# kro-governance Application generated by gitops/platform/governance-appset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kro

resources:
  - ../base/limitrange-standard.yaml
