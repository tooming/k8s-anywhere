# Governance overlay for the harbor namespace (RFC #294 standard tier / RFC #297).
# Applies the standard-tier LimitRange container defaults. Delivered by the
# harbor-governance Application generated by gitops/platform/governance-appset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: harbor

resources:
  - ../base/limitrange-standard.yaml
