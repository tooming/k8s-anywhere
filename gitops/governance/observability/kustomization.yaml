# Governance overlay for the observability namespace (RFC #294 heavy tier).
# Applies the heavy-tier LimitRange container defaults — Mimir/Loki are multi-GiB
# JVM/Go processes. Delivered by the observability-governance Application generated
# by gitops/platform/governance-appset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - limitrange.yaml
