# Governance overlay for the vault namespace (RFC #294 standard tier).
# Applies the standard-tier LimitRange container defaults. Delivered by the
# vault-governance Application generated by gitops/platform/governance-appset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vault

resources:
  - ../../base/limitrange-standard.yaml
