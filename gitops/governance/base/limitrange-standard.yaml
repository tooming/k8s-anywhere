# Standard-tier LimitRange — RFC #294 "standard" profile.
# namespace is stamped by the Kustomize overlay (kustomization.yaml namespace: field).
# Do not add metadata.namespace here; all 17 standard-tier overlays share this file.
apiVersion: v1
kind: LimitRange
metadata:
  name: standard-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "2000m"
        memory: "4Gi"
