# Governance overlay for the cert-manager namespace (RFC #294 standard tier /
# RFC #293 follow-up). Applies the standard-tier LimitRange container defaults.
# Delivered by the cert-manager-governance Application generated by
# gitops/platform/governance-appset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - ../base/limitrange-standard.yaml
