# Governance overlay for the argocd namespace (RFC #293 / RFC #294 standard tier).
# Applies the standard-tier LimitRange container defaults. Delivered by the
# argocd-governance Application generated by gitops/platform/governance-appset.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../base/limitrange-standard.yaml
