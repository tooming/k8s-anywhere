# Route the Kargo UI through Envoy at http://kargo.127.0.0.1.nip.io:8000
# (front door). The Kargo UI visualises Freight lineage, stage health, and
# promotion history — the primary "see the pipeline" learning artifact per ADR-0023.
# Listed in the Grafana "Lab UIs" panel (stack-health.json) — kept in sync by
# `make lab-ui-check`. The kargo-api Service is kargo-api (Helm release name
# "kargo" + chart suffix), port 80 (plain HTTP; TLS terminated at Envoy gateway).
# ON-DEMAND: synced by the kargo-extras Application (wave 0).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "kargo.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kargo-api
          port: 80
