# Allow Kargo controller pods to reach the image registry on TCP 80 (ADR-0016).
# The Kargo Warehouse polls image digests from the in-lab registry to detect new
# Freight. The registry is served by Traefik (HTTP front door, ADR-0040 — supersedes
# Envoy Gateway/ADR-0008); Kargo reaches it via the nip.io hostname which resolves
# to the cluster's ingress address.
#
# `gitops/kargo-project/project.yaml`'s Warehouse polls the Harbor host
# (ADR-0024/RFC #297, auto/harbor-capstone-rewire cutover) — the prior legacy
# registry egress target was removed once the Warehouse `repoURL` flipped, since
# nothing in gitops points Kargo at it any longer.
#
# NetworkPolicy `ports:` match the destination POD's port, not the Service's port —
# the request path is Kargo -> Traefik pod (this rule) -> Harbor pod (a *separate*
# ingress rule, gitops/harbor/networkpolicy/allow-harbor-ingress.yaml, on Harbor's
# own containerPort 8080). This rule's port must track Traefik's own container port
# for the web (plain-HTTP) entrypoint instead: 8000 (k3s's bundled Traefik chart
# default: ports.web.port: 8000, exposedPort: 80). Harbor's route carries no TLS
# listener (ADR-0024 §"Minimal profile"), so only the web entrypoint's port is
# listed here.
#
# MIGRATION NOTE (ADR-0040, not live-verified): under Envoy Gateway this rule's
# `to:` selected `envoy-gateway-system` + Traefik's-predecessor's own proxy-pod
# port (10080, the equivalent data-plane container port at the time — see this
# file's own git history for the original fix, 2026-08-25 issue #633
# verification). Re-target to Traefik's kube-system pods + port 8000 is this
# migration's mechanical carry-over of the same fix; the first live Kargo
# Warehouse discovery cycle after this migration should confirm the port is right,
# same caution ADR-0040 already calls out for every other Traefik container port
# assumption in this repo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kargo-egress-registry
  namespace: kargo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 8000
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
