# Allow Kargo controller pods to reach the image registry on TCP 443/80 (ADR-0016).
# The Kargo Warehouse polls image digests from the in-lab registry to detect new
# Freight. The registry is served by Envoy Gateway (HTTPS/HTTP front door); Kargo
# reaches it via the nip.io hostname which resolves to the cluster's ingress address.
# Also allows egress to the capstone namespace's Envoy-proxied registry endpoint.
#
# Two egress targets today: the legacy registry namespace below — still the one
# `gitops/kargo-project/project.yaml`'s Warehouse actually polls right now — and
# `harbor`, added ahead of time (ROADMAP `auto/harbor-capstone-rewire` prep slice,
# ADR-0024/RFC #297) so the network path exists before that item's live cutover
# flips the Warehouse `repoURL` at the new registry host. Purely additive: nothing
# in gitops points Kargo at Harbor yet, so this widen has no effect on current live
# traffic — the legacy rule stays until the cutover PR removes it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kargo-egress-registry
  namespace: kargo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artifactory
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
