# Allow Traefik's data-plane pods to reach the Kargo API server on TCP 80
# (ADR-0016, ADR-0040 — supersedes Envoy Gateway/ADR-0008). Traefik pods serve the
# kargo.127.0.0.1.nip.io IngressRoute by forwarding to the kargo-api Service on
# port 80 (plain HTTP; TLS terminated at Traefik per ADR-0023). The name label
# selects Traefik's own pods in kube-system only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kargo-api-from-gateway
  namespace: kargo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
