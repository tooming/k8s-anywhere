# Allow Envoy Gateway proxy pods to reach the Kargo API server on TCP 80 (ADR-0016).
# The Envoy proxy pods serve the kargo.127.0.0.1.nip.io HTTPRoute by forwarding to
# the kargo-api Service on port 80 (plain HTTP; TLS terminated at Envoy per ADR-0023).
# The proxy component label selects the Envoy data-plane pods in envoy-gateway-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kargo-api-from-gateway
  namespace: kargo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
