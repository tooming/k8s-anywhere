# Route the Kargo UI through Traefik at http://kargo.127.0.0.1.nip.io:8000
# (front door). The Kargo UI visualises Freight lineage, stage health, and
# promotion history — the primary "see the pipeline" learning artifact per ADR-0023.
# Listed in the Grafana "Lab UIs" panel (stack-health.json) — kept in sync by
# `make lab-ui-check`. The kargo-api Service is kargo-api (Helm release name
# "kargo" + chart suffix), port 80 (plain HTTP; TLS terminated at Traefik).
# ON-DEMAND: synced by the kargo-extras Application (wave 0).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kargo
  namespace: kargo
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`kargo.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: kargo-api
          port: 80
  tls: {}
