# Allow ingress from the observability namespace to scrape istiod Prometheus metrics
# on TCP 15014 (ADR-0016). Port 15014 is the istiod monitoring port; Alloy can scrape
# it once an Istio scrape job is added to observability-alloy.yaml. The allow is added
# now so the NetworkPolicy floor is already correct when Istio is brought up, without
# requiring a separate follow-up policy PR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-metrics-ingress
  namespace: istio-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 15014
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
