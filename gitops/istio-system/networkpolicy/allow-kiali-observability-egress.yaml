# Allow Kiali pods to egress to Mimir in the observability namespace on TCP 9009
# for Prometheus-compatible metrics queries (gitops/platform/kiali.yaml
# external_services.prometheus.url). Scoped to Kiali pods via podSelector so
# other istio-system pods are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kiali-observability-egress
  namespace: istio-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kiali
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 9009
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
