# Allow all pods within the istio-system namespace to communicate with each other (ADR-0016).
# This is a documented carve-out from ADR-0016's general "no catch-all 'allow same
# namespace'" rule — see ADR-0016 §"Scope & exceptions" → Carve-outs table (the
# argocd/harbor/istio-system/longhorn-system/tidb row) for the binding
# rationale and flip condition.
# The Istio ambient control-plane has dense intra-namespace flows:
#   istiod control plane <-> istio-base CRD webhooks (TCP 15010/15012 xDS gRPC);
#   istio-cni DaemonSet -> istiod for node-local mesh configuration (TCP 15010);
#   ztunnel DaemonSet -> istiod for xDS policy updates (TCP 15010);
#   kiali -> istiod for service mesh topology (TCP 15014 health, TCP 15010 xDS).
# A single broad intra-namespace allow is correct here — all components are
# intentional couplings of the Istio ambient mesh control plane (ADR-0012).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-intra-namespace
  namespace: istio-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
