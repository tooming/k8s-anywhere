# NetworkPolicy Kustomize overlay for the artifactory namespace (ADR-0016 §4 fan-out).
# Artifactory is on-demand (manual-sync only) but the NetworkPolicy manifests are cheap
# (no pods) so this overlay is auto-synced, ensuring the default-deny floor and
# per-workload allows are already in place before `make artifactory-up` brings pods up.
# Wired into gitops/platform/networkpolicy-appset.yaml (auto-synced, wave 4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: artifactory

resources:
  - ../../network/policies/default-deny.yaml
  - ../../network/policies/allow-dns-and-apiserver.yaml
  - ../../network/policies/zz-dns-clusterip-bridge.yaml
  - allow-artifactory-ingress.yaml
  - allow-artifactory-garage-egress.yaml
  - allow-artifactory-intra-namespace.yaml
