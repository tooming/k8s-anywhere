# Allow egress from artifactory pods to Garage S3 in the storage namespace (ADR-0016,
# ADR-0002). Artifactory uses Garage as its S3-compatible binary store for artifacts
# (ADR-0011 + ADR-0002). Endpoint: garage.storage.svc.cluster.local:3900.
# Without this allow the default-deny floor blocks Artifactory → Garage S3 writes
# when Artifactory is running.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-artifactory-garage-egress
  namespace: artifactory
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 3900
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
