# Allow ingress to artifactory pods from the envoy-gateway-system namespace on TCP 8082
# (ADR-0016). The Envoy HTTPRoute `gitops/artifactory/route.yaml` proxies traffic for
# `artifactory.127.0.0.1.nip.io` to the `artifactory-oss` Service on port 8082.
# Without this allow the default-deny floor blocks Envoy proxy → Artifactory traffic
# when Artifactory is running.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-artifactory-ingress
  namespace: artifactory
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8082
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
