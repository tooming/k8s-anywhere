# Route the Artifactory UI and Docker registry endpoint through Envoy at
# http://artifactory.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# ON-DEMAND: synced as part of make artifactory-up (via artifactory-extras Application).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: artifactory
  namespace: artifactory
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "artifactory.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: artifactory-oss
          port: 8082
