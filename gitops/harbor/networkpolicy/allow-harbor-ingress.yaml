# Allow ingress to Harbor pods from the envoy-gateway-system namespace (ADR-0016).
# The Envoy HTTPRoute `gitops/harbor/route.yaml` proxies traffic for
# `harbor.127.0.0.1.nip.io` to the Harbor service on port 80
# (expose.type=clusterIP, tls.enabled=false per ADR-0024 §"Minimal profile").
# Covers portal (nginx frontend), core, and registry API endpoints served
# via the unified Harbor clusterIP service.
# Without this allow the default-deny floor blocks Envoy proxy → Harbor traffic
# when Harbor is running.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-harbor-ingress
  namespace: harbor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
