# Harbor ClusterIP egress bridge (ADR-0014 Cilium, ADR-0016 default-deny).
#
# Why this is needed: with default-deny egress, Harbor's per-service egress rules
# (allow-harbor-valkey-egress, allow-harbor-garage-egress) select the *destination
# pods* by namespace/label. But Harbor's clients connect to the Kubernetes *Service
# ClusterIP* (e.g. valkey.data.svc → 10.43.3.49), and Cilium's socket-LB may evaluate
# egress policy against that ClusterIP *before* translating it to the backend pod IP.
# A pod-selector egress rule never matches a ClusterIP, so the connection is dropped
# and harbor-core crashloops on `dial tcp <valkey-clusterip>:6379: i/o timeout`
# (DNS still works — Cilium answers it via its node-local proxy, masking the cause).
#
# Every other lab namespace already carries an equivalent `zz-dns-clusterip-bridge`
# (toCIDR 10.43.0.0/16). Harbor was the one namespace missing it — the #307 floor
# pulled the shared allow-dns-and-apiserver template (which only opens 10.43.0.0/16
# on port 53) but not the broad ClusterIP bridge. This file brings Harbor to parity
# and, unlike the out-of-band copies elsewhere, keeps it under GitOps (ADR-0004).
#
# Scope: the Service ClusterIP CIDR only (10.43.0.0/16). It does not widen pod-to-pod
# reachability — the per-service pod-selector egress rules still gate which backends
# Harbor may actually reach; this merely lets the ClusterIP frontend be evaluated.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zz-dns-clusterip-bridge
spec:
  endpointSelector: {}
  egress:
    - toCIDR:
        - 10.43.0.0/16
