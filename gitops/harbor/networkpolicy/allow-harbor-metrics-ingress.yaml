# Allow ingress to Harbor pods from the observability namespace for Alloy metrics scrape (ADR-0016).
# Harbor metrics are exposed by the built-in harbor-metrics Service on port 9090 when
# metrics.enabled=true (gitops/platform/harbor.yaml). This target is idle unless Harbor
# is manually synced (on-demand, ADR-0024). Mirrors the trivy-operator and kyverno
# metrics ingress allow patterns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-harbor-metrics-ingress
  namespace: harbor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9090
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
