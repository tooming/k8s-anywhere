# Allow all pods within the harbor namespace to communicate with each other (ADR-0016).
# Harbor uses a bundled internal PostgreSQL pod (database.type=internal, ADR-0024
# §"Minimal profile") — core and jobservice connect to it on TCP 5432. Harbor
# components also communicate with each other over the clusterIP Service endpoints
# (core, registry, jobservice, portal). A broad intra-namespace allow is correct
# here: all components are intentional couplings of the Harbor stack and the
# database pod lives in the same namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-harbor-intra-namespace
  namespace: harbor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
