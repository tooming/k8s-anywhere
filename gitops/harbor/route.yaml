# Route the Harbor UI and OCI registry endpoint through Envoy at
# http://harbor.127.0.0.1.nip.io:8000 (front door). Listed in the Grafana
# "Lab UIs" panel (stack-health.json) — kept in sync by `make lab-ui-check`.
# ON-DEMAND: synced as part of harbor-extras Application (auto-synced, wave 0).
# The harbor-extras Application pre-creates this HTTPRoute before `make harbor-up`
# brings up the Harbor pods, so the front door exists as soon as the Application is
# deployed regardless of whether Harbor is currently running.
# Harbor exposes a unified HTTP endpoint on port 80 when expose.type=clusterIP and
# expose.tls.enabled=false (ADR-0024 §"Minimal profile").
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: eg
      namespace: lab-gateway
  hostnames:
    - "harbor.127.0.0.1.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Found live 2026-08-13 (#631): every `docker push` blob-upload session
      # consistently 504'd on its very first POST to /v2/<repo>/blobs/uploads/ —
      # not intermittent flakiness like the base-image-pull issue, a *structural*
      # timeout. Envoy Gateway's default request timeout (no `timeouts:` set here
      # previously) is ~15s; under this host's real load (harbor-core proxying to
      # a cold registry connection, itself proxying to Garage S3) that's tight
      # enough to fail nearly every real push, not just a rare slow one — same
      # class of "chart/gateway default too tight for this host" issue already
      # fixed via probe timeoutSeconds bumps across Harbor, Kyverno, ArgoCD, etc.
      # 60s matches the convention used elsewhere in this repo for the same
      # failure mode.
      timeouts:
        request: 60s
        backendRequest: 60s
      backendRefs:
        - name: harbor
          port: 80
