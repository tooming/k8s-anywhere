# Explicit harbor namespace manifest with Pod Security Admission labels (ADR-0017).
# PSA profile targets `restricted` (Harbor is Go-based; core/registry/jobservice run
# as non-root UID 10000; bundled postgres runs as UID 1001 via Bitnami image).
# The portal component uses nginx in recent Harbor chart versions (1.16.x) with a
# non-root UID — verify on first `make harbor-up` and fall back to `baseline` with
# a documented justification + flip condition only if a chart component genuinely
# cannot render restricted-compatible with securityContext overrides.
# Flip condition to `restricted` (if currently baseline): when chart components
# document restricted-compatible initContainers and non-root portal UIDs.
# Per ADR-0024 §"PSA profile" (architect decision RFC #297, 2026-06-30).
#
# This namespace is pre-created by the auto-synced harbor-extras Application
# (gitops/platform/harbor-extras.yaml, wave 0) so the PSA restricted floor is in
# place before `make harbor-up` admits any Harbor pod.
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
