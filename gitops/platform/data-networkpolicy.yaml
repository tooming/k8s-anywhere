# data-networkpolicy — default-deny + allowlist NetworkPolicies for the data namespace
# (ADR-0016 pilot). Applies the shared baseline templates (default-deny-all,
# allow-dns-and-apiserver) plus per-workload allow rules for RabbitMQ, Valkey, and the
# data-demo generators. ALWAYS-ON: automated sync alongside rabbitmq/valkey (same namespace).
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction for this overlay.
# Wave 4: after rabbitmq + valkey (wave 3) have created the data namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/data/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
