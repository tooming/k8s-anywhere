# storage-networkpolicy — default-deny + allowlist NetworkPolicies for the storage
# namespace (ADR-0016 §4 fan-out; Garage is the lab's S3 backplane for Mimir / Loki /
# Tempo / Pyroscope / Inkless). Applies the shared baseline templates
# (default-deny-all, allow-dns-and-apiserver) plus per-workload allow rules for
# Garage's two real ingress flows: from the LGTMP observability stack (S3 writes on
# TCP 3900 + Alloy metrics scrape on TCP 3903) and from the Inkless broker (diskless
# Kafka log-segment writes on TCP 3900).
# ALWAYS-ON: automated sync alongside the garage Application (same namespace).
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction for this overlay.
# Wave 4: after garage (wave 1) has created the storage namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/storage/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
