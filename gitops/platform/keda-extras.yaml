# keda-extras — applies the keda namespace.yaml (PSA restricted labels,
# ADR-0017/ADR-0029) before the keda Helm Application (sync-wave 1) schedules
# pods. Running at wave 0 ensures the namespace's enforce/warn/audit labels
# are in place before ArgoCD deploys the Helm release.
# ALWAYS-ON: automated sync alongside keda.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
