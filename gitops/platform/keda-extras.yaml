# keda-extras — applies the keda namespace.yaml (PSA restricted labels,
# ADR-0017/ADR-0029) before the keda Helm Application schedules pods. Wave 6
# (moved from wave 0, ADR-0029 §"Scope & exceptions" webhook-TLS follow-up):
# the keda Application itself now also runs at wave 6, since its admission
# webhook cert is issued by a cert-manager ClusterIssuer that only exists
# after cert-manager-root-ca reconciles at wave 5 (see gitops/platform/keda.yaml
# for the ClusterIssuer reference) — keda-extras stays paired with it so the
# namespace's enforce/warn/audit labels are still in place before the Helm
# release deploys.
# ALWAYS-ON: automated sync alongside keda.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
