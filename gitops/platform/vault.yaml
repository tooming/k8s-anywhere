# HashiCorp Vault — secrets backend. Standalone + file storage on a PVC (persistent).
# TLS disabled (lab). Injector off — we sync secrets into the cluster via External
# Secrets Operator. Must be initialized + unsealed once after deploy (see Makefile).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
    helm:
      releaseName: vault
      valuesObject:
        global:
          tlsDisable: true
        injector:
          enabled: false
        ui:
          enabled: true
        server:
          # Explicit image pin (2026-07-24, ROADMAP "Pin Vault's server image
          # tag explicitly"). Full version history and security-audit trail
          # moved to ADR-0037's own Re-evaluation log (2026-09-03) — this
          # comment used to carry that history inline, the only
          # version-sensitive component in this repo that did (every other
          # one already points at its own ADR); see ADR-0037 for the
          # complete trail through this pin's origin at `2.0.3`.
          image:
            repository: "hashicorp/vault"
            tag: "2.1.0"
          standalone:
            enabled: true
            config: |
              ui = true
              disable_mlock = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
                telemetry {
                  unauthenticated_metrics_access = true
                }
              }
              storage "file" {
                path = "/vault/data"
              }
              # ROADMAP "Vault internal telemetry — sys/metrics scrape + dashboard
              # depth": enables Vault's built-in Prometheus-format metrics sink at
              # GET /v1/sys/metrics?format=prometheus. unauthenticated_metrics_access
              # above (nested in the listener block, not here) is what makes that
              # endpoint scrapable without a token — cheaper than an ESO-managed
              # scrape token for a lab whose TLS is already disabled and whose UI is
              # already open cluster-internally. Real metrics this newly exposes:
              # vault_core_unsealed, vault_core_active, vault_core_in_flight_requests,
              # vault_expire_num_leases (verified against hashicorp/vault's own
              # source — vault/core.go, vault/core_metrics.go, vault/expiration.go —
              # not assumed from docs prose, ADR-0004).
              telemetry {
                prometheus_retention_time = "24h"
                disable_hostname          = true
              }
          dataStorage:
            enabled: true
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ADR-0017: Vault 2.0.x (pinned above) no longer holds cap_ipc_lock
          # (disable_mlock above is the required counterpart), so the
          # PSS-restricted profile now applies. `home` (/home/vault) is
          # already an unconditional chart-provided emptyDir; `/tmp` is not,
          # so it's added explicitly for readOnlyRootFilesystem.
          volumes:
            - name: tmp
              emptyDir: {}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          statefulSet:
            securityContext:
              pod:
                runAsNonRoot: true
                runAsGroup: 1000
                runAsUser: 100
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              container:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
