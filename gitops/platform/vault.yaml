# HashiCorp Vault — secrets backend. Standalone + file storage on a PVC (persistent).
# TLS disabled (lab). Injector off — we sync secrets into the cluster via External
# Secrets Operator. Must be initialized + unsealed once after deploy (see Makefile).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.0
    helm:
      releaseName: vault
      valuesObject:
        global:
          tlsDisable: true
        injector:
          enabled: false
        ui:
          enabled: true
        server:
          standalone:
            enabled: true
            config: |
              ui = true
              disable_mlock = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
              }
              storage "file" {
                path = "/vault/data"
              }
          dataStorage:
            enabled: true
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ADR-0017: chart v0.34.0 defaults to a Vault 2.0.3 image that no
          # longer holds cap_ipc_lock (disable_mlock above is the required
          # counterpart), so the PSS-restricted profile now applies. `home`
          # (/home/vault) is already an unconditional chart-provided emptyDir;
          # `/tmp` is not, so it's added explicitly for readOnlyRootFilesystem.
          volumes:
            - name: tmp
              emptyDir: {}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          statefulSet:
            securityContext:
              pod:
                runAsNonRoot: true
                runAsGroup: 1000
                runAsUser: 100
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              container:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
