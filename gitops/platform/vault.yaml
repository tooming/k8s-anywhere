# HashiCorp Vault — secrets backend. Standalone + file storage on a PVC (persistent).
# TLS disabled (lab). Injector off — we sync secrets into the cluster via External
# Secrets Operator. Must be initialized + unsealed once after deploy (see Makefile).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.0
    helm:
      releaseName: vault
      valuesObject:
        global:
          tlsDisable: true
        injector:
          enabled: false
        ui:
          enabled: true
        server:
          # Explicit image pin (2026-07-24, ROADMAP "Pin Vault's server image
          # tag explicitly"): previously inherited silently from the chart's
          # own default (same value, `2.0.3` — this is a pin-what's-already-
          # running change, not a version bump). Every other version-sensitive
          # component in this repo (Grafana, Argo Rollouts, Valkey, Envoy
          # Gateway, Kiali, k3s/ADR-0030) pins its running version explicitly;
          # Vault previously did not, which meant "what version are we
          # running" was only ever answerable from a prose comment, not a
          # field a bats test or a future ADR-audit sweep could check.
          #
          # Re-evaluation log:
          # - 2026-08-05: bumped `2.0.3` -> `2.0.4`. HashiCorp's published
          #   CHANGELOG.md has no `2.0.x` section at either tag (a gap in
          #   their own changelog publishing for this release line, not
          #   silently worked around — confirmed via a real clone + `git log
          #   v2.0.3..v2.0.4` instead). Three "security:"-titled commits in
          #   that range turn out to be false-positive suppressions, not real
          #   vulnerabilities (their own origin commits are titled "Suppress
          #   false positive for GO-2026-5856 & 4970" and the same shape for
          #   GO-2026-5298) — these do NOT count toward the flip condition.
          #   Two fixes ARE real: `go.mod`/`go.sum` bump `klauspost/compress`
          #   to `v1.18.7` and `go.opentelemetry.io/otel` to `v1.44.0`,
          #   resolving GO-2026-5158 and GO-2026-5841 (real dependency CVEs).
          #   Separately, a "Fix Goroutine Leak in Seal Encryption" commit
          #   touches `vault/seal/seal.go` — the shared encrypt/decrypt path
          #   every seal type (including this lab's Shamir/file-storage seal)
          #   goes through, a real reliability fix. Satisfies this pin's flip
          #   condition in spirit (a real security-relevant fix past `2.0.3`)
          #   even though no public bulletin names `2.0.3` itself as affected.
          #   Flip condition: revisit when a bulletin names a version above
          #   `2.0.4` as affected, or when bumping the chart `targetRevision`
          #   past `0.34.0`.
          # - 2026-07-24: pinned at `2.0.3` (the chart v0.34.0 default).
          #   Cross-checked against every 2026 Vault CVE/security bulletin
          #   findable from this sandbox. Confirmed directly in Vault's own
          #   CHANGELOG.md (fetched live from
          #   raw.githubusercontent.com/hashicorp/vault/main/CHANGELOG.md,
          #   not training-data recall): the `2.0.0` section fixes
          #   CVE-2026-5807 (unauthenticated root-token/rekey DoS — "sys/rekey
          #   endpoints are now authenticated by default"), CVE-2026-5052
          #   (ACME SSRF — "Reject obviously unsafe validation targets during
          #   ACME HTTP-01 and TLS-ALPN-01 challenge verification"), and
          #   HCSEC-2026-07 (token exposure to auth plugins — "Correctly
          #   remove any Vault tokens from the Authorization header when this
          #   header is forwarded to plugin backends"). Two further bulletins
          #   found only via secondary sources (SentinelOne, GitLab Advisory
          #   DB; HashiCorp's own discuss.hashicorp.com bulletin pages
          #   returned proxy/auth errors to direct fetch from this sandbox) —
          #   CVE-2026-3605 (KVv2 glob-wildcard delete DoS) and HCSEC-2026-16
          #   (audit device directory-guard bypass) — are both reported fixed
          #   by `2.0.0`/`2.0.1` respectively; not independently confirmed in
          #   the plain-text CHANGELOG.md, flagged here per ADR-0004 rather
          #   than asserted as verified. `2.0.3` (this pin) is newer than all
          #   five fixed versions either way.
          #   Flip condition: revisit when a bulletin names a version above
          #   `2.0.3` as affected, or when bumping the chart `targetRevision`
          #   past `0.34.0` (a later chart may change the default image tag).
          image:
            repository: "hashicorp/vault"
            tag: "2.0.4"
          standalone:
            enabled: true
            config: |
              ui = true
              disable_mlock = true
              listener "tcp" {
                address     = "[::]:8200"
                tls_disable = 1
                telemetry {
                  unauthenticated_metrics_access = true
                }
              }
              storage "file" {
                path = "/vault/data"
              }
              # ROADMAP "Vault internal telemetry — sys/metrics scrape + dashboard
              # depth": enables Vault's built-in Prometheus-format metrics sink at
              # GET /v1/sys/metrics?format=prometheus. unauthenticated_metrics_access
              # above (nested in the listener block, not here) is what makes that
              # endpoint scrapable without a token — cheaper than an ESO-managed
              # scrape token for a lab whose TLS is already disabled and whose UI is
              # already open cluster-internally. Real metrics this newly exposes:
              # vault_core_unsealed, vault_core_active, vault_core_in_flight_requests,
              # vault_expire_num_leases (verified against hashicorp/vault's own
              # source — vault/core.go, vault/core_metrics.go, vault/expiration.go —
              # not assumed from docs prose, ADR-0004).
              telemetry {
                prometheus_retention_time = "24h"
                disable_hostname          = true
              }
          dataStorage:
            enabled: true
            size: 1Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # ADR-0017: Vault 2.0.x (pinned above) no longer holds cap_ipc_lock
          # (disable_mlock above is the required counterpart), so the
          # PSS-restricted profile now applies. `home` (/home/vault) is
          # already an unconditional chart-provided emptyDir; `/tmp` is not,
          # so it's added explicitly for readOnlyRootFilesystem.
          volumes:
            - name: tmp
              emptyDir: {}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          statefulSet:
            securityContext:
              pod:
                runAsNonRoot: true
                runAsGroup: 1000
                runAsUser: 100
                fsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              container:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
