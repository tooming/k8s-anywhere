# External Secrets Operator — syncs secrets from Vault into native k8s Secrets
# that workloads consume. Replaces the kubectl-created bootstrap secrets.
#
# Bumped 2.9.0 -> 2.10.0 (upgrade-drafter fallback, 2026-09-01): verified
# directly (ADR-0004) via a real clone of external-secrets/external-secrets
# -- `git diff helm-chart-2.9.0 helm-chart-2.10.0 -- deploy/charts/
# external-secrets/values.yaml` is purely additive (48 insertions, 0
# deletions): new optional `tls.{minVersion,ciphers,curvePreferences}`
# blocks at the global/webhook/certController levels, all defaulting to
# empty (no behavior change unless explicitly set). Every key this lab's
# valuesObject sets (installCRDs, podSecurityContext, securityContext,
# webhook.*, certController.*, resources) is unchanged. `git log
# v2.9.0..v2.10.0` (39 commits) includes real fixes: "fix(aws): redact
# credentials in aws auth config logs" (a real credential-leak fix),
# "fix(gcp): preserve workload identity token expiry", "fix(vault): only
# apply deprecated token-cache flags when explicitly set" -- plus the TLS
# security-profile feature itself and routine dependency bumps. No CVE
# cited explicitly, but real security-relevant fixes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        # NOTE: this chart has no `global.podSecurityContext`/`global.containerSecurityContext`
        # keys — each Deployment (main, webhook, certController) takes its own
        # top-level podSecurityContext/securityContext. Kyverno's
        # require-pod-security-restricted (ADR-0017) checks runAsNonRoot +
        # seccompProfile at the POD level, so all three need it set explicitly here.
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        webhook:
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        certController:
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
