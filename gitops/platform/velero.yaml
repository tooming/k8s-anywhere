# Velero backup/restore controller + node-agent (ADR-0021, CHARTER O1 + O3).
# Helm chart vmware-tanzu/velero from https://vmware-tanzu.github.io/helm-charts.
# Garage S3 backend (ADR-0002): bucket velero, s3ForcePathStyle=true.
# Kopia FS-snapshot uploader (ADR-0021 §Uploader; uploaderType: kopia).
# cloud-credentials Secret rendered by gitops/secrets/velero-s3-externalsecret.yaml
# from Vault path secret/velero/s3 (seeded by garage-bootstrap.sh).
# velero-extras (wave 0) pre-creates the namespace with PSA restricted labels before
# the Helm release schedules pods (mirrors kyverno-extras + trivy-extras pattern).
# ALWAYS-ON: automated sync; footprint: ~250-450 MiB (controller + node-agent DaemonSet).
#
# Bumped 8.4.0 -> 8.7.2 (upgrade-drafter, 2026-07-18): latest stable patch on the
# 8.x chart line, deliberately not crossing the 9.x major bump. appVersion is
# unchanged (1.15.2 at both chart versions) -- this is a chart-packaging-only
# bump, no Velero application code change. Diffed the chart's values.yaml
# between both tags: purely additive (new optional fields), no renamed or
# removed keys -- every valuesObject key this repo sets was verified present
# and unchanged at the new pin.
#
# Bumped 8.7.2 -> 12.1.0 (RFC #617, 2026-07-20): appVersion 1.15.2 -> 1.18.1.
# This is a chart-major jump (8.x -> 11.x -> 12.x) previously deferred by
# ADR-0021's 2026-07-18 Re-evaluation log pending a values-schema audit --
# that audit (RFC #617) fetched the real chart's values.yaml/Chart.yaml at
# tag velero-12.1.0 and confirmed every valuesObject key below
# (credentials.{useSecret,existingSecret}, configuration.{
# defaultVolumesToFsBackup,features,uploaderType,backupStorageLocation},
# deployNodeAgent, resources, nodeAgent.resources) is unchanged -- a
# version-number-only bump, no schema migration needed. No CVE motivated
# this; see ADR-0021 Re-evaluation log for the full reasoning.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.1.0
    helm:
      releaseName: velero
      valuesObject:
        credentials:
          useSecret: true
          existingSecret: cloud-credentials
        configuration:
          defaultVolumesToFsBackup: true
          features: EnableCSI
          uploaderType: kopia
          backupStorageLocation:
          - name: default
            provider: aws
            bucket: velero
            credential:
              name: cloud-credentials
              key: cloud
            config:
              region: garage
              s3ForcePathStyle: "true"
              s3Url: http://garage.storage.svc.cluster.local:3900
        deployNodeAgent: true
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        nodeAgent:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
