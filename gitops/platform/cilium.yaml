# Cilium CNI — ADR-0014 follow-on.  Non-auto-synced: `make cilium-up` installs
# Cilium before any other workload; only then does pod networking work.
# See docs/DR.md §Cilium for the bootstrap ordering note.
#
# DO NOT add an `automated:` syncPolicy block — Cilium must be brought up
# manually in the correct order (cluster → Cilium → ArgoCD → rest of stack).
# Once the always-on stack is up, ArgoCD adopts and manages this release.
#
# Pinned at 1.17.18 (bumped from 1.16.6, RFC #501, 2026-07-18): CVE-2026-49445 —
# Envoy's standalone DaemonSet (which runs by default since Cilium 1.16, whether
# or not any L7 CiliumNetworkPolicy is authored — envoy.enabled defaults to null/
# "true for new installation" in the chart) creates a world-accessible admin.sock
# on cluster nodes. Fixed upstream in 1.17.14/1.18.8/1.19.2.
#
# Bumped to 1.18.12 (RFC #917, 2026-07-30): Cilium's SECURITY.md support table
# marks every version < 1.18.0 as unsupported (v1.20.0 released 2026-07-29) —
# ADR-0014 audit #916. 1.18.12 is the latest 1.18.x patch, chosen as one
# sequential minor-line step (Cilium's upgrade path is minor-by-minor; not a
# jump straight to 1.20.0). Rollback: revert targetRevision — ArgoCD self-heals;
# Cilium is a DaemonSet so a revert re-rolls the same way the bump did.
# (ADR-0004 caveat: this remote clusterless session cannot verify pod
# networking stays healthy post-bump on a live cluster.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.18.12
    helm:
      releaseName: cilium
      valuesObject:
        # Replace kube-proxy entirely — ADR-0014 rationale (one fewer component)
        kubeProxyReplacement: true
        # NOTE: kube-proxy-free also needs k8sServiceHost/k8sServicePort (the real
        # kube-apiserver endpoint). That value is the k3d server node IP, which is
        # per-run and not portable, so it is NOT pinned here — `make cilium-up`
        # derives and sets it at bootstrap. This app is manual-sync (no automated
        # block below) precisely so it never re-renders without it. If you DO sync
        # this app by hand, re-run `make cilium-up` afterward to restore the endpoint.
        prometheus:
          enabled: true          # RFC #358 — O5 CNI metrics; feeds lab-cilium.json dashboard
          port: 9962             # Cilium default; Alloy pod-discovery scrapes at this port
        hubble:
          enabled: false         # Hubble deferred: ~250-400 MB; not in 12 GB budget
        operator:
          replicas: 1            # single-node lab (ADR-0005)
          # Found live 2026-08-11 (systemic probe-timeout audit): cilium-operator was
          # crashlooping (556 restarts over 4d14h) with the exact same "connection
          # refused" / "context deadline exceeded" signature already found and fixed
          # for Harbor (PR #1040/#1102), ArgoCD's repo-server (PR #1103), and Kyverno's
          # admissionController (PR #1115) -- but this component's fix mechanism is
          # different from those three. Verified against the pinned chart's source
          # (templates/cilium-operator/deployment.yaml, cilium-1.18.12): the
          # operator's livenessProbe/readinessProbe timeoutSeconds (3s) is hardcoded
          # in the template with NO `.Values` reference at all -- there is no values
          # knob to loosen here, matching the same chart-provides-no-override-hook
          # finding already documented for Envoy Gateway above this file's sibling
          # (gitops/platform/envoy-gateway.yaml's leaderElection.disable comment).
          # The real, values-driven lever this chart DOES expose is `operator.extraArgs`
          # (verified: deployment.yaml's `{{- with .Values.operator.extraArgs }}`),
          # which lets us pass extra CLI flags straight to the operator binary.
          # Live logs showed the operator's own startup ("Start hook executed ...
          # duration=10.505903672s") already flirting with its own default
          # --leader-election-renew-deadline=10s under this host's real CPU
          # contention (confirmed live: k3d-agent/server containers running at
          # 126-167% CPU during this investigation) -- with a single operator replica
          # (no HA to arbitrate), losing that lease under a latency spike stalls the
          # control loop and starves the (hardcoded, un-widenable) 3s liveness/
          # readiness probes, which is what actually restarts the container. Widened
          # the leader-election timers themselves (the same "give the real bottleneck
          # more room" fix family as the other three, just applied to the lever this
          # chart actually exposes instead of a probe timeoutSeconds).
          extraArgs:
            - --leader-election-lease-duration=60s
            - --leader-election-renew-deadline=30s
            - --leader-election-retry-period=5s
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
