# cert-manager TLS certificate lifecycle manager (ADR-0028, new CHARTER Goal
# "automated TLS certificate lifecycle"). Helm chart cert-manager from
# https://charts.jetstack.io — chart version tracks app version 1:1 for this
# project (unlike most charts in this repo).
# Single replica per component (ADR-0005 lab trade-off; production uses 2-3 for
# the webhook/controller). Memory limits per ADR-0028 §"Footprint controls":
# controller 128Mi, webhook 64Mi, cainjector 128Mi — ~320 MiB combined cap.
# CRDs installed via the chart itself (crds.enabled: true), not a separate
# imperative kubectl apply step (ADR-0001).
# ALWAYS-ON: automated sync; cert-manager-extras (wave 0) pre-creates the
# namespace with PSA restricted labels before the Helm release schedules pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 1.21.1
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
        resources:
          limits:
            memory: 128Mi
        webhook:
          resources:
            limits:
              memory: 64Mi
          # Found 2026-08-11 (systemic probe-timeout audit): the chart's own
          # webhook.livenessProbe/readinessProbe default to timeoutSeconds: 1 (verified
          # against the pinned chart's values.yaml, cert-manager-1.21.1) — the same
          # chart-default-too-tight footgun already found and fixed for Harbor
          # (PR #1040/#1102), ArgoCD's repo-server/server (PR #1103/#1121), and
          # Kyverno's admissionController (PR #1115). cert-manager's webhook is a
          # fail-closed admission webhook for Certificate/Issuer CRDs (same class of
          # risk as Kyverno's), so a probe-timeout crashloop here can block cluster-wide
          # cert issuance, not just this component. Bumped to 15s, matching the
          # convention already used for other admission-webhook components in this repo.
          livenessProbe:
            timeoutSeconds: 15
          readinessProbe:
            timeoutSeconds: 15
        cainjector:
          resources:
            limits:
              memory: 128Mi
          # Found live 2026-08-18 (#633 verification), reconciled from the
          # in-cluster Forgejo remote 2026-09-04 (issue #1345 — this fix only
          # ever landed on Forgejo's main, never on GitHub): 64Mi was almost
          # certainly fine when this was first set, but cainjector caches every
          # CRD, Certificate, {Mutating,Validating}WebhookConfiguration, and
          # APIService cluster-wide in memory to do its job — and this lab's CRD
          # footprint has grown substantially (Kargo, Argo Rollouts, TiDB,
          # Longhorn, Velero, Kyverno, and more, none of which existed when 64Mi
          # was chosen). Observed live: 464 restarts over 7 days (`kubectl get
          # pods -n cert-manager`), each exitCode 137 (OOMKilled) within ~2s of
          # container start — too fast to be anything but the memory limit
          # itself. This silently broke Kargo's own admission webhooks (their CA
          # bundle never gets injected without a cainjector that stays up long
          # enough to reconcile), surfaced only once #633's verification
          # exercised a live Warehouse write for the first time.
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager's clusterissuers/issuers CRDs are ~325 KB each (challenges
      # ~271 KB) — over the 262144-byte kubectl client-side-apply annotation cap.
      # Without server-side apply, repo-server can't apply them ("metadata.annotations:
      # Too long"), matching the exact failure class ADR-0019 hit for Kyverno's CRDs.
      - ServerSideApply=true
