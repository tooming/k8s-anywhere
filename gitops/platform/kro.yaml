# KRO (Kube Resource Orchestrator) — bundle many k8s/ACK resources into ONE
# custom API (a ResourceGraphDefinition generates a new CRD). The platform-eng
# capstone: pairs with ACK so a single high-level claim provisions cloud + k8s
# resources together. rbac.mode: unrestricted (default) so KRO can manage the
# arbitrary resource kinds its RGDs reference (incl. ACK Buckets).
#
# SUSPENDED (2026-08-24, cluster-load reduction): kro's controller was
# chronically crash-looping (216+ restarts over 13 days) with "failed to wait
# for ResourceGraphDefinition caches to sync" -- a downstream symptom of this
# host's apiserver being too slow to satisfy kro's own informer-sync startup
# timeout, not an independent bug in kro itself. Each crash-restart triggers a
# fresh full-cache resync (a burst of List/Watch calls against the shared k3s
# datastore), so a chronically-crashing kro was *also* a contributor to the
# same apiserver/datastore write pressure it was a victim of. This laptop's
# Colima VM has been running far more simultaneously than it comfortably can
# (12 GB budget, 18+ always-on namespaces); kro is CHARTER-mentioned demo
# infrastructure (cloud control-plane patterns), not ADR-mandated core
# infra, so it's the right thing to trim first.
#
# Turned off via syncPolicy (automated removed below), not a Helm values
# field: this chart's OCI ref (ghcr.io/kro-run/kro, path resolution ArgoCD
# alone seems able to do) isn't independently pullable from this session to
# verify a values-field name against its real schema, and this repo has been
# burned before by a values key that silently no-ops because it doesn't
# match the chart's actual schema (see harbor.yaml's extraEnvVarsSecret /
# pyroscope.yaml's dead securityContext-key comments for that history).
# Manual sync only now; live
# replicas scaled to 0 directly. Re-enable by restoring the automated block
# below once the cluster has real headroom again.
#
# Bumped 0.9.3 -> 0.9.4 (upgrade-drafter fallback, 2026-09-06): ADR-0038's
# 2026-09-03 currency check confirmed 0.9.3 was still the newest tag at that
# time (a v0.9.4 fetch at the chart's Chart.yaml path 404'd, same as the
# known-current v0.9.3 tag at that path -- this chart's Chart.yaml isn't
# under a flat repo-root path, so the GitHub releases list is the reliable
# signal, not a raw path fetch). Re-checked directly (ADR-0004, not assumed):
# github.com/kro-run/kro/releases/tag/v0.9.4 is a real, published (non-draft,
# non-prerelease) release, published 2026-09-04 by github-actions -- newer
# than the ADR's 2026-09-03 check, so this is a genuinely new tag, not a
# stale read. No published GHSA advisory forced this; routine same-line
# patch currency only, no major bump. Left SUSPENDED as-is (no automated
# block) -- this bump doesn't touch the suspension, only the pinned version
# for whenever it's re-enabled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kro
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: ghcr.io/kro-run/kro
    chart: kro
    targetRevision: 0.9.4
    helm:
      releaseName: kro
      valuesObject:
        deployment:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
  destination:
    server: https://kubernetes.default.svc
    namespace: kro
  # No automated block: manual sync only while suspended (see top-of-file
  # comment). selfHeal:true would otherwise re-scale the live replicas back
  # up the moment the Deployment is patched to 0 below.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
