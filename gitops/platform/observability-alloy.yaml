# Grafana Alloy — the collector. Metrics: scrapes kube-state-metrics + ArgoCD,
# remote_writes to Mimir. Logs: tails pod logs (k8s API) and ships to Loki.
# Both multi-tenant (X-Scope-OrgID: lab). Decoupled from storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.8.2
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: deployment
          replicas: 1
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            seccompProfile:
              type: RuntimeDefault
        alloy:
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            # readOnlyRootFilesystem carve-out: Alloy writes its WAL to /tmp/alloy
            # (chart-created emptyDir); tightening to true is a follow-up item once
            # the storagePath volume is verified writable under restricted policy.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          configMap:
            content: |
              // ---- metrics -> Mimir ----
              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir.observability.svc.cluster.local:9009/api/v1/push"
                  headers = {
                    "X-Scope-OrgID" = "lab",
                  }
                }
              }

              prometheus.scrape "ksm" {
                targets = [
                  {"__address__" = "kube-state-metrics.observability.svc.cluster.local:8080", "job" = "kube-state-metrics"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              prometheus.scrape "argocd" {
                targets = [
                  // job names follow ArgoCD's official Prometheus convention so the
                  // community dashboard (gnetId 14584) matches the per-component series.
                  {"__address__" = "argocd-application-controller-metrics.argocd.svc.cluster.local:8082", "job" = "argocd-metrics"},
                  {"__address__" = "argocd-server-metrics.argocd.svc.cluster.local:8083", "job" = "argocd-server-metrics"},
                  {"__address__" = "argocd-repo-server-metrics.argocd.svc.cluster.local:8084", "job" = "argocd-repo-server"},
                  {"__address__" = "argocd-applicationset-controller-metrics.argocd.svc.cluster.local:8080", "job" = "argocd-applicationset-controller"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- logs -> Loki (tenant "lab") ----
              loki.write "loki" {
                endpoint {
                  url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
                  headers = {
                    "X-Scope-OrgID" = "lab",
                  }
                }
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.loki.receiver]
              }

              // ---- profiles -> Pyroscope (single-tenant) ----
              // Pull pprof from the Go services (no eBPF, no app changes).
              pyroscope.write "pyroscope" {
                endpoint {
                  url = "http://pyroscope.observability.svc.cluster.local:4040"
                }
              }

              pyroscope.scrape "pprof" {
                targets = [
                  {"__address__" = "pyroscope.observability.svc.cluster.local:4040", "service_name" = "pyroscope"},
                  {"__address__" = "mimir.observability.svc.cluster.local:9009", "service_name" = "mimir"},
                  {"__address__" = "loki.observability.svc.cluster.local:3100", "service_name" = "loki"},
                  {"__address__" = "tempo.observability.svc.cluster.local:3200", "service_name" = "tempo"},
                ]
                forward_to = [pyroscope.write.pyroscope.receiver]
              }

              // ---- node-exporter (host metrics) -> Mimir ----
              discovery.relabel "node_exporter" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  regex         = "prometheus-node-exporter"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "instance"
                }
              }
              prometheus.scrape "node_exporter" {
                targets         = discovery.relabel.node_exporter.output
                job_name        = "node-exporter"
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- kubelet + cAdvisor (container/pod metrics) -> Mimir ----
              // node role -> kubelet at <nodeIP>:10250; auth via SA token
              // (RBAC nodes/metrics), kubelet serving cert is self-signed.
              discovery.kubernetes "nodes" {
                role = "node"
              }
              prometheus.scrape "kubelet" {
                targets           = discovery.kubernetes.nodes.targets
                job_name          = "kubelet"
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to        = [prometheus.remote_write.mimir.receiver]
                scrape_interval   = "30s"
              }
              discovery.relabel "cadvisor" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  target_label = "__metrics_path__"
                  replacement  = "/metrics/cadvisor"
                }
              }
              prometheus.scrape "cadvisor" {
                targets           = discovery.relabel.cadvisor.output
                job_name          = "cadvisor"
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to        = [prometheus.remote_write.mimir.receiver]
                scrape_interval   = "30s"
              }

              // ---- LGTMP component self-metrics -> Mimir ----
              prometheus.scrape "lgtmp" {
                targets = [
                  {"__address__" = "mimir.observability.svc.cluster.local:9009", "job" = "mimir"},
                  {"__address__" = "loki.observability.svc.cluster.local:3100", "job" = "loki"},
                  {"__address__" = "tempo.observability.svc.cluster.local:3200", "job" = "tempo"},
                  {"__address__" = "pyroscope.observability.svc.cluster.local:4040", "job" = "pyroscope"},
                  {"__address__" = "grafana.observability.svc.cluster.local:80", "job" = "grafana"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- data layer (RabbitMQ + Valkey) -> Mimir ----
              // RabbitMQ exposes the rabbitmq_prometheus plugin on :15692; Valkey is
              // scraped via the redis_exporter co-located container on :9121. Feeds the
              // "Lab — RabbitMQ" and "Lab — Valkey" dashboards with real metrics.
              prometheus.scrape "data" {
                targets = [
                  {"__address__" = "rabbitmq.data.svc.cluster.local:15692", "job" = "rabbitmq"},
                  {"__address__" = "valkey.data.svc.cluster.local:9121", "job" = "valkey"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Envoy Gateway (north-south ingress) -> Mimir ----
              // Controller controller-runtime metrics (:19001/metrics) + data-plane
              // Envoy proxy /stats/prometheus (:19000) via pod label discovery.
              // Feeds the "Lab — Envoy Gateway" dashboard (ADR-0004).
              prometheus.scrape "envoy_gateway_controller" {
                targets = [
                  {"__address__" = "envoy-gateway.envoy-gateway-system.svc.cluster.local:19001", "job" = "envoy-gateway-controller"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              discovery.relabel "envoy_proxy_pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex         = "envoy-gateway-system"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
                  regex         = "proxy"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_ip"]
                  regex         = "(.*)"
                  target_label  = "__address__"
                  replacement   = "$1:19000"
                }
                rule {
                  target_label = "__metrics_path__"
                  replacement  = "/stats/prometheus"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  target_label = "job"
                  replacement  = "envoy-proxy"
                }
              }

              prometheus.scrape "envoy_proxy" {
                targets         = discovery.relabel.envoy_proxy_pods.output
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Garage (S3-compatible object store) admin metrics -> Mimir ----
              // Garage exposes Prometheus metrics at its admin port (:3903/metrics).
              // No authentication is required for the metrics path. Feeds the
              // "Lab — Garage S3" dashboard (ADR-0004, ADR-0002).
              prometheus.scrape "garage" {
                targets = [
                  {"__address__" = "garage.storage.svc.cluster.local:3903", "job" = "garage"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Inkless (diskless Kafka) exporter metrics -> Mimir ----
              // kafka-exporter co-located container in the Inkless StatefulSet exposes Prometheus
              // metrics on :9308; this target is idle unless inkless is manually synced.
              prometheus.scrape "inkless" {
                targets = [
                  {"__address__" = "inkless.inkless.svc.cluster.local:9308", "job" = "inkless"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
