# Grafana Alloy — the collector. Metrics: scrapes kube-state-metrics + ArgoCD,
# remote_writes to Mimir. Logs: tails pod logs (k8s API) and ships to Loki.
# Both multi-tenant (X-Scope-OrgID: lab). Decoupled from storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.11.1
    helm:
      releaseName: alloy
      valuesObject:
        # Pod-level securityContext is set via `global.podSecurityContext`, NOT
        # `controller.podSecurityContext` -- this chart's
        # templates/controllers/_pod.yaml reads `.Values.global.podSecurityContext`
        # for the pod spec; `controller.podSecurityContext` does not exist in
        # its schema at all and was a silent no-op here previously.
        global:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            seccompProfile:
              type: RuntimeDefault
        controller:
          type: deployment
          replicas: 1
          volumes:
            # The alloy chart does NOT create a volume for --storage.path (verified
            # against chart source: templates/controllers/_pod.yaml /
            # templates/containers/_agent.yaml carry no "storage" volume or mount —
            # only config/varlog/dockercontainers/extra). Without this, /tmp/alloy
            # lands on the container's root filesystem, so it must be backed
            # explicitly before readOnlyRootFilesystem can be true. Re-verified
            # unchanged at 1.10.1 (byte-identical volumes block in _pod.yaml vs 1.8.2),
            # and again at 1.11.0 (chart still creates no storage volume; the
            # security-critical global.podSecurityContext / alloy.securityContext /
            # alloy.mounts.extra / alloy.resources keys this Application relies on
            # are unchanged — the 1.10.1 -> 1.11.0 bump only adds an `alloy.command`
            # override key and bumps the bundled Alloy binary to v1.18.0, per the
            # chart's own CHANGELOG.md).
            extra:
              - name: alloy-storage
                emptyDir: {}
        alloy:
          # Found 2026-08-11 (systemic probe-timeout audit): the chart's own
          # readinessProbe.timeoutSeconds default is 1 (verified against the pinned
          # chart's values.yaml, alloy-1.11.1; the value lives at the flat key
          # `alloy.timeoutSeconds`, not nested under a `readinessProbe:` block --
          # confirmed against templates/containers/_agent.yaml) -- the same
          # chart-default-too-tight footgun already found and fixed for Harbor
          # (PR #1040/#1102), ArgoCD (PR #1103/#1121), Kyverno (PR #1115), and others
          # in this same sweep. Alloy has no livenessProbe configured by default (the
          # chart's `alloy.livenessProbe: {}` renders nothing), so only readiness is
          # at risk here. Bumped to 15s, matching the convention used for other
          # heavier always-on data-plane components in this repo (this collector
          # tails every pod's logs and remote-writes metrics -- not a trivial
          # exporter, unlike node-exporter's 5s treatment elsewhere in this sweep).
          timeoutSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          mounts:
            extra:
              - name: alloy-storage
                mountPath: /tmp/alloy
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          configMap:
            content: |
              // ---- metrics -> Mimir ----
              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir.observability.svc.cluster.local:9009/api/v1/push"
                  headers = {
                    "X-Scope-OrgID" = "lab",
                  }
                }
              }

              prometheus.scrape "ksm" {
                targets = [
                  {"__address__" = "kube-state-metrics.observability.svc.cluster.local:8080", "job" = "kube-state-metrics"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              prometheus.scrape "argocd" {
                targets = [
                  // job names follow ArgoCD's official Prometheus convention so the
                  // community dashboard (gnetId 14584) matches the per-component series.
                  {"__address__" = "argocd-application-controller-metrics.argocd.svc.cluster.local:8082", "job" = "argocd-metrics"},
                  {"__address__" = "argocd-server-metrics.argocd.svc.cluster.local:8083", "job" = "argocd-server-metrics"},
                  {"__address__" = "argocd-repo-server-metrics.argocd.svc.cluster.local:8084", "job" = "argocd-repo-server"},
                  {"__address__" = "argocd-applicationset-controller-metrics.argocd.svc.cluster.local:8080", "job" = "argocd-applicationset-controller"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- logs -> Loki (tenant "lab") ----
              loki.write "loki" {
                endpoint {
                  url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
                  headers = {
                    "X-Scope-OrgID" = "lab",
                  }
                }
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.loki.receiver]
              }

              // ---- profiles -> Pyroscope (single-tenant) ----
              // Pull pprof from the Go services (no eBPF, no app changes).
              pyroscope.write "pyroscope" {
                endpoint {
                  url = "http://pyroscope.observability.svc.cluster.local:4040"
                }
              }

              pyroscope.scrape "pprof" {
                targets = [
                  {"__address__" = "pyroscope.observability.svc.cluster.local:4040", "service_name" = "pyroscope"},
                  {"__address__" = "mimir.observability.svc.cluster.local:9009", "service_name" = "mimir"},
                  {"__address__" = "loki.observability.svc.cluster.local:3100", "service_name" = "loki"},
                  {"__address__" = "tempo.observability.svc.cluster.local:3200", "service_name" = "tempo"},
                ]
                forward_to = [pyroscope.write.pyroscope.receiver]
              }

              // ---- node-exporter (host metrics) -> Mimir ----
              discovery.relabel "node_exporter" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  regex         = "prometheus-node-exporter"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "instance"
                }
              }
              prometheus.scrape "node_exporter" {
                targets         = discovery.relabel.node_exporter.output
                job_name        = "node-exporter"
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- kubelet + cAdvisor (container/pod metrics) -> Mimir ----
              // node role -> kubelet at <nodeIP>:10250; auth via SA token
              // (RBAC nodes/metrics), kubelet serving cert is self-signed.
              discovery.kubernetes "nodes" {
                role = "node"
              }
              prometheus.scrape "kubelet" {
                targets           = discovery.kubernetes.nodes.targets
                job_name          = "kubelet"
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to        = [prometheus.remote_write.mimir.receiver]
                scrape_interval   = "30s"
              }
              discovery.relabel "cadvisor" {
                targets = discovery.kubernetes.nodes.targets
                rule {
                  target_label = "__metrics_path__"
                  replacement  = "/metrics/cadvisor"
                }
              }
              prometheus.scrape "cadvisor" {
                targets           = discovery.relabel.cadvisor.output
                job_name          = "cadvisor"
                scheme            = "https"
                bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
                tls_config {
                  insecure_skip_verify = true
                }
                forward_to        = [prometheus.remote_write.mimir.receiver]
                scrape_interval   = "30s"
              }

              // ---- LGTMP component self-metrics -> Mimir ----
              prometheus.scrape "lgtmp" {
                targets = [
                  {"__address__" = "mimir.observability.svc.cluster.local:9009", "job" = "mimir"},
                  {"__address__" = "loki.observability.svc.cluster.local:3100", "job" = "loki"},
                  {"__address__" = "tempo.observability.svc.cluster.local:3200", "job" = "tempo"},
                  {"__address__" = "pyroscope.observability.svc.cluster.local:4040", "job" = "pyroscope"},
                  {"__address__" = "grafana.observability.svc.cluster.local:80", "job" = "grafana"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- data layer (RabbitMQ + Valkey) -> Mimir ----
              // RabbitMQ exposes the rabbitmq_prometheus plugin on :15692; Valkey is
              // scraped via the redis_exporter co-located container on :9121. Feeds the
              // "Lab — RabbitMQ" and "Lab — Valkey" dashboards with real metrics.
              prometheus.scrape "data" {
                targets = [
                  {"__address__" = "rabbitmq.data.svc.cluster.local:15692", "job" = "rabbitmq"},
                  {"__address__" = "valkey.data.svc.cluster.local:9121", "job" = "valkey"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Envoy Gateway (north-south ingress) -> Mimir ----
              // Controller controller-runtime metrics (:19001/metrics) + data-plane
              // Envoy proxy /stats/prometheus (:19000) via pod label discovery.
              // Feeds the "Lab — Envoy Gateway" dashboard (ADR-0004).
              prometheus.scrape "envoy_gateway_controller" {
                targets = [
                  {"__address__" = "envoy-gateway.envoy-gateway-system.svc.cluster.local:19001", "job" = "envoy-gateway-controller"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              discovery.relabel "envoy_proxy_pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex         = "envoy-gateway-system"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
                  regex         = "proxy"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_ip"]
                  regex         = "(.*)"
                  target_label  = "__address__"
                  replacement   = "$1:19000"
                }
                rule {
                  target_label = "__metrics_path__"
                  replacement  = "/stats/prometheus"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  target_label = "job"
                  replacement  = "envoy-proxy"
                }
              }

              prometheus.scrape "envoy_proxy" {
                targets         = discovery.relabel.envoy_proxy_pods.output
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Garage (S3-compatible object store) admin metrics -> Mimir ----
              // Garage exposes Prometheus metrics at its admin port (:3903/metrics).
              // No authentication is required for the metrics path. Feeds the
              // "Lab — Garage S3" dashboard (ADR-0004, ADR-0002).
              prometheus.scrape "garage" {
                targets = [
                  {"__address__" = "garage.storage.svc.cluster.local:3903", "job" = "garage"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Kyverno (admission policy engine) metrics -> Mimir ----
              // Kyverno 3.x splits into four controllers, each exposing Prometheus
              // metrics on :8000 via its own `*-controller-metrics` Service. There is
              // no single kyverno-svc-metrics in 3.x, and kyverno-svc is the admission
              // webhook (443->9443), not metrics. policy-result + admission-review
              // series come from the admission/background controllers; we scrape all
              // four so the "Lab — Kyverno" dashboard reflects real state (ADR-0004,
              // ADR-0019). The metrics NetworkPolicy allow (port 8000, podSelector {})
              // already covers every kyverno pod regardless of Service name.
              prometheus.scrape "kyverno" {
                targets = [
                  {"__address__" = "kyverno-admission-controller-metrics.kyverno.svc.cluster.local:8000", "job" = "kyverno"},
                  {"__address__" = "kyverno-background-controller-metrics.kyverno.svc.cluster.local:8000", "job" = "kyverno"},
                  {"__address__" = "kyverno-cleanup-controller-metrics.kyverno.svc.cluster.local:8000", "job" = "kyverno"},
                  {"__address__" = "kyverno-reports-controller-metrics.kyverno.svc.cluster.local:8000", "job" = "kyverno"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- cert-manager (TLS certificate lifecycle) metrics -> Mimir ----
              // Scrapes the controller Service on :9402/metrics (chart default for
              // all three components — controller, webhook, cainjector — but the
              // controller is the one that emits certmanager_certificate_* series,
              // which is what the "Lab — cert-manager" dashboard reads; ADR-0004,
              // ADR-0028).
              prometheus.scrape "cert_manager" {
                targets = [
                  {"__address__" = "cert-manager.cert-manager.svc.cluster.local:9402", "job" = "cert-manager"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- KEDA (event-driven autoscaling, ADR-0029) -> Mimir ----
              // Scrapes the operator Service (keda-operator.keda.svc:8080) — where
              // keda_scaler_active / keda_scaled_object_paused / keda_scaler_metrics_value
              // are actually emitted (ScaledObject reconciliation happens in the
              // operator, not metricServer or webhooks). Same "just the interesting
              // one" scope as the cert_manager job above.
              prometheus.scrape "keda" {
                targets = [
                  {"__address__" = "keda-operator.keda.svc.cluster.local:8080", "job" = "keda"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Inkless (diskless Kafka) exporter metrics -> Mimir ----
              // kafka-exporter co-located container in the Inkless StatefulSet exposes Prometheus
              // metrics on :9308; this target is idle unless inkless is manually synced.
              prometheus.scrape "inkless" {
                targets = [
                  {"__address__" = "inkless.inkless.svc.cluster.local:9308", "job" = "inkless"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Trivy Operator (supply-chain CVE + SBOM scanner) -> Mimir ----
              // Trivy Operator exposes Prometheus metrics at :8080/metrics; feeds the
              // "Lab — Trivy Operator" dashboard with real trivy_image_vulnerabilities,
              // trivy_sbom_reports_total, and trivy_config_audit_checks_total (ADR-0022,
              // ADR-0004). The NetworkPolicy allow (port 8080, trivy-system ns) is in
              // gitops/trivy-system/networkpolicy/allow-trivy-metrics-from-observability.yaml.
              prometheus.scrape "trivy_operator" {
                targets = [
                  {"__address__" = "trivy-operator.trivy-system.svc.cluster.local:8080", "job" = "trivy-operator"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "60s"
              }

              // ---- Velero (backup/restore controller) metrics -> Mimir ----
              // Velero exposes Prometheus metrics on :8085/metrics; feeds the
              // "Lab — Velero" dashboard with real backup last-successful-timestamp,
              // partial-failure counters, and restore outcomes (ADR-0021, ADR-0004).
              // The NetworkPolicy allow (port 8085) is in
              // gitops/velero/networkpolicy/allow-velero-metrics-from-observability.yaml.
              prometheus.scrape "velero" {
                targets = [
                  {"__address__" = "velero.velero.svc.cluster.local:8085", "job" = "velero"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Argo Rollouts (progressive delivery controller) metrics -> Mimir ----
              // Argo Rollouts exposes controller-runtime metrics on :8090/metrics; feeds
              // the "Lab — Argo Rollouts" dashboard with real reconcile rate, rollout phase
              // distribution, and canary weight series (ADR-0020, ADR-0004). The
              // NetworkPolicy allow (port 8090, ingress from observability) is pre-wired in
              // gitops/argo-rollouts/networkpolicy/allow-argo-rollouts-metrics-from-observability.yaml.
              prometheus.scrape "argo_rollouts" {
                targets = [
                  {"__address__" = "argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090", "job" = "argo-rollouts"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- External Secrets Operator (ESO) metrics -> Mimir ----
              // ESO exposes controller-runtime Prometheus metrics at :8080/metrics by
              // default (no chart valuesObject change needed). Feeds the "Lab — External
              // Secrets" dashboard with real externalsecret_sync_calls_total,
              // externalsecret_sync_calls_duration_seconds series (ADR-0004).
              prometheus.scrape "external_secrets" {
                targets = [
                  {"__address__" = "external-secrets.external-secrets.svc.cluster.local:8080", "job" = "external-secrets"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Vault internal telemetry -> Mimir ----
              // Vault's own built-in Prometheus sink (telemetry stanza + the listener's
              // unauthenticated_metrics_access, both in vault.yaml) exposes real internal
              // metrics at GET /v1/sys/metrics?format=prometheus — distinct from the
              // pod-readiness-only signal the VaultPodNotReady alert rule
              // (observability-grafana.yaml) already reads from KSM. Feeds the "Lab —
              // Vault" dashboard with real vault_core_unsealed, vault_core_active,
              // vault_core_in_flight_requests, vault_expire_num_leases series (verified
              // against hashicorp/vault's own source, not docs prose, ADR-0004).
              // NetworkPolicy allow (port 8200, ingress from observability) is in
              // gitops/vault/networkpolicy/allow-vault-metrics-from-observability.yaml.
              prometheus.scrape "vault" {
                targets = [
                  {"__address__" = "vault.vault.svc.cluster.local:8200", "job" = "vault"},
                ]
                metrics_path    = "/v1/sys/metrics"
                params          = {format = ["prometheus"]}
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Harbor (OCI registry) metrics -> Mimir ----
              // Harbor exposes Prometheus metrics via its built-in exporter when
              // metrics.enabled=true (harbor.yaml). The harbor-metrics Service exposes
              // port 9090 (chart v1.16.x default). This target is idle unless Harbor is
              // manually synced (on-demand, ADR-0024). NetworkPolicy allow (port 9090,
              // ingress from observability) is in
              // gitops/harbor/networkpolicy/allow-harbor-metrics-ingress.yaml.
              prometheus.scrape "harbor" {
                targets = [
                  {"__address__" = "harbor-metrics.harbor.svc.cluster.local:9090", "job" = "harbor"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Alloy self-metrics -> Mimir ----
              // Alloy exposes its own Prometheus metrics at :12345/metrics (the default
              // listenAddr). Feeds the "Lab — Grafana Alloy (Collector)" dashboard with
              // real prometheus_sd_discovered_targets, prometheus_tsdb_head_samples_appended_total,
              // prometheus_remote_storage_sent_bytes_total, and alloy_component_evaluation_seconds
              // series (ADR-0004, ADR-0005 O5 gap). A stable ClusterIP Service is provided
              // by the alloy Helm chart, so the static target is reliable.
              prometheus.scrape "alloy_self" {
                targets = [
                  {"__address__" = "alloy.observability.svc.cluster.local:12345", "job" = "alloy"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Kargo (GitOps promotion pipeline) metrics -> Mimir ----
              // Kargo api, controller, and webhooks-server expose controller-runtime Prometheus
              // metrics at :8080/metrics (chart v1.2.x default). Feeds the
              // "Lab — Kargo (GitOps Promotion)" dashboard with real reconcile-rate, Stage
              // promotion, Freight creation, and Warehouse reconcile series (ADR-0023, ADR-0004).
              // The NetworkPolicy allow (TCP 8080 ingress from observability) is in
              // gitops/kargo/networkpolicy/allow-kargo-metrics-ingress.yaml.
              // This target is idle unless kargo is manually synced via make kargo-up.
              prometheus.scrape "kargo" {
                targets = [
                  {"__address__" = "kargo-api.kargo.svc.cluster.local:8080", "job" = "kargo"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Longhorn (on-demand block storage) metrics -> Mimir ----
              // Longhorn manager exposes Prometheus metrics at :9500/metrics via the
              // longhorn-manager DaemonSet Service. Feeds the "Lab — Longhorn (Block Storage)"
              // dashboard with real volume state, robustness, and capacity series (ADR-0013, ADR-0004).
              // The NetworkPolicy allow (TCP 9500 ingress from observability) is in
              // gitops/longhorn/networkpolicy/allow-longhorn-metrics-ingress.yaml.
              // This target is idle unless longhorn is manually synced via make longhorn-up.
              prometheus.scrape "longhorn" {
                targets = [
                  {"__address__" = "longhorn-manager.longhorn-system.svc.cluster.local:9500", "job" = "longhorn"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Istio ambient mesh control plane (on-demand) metrics -> Mimir ----
              // istiod exposes Prometheus metrics at :15014/metrics via the istiod
              // Service (the standard Istio monitoring port). Feeds the "Lab — Istio
              // Ambient Mesh" dashboard with control-plane push/connection series
              // (ADR-0012, ADR-0004). The NetworkPolicy allow (TCP 15014 ingress from
              // observability) is in
              // gitops/istio-system/networkpolicy/allow-istio-metrics-ingress.yaml.
              // This target is idle unless Istio is manually synced via make istio-up.
              prometheus.scrape "istiod" {
                targets = [
                  {"__address__" = "istiod.istio-system.svc.cluster.local:15014", "job" = "istiod"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- Cilium agent (CNI, kube-system) metrics -> Mimir ----
              // Cilium DaemonSet uses hostNetwork: true; pod IP equals the node IP.
              // Pod discovery filtered by k8s-app=cilium in kube-system; address
              // relabelled to <pod_ip>:9962 (prometheus.port in cilium.yaml valuesObject).
              // Feeds the "Lab — Cilium (CNI)" dashboard (ADR-0014, ADR-0004, RFC #358).
              // NP allow: TCP 9962 ipBlock 0.0.0.0/0 in allow-alloy-egress-external.yaml.
              discovery.relabel "cilium_agent" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  regex         = "kube-system"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_k8s_app"]
                  regex         = "cilium"
                  action        = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_ip"]
                  regex         = "(.*)"
                  target_label  = "__address__"
                  replacement   = "$1:9962"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
              }
              prometheus.scrape "cilium_agent" {
                targets         = discovery.relabel.cilium_agent.output
                job_name        = "cilium-agent"
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- TiDB (distributed SQL database) metrics -> Mimir ----
              // The TiDB Operator creates a <cluster>-tidb Service in namespace tidb that
              // exposes the TiDB status/metrics endpoint at :10080/metrics (tidb_executor_*,
              // tidb_server_connections, etc.). For the lab TidbCluster named "lab", the
              // Service is lab-tidb.tidb.svc.cluster.local. The NetworkPolicy allow
              // (TCP 10080 ingress from observability) is pre-wired in
              // gitops/tidb/networkpolicy/allow-tidb-from-observability.yaml.
              // This target is idle unless make tidb-up is active (on-demand component).
              prometheus.scrape "tidb" {
                targets = [
                  {"__address__" = "lab-tidb.tidb.svc.cluster.local:10080", "job" = "tidb"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
