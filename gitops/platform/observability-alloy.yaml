# Grafana Alloy — the collector. Metrics: scrapes kube-state-metrics + ArgoCD,
# remote_writes to Mimir. Logs: tails pod logs (k8s API) and ships to Loki.
# Both multi-tenant (X-Scope-OrgID: lab). Decoupled from storage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.8.1
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: deployment
          replicas: 1
        alloy:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          configMap:
            content: |
              // ---- metrics -> Mimir ----
              prometheus.remote_write "mimir" {
                endpoint {
                  url = "http://mimir.observability.svc.cluster.local:9009/api/v1/push"
                  headers = {
                    "X-Scope-OrgID" = "lab",
                  }
                }
              }

              prometheus.scrape "ksm" {
                targets = [
                  {"__address__" = "kube-state-metrics.observability.svc.cluster.local:8080", "job" = "kube-state-metrics"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              prometheus.scrape "argocd" {
                targets = [
                  {"__address__" = "argocd-application-controller-metrics.argocd.svc.cluster.local:8082", "job" = "argocd-controller"},
                  {"__address__" = "argocd-server-metrics.argocd.svc.cluster.local:8083", "job" = "argocd-server"},
                  {"__address__" = "argocd-repo-server-metrics.argocd.svc.cluster.local:8084", "job" = "argocd-repo"},
                  {"__address__" = "argocd-applicationset-controller-metrics.argocd.svc.cluster.local:8080", "job" = "argocd-appset"},
                ]
                forward_to      = [prometheus.remote_write.mimir.receiver]
                scrape_interval = "30s"
              }

              // ---- logs -> Loki (tenant "lab") ----
              loki.write "loki" {
                endpoint {
                  url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
                  headers = {
                    "X-Scope-OrgID" = "lab",
                  }
                }
              }

              discovery.kubernetes "pods" {
                role = "pod"
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.loki.receiver]
              }

              // ---- profiles -> Pyroscope (single-tenant) ----
              // Pull pprof from the Go services (no eBPF, no app changes).
              pyroscope.write "pyroscope" {
                endpoint {
                  url = "http://pyroscope.observability.svc.cluster.local:4040"
                }
              }

              pyroscope.scrape "pprof" {
                targets = [
                  {"__address__" = "pyroscope.observability.svc.cluster.local:4040", "service_name" = "pyroscope"},
                  {"__address__" = "mimir.observability.svc.cluster.local:9009", "service_name" = "mimir"},
                  {"__address__" = "loki.observability.svc.cluster.local:3100", "service_name" = "loki"},
                  {"__address__" = "tempo.observability.svc.cluster.local:3200", "service_name" = "tempo"},
                ]
                forward_to = [pyroscope.write.pyroscope.receiver]
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
