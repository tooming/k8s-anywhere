# Prometheus node-exporter — host/node metrics (CPU, mem, disk, net, filesystem)
# for the "Node Exporter Full" community dashboard. DaemonSet on every node;
# Alloy scrapes it (job "node-exporter") -> Mimir. On k3d these are the node
# *containers'* metrics (still useful to see per-node load).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: 4.55.0
    helm:
      releaseName: node-exporter
      valuesObject:
        # Disable host namespaces — PSS restricted prohibits hostPID/hostNetwork.
        # In k3d the "nodes" are Docker containers so host-PID/network visibility
        # adds no meaningful value; container-level metrics are sufficient.
        hostPID: false
        hostNetwork: false
        # Disable hostPath volume for host root FS — PSS restricted prohibits hostPath.
        hostRootFsMount:
          enabled: false
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # run on every node (incl. any tainted control-plane)
        tolerations:
          - operator: Exists
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    # Dedicated PSA-privileged namespace (ADR-0017): node-exporter mounts /proc and
    # /sys via hostPath, forbidden under both restricted AND baseline, so it cannot
    # live in the restricted observability namespace. See gitops/node-exporter/namespace.yaml.
    namespace: node-exporter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
