# Prometheus node-exporter — host/node metrics (CPU, mem, disk, net, filesystem)
# for the "Node Exporter Full" community dashboard. DaemonSet on every node;
# Alloy scrapes it (job "node-exporter") -> Mimir. On k3d these are the node
# *containers'* metrics (still useful to see per-node load).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: 4.56.1
    helm:
      releaseName: node-exporter
      valuesObject:
        # Disable host namespaces — PSS restricted prohibits hostPID/hostNetwork.
        # In k3d the "nodes" are Docker containers so host-PID/network visibility
        # adds no meaningful value; container-level metrics are sufficient.
        hostPID: false
        hostNetwork: false
        # Disable hostPath volume for host root FS — PSS restricted prohibits hostPath.
        hostRootFsMount:
          enabled: false
        # Pod-level securityContext is set via the `securityContext` key, NOT
        # `podSecurityContext` -- this chart's templates/daemonset.yaml reads
        # `.Values.securityContext` for the pod spec; `podSecurityContext`
        # does not exist in its schema and was a silent no-op here previously
        # (found auditing PR #492's chart-values diff). The chart's own
        # `securityContext` default covers runAsNonRoot/runAsUser/runAsGroup
        # but NOT seccompProfile, so that field was likely unenforced until
        # this fix.
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # run on every node (incl. any tainted control-plane)
        tolerations:
          - operator: Exists
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    # Dedicated PSA-privileged namespace (ADR-0017): node-exporter mounts /proc and
    # /sys via hostPath, forbidden under both restricted AND baseline, so it cannot
    # live in the restricted observability namespace. See gitops/node-exporter/namespace.yaml.
    namespace: node-exporter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
