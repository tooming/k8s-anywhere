# TiDB Demo App — nginx workload demonstrating Vault → ExternalSecret → Pod credential injection.
# ON-DEMAND: no automated: block → ArgoCD discovers this Application but will NOT
# auto-deploy it. Bring up with: make tidb-demo-up
# Tear down with:               make tidb-demo-down
# Does not require TiDB cluster to be running, but run `make tidb-up` for a live database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tidb-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/tidb-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: tidb
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
