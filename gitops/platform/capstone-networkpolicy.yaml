# capstone-networkpolicy — default-deny + allowlist NetworkPolicies for the capstone namespace
# (ADR-0016 §4 fan-out; closes the capstone pilot loop). Applies the shared baseline templates
# (default-deny-all, allow-dns-and-apiserver) plus per-workload allow rules for the capstone
# app's three real network flows: ingress from Envoy Gateway and egress to Tempo.
# ALWAYS-ON: automated sync alongside the capstone Application (same namespace).
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction for this overlay.
# Wave 4: after the capstone Application (wave 4) has created the capstone namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/apps/capstone/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
