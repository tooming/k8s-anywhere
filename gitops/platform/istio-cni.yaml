# Istio CNI — node-level plugin for transparent traffic capture in ambient mode.
# Must be deployed before istiod when using the ambient profile. ON-DEMAND: no
# auto-sync block. Bring up with: make istio-up (step 2, after istio-base)
# Tear down with:                  make istio-down (step 3, before istio-base)
#
# Bumped 1.30.3 -> 1.30.4 (upgrade-drafter fallback, 2026-09-01) — see
# gitops/platform/istio-base.yaml's header + ADR-0012's Re-evaluation log for
# the full verification trail (all four Istio charts move in lockstep).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.30.4
    helm:
      releaseName: istio-cni
      valuesObject:
        profile: ambient
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
