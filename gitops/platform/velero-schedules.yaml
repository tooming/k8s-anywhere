# velero-schedules — the four daily Velero Schedules, one per stateful namespace
# (ADR-0021 §"Schedule set", RFC #155, CHARTER Objective O3):
#   data-daily      (data)     02:00 UTC  — RabbitMQ + Valkey PVCs
#   tidb-daily      (tidb)     02:30 UTC  — PD/TiKV/TiDB PVCs (on-demand ns)
#   capstone-daily  (capstone) 03:00 UTC  — end-to-end demo app
#   vault-daily     (vault)    03:30 UTC  — Vault file-backend PVC
#
# Sync-wave 5: after velero-extras (wave 0, namespace) and velero (wave 1, controller
# + the Schedule CRD) are established, so the Schedule CRs validate against a live CRD.
# Plain directory mode (no kustomization.yaml) — ArgoCD applies every YAML file in
# gitops/velero/schedules/ as a standalone manifest (non-recursive, so it does NOT
# collide with velero-extras which targets gitops/velero/ for the namespace alone).
# ALWAYS-ON: automated sync alongside the velero controller (Schedules are cheap CRs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-schedules
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/velero/schedules
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
