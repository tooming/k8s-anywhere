# kube-state-metrics — exposes real cluster object metrics (pod phases,
# deployment replica readiness, etc.) that drive the stack-health view.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: 8.0.0
    helm:
      releaseName: kube-state-metrics
      valuesObject:
        fullnameOverride: kube-state-metrics
        # Pod-level securityContext is set via the `securityContext` key, NOT
        # `podSecurityContext` -- this chart's own values.yaml/templates read
        # `.Values.securityContext` (with an `enabled` flag) for the pod spec;
        # `podSecurityContext` does not exist in its schema at all and was a
        # silent no-op here previously (found auditing PR #491's chart-values
        # diff). `enabled: true` is the chart default already, set explicitly
        # so this override doesn't silently stop applying if that default
        # ever changes.
        securityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
