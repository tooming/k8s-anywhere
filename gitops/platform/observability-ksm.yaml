# kube-state-metrics — exposes real cluster object metrics (pod phases,
# deployment replica readiness, etc.) that drive the stack-health view.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: 8.3.1
    helm:
      releaseName: kube-state-metrics
      valuesObject:
        fullnameOverride: kube-state-metrics
        # Self-monitoring (KSM's own build_info/watch_total metrics, distinct
        # from the kube_* cluster-object metrics KSM exposes on the main
        # :8080 port) is chart-default OFF (`selfMonitor.enabled: false`).
        # With it off the chart's own service.yaml never adds a Service port
        # for the telemetry listener at all -- lab-ksm.json's "KSM Version"
        # (kube_state_metrics_build_info) and "KSM Watch Total by Resource"
        # (kube_state_metrics_watch_total) panels were structurally
        # guaranteed to never show data as a result (found auditing the
        # dashboard's real metric names, same class of bug as PR #1155/#1156).
        # Enabling it opens a real :8081 Service port (paired scrape target
        # in observability-alloy.yaml's "ksm_self" block) so those panels
        # show real, auto-discovered state (ADR-0004) instead of "No data"
        # forever.
        selfMonitor:
          enabled: true
        # Pod-level securityContext is set via the `securityContext` key, NOT
        # `podSecurityContext` -- this chart's own values.yaml/templates read
        # `.Values.securityContext` (with an `enabled` flag) for the pod spec;
        # `podSecurityContext` does not exist in its schema at all and was a
        # silent no-op here previously (found auditing PR #491's chart-values
        # diff). `enabled: true` is the chart default already, set explicitly
        # so this override doesn't silently stop applying if that default
        # ever changes.
        securityContext:
          enabled: true
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
