# ack-networkpolicy — default-deny + allowlist NetworkPolicies for the ack-system namespace
# (ADR-0016 §4 fan-out; ack-system holds the ACK S3 controller that reconciles Bucket CRs
# against the moto AWS mock). Applies the shared baseline templates (default-deny-all,
# allow-dns-and-apiserver) plus the ACK controller's single outbound flow: egress to moto
# on TCP 5000 (the AWS-compatible HTTP API configured via endpoint_url in ack-s3).
# ALWAYS-ON: automated sync alongside the ack-s3 Application (same namespace).
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction for this overlay.
# Wave 4: after ack-s3 (wave 3) has created the ack-system namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ack-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/ack/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: ack-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
