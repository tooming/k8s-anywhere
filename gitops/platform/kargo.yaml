# Kargo promotion-orchestration engine (ADR-0023).
# Helm chart kargo from the OCI registry ghcr.io/akuity/kargo-charts (the old
# https://charts.kargo.io HTTPS index was retired upstream and is now NXDOMAIN).
# Single replica per component (ADR-0005 lab trade-off; production runs HA).
# Plain HTTP inside the cluster (api.tls.enabled: false — see that key's own
# comment below: selfSignedCert: false alone, this file's setting before
# 2026-08-18, does NOT disable TLS and left kargo-api's pod permanently stuck
# in ContainerCreating). TLS terminated at Traefik (ADR-0040, supersedes Envoy Gateway/ADR-0008). Admin
# credentials from Vault via ESO
# (ExternalSecret kargo-admin-credentials, Vault path secret/kargo/admin),
# wired in wholesale via api.secret.name — the chart has no secretKeyRef-style
# field for individual admin-account values.
# kargo-extras (wave 0) pre-creates the kargo namespace with PSA restricted labels
# (ADR-0017) before the Helm release schedules pods. The chart has NO pod-level
# securityContext knob anywhere (only per-component `<x>.securityContext`, which
# templates onto the CONTAINER) — global.securityContext sets that container-level
# floor for every component in one place; add-default-runasnonroot backfills the
# pod-level runAsNonRoot this chart can never set itself (see that policy's comment).
# ON-DEMAND: no auto-sync block → ArgoCD discovers this Application but will NOT
# auto-deploy it. Bring up with: make kargo-up
# Tear down with:               make kargo-down
# Do NOT enable auto-sync here — footprint (~250-450 MiB) requires manual intent
# (ADR-0005, 12 GB VM budget).
#
# Bumped 1.2.3 -> 1.6.4 (RFC #508, 2026-07-18): CVE-2026-24748 (GetConfig/
# RefreshResource unauthenticated access, CVSS 6.9) affects all versions up to
# and including v1.8.6; 1.6.4 is the latest 1.6.x patch, chosen to stay below
# the 1.7.0 floor where two other, unrelated Kargo CVEs found in the same
# sweep begin. CRD/values compatibility verified against the chart's real
# values.yaml and the kargo.akuity.io/v1alpha1 Go API types at both the old
# and new pinned tags (sparse git fetch of akuity/kargo — ghcr.io's OCI
# registry doesn't expose an easy diff): found and fixed api.tls.selfSignedCert
# below (was wrongly nested as selfSignedCert.generate: false; the chart's
# real schema is a plain boolean at both tags) plus two unrelated, longer-
# standing bugs in gitops/kargo-project/project.yaml (Warehouse
# imageSelectionStrategy and the argocd-update kustomize.images nesting) that
# predate this bump but were caught by the same compatibility check.
#
# Bumped 1.6.4 -> 1.10.9 (2026-07-18, same day): a fresh audit of every
# published github.com/akuity/kargo/security/advisories entry against the
# 1.6.4 pin found FOUR advisories affecting it with no 1.6.x-branch fix
# available (the 1.6.x line is EOL upstream): GHSA-xx8h-gw9m-m95p and
# GHSA-f72x-6fm6-94rq (privilege escalation / missing authorization via
# Generic Resource Creation API endpoints, fixed 1.9.10/1.10.9),
# GHSA-wp4p-hr79-q4g8 / CVE-2026-61850 (privilege escalation via Project RBAC
# management, fixed 1.8.14/1.9.9/1.10.8), and GHSA-g7gw-m874-7rmf / CVE-2026-42350
# (open redirect in the UI OIDC login flow, fixed 1.10.2+). The two CVEs the
# 1.6.4 bump deliberately stayed below (CVE-2026-27112/GHSA-7g9x, CVSS 9.4
# critical, affects >=1.7.0 <=1.9.2; CVE-2026-27111/GHSA-5vvm, affects
# 1.9.0-1.9.2) and the original CVE-2026-24748 remain correctly not-applicable
# or already-fixed at any version >= 1.6.4 -- that prior reasoning still holds,
# it was just stale relative to advisories published since (three of the four
# newly-closed ones were disclosed after the 1.6.4 pin was chosen). 1.10.9 is
# the highest stable release and closes every open advisory. CRD/values
# compatibility re-verified the same way as the prior bump: global.securityContext,
# api.{replicas,resources,tls.selfSignedCert,secret} and controller/webhooksServer
# resources are all unchanged in path (only new, unrelated optional fields added
# elsewhere in values.yaml); the Warehouse ImageSubscription type (RepoURL/
# ImageSelectionStrategy/DiscoveryLimit, all json-tag-unchanged) moved from
# warehouse_types.go to a new zz_subscription_types.go file, and the
# argocd-update step's config schema moved from internal/promotion/runner/
# builtin/schemas/ to pkg/promotion/runner/builtin/schemas/ (internal/ was
# restructured into pkg/ across this version range) -- both are pure
# code-reorganization moves, not schema changes: every field this repo sets
# resolves identically at the new pin.
#
# Bumped 1.10.9 -> 1.11.0 (2026-07-25, upgrade-drafter sweep): confirmed via the
# OCI registry's real tag list (ghcr.io/v2/akuity/kargo-charts/kargo/tags/list,
# paginated with n=1000) that 1.11.0 is the newest stable tag above 1.10.9 --
# only pre-1.11.0 -rc.* tags exist beyond it, no newer stable release. Not a
# major bump (1.x line). Schema compatibility verified directly against the
# chart's real values.yaml committed in the source repo at both git tags
# (raw.githubusercontent.com/akuity/kargo/{v1.10.9,v1.11.0}/charts/kargo/values.yaml
# -- the OCI blob CDN itself is proxy-blocked in this sandbox, this is the
# equivalent real source, not fabricated): every path this Application sets
# (global.securityContext, api.{replicas,resources,tls.selfSignedCert,secret},
# controller.{replicas,resources}, webhooksServer.{replicas,resources}) is
# present unchanged at both tags -- the diff is purely additive (new optional
# Dex BYO-OIDC config, revisionHistoryLimit/rollingUpdate knobs, coarse
# workloads/dataPlane install switches all defaulting to the prior behavior)
# plus doc/comment rewording. No CVE is cited in the 1.11.0 release itself;
# this bump is routine version currency, not a security fix.
#
# Bumped 1.11.0 -> 1.11.1 (2026-08-11, #1101): highest stable release, no major
# bump, no pinning ADR flip condition triggered. Verified directly against the
# real OCI registry (ghcr.io/akuity/kargo-charts/kargo) via the registry's own
# tags/list and manifest APIs -- not assumed from the GitHub release page
# alone: tag 1.11.1 exists, manifest annotation
# org.opencontainers.image.created is 2026-08-10T19:57:48Z (real), image.version
# is 1.11.1. Kargo ships app+chart together from one Chart.yaml per release tag
# (no separate chart-only versioning line), so this is a same-tag app+chart
# bump. Upstream changelog (v1.11.1, published 2026-08-10): nine backported
# fixes -- UI (ArgoCD link handling, YAML editor spacing, chart cloning),
# controller (network connection management, git rename detection), server
# (REST API error handling, HTTP request context propagation), response body
# leak prevention. No CVE mentioned. Nothing touches the Digest-strategy
# admission-webhook behavior tests/kargo.bats documents (#633) -- unaffected.
# Release: https://github.com/akuity/kargo/releases/tag/v1.11.1
#
# Bumped 1.11.1 -> 1.11.2 (2026-08-18, upgrade-drafter fallback): highest
# stable release, no major bump. Verified directly (not assumed): the
# packaged chart's GitHub Packages page (github.com/akuity/kargo/pkgs/
# container/kargo-charts%2Fkargo) lists 1.11.2 published ~7h before this
# check, digest sha256:e5347cd11308d7260326cb98a30c5a272941c847b1ba4d3655
# 589dca897430b1 -- a real, already-published chart, not just a git tag.
# Kargo ships app+chart together from one Chart.yaml per release tag, so
# this is a same-tag app+chart bump. Six backport commits into release-1.11
# (github.com/akuity/kargo/compare/v1.11.1...v1.11.2): an SSO post-login
# redirect fix, a GitHub bypass-rule regression fix, a UI promotion-steps
# wizard fix, "fix: dropped origins when aborting queued promotions", and
# "fix(health): Fixes pointless status write for argocd health" -- no CVE
# cited (github.com/akuity/kargo/security/advisories' newest entry is still
# April 2026, already closed at 1.10.2+). values.yaml schema re-verified
# unchanged at both tags for every path this Application sets
# (global.securityContext, api.{replicas,resources,tls.selfSignedCert,secret},
# controller.resources, webhooksServer.{replicas,resources}). The two
# promotion/health fixes are notable given #633's still-open Kargo-
# promotion investigation, but this remote clusterless session cannot
# verify they change that issue's outcome -- noted honestly, not claimed as
# a fix for #633.
# Release: https://github.com/akuity/kargo/releases/tag/v1.11.2
#
# Bumped 1.11.2 -> 1.11.3 (2026-09-01, upgrade-drafter fallback): a real
# authorization-bypass fix, not routine currency. Verified directly (not
# assumed): the packaged chart's GitHub Packages page (github.com/akuity/
# kargo/pkgs/container/kargo-charts%2Fkargo) lists 1.11.3 published ~8h
# before this check, digest sha256:842baea04e91c798f566ed389230d960572b
# c829c3ce30eedb1e9ee8d29ee57f -- a real, already-published chart, not just
# a git tag. Kargo ships app+chart together from one Chart.yaml per release
# tag, so this is a same-tag app+chart bump. Commit log
# (github.com/akuity/kargo/compare/v1.11.2...v1.11.3) shows the headline
# fix: 08a4d08 "fix(server): close cluster-scoped authorization bypass in
# generic resource writes" plus 2aa5fd0 "fix: no authz performed for
# resource refresh" -- a real authz-bypass fix, though not yet assigned a
# GHSA/CVE number (github.com/akuity/kargo/security/advisories' newest
# entry is still April 2026, unchanged -- checked directly, this fix hasn't
# been formally disclosed as an advisory yet). Also includes hardening
# commits: "build: compile the Helm binary ourselves to reduce
# vulnerabilities" and "chore(deps): update dependencies to reduce
# vulnerabilities", plus unrelated UI fixes (AnalysisRun result rendering,
# a Freight-refetch infinite loop). values.yaml schema re-verified at both
# tags for every path this Application sets (global.securityContext,
# api.{replicas,resources,tls.selfSignedCert,secret}, controller.resources,
# webhooksServer.{replicas,resources}) -- all present and unchanged;
# `controller.replicas` in this Application's own valuesObject below has no
# matching chart parameter at either tag (confirmed pre-existing at 1.11.2
# too, not a regression from this bump -- Helm silently ignores unused
# values keys, so this has always been a harmless no-op, not a new schema
# break).
# Release: https://github.com/akuity/kargo/releases/tag/v1.11.3
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.11.3
    helm:
      releaseName: kargo
      valuesObject:
        global:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        api:
          replicas: 1
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 64Mi
          tls:
            # Found live 2026-08-18 (#633 verification, first time kargo-api ever
            # actually got observed booting); reconciled from the in-cluster
            # Forgejo remote 2026-09-04 (issue #1345 — only ever landed on
            # Forgejo's main). selfSignedCert: false alone does NOT disable TLS —
            # per the chart's own values.yaml doc comment, enabled: true is the
            # default and "all other settings in this section... are ignored when
            # this is set to false". With only selfSignedCert overridden, the
            # chart skips creating templates/api/cert.yaml's Certificate but the
            # Deployment still mounts a TLS secret because tls.enabled is still
            # true — a secret the chart then expects to be provided externally
            # and never is. Pod hangs forever in ContainerCreating
            # (`MountVolume.SetUp failed ... secret "kargo-api-cert" not found`).
            # enabled: false is the actual "plain HTTP inside the cluster" switch
            # this file's own top comment already claimed to be using.
            enabled: false
            selfSignedCert: false
          secret:
            name: kargo-admin-credentials
        controller:
          replicas: 1
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
        webhooksServer:
          replicas: 1
          resources:
            limits:
              memory: 64Mi
            requests:
              memory: 16Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
