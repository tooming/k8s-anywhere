# Istio base — CRDs and cluster-scoped RBAC resources (Helm chart: istio/base).
# ON-DEMAND: no auto-sync block → ArgoCD discovers this Application but will NOT
# auto-deploy it. Bring up first with: make istio-up
# Tear down last with:                make istio-down
# Do NOT enable auto-sync here — the full Istio ambient footprint (~480 MB) is
# incompatible with running the always-on stack simultaneously (12 GB VM budget,
# ADR-0012). Deploy order: istio-base → istio-cni → istiod → ztunnel.
#
# Bumped 1.30.3 -> 1.30.4 (upgrade-drafter fallback, 2026-09-01, all four
# charts together — base/istio-cni/istiod/ztunnel move in lockstep). See
# ADR-0012's Re-evaluation log for the full verification trail (downloaded
# and diffed the real .tgz release assets from the chart repo for all four
# charts).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.4
    helm:
      releaseName: istio-base
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
