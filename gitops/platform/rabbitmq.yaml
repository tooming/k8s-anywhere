# RabbitMQ — always-on message broker (AMQP) with the management UI + the
# rabbitmq_prometheus plugin. ALWAYS-ON: automated sync (like the LGTMP stack),
# so it comes up with `make up`. Single node is the ADR-0005 lab trade-off;
# production uses a clustered RabbitMQ (quorum queues) — see ADR-0009.
# Wave 3: after External Secrets' ClusterSecretStore (wave 2) so rabbitmq-creds resolves.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/data/rabbitmq
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
