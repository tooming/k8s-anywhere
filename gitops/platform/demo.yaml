# First child Application, picked up by the root app-of-apps.
# Proves the full chain works: root -> demo -> actual workloads in the cluster.
# Real platform components (Traefik, Vault, ...) will land here next, alongside this.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/apps/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
