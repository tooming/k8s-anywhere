# LocalStack — local AWS emulator. First use: KMS for Vault auto-unseal. Later:
# S3/IAM/etc. as the target for ACK controllers. PERSISTENCE=1 attempts to keep
# state across restarts (may be Community-limited — we test before relying on it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: localstack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://localstack.github.io/helm-charts
    chart: localstack
    targetRevision: 0.7.0
    helm:
      releaseName: localstack
      valuesObject:
        image:
          tag: "stable"
        # NOTE: PERSISTENCE=1 is LocalStack Pro-only (Community exits with code 55).
        # So Community state is EPHEMERAL — fine for ACK/S3 demos; means a KMS key
        # for Vault auto-unseal would NOT survive a LocalStack restart.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: localstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
