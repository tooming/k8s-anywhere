# cert-manager-networkpolicy — default-deny + allowlist NetworkPolicies for the
# cert-manager namespace (ADR-0016 §4 fan-out; TLS certificate lifecycle manager).
# Applies the shared baseline templates (default-deny-all, allow-dns-and-apiserver)
# plus a per-workload allow rule: kube-apiserver webhook callback on TCP 10250.
# (The Alloy metrics-scrape ingress rule this overlay used to also carry was
# removed 2026-09-06, ADR-0041, observability stack removed with no replacement.)
# ALWAYS-ON: automated sync alongside the cert-manager Application (same namespace).
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction for this overlay.
# Wave 4: after cert-manager (wave 1) and cert-manager-extras (wave 0) have created
# the namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/cert-manager/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
