# Grafana Pyroscope — continuous profiling, the "P" in LGTM**P**. Single-binary
# (replicaCount 1), Garage-backed (bucket `pyroscope`). The S3 client picks up
# creds from AWS_* env (the garage-s3 Secret) since access/secret keys are left
# empty in the config. Producer = Alloy `pyroscope.scrape` of Go /debug/pprof
# endpoints (no eBPF). Viewed via the Grafana Pyroscope datasource + dashboard.
# Single-tenant: the chart exposes no simple multitenancy toggle (the one
# LGTMP component not on tenant `lab`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyroscope
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: pyroscope
    targetRevision: 2.0.3
    helm:
      releaseName: pyroscope
      valuesObject:
        # disable the bundled object-store chart — we use Garage (ADR-0002)
        minio:
          enabled: false
        # the chart also bundles its own Alloy (annotation-based pprof scraper).
        # Disable it: our main Alloy already scrapes pyroscope/mimir/loki/tempo,
        # and two CPU profilers on one target collide ("cpu profiling already in
        # use") + the extra pod wastes RAM.
        alloy:
          enabled: false
        pyroscope:
          replicaCount: 1
          # Pod Security Standards restricted (ADR-0017). Pyroscope image runs as UID 10001.
          # readOnlyRootFilesystem carve-out: Pyroscope writes profile data to PVC-backed
          # storage and temp WAL; tightening to true is a follow-up item.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          persistence:
            enabled: true
            size: 4Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          extraCustomEnvVars:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: secret-access-key
          structuredConfig:
            storage:
              backend: s3
              s3:
                endpoint: "garage.storage.svc.cluster.local:3900"
                bucket_name: "pyroscope"
                region: "garage"
                insecure: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
