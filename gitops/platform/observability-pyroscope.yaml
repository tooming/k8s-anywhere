# Grafana Pyroscope — continuous profiling, the "P" in LGTM**P**. Single-binary
# (replicaCount 1), Garage-backed (bucket `pyroscope`). The S3 client picks up
# creds from AWS_* env (the garage-s3 Secret) since access/secret keys are left
# empty in the config. Producer = Alloy `pyroscope.scrape` of Go /debug/pprof
# endpoints (no eBPF). Viewed via the Grafana Pyroscope datasource + dashboard.
# Single-tenant: the chart exposes no simple multitenancy toggle (the one
# LGTMP component not on tenant `lab`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pyroscope
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: pyroscope
    targetRevision: 2.1.2
    helm:
      releaseName: pyroscope
      valuesObject:
        # disable the bundled object-store chart — we use Garage (ADR-0002)
        minio:
          enabled: false
        # the chart also bundles its own Alloy (annotation-based pprof scraper).
        # Disable it: our main Alloy already scrapes pyroscope/mimir/loki/tempo,
        # and two CPU profilers on one target collide ("cpu profiling already in
        # use") + the extra pod wastes RAM.
        alloy:
          enabled: false
        pyroscope:
          replicaCount: 1
          # Pod Security Standards restricted (ADR-0017). Pyroscope image runs as UID 10001.
          # readOnlyRootFilesystem verified true: checked the pinned chart source
          # (grafana/pyroscope repo, tag pyroscope-2.1.2,
          # operations/pyroscope/helm/pyroscope/templates/deployments-statefulsets.yaml).
          # With this config (v1 disabled, v2 enabled — the chart default — and the
          # single "all" component, i.e. singleBinary mode with metastore folded in),
          # the container mounts the same "data" PVC (persistence below) twice: at
          # /data (no subPath) and at /data-metastore (subPath ".metastore", the
          # chart default) — the metastore raft/db files the process writes always
          # land under one of those two paths, and the S3 backend (Garage, below)
          # holds the actual profile blocks. No other write path exists.
          # Container-level fields live under `securityContext` (the chart's real key,
          # verified against operations/pyroscope/helm/pyroscope/templates/
          # deployments-statefulsets.yaml: `.Values.pyroscope.securityContext` renders
          # the container securityContext block) -- NOT `containerSecurityContext`,
          # which does not exist anywhere in this chart's schema and was silently a
          # no-op (found in a janitor sweep for the same key-mismatch bug class PR
          # #493 fixed for ksm/node-exporter/grafana/alloy; this fifth instance in
          # the observability stack was missed by that PR's scope).
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          persistence:
            enabled: true
            size: 4Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          extraCustomEnvVars:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-s3
                  key: secret-access-key
          structuredConfig:
            storage:
              backend: s3
              s3:
                endpoint: "garage.storage.svc.cluster.local:3900"
                bucket_name: "pyroscope"
                region: "garage"
                insecure: true
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
