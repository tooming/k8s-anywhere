# argo-rollouts-networkpolicy — default-deny + allowlist NetworkPolicies for the
# argo-rollouts namespace (ADR-0016 §4 fan-out; progressive delivery controller).
# Applies the shared baseline templates (default-deny-all, allow-dns-and-apiserver)
# plus a per-workload allow rule: Traefik dashboard access on TCP 3100 (ADR-0040).
# (The Alloy metrics-scrape ingress rule and the Mimir-egress AnalysisTemplate-query
# rule this overlay used to also carry were removed 2026-09-06, ADR-0041,
# observability stack removed with no replacement — Argo Rollouts' canary
# AnalysisTemplate gate went with it.)
# ALWAYS-ON: automated sync alongside the argo-rollouts Application.
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction.
# Wave 4: after argo-rollouts (wave 1) and argo-rollouts-extras (wave 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/argo-rollouts/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
