# Artifactory extras — Envoy HTTPRoute and any supporting in-repo manifests.
# ON-DEMAND: pairs with the artifactory Application. No automated: block.
# Bring up with: make artifactory-up
# Tear down with: make artifactory-down
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artifactory-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/artifactory
  destination:
    server: https://kubernetes.default.svc
    namespace: artifactory
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
