# artifactory-extras — applies the Envoy HTTPRoute for artifactory.127.0.0.1.nip.io and
# pre-creates the artifactory namespace with PSA baseline labels (ADR-0017 §Per-namespace
# profile; RFC #287 architect decision 2026-06-27). Running at sync-wave 0 ensures the
# namespace with baseline labels is in place before `make artifactory-up` admits any
# Artifactory pod (namespace pre-creation is harmless — no pods until artifactory-up).
# PSA profile is `baseline` because JVM initContainers in jfrog/artifactory-oss run as
# root UID 0 for chown; restricted is not viable without upstream chart changes.
# ALWAYS-ON: automated sync so the PSA floor is always present regardless of whether
# Artifactory is currently running (the empty namespace with labels is cheap).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: artifactory-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/artifactory
  destination:
    server: https://kubernetes.default.svc
    namespace: artifactory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
