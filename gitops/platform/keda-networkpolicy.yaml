# keda-networkpolicy — default-deny + allowlist NetworkPolicies for the keda
# namespace (ADR-0016 §4 fan-out; event-driven autoscaling controller).
# Applies the shared baseline templates (default-deny-all, allow-dns-and-apiserver)
# plus per-workload allow rules: kube-apiserver webhook callback on TCP 9443 and
# Alloy metrics scrape from observability on TCP 8080.
# ALWAYS-ON: automated sync alongside the keda Application (same namespace).
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction for this overlay.
# Wave 4: after keda (wave 1) and keda-extras (wave 0) have created the namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/keda/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
