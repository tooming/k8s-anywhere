# keda-networkpolicy — default-deny + allowlist NetworkPolicies for the keda
# namespace (ADR-0016 §4 fan-out; event-driven autoscaling controller).
# Applies the shared baseline templates (default-deny-all, allow-dns-and-apiserver)
# plus a per-workload allow rule: kube-apiserver webhook callback on TCP 9443.
# (The Alloy metrics-scrape ingress rule this overlay used to also carry was
# removed 2026-09-06, ADR-0041, observability stack removed with no replacement.)
# ON-DEMAND (converted 2026-08-25 alongside keda itself — ADR-0029's
# Re-evaluation log, cluster-load reduction): manual sync only, brought
# up/down by `make keda-up`/`make keda-down`.
# The kustomization references templates from ../../network/policies/ — the
# kustomize.buildOptions flag lifts the out-of-tree load restriction for this overlay.
# Wave 6 (moved from wave 4, ADR-0029 §"Scope & exceptions" webhook-TLS follow-up):
# after keda and keda-extras (both now wave 6, alongside lab-gateway-certificate)
# have created the namespace and issued the webhook cert via cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/keda/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  # No automated block: manual sync only (on-demand).
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
