# ACK custom resources (kind: Bucket, etc.). Separate from the controller app so
# it syncs AFTER the controller has registered the s3.services.k8s.aws CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ack-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/ack
  destination:
    server: https://kubernetes.default.svc
    namespace: ack-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
