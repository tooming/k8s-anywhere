# Istio ztunnel — per-node L4 proxy that implements the ambient mesh data plane
# (replaces sidecars with a shared node-level proxy; ADR-0012). ON-DEMAND: no
# auto-sync block. Bring up with: make istio-up (step 4, last; requires istiod).
# Tear down with:                  make istio-down (step 1, first).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: ztunnel
    targetRevision: 1.30.3
    helm:
      releaseName: ztunnel
      valuesObject:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
