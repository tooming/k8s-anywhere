# argocd-extras — patches the argocd namespace with full PSA `restricted`
# enforce/warn/audit labels (RFC #205, ADR-0017 §Staged rollout Phase 2 — the
# Phase 1 warn/audit-only labels were superseded once infra/modules/argocd/values.yaml
# confirmed every ArgoCD component's securityContext is restricted-compliant, PR #493's
# audit). The argocd namespace is Terraform-created (infra/modules/argocd); this
# Application SSAs only the namespace.yaml labels onto it without touching
# Terraform-owned fields. sync-wave 0 so labels land before any ArgoCD component
# reconcile.
# ALWAYS-ON: automated sync alongside the argocd bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
      - LoadRestrictionsNone=true
