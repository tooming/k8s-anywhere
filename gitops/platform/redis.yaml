# Redis — always-on in-cluster cache / key-value store, with a redis_exporter sidecar
# for Prometheus metrics. ALWAYS-ON: automated sync, comes up with `make up`. Single
# replica is the ADR-0005 lab trade-off; production uses Sentinel or Redis Cluster for
# failover/sharding — see ADR-0010. Wave 3: after the ClusterSecretStore (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/data/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
