# Kyverno admission policy engine (ADR-0019, CHARTER Objective O1).
# Helm chart kyverno/kyverno from https://kyverno.github.io/kyverno/.
# Single-replica per controller (ADR-0005 lab trade-off; production uses 3+).
# Memory limits per ADR-0019 §"Footprint controls": admission 256Mi,
# background 128Mi, cleanup 64Mi, reports 128Mi — ~200–300 MB steady-state.
# Ships the engine and CRDs (ClusterPolicy, PolicyReport, …). ClusterPolicies
# land in the kyverno-policies Application (sync-wave 5, separate PR).
# ALWAYS-ON: automated sync; kyverno-extras (wave 0) pre-creates the namespace
# with PSA baseline labels before the Helm release schedules any pods.
#
# Bumped 3.3.4 -> 3.3.9 (upgrade-drafter, 2026-07-18): same-minor patch bump
# (appVersion v1.13.2 -> v1.13.6, same 1.13.x line). Bundles several real CVE
# fixes (kyverno/kyverno CVE-2025-46569, CVE-2025-30204, CVE-2025-22869, and a
# golang-jwt/jwt/v4 CVE — verified via the actual commit range between the
# kyverno-chart-3.3.4 and kyverno-chart-3.3.9 tags), not just a routine bump.
# Re-verified chart 3.3.9's values.yaml still ships the identical restricted-
# compatible securityContext defaults on all four controllers that RFC #483's
# PSA-restricted flip (ADR-0017/ADR-0019) depends on — no regression.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.3.9
    helm:
      releaseName: kyverno
      valuesObject:
        admissionController:
          replicas: 1
          resources:
            limits:
              memory: 256Mi
        backgroundController:
          replicas: 1
          resources:
            limits:
              memory: 128Mi
        cleanupController:
          replicas: 1
          resources:
            limits:
              memory: 64Mi
        reportsController:
          replicas: 1
          resources:
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno's clusterpolicies.kyverno.io / policies.kyverno.io CRDs are ~650 KB
      # each — far over the 262144-byte cap on the kubectl client-side-apply
      # annotation. Without server-side apply, repo-server can't apply them
      # ("metadata.annotations: Too long"), so the policy CRDs never install and the
      # admission controller CrashLoopBackOffs on its CRD sanity check.
      - ServerSideApply=true
