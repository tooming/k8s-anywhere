# Kyverno admission policy engine (ADR-0019, CHARTER Objective O1).
# Helm chart kyverno/kyverno from https://kyverno.github.io/kyverno/.
# Single-replica per controller (ADR-0005 lab trade-off; production uses 3+),
# EXCEPT admissionController (see its own comment below for why).
# Memory limits per ADR-0019 §"Footprint controls": admission 256Mi,
# background 128Mi, cleanup 64Mi, reports 128Mi — ~200–300 MB steady-state.
# Ships the engine and CRDs (ClusterPolicy, PolicyReport, …). ClusterPolicies
# land in the kyverno-policies Application (sync-wave 5, separate PR).
# ALWAYS-ON: automated sync; kyverno-extras (wave 0) pre-creates the namespace
# with PSA baseline labels before the Helm release schedules any pods.
#
# Bumped 3.3.4 -> 3.3.9 (upgrade-drafter, 2026-07-18): same-minor patch bump
# (appVersion v1.13.2 -> v1.13.6, same 1.13.x line). Bundles several real CVE
# fixes (kyverno/kyverno CVE-2025-46569, CVE-2025-30204, CVE-2025-22869, and a
# golang-jwt/jwt/v4 CVE — verified via the actual commit range between the
# kyverno-chart-3.3.4 and kyverno-chart-3.3.9 tags), not just a routine bump.
# Re-verified chart 3.3.9's values.yaml still ships the identical restricted-
# compatible securityContext defaults on all four controllers that RFC #483's
# PSA-restricted flip (ADR-0017/ADR-0019) depends on — no regression.
#
# Bumped 3.3.9 -> 3.8.2 (upgrade-drafter, 2026-07-19): no newer 3.3.x/3.4.x/…
# patch existed within the same minor — 3.8.2 is the newest STABLE chart
# release (appVersion v1.13.6 -> v1.18.2), verified against the chart repo's
# own index (kyverno.github.io/kyverno's backing gh-pages index.yaml), skipping
# the 3.8.2-rc.2 pre-release. Not a chart-major bump (stays on chart major 3).
# Re-verified (values.yaml at tag kyverno-chart-3.8.2) that all four
# controllers keep the same replicas/resources.limits shape this Application's
# valuesObject relies on, and that admissionController's containerSecurityContext
# still ships the identical restricted-compatible defaults (runAsNonRoot: true,
# allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities
# drop: [ALL]) RFC #483's PSA-restricted flip depends on — no regression. The
# `gitops/kyverno/policies/*.yaml` ClusterPolicies (separate Application) all
# use the stable, unaffected `kyverno.io/v1` API — no policy-side change needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.2
    helm:
      releaseName: kyverno
      valuesObject:
        admissionController:
          # 2 replicas, not 1 like every other controller here — deliberate
          # exception to ADR-0005's single-replica pattern, confirmed with the
          # user 2026-07-29. ADR-0005's argument (2 copies on one host add no
          # real HA) covers *host*-level failure; this is a different failure
          # mode. The resourceValidatingWebhookConfiguration is fail-closed
          # (ADR-0019): with 1 replica, that one pod restarting (routine under
          # load — OOM, liveness kick, node hiccup) leaves the webhook with
          # zero endpoints, which blocks *every* delete/create cluster-wide
          # until it comes back — not just Kyverno-related resources. Hit
          # live 2026-07-29: this exact deadlock repeatedly stalled unrelated
          # cluster recovery work (couldn't even force-delete an unrelated
          # stuck pod while the sole admission-controller replica was mid-
          # restart). A second replica on the same node still answers the
          # webhook while the first restarts, closing the gap — genuine
          # resilience, not the SPOF theatre ADR-0005 warns against.
          replicas: 2
          resources:
            limits:
              memory: 256Mi
          # Found live 2026-08-11: the chart's own startupProbe default omits
          # timeoutSeconds entirely, which falls back to Kubernetes' own 1s default —
          # the same chart-default-too-tight footgun already found and fixed this same
          # investigation for Harbor's database/core/registry (PR #1040/#1102) and
          # ArgoCD's repo-server (PR #1103). Observed live: both admissionController
          # replicas' startup probes failing with "connection refused" hundreds of
          # times over 3+ days (kubectl describe pod showed x788 over 3d10h on one
          # replica alone) — the process wasn't dead, the 1s window just isn't enough
          # for this host's actual latency profile. Because this webhook is
          # fail-closed (see the replicas:2 comment above) and kyverno has
          # `syncPolicy.automated.selfHeal: true`, a live-only kubectl patch to the
          # probes gets reverted by the very next reconcile — this must be fixed here,
          # in git, to hold. Liveness/readiness bumped to match the 15s convention
          # already used everywhere else in this repo for the same host-latency
          # reason; startup gets the same treatment since it gates both.
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 9443
              scheme: HTTPS
            failureThreshold: 20
            initialDelaySeconds: 2
            periodSeconds: 6
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 2
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 9443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 6
            successThreshold: 1
        backgroundController:
          replicas: 1
          resources:
            limits:
              memory: 128Mi
        cleanupController:
          replicas: 1
          resources:
            limits:
              memory: 64Mi
        reportsController:
          replicas: 1
          resources:
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno's clusterpolicies.kyverno.io / policies.kyverno.io CRDs are ~650 KB
      # each — far over the 262144-byte cap on the kubectl client-side-apply
      # annotation. Without server-side apply, repo-server can't apply them
      # ("metadata.annotations: Too long"), so the policy CRDs never install and the
      # admission controller CrashLoopBackOffs on its CRD sanity check.
      - ServerSideApply=true
