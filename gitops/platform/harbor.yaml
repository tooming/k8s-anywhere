# Harbor CNCF OCI artifact registry (ADR-0024, supersedes ADR-0011).
# Helm chart goharbor/harbor from https://helm.goharbor.io.
# ON-DEMAND: no auto-sync block → ArgoCD discovers this Application but will NOT
# auto-deploy it. Bring up with: make harbor-up
# Tear down with:               make harbor-down
# Do NOT enable auto-sync here — keep it on-demand (ADR-0024 §"12 GB gate").
#
# Minimal profile (ADR-0024 §"Minimal profile"):
#   - trivy disabled: cluster scanning already handled by Trivy Operator (ADR-0022)
#   - notary disabled: out of scope for first cut (OCI push/pull only)
#   - expose.type=clusterIP + tls.enabled=false: Envoy HTTPRoute fronts ingress (ADR-0008)
#   - persistence.imageChartStorage.type=s3: Garage S3 backend (ADR-0002)
#   - database.type=internal: bundled Postgres acceptable for first cut
#
# ADR-0018 exception — bundled internal redis-photon, not platform Valkey reuse:
# ADR-0024 §"Minimal profile" originally called for pointing at the platform Valkey
# (ADR-0018, `data` ns) "where practical" / "where the chart allows it". Verified
# 2026-07-21: it doesn't. `redis.external.existingSecret` drives the chart's
# `harbor.redis.pwdfromsecret` helper, which calls Helm's `lookup` to bake the
# password into the core/jobservice connection URL at *template* time. ArgoCD only
# ever renders via `helm template` (never `install`/`upgrade`), and `lookup` is
# documented to always return nil outside a live install/upgrade — so this is a hard
# incompatibility with ArgoCD's rendering model, not a config mistake; it fails
# identically on any ArgoCD install. The failure is a manifest-generation crash (nil
# pointer on REDIS_PASSWORD) that leaves the whole Application unsynced, which is why
# `harbor` sat as an empty namespace rather than crashlooping.
#
# Explicit, scoped, user-approved deviation from ADR-0018 (2026-07-21, via #632):
# `redis.type: internal` deploys the chart's bundled `goharbor/redis-photon` pod
# instead. This is Harbor's own private cache instance, not a general re-adoption of
# Redis over Valkey elsewhere in the lab — ADR-0018 (Valkey as *the lab's* cache/KV
# store) is otherwise unaffected. The extra pod's footprint is exactly what the
# §"12 GB gate" measurement below accounts for.
#
# S3 credentials (ADR-0002 — never inline): registry reads REGISTRY_STORAGE_S3_ACCESSKEY
# and REGISTRY_STORAGE_S3_SECRETKEY from harbor-s3-creds Secret (ESO-rendered from
# Vault secret/harbor/s3, seeded by garage-bootstrap.sh). Docker Distribution registry2
# overrides config.yaml s3 values with REGISTRY_* environment variables.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.19.2
    helm:
      releaseName: harbor
      valuesObject:
        expose:
          type: clusterIP
          tls:
            enabled: false
        externalURL: http://harbor.127.0.0.1.nip.io:8000
        # Admin credential from Vault (never inline — ADR-0024 day-0 seam).
        # Scripts/vault-bootstrap.sh seeds secret/harbor/admin; ESO renders
        # harbor-admin-creds (HARBOR_ADMIN_PASSWORD + HARBOR_ADMIN_USER).
        existingSecretAdminPassword: harbor-admin-creds
        existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
        trivy:
          enabled: false
        notary:
          enabled: false
        persistence:
          resourcePolicy: keep
          imageChartStorage:
            type: s3
            s3:
              region: garage
              bucket: harbor-registry
              regionendpoint: http://garage.storage.svc.cluster.local:3900
              encrypt: false
              v4auth: true
              secure: false
              # Credentials injected via REGISTRY_STORAGE_S3_ACCESSKEY /
              # REGISTRY_STORAGE_S3_SECRETKEY env vars from harbor-s3-creds
              # Secret (ESO-rendered from Vault secret/harbor/s3).
              accesskey: ""
              secretkey: ""
        database:
          type: internal
          internal:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            # Found live 2026-08-06: the chart's own default timeoutSeconds: 1 (every
            # Harbor component, not just database) is too tight for this host under any
            # real load — the exec healthcheck (`/docker-healthcheck.sh`) routinely takes
            # longer than 1s here, causing a self-inflicted crashloop-on-every-recreation
            # that has nothing to do with database health. Bumped to 5s (matches the
            # convention already used for argocd's own probes elsewhere in this repo).
            #
            # Bumped again 2026-08-11: even 5s wasn't enough under this session's sustained
            # host latency, and the failure mode here is worse than a simple pod restart —
            # killing the exec'd `/docker-healthcheck.sh` mid-script produced "untracked
            # child process ... exited with exit code 141" (SIGPIPE) in the postgres
            # container's own logs, which postgres's supervisor treats as a fatal crash:
            # "terminating any other active server processes" / full crash-recovery cycle,
            # repeating roughly every minute. That's what was actually root-causing harbor-
            # core's endless "failed to migrate the database" / DNS-lookup-flavored errors
            # this whole investigation — core was reconnecting to a database that kept
            # restarting out from under it, not a DNS or core bug. Verified live: bumping
            # to 15s (matching the convention already used for Kyverno/ArgoCD tonight) let
            # the database run stable for 7+ minutes straight, versus under a minute before.
            livenessProbe:
              timeoutSeconds: 15
              failureThreshold: 6
            readinessProbe:
              timeoutSeconds: 15
              failureThreshold: 6
        # `redis` is the Harbor chart's API key name for its cache dependency. See the
        # ADR-0018 exception note above the Application header: type=internal (bundled
        # redis-photon), not the platform Valkey, because Valkey reuse via
        # existingSecret+lookup() doesn't render under ArgoCD.
        redis:
          type: internal
          internal:
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 200m
                memory: 128Mi
        registry:
          registry:
            # ESO renders harbor-s3-creds Secret from Vault secret/harbor/s3.
            # Docker Distribution registry2 reads REGISTRY_STORAGE_S3_ACCESSKEY and
            # REGISTRY_STORAGE_S3_SECRETKEY to override the empty config.yaml values.
            #
            # Found live 2026-08-11: `extraEnvVarsSecret` (the field that sat here
            # before) is NOT a real field in this chart — checked directly against the
            # chart's own templates (`helm pull goharbor/harbor --version 1.19.2`,
            # `grep -rn extraEnvVarsSecret templates/registry/`): zero matches. The
            # registry Deployment's template only wires `registry.registry.extraEnvVars`
            # (a literal `{name, value}` list, same shape core/jobservice's GOMAXPROCS
            # entries below use) — nothing in this chart version ever reads an
            # `extraEnvVarsSecret` key, so it was silently ignored by Helm the entire
            # time this line existed. That silent no-op is the actual, full root cause
            # of #631's push failures: `kubectl exec ... env | grep REGISTRY_STORAGE_S3`
            # on the live registry pod confirmed those two vars were never present, and
            # the registry's own logs showed `s3aws: NoCredentialProviders: no valid
            # providers in chain` on every push attempt. Fixed by using `valueFrom.
            # secretKeyRef` against the same harbor-s3-creds Secret instead — the actual
            # supported mechanism for injecting Secret-sourced env vars in this chart.
            extraEnvVars:
              - name: REGISTRY_STORAGE_S3_ACCESSKEY
                valueFrom:
                  secretKeyRef:
                    name: harbor-s3-creds
                    key: REGISTRY_STORAGE_S3_ACCESSKEY
              - name: REGISTRY_STORAGE_S3_SECRETKEY
                valueFrom:
                  secretKeyRef:
                    name: harbor-s3-creds
                    key: REGISTRY_STORAGE_S3_SECRETKEY
            # See database.internal's probe comment above — same host-timeout fix.
            livenessProbe:
              timeoutSeconds: 5
            readinessProbe:
              timeoutSeconds: 5
          # Found live 2026-08-12 (#631): a real `docker push` of the capstone image
          # OOMKilled this container mid-blob-upload (`lastState.terminated.reason:
          # OOMKilled, exitCode: 137`, timestamp exact match against the CI job's
          # failed HEAD request). registry2's S3 storage driver buffers upload chunks
          # in memory before flushing to Garage; 512Mi was sized for idle/health-check
          # traffic, not a real push. 512Mi -> 1Gi (request 128Mi -> 256Mi
          # proportionally) — verified live: a subsequent push completed without a
          # repeat OOMKill.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          controller:
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
            livenessProbe:
              timeoutSeconds: 5
            readinessProbe:
              timeoutSeconds: 5
        core:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # See database.internal's probe comment above — same host-timeout fix.
          startupProbe:
            timeoutSeconds: 5
          livenessProbe:
            timeoutSeconds: 5
          readinessProbe:
            timeoutSeconds: 5
          # GOMAXPROCS=1 — this host is Apple Silicon (arm64); goharbor/harbor-core
          # publishes amd64-only images, so every core/jobservice process runs under
          # QEMU user-mode x86_64 emulation the whole time it's up (confirmed live:
          # `kubectl exec ... uname -m` reports x86_64 from inside the container on
          # this arm64 node). QEMU's binary translation has known correctness gaps
          # around the atomic/memory-ordering operations Go's runtime and GC rely on
          # for true multi-core concurrency — under real parallelism (GOMAXPROCS>1,
          # the default = visible host cores) this surfaced as genuine memory-safety
          # crashes: `panic: concurrent map writes` and separately `panic: runtime
          # error: growslice: len out of range`, non-deterministic and different each
          # crash (the classic signature of an emulation-induced data race, not an
          # application bug) — core/jobservice crashlooped indefinitely (hundreds of
          # restarts across sessions) while every other Harbor component (nginx,
          # portal, redis, registry, database — also x86_64-emulated, but far less
          # concurrent) stayed stable. GOMAXPROCS=1 forces the Go scheduler onto a
          # single OS thread, eliminating true parallelism and therefore the race
          # window, at the cost of some throughput this lab doesn't need. Verified
          # live 2026-08-10: core and jobservice both went from perpetual
          # CrashLoopBackOff to stable 1/1 within seconds of setting this.
          #
          # Found live 2026-08-11: GOMAXPROCS=1 reduces but does NOT eliminate this
          # crash class — core kept hitting `fatal error: fault` / `SIGSEGV` deep in
          # `encoding/gob` while decoding the embedded go-openapi/spec Swagger blob at
          # startup (main.main -> RegisterRoutes -> gob.Decode), same fault address
          # every crash. That's still single-threaded work, so it isn't a data race
          # between goroutines — it's Go's *asynchronous preemption* signal (sent to a
          # goroutine mid-instruction to force a scheduling point) landing while QEMU's
          # user-mode x86_64 emulation is mid-translation, corrupting in-flight
          # register/memory state well enough to produce a garbage pointer (decoded
          # fault address 0x636f446c616e72 is literal ASCII "rnalDoc" — a fragment of a
          # struct field name from the spec being decoded, not a real address: a
          # classic sign of a string header's data pointer getting overwritten with the
          # string's own bytes). GODEBUG=asyncpreemptoff=1 disables the Go runtime's
          # signal-based async preemption entirely, removing the exact mechanism this
          # QEMU version mishandles. Verified live: core went stable after setting
          # this, no repeat of the gob-decode fault.
          extraEnvVars:
            - name: GOMAXPROCS
              value: "1"
            - name: GODEBUG
              value: "asyncpreemptoff=1"
        jobservice:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            timeoutSeconds: 5
          readinessProbe:
            timeoutSeconds: 5
          # GOMAXPROCS=1 — see core's identical comment above (same emulated-host
          # root cause, same fix, same live verification).
          extraEnvVars:
            - name: GOMAXPROCS
              value: "1"
        portal:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            timeoutSeconds: 5
          readinessProbe:
            timeoutSeconds: 5
        metrics:
          enabled: true
        exporter:
          # See database.internal's probe comment above — same host-timeout fix.
          livenessProbe:
            timeoutSeconds: 5
          readinessProbe:
            timeoutSeconds: 5
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
