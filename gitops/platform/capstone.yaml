# Capstone app — auto-synced ArgoCD Application deploying the image built by the
# GitLab CI pipeline (step 2 of the capstone demo). The workload is light (HotROD),
# so auto-sync is safe (unlike the heavy on-demand components).
# Wave 4: after ESO (wave 1) + secrets config including the capstone namespace + the
# artifactory-registry ExternalSecret (wave 2) + data-layer (wave 3), so the
# imagePullSecret is available when the pod is scheduled.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/apps/capstone
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
