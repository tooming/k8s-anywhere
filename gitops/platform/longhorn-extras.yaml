# Longhorn extras — Envoy HTTPRoute and any supporting in-repo manifests.
# ON-DEMAND: pairs with the longhorn Application. No auto-sync block.
# Bring up with: make longhorn-up
# Tear down with: make longhorn-down
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
