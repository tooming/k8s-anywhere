# The shared lab TLS termination (Traefik TLSStore, ADR-0040 — supersedes the
# GatewayClass/Gateway this used to hold under Envoy Gateway/ADR-0008) plus the
# ArgoCD IngressRoute. No CRD-install ordering dependency any more: Traefik and
# its CRDs (traefik.io/v1alpha1) ship as part of k3s itself, installed at cluster
# boot rather than by an ArgoCD-synced Application — sync-wave 1 is kept only for
# parity with this Application's own retry/creation-order history, not a real
# dependency. retry covers any race.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/network
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
