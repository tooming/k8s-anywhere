# Loki — multi-tenant log store (single-binary), backed by Garage S3 (loki bucket).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
    targetRevision: main
    path: gitops/observability/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
