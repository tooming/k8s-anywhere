# lab-gateway-networkpolicy — default-deny + allowlist NetworkPolicies for the
# lab-gateway namespace (ADR-0016 §4 fan-out; the Gateway listener namespace).
# Applies only the shared baseline templates (default-deny-all, allow-dns-and-apiserver).
# No per-workload allow rules are needed: the namespace holds only the Gateway CR today
# (no pods). Envoy proxy pods live in envoy-gateway-system and are covered separately.
# ALWAYS-ON: automated sync alongside the lab-gateway Application (same namespace).
# The kustomization references templates from the sibling policies/ directory within
# gitops/network/ — the kustomize.buildOptions flag lifts the out-of-tree load
# restriction for this overlay.
# Wave 4: after lab-gateway (wave 1) has created the lab-gateway namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-gateway-networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/network/networkpolicy
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
