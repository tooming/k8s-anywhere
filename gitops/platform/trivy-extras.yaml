# trivy-extras — applies the trivy-system namespace.yaml (PSA baseline labels,
# ADR-0017) before the Trivy Operator Helm Application (sync-wave 1) schedules
# pods. Running at wave 0 ensures the namespace's enforce/warn/audit labels are
# in place before ArgoCD deploys the Helm release (mirrors kyverno-extras pattern).
# ALWAYS-ON: automated sync alongside trivy-operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-extras
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/trivy-system
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
