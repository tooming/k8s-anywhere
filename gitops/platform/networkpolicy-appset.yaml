# networkpolicy-appset — ADR-0016 §4 fan-out as an ApplicationSet.
# Replaces the 9 standalone *-networkpolicy Application manifests with a single
# List-generator ApplicationSet, making the per-namespace NetworkPolicy fan-out
# visible in the ArgoCD ApplicationSet UI (list page + tree-view + slide-out).
# Wave 3: ApplicationSet object is planted before the generated Applications at wave 4.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - list:
        elements:
          # ack-networkpolicy REMOVED 2026-09-07 (ADR-0038): ACK (S3) was dropped
          # from the lab entirely, no replacement.
          - appName: argocd-networkpolicy
            gitPath: gitops/argocd/networkpolicy
            destNamespace: argocd
          # capstone-networkpolicy REMOVED 2026-09-07: capstone was dropped from
          # the lab entirely, no replacement, alongside Harbor/Kargo/Argo Rollouts/
          # Kyverno.
          # data-networkpolicy REMOVED 2026-09-06 (RabbitMQ/ADR-0009, Valkey/
          # ADR-0018): the data namespace no longer exists — it held nothing else.
          - appName: external-secrets-networkpolicy
            gitPath: gitops/external-secrets/networkpolicy
            destNamespace: external-secrets
          - appName: lab-gateway-networkpolicy
            gitPath: gitops/network/networkpolicy
            destNamespace: lab-gateway
          # moto-networkpolicy REMOVED 2026-09-07 (ADR-0038): moto was dropped from
          # the lab entirely, no replacement — ACK-S3 (its only client) and KRO
          # (which orchestrated ACK on top of it) are also gone.
          # observability-networkpolicy REMOVED 2026-09-06 (ADR-0041): the
          # observability namespace no longer exists — Grafana/Mimir/Loki/
          # Tempo/Pyroscope/Alloy removed entirely, no replacement.
          # storage-networkpolicy REMOVED 2026-09-07 (ADR-0002/ADR-0007/ADR-0039): the
          # storage namespace no longer exists — Garage, s3manager, and the off-cluster
          # tfstate Garage were all removed entirely, no replacement.
          # kro-networkpolicy REMOVED 2026-09-07 (ADR-0038): KRO was dropped from
          # the lab entirely — its only ResourceGraphDefinition claimed an ACK
          # Bucket, so it became dead weight the moment ACK/moto were removed, no
          # replacement.
          - appName: lab-demo-networkpolicy
            gitPath: gitops/apps/demo/networkpolicy
            destNamespace: lab-demo
          - appName: vault-networkpolicy
            gitPath: gitops/vault/networkpolicy
            destNamespace: vault
          # harbor-networkpolicy REMOVED 2026-09-07 (ADR-0024): Harbor was dropped
          # from the lab entirely, no replacement — the harbor namespace no longer
          # exists, same dead-config shape the data-networkpolicy removal above
          # already established.
          # node-exporter-networkpolicy REMOVED 2026-09-06 (ADR-0041): the
          # node-exporter namespace no longer exists — node-exporter existed
          # only as an Alloy scrape target, removed with the rest of the
          # observability stack, no replacement.
  template:
    metadata:
      name: "{{appName}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default
      source:
        repoURL: https://github.com/tooming/k8s-anywhere.git
        targetRevision: main
        path: "{{gitPath}}"
        kustomize:
          buildOptions: "--load-restrictor LoadRestrictionsNone"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{destNamespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
