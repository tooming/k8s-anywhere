# networkpolicy-appset — ADR-0016 §4 fan-out as an ApplicationSet.
# Replaces the 9 standalone *-networkpolicy Application manifests with a single
# List-generator ApplicationSet, making the per-namespace NetworkPolicy fan-out
# visible in the ArgoCD ApplicationSet UI (list page + tree-view + slide-out).
# Wave 3: ApplicationSet object is planted before the generated Applications at wave 4.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: networkpolicy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - list:
        elements:
          - appName: ack-networkpolicy
            gitPath: gitops/ack/networkpolicy
            destNamespace: ack-system
          - appName: argocd-networkpolicy
            gitPath: gitops/argocd/networkpolicy
            destNamespace: argocd
          - appName: capstone-networkpolicy
            gitPath: gitops/apps/capstone/networkpolicy
            destNamespace: capstone
          # data-networkpolicy REMOVED 2026-09-06 (RabbitMQ/ADR-0009, Valkey/
          # ADR-0018): the data namespace no longer exists — it held nothing else.
          - appName: external-secrets-networkpolicy
            gitPath: gitops/external-secrets/networkpolicy
            destNamespace: external-secrets
          - appName: lab-gateway-networkpolicy
            gitPath: gitops/network/networkpolicy
            destNamespace: lab-gateway
          - appName: moto-networkpolicy
            gitPath: gitops/moto/networkpolicy
            destNamespace: moto
          # observability-networkpolicy REMOVED 2026-09-06 (ADR-0041): the
          # observability namespace no longer exists — Grafana/Mimir/Loki/
          # Tempo/Pyroscope/Alloy removed entirely, no replacement.
          - appName: storage-networkpolicy
            gitPath: gitops/storage/networkpolicy
            destNamespace: storage
          - appName: kro-networkpolicy
            gitPath: gitops/kro/networkpolicy
            destNamespace: kro
          - appName: lab-demo-networkpolicy
            gitPath: gitops/apps/demo/networkpolicy
            destNamespace: lab-demo
          - appName: vault-networkpolicy
            gitPath: gitops/vault/networkpolicy
            destNamespace: vault
          - appName: harbor-networkpolicy
            gitPath: gitops/harbor/networkpolicy
            destNamespace: harbor
          # node-exporter-networkpolicy REMOVED 2026-09-06 (ADR-0041): the
          # node-exporter namespace no longer exists — node-exporter existed
          # only as an Alloy scrape target, removed with the rest of the
          # observability stack, no replacement.
  template:
    metadata:
      name: "{{appName}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default
      source:
        repoURL: ssh://git@host.k3d.internal:2223/lab/k8s-lab.git
        targetRevision: main
        path: "{{gitPath}}"
        kustomize:
          buildOptions: "--load-restrictor LoadRestrictionsNone"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{destNamespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
