# Envoy Gateway control plane (installs Gateway API CRDs + the controller).
# Helm chart pulled from its OCI registry. ServerSideApply avoids the
# client-side-apply size limit on the large Gateway API CRDs.
#
# leaderElection.disable — chronic-bug fix (observed repeatedly, most recently
# 17+ restarts in ~2h during the #631/#633 investigation on 2026-08-07):
# controller-runtime's default manager enables Kubernetes leader election even
# at deployment.replicas: 1 (ADR-0008's single-replica choice, ADR-0005). On
# this lab's single Colima VM host, a routine apiserver latency spike (see
# docs' on-demand-budget-incident and blue/green-contention notes) is enough
# for the sole pod to fail to renew its own lease within the tight
# controller-runtime defaults (~10s renew deadline / 15s lease duration) —
# `leaderelection.go: error retrieving lease lock` / `leader election lost` —
# which makes manager.Start() return an error and the process os.Exit, killing
# and restarting the only replica. That's a full front-door outage (ALL
# HTTPRoutes 502, not just one) for zero benefit: with exactly one candidate,
# election has nothing to arbitrate. gateway-helm v1.8.3 exposes
# provider.kubernetes.leaderElection.disable (EnvoyGateway API type
# LeaderElection, gateway.envoyproxy.io/v1alpha1) precisely for this — verified
# against the chart's rendered EnvoyGateway config (`helm template`); the
# chart's values.yaml/templates expose no probe-timeout override hook for this
# Deployment (checked: envoy-gateway-deployment.yaml hardcodes
# livenessProbe/readinessProbe with no `.Values` reference), so unlike Harbor's
# probe-timeout fix (PR #1040) there is no values knob to loosen here — moot
# anyway since this fix removes the leader-election failure mode by
# construction rather than by widening a timeout around it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.8.3
    helm:
      releaseName: eg
      valuesObject:
        config:
          envoyGateway:
            provider:
              kubernetes:
                leaderElection:
                  disable: true
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
