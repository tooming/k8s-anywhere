# KEDA event-driven autoscaling controller (ADR-0029, new CHARTER Goal
# "event-driven autoscaling"). Helm chart keda from
# https://kedacore.github.io/charts — chart version tracks app version 1:1 for
# this project (same convention as cert-manager, ADR-0028).
# Single replica per component (ADR-0005 lab trade-off). Memory limits per
# ADR-0029 §"Footprint controls": operator 128Mi, metricServer 128Mi,
# webhooks 64Mi — ~320 MiB combined cap.
# CRDs installed via the chart itself (crds.install: true, the chart's own
# default), not a separate imperative kubectl apply step (ADR-0001).
# Admission webhook TLS is issued by cert-manager's k8s-lab-ca ClusterIssuer
# (ADR-0029 §"Scope & exceptions" follow-up) instead of the chart's built-in
# self-signed generation — verified against the pinned chart's
# templates/manager/deployment.yaml: enabling certManager flips the webhook
# cert Secret volume from optional to required, so this Application must sync
# after k8s-lab-ca exists (cert-manager-root-ca, wave 5) — see wave 6 below.
# ALWAYS-ON: automated sync; keda-extras (wave 6) pre-creates the namespace
# with PSA restricted labels before the Helm release schedules pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.20.2
    helm:
      releaseName: keda
      valuesObject:
        crds:
          install: true
        certificates:
          certManager:
            enabled: true
            issuer:
              generate: false
              name: k8s-lab-ca
              kind: ClusterIssuer
        resources:
          operator:
            limits:
              memory: 128Mi
            requests:
              memory: 100Mi
              cpu: 100m
          metricServer:
            limits:
              memory: 128Mi
            requests:
              memory: 100Mi
              cpu: 100m
          webhooks:
            limits:
              memory: 64Mi
            requests:
              memory: 50Mi
              cpu: 50m
        # Found 2026-08-11 (systemic probe-timeout audit): all three KEDA components'
        # livenessProbe/readinessProbe default to timeoutSeconds: 1 (verified against
        # the pinned chart's values.yaml, keda-2.20.2) -- the same chart-default-too-
        # tight footgun already found and fixed for Harbor (PR #1040/#1102), ArgoCD's
        # repo-server/server (PR #1103/#1121), Kyverno's admissionController (PR
        # #1115), and cert-manager's webhook (this PR). `webhooks` is a fail-closed
        # admission webhook for ScaledObject/ScaledJob CRDs (same risk class as
        # Kyverno's), so a crashloop there can block those CRDs cluster-wide.
        # `operator`/`metricServer` sit on the same probe-timeout-1s footgun even
        # though they're not fail-closed. Bumped all three to 15s, matching the
        # convention already used for other admission-webhook/control-plane
        # components in this repo -- note this is a *separate* top-level key
        # (`operator:`/`metricServer:`/`webhooks:`) from the `resources.operator`/
        # `resources.metricServer`/`resources.webhooks` blocks above; the chart
        # nests resources under one shared key but probes under each component's
        # own top-level key.
        operator:
          livenessProbe:
            timeoutSeconds: 15
          readinessProbe:
            timeoutSeconds: 15
        metricsServer:
          livenessProbe:
            timeoutSeconds: 15
          readinessProbe:
            timeoutSeconds: 15
        webhooks:
          livenessProbe:
            timeoutSeconds: 15
          readinessProbe:
            timeoutSeconds: 15
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # KEDA's crd-scaledjobs.yaml is ~634 KB — over the 262144-byte kubectl
      # client-side-apply annotation cap. Without server-side apply, repo-server
      # can't apply it ("metadata.annotations: Too long"), matching the exact
      # failure class ADR-0019 hit for Kyverno's CRDs and ADR-0028 hit for
      # cert-manager's.
      - ServerSideApply=true
