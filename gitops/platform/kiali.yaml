# Kiali — service mesh observability UI for Istio ambient (ADR-0012).
# ON-DEMAND: no auto-sync block. Requires make istio-up first.
# Bring up with: make kiali-up   (or make mesh-up for Istio + Kiali together)
# Tear down with: make kiali-down
#
# Bumped 2.30.0 -> 2.31.0 (upgrade-drafter fallback, 2026-09-01): real CVE
# fixes, not just currency. `git log v2.30.0..v2.31.0` on the kiali/kiali app
# repo (47 commits) names 5 CVE-driven dependency bumps: axios/undici/
# immutable, OpenTelemetry-Go (CVE-2026-41178), browserslist (CVE-2026-73089/
# CVE-2026-73088), golang.org/x/text (CVE-2026-56852), brace-expansion/
# ip-address/postcss. Also real Istio-validation false-positive fixes
# (KIA0105, KIA0102, KIA1313, P0/P1 checks). The `kiali-server` chart
# directory itself is byte-for-byte unchanged between the two tags (`git
# diff v2.30.0 v2.31.0 -- kiali-server/` on kiali/helm-charts is empty) --
# chart/appVersion strings are injected at release-packaging time, not
# committed to git (Chart.yaml/values.yaml's `${HELM_IMAGE_TAG}` placeholder
# is real in-tree at every tag) -- so no schema risk regardless: this lab's
# valuesObject (auth.strategy, external_services.*, deployment.resources)
# doesn't touch deployment.image_version either.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: 2.31.0
    helm:
      releaseName: kiali
      valuesObject:
        auth:
          strategy: anonymous
        external_services:
          prometheus:
            url: "http://mimir.observability.svc.cluster.local:9009/prometheus"
            custom_headers:
              X-Scope-OrgID: "lab"
          tracing:
            enabled: false
        deployment:
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
