# governance-appset — RFC #293 §"Platform Governance appset".
# A single List-generator ApplicationSet that fans out per-namespace governance
# objects (LimitRange defaults today; room for ResourceQuota / PriorityClass later)
# from gitops/governance/<namespace>/ leaf overlays. Mirrors the networkpolicy-appset
# pattern so the governance fan-out is visible in the ArgoCD ApplicationSet UI.
# Kyverno ClusterPolicies are NOT moved here — they stay in gitops/kyverno/policies/.
# Wave 3: the ApplicationSet object is planted before the generated Applications at wave 4.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: governance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - list:
        elements:
          # standard tier (RFC #294 mapping table)
          - appName: argocd-governance
            gitPath: gitops/governance/argocd
            destNamespace: argocd
          # capstone-governance REMOVED 2026-09-07 (capstone dropped from the lab
          # entirely, no replacement, alongside Harbor/Kargo/Argo Rollouts/Kyverno).
          # kyverno-governance REMOVED 2026-09-07 (ADR-0019): Kyverno was dropped
          # from the lab entirely, no replacement.
          - appName: external-secrets-governance
            gitPath: gitops/governance/external-secrets
            destNamespace: external-secrets
          # velero-governance REMOVED 2026-09-07 (ADR-0021): Velero was dropped
          # from the lab entirely, no replacement (its S3 backend, Garage, was
          # already removed the same day).
          # argo-rollouts-governance REMOVED 2026-09-07 (ADR-0020): Argo Rollouts
          # was dropped from the lab entirely, no replacement — capstone was its
          # only consumer and is also gone.
          # trivy-system-governance REMOVED 2026-09-07 (ADR-0022): Trivy Operator
          # was dropped from the lab entirely, no replacement.
          # moto-governance REMOVED 2026-09-07 (ADR-0038): moto was dropped from
          # the lab entirely, no replacement — ACK-S3 (its only client) and KRO
          # (which orchestrated ACK on top of it) are also gone.
          # ack-system-governance REMOVED 2026-09-07 (ADR-0038): ACK (S3) was
          # dropped from the lab entirely, no replacement.
          # kro-governance REMOVED 2026-09-07 (ADR-0038): KRO was dropped from the
          # lab entirely — its only ResourceGraphDefinition claimed an ACK Bucket,
          # so it became dead weight the moment ACK/moto were removed, no
          # replacement.
          # kargo-governance REMOVED 2026-09-07 (ADR-0023): Kargo was dropped from
          # the lab entirely, no replacement — capstone (its only pipeline target)
          # and Harbor (its only image source) are also gone.
          - appName: lab-demo-governance
            gitPath: gitops/governance/lab-demo
            destNamespace: lab-demo
          # data-governance REMOVED 2026-09-06 (RabbitMQ/ADR-0009, Valkey/ADR-0018):
          # the data namespace no longer exists — it held nothing else.
          # storage-governance REMOVED 2026-09-07 (ADR-0002/ADR-0007/ADR-0039): the
          # storage namespace held only Garage and s3manager, both removed the
          # same day with no replacement — this was the last leaf keeping the
          # now-empty namespace's governance leaf alive.
          - appName: vault-governance
            gitPath: gitops/governance/vault
            destNamespace: vault
          - appName: lab-gateway-governance
            gitPath: gitops/governance/lab-gateway
            destNamespace: lab-gateway
          # harbor-governance REMOVED 2026-09-07 (ADR-0024): Harbor was dropped from
          # the lab entirely, no replacement — same dead-config shape the
          # data-governance removal above already established.
          # envoy-gateway-system-governance REMOVED 2026-09-06 (ADR-0040, supersedes
          # Envoy Gateway/ADR-0008): the envoy-gateway-system namespace no longer
          # exists — Traefik replaced it and ships with k3s, no ArgoCD-managed
          # namespace of its own.
          # node-exporter-governance REMOVED 2026-09-06 (ADR-0041, observability
          # stack removed with no replacement): node-exporter existed only as an
          # Alloy scrape target and had no independent role once Alloy was gone.
          - appName: cert-manager-governance
            gitPath: gitops/governance/cert-manager
            destNamespace: cert-manager
          # keda-governance REMOVED 2026-08-25: KEDA (engine + namespace, via
          # keda-extras) converted to fully on-demand for cluster-load reduction
          # (ADR-0029's Re-evaluation log) — unlike harbor/kargo, KEDA's own
          # namespace-creating Application went on-demand too, so this entry's
          # `CreateNamespace=true` would recreate an otherwise-empty `keda`
          # namespace (just a LimitRange, no workload) on every reconciliation,
          # working against the "fully on-demand, zero footprint" intent of that
          # conversion. Mirrors the kiali-governance removal precedent below
          # (istio-system excluded as an on-demand-heavy namespace too variable
          # for static defaults) — re-add only if keda's namespace becomes
          # always-on again.
          # capstone-pipeline-governance REMOVED 2026-09-07: capstone (and its
          # Kargo pipeline) were dropped from the lab entirely, no replacement.
          # observability-governance (heavy tier, RFC #294 mapping table) REMOVED
          # 2026-09-06 (ADR-0041): the observability namespace no longer exists —
          # the entire observability stack was removed with no replacement.
  template:
    metadata:
      name: "{{appName}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default
      source:
        repoURL: https://github.com/tooming/k8s-anywhere.git
        targetRevision: main
        path: "{{gitPath}}"
        kustomize:
          buildOptions: "--load-restrictor LoadRestrictionsNone"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{destNamespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
