# governance-appset — RFC #293 §"Platform Governance appset".
# A single List-generator ApplicationSet that fans out per-namespace governance
# objects (LimitRange defaults today; room for ResourceQuota / PriorityClass later)
# from gitops/governance/<namespace>/ leaf overlays. Mirrors the networkpolicy-appset
# pattern so the governance fan-out is visible in the ArgoCD ApplicationSet UI.
# Kyverno ClusterPolicies are NOT moved here — they stay in gitops/kyverno/policies/.
# Wave 3: the ApplicationSet object is planted before the generated Applications at wave 4.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: governance
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  generators:
    - list:
        elements:
          # standard tier (RFC #294 mapping table)
          - appName: argocd-governance
            gitPath: gitops/governance/argocd
            destNamespace: argocd
          - appName: capstone-governance
            gitPath: gitops/governance/capstone
            destNamespace: capstone
          - appName: kyverno-governance
            gitPath: gitops/governance/kyverno
            destNamespace: kyverno
          - appName: external-secrets-governance
            gitPath: gitops/governance/external-secrets
            destNamespace: external-secrets
          - appName: velero-governance
            gitPath: gitops/governance/velero
            destNamespace: velero
          - appName: argo-rollouts-governance
            gitPath: gitops/governance/argo-rollouts
            destNamespace: argo-rollouts
          - appName: trivy-system-governance
            gitPath: gitops/governance/trivy-system
            destNamespace: trivy-system
          - appName: moto-governance
            gitPath: gitops/governance/moto
            destNamespace: moto
          - appName: ack-system-governance
            gitPath: gitops/governance/ack-system
            destNamespace: ack-system
          - appName: kro-governance
            gitPath: gitops/governance/kro
            destNamespace: kro
          - appName: kargo-governance
            gitPath: gitops/governance/kargo
            destNamespace: kargo
          - appName: lab-demo-governance
            gitPath: gitops/governance/lab-demo
            destNamespace: lab-demo
          - appName: data-governance
            gitPath: gitops/governance/data
            destNamespace: data
          - appName: storage-governance
            gitPath: gitops/governance/storage
            destNamespace: storage
          - appName: vault-governance
            gitPath: gitops/governance/vault
            destNamespace: vault
          - appName: lab-gateway-governance
            gitPath: gitops/governance/lab-gateway
            destNamespace: lab-gateway
          - appName: kiali-governance
            gitPath: gitops/governance/kiali
            destNamespace: kiali
          - appName: harbor-governance
            gitPath: gitops/governance/harbor
            destNamespace: harbor
          - appName: envoy-gateway-system-governance
            gitPath: gitops/governance/envoy-gateway-system
            destNamespace: envoy-gateway-system
          - appName: node-exporter-governance
            gitPath: gitops/governance/node-exporter
            destNamespace: node-exporter
          - appName: cert-manager-governance
            gitPath: gitops/governance/cert-manager
            destNamespace: cert-manager
          - appName: keda-governance
            gitPath: gitops/governance/keda
            destNamespace: keda
          # heavy tier (RFC #294 mapping table)
          - appName: observability-governance
            gitPath: gitops/governance/observability
            destNamespace: observability
  template:
    metadata:
      name: "{{appName}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: default
      source:
        repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
        targetRevision: main
        path: "{{gitPath}}"
        kustomize:
          buildOptions: "--load-restrictor LoadRestrictionsNone"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{destNamespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
