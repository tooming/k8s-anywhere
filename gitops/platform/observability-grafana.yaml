# Grafana — visualizes the real metrics in Mimir. Routed through Envoy at
# localhost:8080. Lab dashboards sync from GitLab via Grafana native Git Sync (ADR-0006).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    # Chart source migrated from the deprecated grafana.github.io/helm-charts
    # (that repo's "grafana" chart entry carries deprecated: true and stopped
    # receiving updates 2026-01-30) to the actively maintained
    # grafana-community/helm-charts, RFC #544. This is a chart-template/schema
    # bump only — the running Grafana binary stays pinned at image tag 13.0.3
    # below (unified-storage migration bug history, ADR-0006); verified the
    # security-critical valuesObject keys (securityContext,
    # containerSecurityContext, and their pod/container template wiring) are
    # byte-identical between the old (chart 10.5.15) and new (chart 12.7.2)
    # sources before bumping.
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.8.0
    helm:
      releaseName: grafana
      valuesObject:
        # Pin Grafana 13.0.3 — keeps the Pure-Git Git Sync provider from ADR-0006 and
        # avoids the 13.0.0 unified-storage migration bug for Git Sync users. Bumped
        # from 13.0.1 (CVE-2026-9029, CVE-2026-33382, CVE-2026-42127, CVE-2026-42129,
        # CVE-2026-10601, CVE-2026-8609, CVE-2026-8595 — all fixed in 13.0.2; 13.0.3 is
        # the newest 13.0.x patch, RFC #563).
        image:
          tag: "13.0.3"
        # admin login comes from Vault via the grafana-admin ExternalSecret
        # (gitops/secrets/grafana-admin-externalsecret.yaml): no plaintext default,
        # and a non-"admin" password means Grafana stops nagging to change it.
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        # Disable the chart's built-in init-chown-data container (runs as root + CHOWN,
        # violates PSS restricted/ADR-0017). fsGroup: 472 in securityContext is
        # sufficient — Kubernetes chowns the PVC to gid 472 on mount.
        initChownData:
          enabled: false
        # Pod Security Standards restricted (ADR-0017). Grafana image runs as UID 472.
        # readOnlyRootFilesystem verified true: GF_PATHS_DATA (/var/lib/grafana,
        # including the plugins subdir) is the PVC above; the unified-storage search
        # index (/var/lib/grafana-search) is an unconditional chart-managed emptyDir
        # (chart templates/_pod.tpl); GF_PATHS_LOGS (/var/log/grafana) is only
        # MkdirAll'd by Grafana under log.mode "file" (pkg/infra/log/log.go) — our
        # log.mode is "console" only, so it's never written. No other write path
        # exists under this config (checked against grafana chart grafana-12.7.2
        # and grafana/grafana image v13.0.3's docker entrypoint — byte-identical to
        # v13.0.1's packaging/docker/run.sh, re-diffed when bumping to 13.0.3; the
        # 12.7.2 -> 12.7.3 chart bump changed only the chart's default bundled
        # image tag per its release notes, not templates/_pod.tpl, so this
        # analysis still holds unchanged at 12.7.3; the 12.7.3 -> 12.8.0 bump
        # touched only Chart.yaml's version + a testFramework bats image tag,
        # values.yaml/templates/_pod.tpl diffed byte-identical, so this
        # analysis still holds unchanged at 12.8.0).
        #
        # Pod-level securityContext is set via the `securityContext` key, NOT
        # `podSecurityContext` -- this chart's templates/_pod.tpl reads
        # `.Values.securityContext` for the pod spec; `podSecurityContext`
        # does not exist in its schema and was a silent no-op here previously.
        # The runAsNonRoot/runAsUser/runAsGroup/fsGroup fields the comment
        # above depends on were actually being supplied by the chart's own
        # matching default the whole time (verified: chart default
        # securityContext already sets exactly these four fields), so the
        # fsGroup chown behavior described above held regardless -- but
        # seccompProfile was not applied at the pod level under the old key.
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          runAsGroup: 472
          fsGroup: 472
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # persist grafana.db (users + sessions) so restarts don't force re-login
        persistence:
          enabled: true
          size: 2Gi
        deploymentStrategy:
          type: Recreate
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # Grafana's Git Sync client (Go) must trust the mkcert CA on GitLab's HTTPS
        # proxy (ADR-0006). This init container appends that CA — published as the
        # gitlab-tls-ca ConfigMap by scripts/gitlab-tls-bootstrap.sh — to the image's
        # system bundle; SSL_CERT_FILE then points Grafana at the combined bundle, so
        # public CAs still work (grafana.com dashboard downloads) AND our CA is trusted.
        env:
          SSL_CERT_FILE: /etc/ssl-custom/ca-bundle.crt
        extraConfigmapMounts:
          - name: gitlab-tls-ca
            configMap: gitlab-tls-ca
            mountPath: /etc/gitlab-ca
            readOnly: true
            optional: true   # graceful on a fresh cluster before gitlab-tls-bootstrap runs
        extraEmptyDirMounts:
          - name: custom-ca
            mountPath: /etc/ssl-custom
        extraInitContainers:
          - name: ca-bundle
            image: docker.io/grafana/grafana:13.0.3
            securityContext:
              runAsNonRoot: true
              runAsUser: 472
              runAsGroup: 472
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            command:
              - /bin/sh
              - -c
              # always seed the system CAs; append our CA if the (optional) CM is present.
              - "cp /etc/ssl/certs/ca-certificates.crt /etc/ssl-custom/ca-bundle.crt; cat /etc/gitlab-ca/ca.crt >> /etc/ssl-custom/ca-bundle.crt 2>/dev/null || true"
            volumeMounts:
              - name: gitlab-tls-ca
                mountPath: /etc/gitlab-ca
              - name: custom-ca
                mountPath: /etc/ssl-custom
        grafana.ini:
          server:
            root_url: "http://localhost:8080/"
          # Git Sync (native dashboards-as-code → GitLab, ADR-0006). The Repository
          # connection is created out-of-band against Grafana's provisioning apiserver
          # (scripts/grafana-gitsync-bootstrap.sh) — a bootstrap seam, not ArgoCD.
          feature_toggles:
            provisioning: true
            kubernetesDashboards: true
          provisioning:
            # the generic "git" (Pure Git) provider isn't in the default allow-list
            # (github|local), so enable it explicitly (needs the 13.0.x image above).
            repository_types: "git|github|bitbucket|gitlab|local"
          # 13.0.x + kubernetesDashboards keeps dashboards/folders in unified storage;
          # existing legacy-format dashboards must be migrated on first boot, or Grafana
          # refuses to start while provisioning is on. Enable the one-time migration.
          unified_storage.folders.folder.grafana.app:
            enableMigration: true
          unified_storage.dashboards.dashboard.grafana.app:
            enableMigration: true
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                uid: mimir
                type: prometheus
                access: proxy
                url: http://mimir.observability.svc.cluster.local:9009/prometheus
                isDefault: true
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                secureJsonData:
                  httpHeaderValue1: "lab"
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki.observability.svc.cluster.local:3100
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                secureJsonData:
                  httpHeaderValue1: "lab"
              - name: Tempo
                uid: tempo
                type: tempo
                access: proxy
                url: http://tempo.observability.svc.cluster.local:3200
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                secureJsonData:
                  httpHeaderValue1: "lab"
              - name: Pyroscope
                uid: pyroscope
                type: grafana-pyroscope-datasource
                access: proxy
                url: http://pyroscope.observability.svc.cluster.local:4040
        # Community dashboards downloaded by gnetId at startup (needs egress to
        # grafana.com), pointed at the Mimir datasource, in a "Community" folder.
        # editable:true so tweaks stick (our own dashboards stay provisioned).
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: community
                orgId: 1
                folder: Community
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/community
        dashboards:
          community:
            node-exporter-full:
              gnetId: 1860
              revision: 45
              datasource: Mimir
            kubernetes-views-global:
              gnetId: 15757
              revision: 43
              datasource: Mimir
            kubernetes-views-pods:
              gnetId: 15760
              revision: 39
              datasource: Mimir
            kube-state-metrics-v2:
              gnetId: 13332
              revision: 12
              datasource: Mimir
            argocd:
              gnetId: 14584
              revision: 1
              datasource: Mimir
            loki-metrics:
              gnetId: 17781
              revision: 1
              datasource: Mimir
        # No k8s-configmap-watcher: lab dashboards now sync from GitLab via native Git Sync
        # (ADR-0006). The community dashboards above (gnetId) use a separate file
        # provider and are unaffected.
        extraObjects:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: grafana
              namespace: observability
            spec:
              parentRefs:
                - name: eg
                  namespace: lab-gateway
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: grafana
                      port: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
