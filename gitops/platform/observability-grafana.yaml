# Grafana — visualizes the real metrics in Mimir. Routed through Envoy at
# localhost:8080. Dashboards are loaded from labelled ConfigMaps by the sidecar.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.5.15
    helm:
      releaseName: grafana
      valuesObject:
        # admin login comes from Vault via the grafana-admin ExternalSecret
        # (gitops/secrets/grafana-admin-externalsecret.yaml): no plaintext default,
        # and a non-"admin" password means Grafana stops nagging to change it.
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        # persist grafana.db (users + sessions) so restarts don't force re-login
        persistence:
          enabled: true
          size: 2Gi
        deploymentStrategy:
          type: Recreate
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        grafana.ini:
          server:
            root_url: "http://localhost:8080/"
          dashboards:
            # land on the Lab — Stack Health dashboard (file written by the sidecar)
            default_home_dashboard_path: /tmp/dashboards/stack-health.json
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Mimir
                uid: mimir
                type: prometheus
                access: proxy
                url: http://mimir.observability.svc.cluster.local:9009/prometheus
                isDefault: true
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                secureJsonData:
                  httpHeaderValue1: "lab"
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki.observability.svc.cluster.local:3100
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                secureJsonData:
                  httpHeaderValue1: "lab"
              - name: Tempo
                uid: tempo
                type: tempo
                access: proxy
                url: http://tempo.observability.svc.cluster.local:3200
                jsonData:
                  httpHeaderName1: "X-Scope-OrgID"
                secureJsonData:
                  httpHeaderValue1: "lab"
              - name: Pyroscope
                uid: pyroscope
                type: grafana-pyroscope-datasource
                access: proxy
                url: http://pyroscope.observability.svc.cluster.local:4040
        # Community dashboards downloaded by gnetId at startup (needs egress to
        # grafana.com), pointed at the Mimir datasource, in a "Community" folder.
        # editable:true so tweaks stick (our own dashboards stay provisioned).
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: community
                orgId: 1
                folder: Community
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/community
        dashboards:
          community:
            node-exporter-full:
              gnetId: 1860
              revision: 45
              datasource: Mimir
            kubernetes-views-global:
              gnetId: 15757
              revision: 43
              datasource: Mimir
            kubernetes-views-pods:
              gnetId: 15760
              revision: 39
              datasource: Mimir
            kube-state-metrics-v2:
              gnetId: 13332
              revision: 12
              datasource: Mimir
            argocd:
              gnetId: 14584
              revision: 1
              datasource: Mimir
            loki-metrics:
              gnetId: 17781
              revision: 1
              datasource: Mimir
        sidecar:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: ALL
        extraObjects:
          - apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            metadata:
              name: grafana
              namespace: observability
            spec:
              parentRefs:
                - name: eg
                  namespace: lab-gateway
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - name: grafana
                      port: 80
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
