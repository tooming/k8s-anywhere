# Argo Rollouts progressive delivery controller (ADR-0020, CHARTER Objective O1).
# Helm chart argo/argo-rollouts from https://argoproj.github.io/argo-helm.
# Single controller replica + 1 dashboard replica (ADR-0005 lab trade-off).
# Dashboard enabled — visualises canary steps in real time; exposed via IngressRoute
# rollouts.127.0.0.1.nip.io (gitops/argo-rollouts/ingressroute.yaml, via argo-rollouts-extras).
# Traffic routing: Argo Rollouts' built-in Traefik integration (trafficRouting.traefik,
# ADR-0020 §Traffic-router + ADR-0040) drives canary weight rewrites via a TraefikService
# CRD — no external traffic-router plugin needed (unlike the former Envoy Gateway
# integration's argoproj-labs/gatewayAPI plugin, ADR-0008, removed with it below).
# ALWAYS-ON: automated sync; argo-rollouts-extras (wave 0) pre-creates the namespace
# with PSA restricted labels before the Helm release schedules pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    # 2.41.1 (bumped from 2.41.0, upgrade-drafter fallback run, 2026-07-20):
    # argo-helm finally published a chart release tracking appVersion v1.9.1 —
    # the exact flip condition ADR-0020's Re-evaluation log named for the
    # 2026-07-18/07-19 CVE-2026-35469 entries. The image.tag overrides those
    # entries added (as a stopgap while only the image, not the chart, could be
    # bumped) are gone below: the chart's own default now already resolves to
    # v1.9.1, so pinning it explicitly would just be redundant.
    #
    # 2.43.0 (bumped from 2.41.1, upgrade-drafter fallback, 2026-09-01):
    # routine currency, no CVE. Verified directly (not assumed, ADR-0004)
    # against the real chart source
    # (raw.githubusercontent.com/argoproj/argo-helm/argo-rollouts-2.43.0/
    # charts/argo-rollouts/Chart.yaml): version 2.43.0, appVersion v1.10.0 —
    # a minor bump on both the chart (2.x) and app (1.x) major lines, no
    # major crossed. Release notes (github.com/argoproj/argo-rollouts/
    # releases/tag/v1.10.0) cite no security fixes and no breaking changes;
    # real stability fixes: a panic-prevention guard for empty Values in the
    # injected anti-affinity check, a deepcopy fix for ALB status updates
    # (issues #3673/#4184), and flaky-test fixes. values.yaml schema
    # re-verified at 2.43.0 for every path this Application sets:
    # controller.{replicas,resources,trafficRouterPlugins} and
    # dashboard.{enabled,replicas,resources,containerSecurityContext} — all
    # present, unchanged structure; dashboard.containerSecurityContext still
    # defaults to {} (empty) at this tag too, confirming the explicit
    # override below (2026-08-19 finding) remains necessary.
    targetRevision: 2.43.0
    helm:
      releaseName: argo-rollouts
      valuesObject:
        controller:
          replicas: 1
          resources:
            limits:
              memory: 128Mi
          # trafficRouterPlugins (argoproj-labs/gatewayAPI) REMOVED 2026-09-06
          # (ADR-0040, supersedes Envoy Gateway/ADR-0008): Traefik's traffic
          # routing (trafficRouting.traefik, see gitops/apps/capstone/rollout.yaml)
          # is built into Argo Rollouts core — no external plugin binary to
          # download/register at all, unlike the Gateway API integration this
          # replaced.
        dashboard:
          enabled: true
          replicas: 1
          resources:
            limits:
              memory: 64Mi
          # Found live 2026-08-19 (#633 verification): the chart's top-level
          # `containerSecurityContext` default (allowPrivilegeEscalation: false,
          # capabilities.drop: [ALL], readOnlyRootFilesystem: true) applies to the
          # controller container but is NOT inherited by `dashboard.*` — that block
          # has its own `containerSecurityContext: {}` (empty) default, verified
          # against `helm show values argo/argo-rollouts --version 2.41.1`. Every
          # namespace runs PSA restricted (ADR-0017), so the dashboard Deployment's
          # pod template was rejected outright ("violates PodSecurity
          # \"restricted:latest\": allowPrivilegeEscalation != false, unrestricted
          # capabilities") from the day this Application was first created
          # (2026-07-24) — 0/1 available, ReplicaFailure, for 26 days straight,
          # invisible unless something actually checked the Application's health
          # (nothing had, until this verification pass). Mirrors the same
          # top-level default explicitly since this sub-block doesn't fall back to it.
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
