# Argo Rollouts progressive delivery controller (ADR-0020, CHARTER Objective O1).
# Helm chart argo/argo-rollouts from https://argoproj.github.io/argo-helm.
# Single controller replica + 1 dashboard replica (ADR-0005 lab trade-off).
# Dashboard enabled — visualises canary steps in real time; exposed via HTTPRoute
# rollouts.127.0.0.1.nip.io (gitops/argo-rollouts/route.yaml, via argo-rollouts-extras).
# Traffic-router plugin: argoproj-labs/gatewayAPI v0.5.0 integrates with Envoy Gateway
# HTTPRoute weight rewrites for canary traffic splitting (ADR-0008 + ADR-0020 §Traffic-router).
# ALWAYS-ON: automated sync; argo-rollouts-extras (wave 0) pre-creates the namespace
# with PSA restricted labels before the Helm release schedules pods.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    # 2.41.1 (bumped from 2.41.0, upgrade-drafter fallback run, 2026-07-20):
    # argo-helm finally published a chart release tracking appVersion v1.9.1 —
    # the exact flip condition ADR-0020's Re-evaluation log named for the
    # 2026-07-18/07-19 CVE-2026-35469 entries. The image.tag overrides those
    # entries added (as a stopgap while only the image, not the chart, could be
    # bumped) are gone below: the chart's own default now already resolves to
    # v1.9.1, so pinning it explicitly would just be redundant.
    targetRevision: 2.41.1
    helm:
      releaseName: argo-rollouts
      valuesObject:
        controller:
          replicas: 1
          resources:
            limits:
              memory: 128Mi
          # Must be a YAML *list*, not a block-scalar string: the chart runs the
          # value through `toYaml` into the argo-rollouts-config ConfigMap, and the
          # controller unmarshals that key as []types.PluginItem. A "|" string
          # double-encodes (the rendered value becomes a nested "|" scalar), so the
          # controller dies with "cannot unmarshal string into Go value of type
          # []types.PluginItem" on boot.
          trafficRouterPlugins:
            - name: argoproj-labs/gatewayAPI
              location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.5.0/gatewayapi-plugin-linux-amd64
        dashboard:
          enabled: true
          replicas: 1
          resources:
            limits:
              memory: 64Mi
          # Found live 2026-08-19 (#633 verification): the chart's top-level
          # `containerSecurityContext` default (allowPrivilegeEscalation: false,
          # capabilities.drop: [ALL], readOnlyRootFilesystem: true) applies to the
          # controller container but is NOT inherited by `dashboard.*` — that block
          # has its own `containerSecurityContext: {}` (empty) default, verified
          # against `helm show values argo/argo-rollouts --version 2.41.1`. Every
          # namespace runs PSA restricted (ADR-0017), so the dashboard Deployment's
          # pod template was rejected outright ("violates PodSecurity
          # \"restricted:latest\": allowPrivilegeEscalation != false, unrestricted
          # capabilities") from the day this Application was first created
          # (2026-07-24) — 0/1 available, ReplicaFailure, for 26 days straight,
          # invisible unless something actually checked the Application's health
          # (nothing had, until this verification pass). Mirrors the same
          # top-level default explicitly since this sub-block doesn't fall back to it.
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
