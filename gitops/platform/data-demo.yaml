# Data-layer demo — small always-on workloads that actually USE RabbitMQ and Redis, so
# the dashboards show real traffic (publish/deliver rates, Redis ops/sec) rather than an
# idle broker. ALWAYS-ON: automated sync. Wave 4: after rabbitmq + redis (wave 3) so the
# services and credentials exist when the generators start.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: http://host.k3d.internal:8929/lab/k8s-lab.git
    targetRevision: main
    path: gitops/data/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
