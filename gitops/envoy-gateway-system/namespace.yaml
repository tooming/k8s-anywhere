# envoy-gateway-system namespace — PSA baseline labels (RFC #230, ADR-0017 §Per-namespace profile).
# Two pod types share this namespace: the Gateway controller (restricted-compatible) and
# Envoy proxy data-plane pods (default UID 0 in gateway-helm v1.8.0). PSS baseline blocks
# the most dangerous host-namespace controls (hostPID, hostIPC, hostNetwork, privileged
# containers) while permitting root UIDs used by the upstream proxy image.
# The namespace is pre-created by the envoy-gateway Helm Application (wave 0); this manifest
# patches only the PSA baseline labels via ArgoCD SSA (envoy-gateway-system-extras App, wave 0).
# Flip condition: when the upstream gateway-helm chart explicitly supports non-root proxy pods
# via EnvoyProxy.spec.provider.kubernetes.envoyDeployment.pod.securityContext AND the
# maintainer verifies north-south traffic unaffected after label flip, promote all four labels
# to restricted. Per RFC #230 (architect decision 2026-06-19).
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/audit: baseline
