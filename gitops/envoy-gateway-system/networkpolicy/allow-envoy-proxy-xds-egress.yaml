# Allow the Envoy data-plane proxy pods egress to the Envoy Gateway CONTROL PLANE's
# xDS server (envoy-gateway, TCP 18000) — ADR-0016 default-deny floor, RFC #206.
#
# Without this the proxy can't open its DeltaAggregatedResources gRPC stream to
# xds_cluster, so it never receives listener/route config, fails its startup probe,
# and CrashLoopBackOffs ("gRPC config stream to xds_cluster closed ... connection
# timeout"). The data path on :8080 then serves empty replies / 502 for every lab UI
# (Grafana, ArgoCD, Vault, …). It's a LATENT gap: the long-lived xDS stream survives
# until the proxy restarts (e.g. a node flap), then can't reconnect — so it surfaces
# as an intermittent total-ingress outage, not a clean from-scratch failure.
#
# allow-envoy-proxy-backend-egress only covers the seventeen *backend* namespaces the
# proxy routes INTO; the allow-dns-and-apiserver baseline only covers DNS + apiserver.
# The proxy→control-plane xDS hop (same namespace) was covered by neither.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-envoy-proxy-xds-egress
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              control-plane: envoy-gateway
      ports:
        - protocol: TCP
          port: 18000
