# Allow ingress to the Envoy Gateway controller pod from Alloy for metrics scraping
# (ADR-0016, RFC #206). The Alloy scrape job `envoy-gateway-controller` targets
# envoy-gateway.envoy-gateway-system.svc:19001 for controller-runtime reconcile metrics
# (already wired in gitops/platform/observability-alloy.yaml and already allowed by
# the Alloy egress rule in gitops/observability/networkpolicy/allow-alloy-egress-external.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-envoy-controller-metrics-ingress
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 19001
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
