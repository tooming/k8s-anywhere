# Allow egress from Envoy data-plane proxy pods to all seventeen backend namespaces
# (ADR-0016, RFC #206). The proxy forwards HTTPRoute traffic to Services in these
# namespaces; a default-deny floor without this rule would silently drop every
# HTTPRoute response, breaking all lab UIs. No port restriction is applied because
# the backend container ports vary per namespace (8080, 8200, 5000, 3000, etc.) and
# the canonical port list lives in each backend's own Service spec. The matchExpressions
# operator:In pattern matches the velero egress-kopia-pv precedent.
#
# `harbor` added 2026-08-03: found live while verifying #631/#633 — Envoy could
# resolve the `harbor` HTTPRoute's backend fine, but every request timed out with
# `downstream_remote_disconnect` because this list never included the `harbor`
# namespace, so the default-deny floor silently dropped the proxy's egress to it.
# The same gap this file's own header warns about, just for a namespace added
# after this policy was last touched.
#
# `tidb`/`longhorn-system`/`istio-system`/`kargo` added 2026-08-07 (janitor sweep):
# the exact same gap, recurred — each of these four namespaces already had a live
# HTTPRoute through the shared gateway (`gitops/tidb-demo/route.yaml`,
# `gitops/longhorn/route.yaml`, `gitops/kiali/route.yaml` (istio-system),
# `gitops/kargo/route.yaml`) but was never added here, so their responses would be
# silently dropped the same way harbor's were. `scripts/envoy-egress-allowlist-check.sh`
# (wired into `make ci`) now catches this mechanically going forward — every
# HTTPRoute namespace routed through the shared gateway must appear in this list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-envoy-proxy-backend-egress
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - argocd
                  - capstone
                  - vault
                  - observability
                  - data
                  - storage
                  - moto
                  - ack-system
                  - argo-rollouts
                  - kyverno
                  - velero
                  - trivy-system
                  - harbor
                  - tidb
                  - longhorn-system
                  - istio-system
                  - kargo
