# ArgoCD Helm values — tuned for a 16 GB localhost lab.
# See docs/00-architecture.md for the role ArgoCD plays.
#
# Note on `redis:`/`redisSecretInit:` below: these configure the argo-cd chart's
# OWN bundled Redis instance, a mandatory upstream dependency of every argo-cd
# Helm install (ArgoCD's API server cache) — present in this file since before
# this comment existed. This is unrelated to ADR-0018 ("Valkey as the lab's own
# cache/key-value store"), which scopes to workloads this repo chooses to run,
# not a third-party chart's internal plumbing that ships regardless of that
# decision. Not a reintroduction of Redis as lab infrastructure.

global:
  domain: argocd.localhost
  # No image.tag override needed anymore (janitor cleanup 2026-08-05): this used to
  # pin `tag: latest` to include the /applicationsets UI route (argoproj/argo-cd#26666),
  # which only shipped from v3.5.0 onward and had no stable release at the time this
  # override was added. `auto/argocd-chart-10-2-3` (2026-08-05) bumped chart_version to
  # 10.2.3, whose appVersion IS v3.5.0 (verified: `git merge-base --is-ancestor
  # 4d02fc2f5 v3.5.0` on a real argoproj/argo-cd clone confirms v3.5.0 is the first
  # stable tag containing that commit) — the chart's own `global.image.tag` default is
  # `""`, which falls back to `.Chart.AppVersion` (the chart's own comment: "Overrides
  # the global Argo CD image tag whose default is the chart appVersion"), so omitting
  # this key now resolves to the real, stable `v3.5.0` tag automatically, and stays in
  # sync with the chart's own appVersion on every future bump instead of needing a
  # manual re-pin. See `gitops/kyverno/policies/disallow-latest-tag.yaml`'s `argocd`
  # carve-out comment for the maintainer-confirmation gate on removing that exclusion
  # (Issue #999) — this values.yaml fix landing does NOT by itself make it safe to drop,
  # since this module is Terraform-bootstrap-only (ADR-0001) and needs a live
  # `terraform apply` to actually take effect on the cluster.
  # PSS restricted — Phase 2 (RFC #205, ADR-0017). ArgoCD components run as UID 1000 (non-root).
  # Pod-level securityContext is set via `global.securityContext`, NOT
  # `global.podSecurityContext` -- the argo-cd chart's templates (e.g.
  # templates/argocd-application-controller/deployment.yaml) read
  # `.Values.global.securityContext`; `podSecurityContext` does not exist in
  # this chart's schema and was a silent no-op here previously (found during
  # a broader audit of this same bug class, PR #493). Verified against the
  # pinned chart version (argo-cd-9.7.1): every component (controller,
  # server, repoServer, applicationSet, dex, and the bundled session-cache
  # sub-chart) already defaults its own
  # `<component>.containerSecurityContext` to `runAsNonRoot: true`,
  # `readOnlyRootFilesystem: true`, `allowPrivilegeEscalation: false`,
  # `seccompProfile.type: RuntimeDefault`, `capabilities.drop: [ALL]` --
  # container-level PSS restricted compliance held regardless of this bug
  # (checked controller/server/repoServer/applicationSet plus dex and the
  # bundled session-cache sub-chart). The chart has no
  # `global.containerSecurityContext` key either (it's per-component, not
  # global) -- removed rather than expanded into per-component blocks that
  # would just restate the chart's own already-correct defaults.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # RFC #785: chart 10.x flips this key's default from false to true. This repo
  # already hand-manages its own default-deny + allow-list NetworkPolicy set for
  # the argocd namespace via GitOps (gitops/argocd/networkpolicy/, ADR-0016
  # pattern) -- leaving the chart default would let it template a second,
  # uncoordinated NetworkPolicy set alongside that one. Explicit override
  # preserves pre-10.x behavior.
  networkPolicy:
    create: false

configs:
  params:
    # Serve plain HTTP. We port-forward for now and terminate TLS at Envoy later.
    server.insecure: true
    # Unset, this defaults to the host's visible CPU count (6 on this VM), not the
    # repo-server container's 1-core limit — during the cold-start sync storm (~90
    # Applications at once) that oversubscription CFS-throttles the container so
    # hard its own healthz handler misses the liveness probe's 5s timeout, and it
    # crashloops indefinitely (never converging). Bound concurrent manifest
    # generation to what the CPU limit can actually serve.
    reposerver.parallelism.limit: "2"
    # Found live 2026-08-11: with parallelism capped at 2 (above) and the manifest
    # cache invalidated (argocd-redis pod recreated, e.g. after a node restart —
    # happened twice this session), ~90+ Applications all need fresh generation at
    # once and queue behind just 2 concurrent slots. The controller's default 60s
    # deadline per GenerateManifest call is fine for a warm cache, but under a
    # cold-cache backlog on this host, individual requests — especially Harbor's
    # unusually large chart — routinely lost the race and errored `DeadlineExceeded`
    # even though repo-server was actively working, not stuck (confirmed live: its
    # logs showed steady cache-hit/miss throughput the whole time). Bumped both the
    # controller-side and server-side repo-server call deadlines to give a cold
    # cache-rebuild genuine room to finish instead of erroring out mid-queue.
    controller.repo.server.timeout.seconds: "180"
    server.repo.server.timeout.seconds: "180"
  cm:
    # All kustomizations in this repo use cross-directory resource references
    # (e.g. ../../network/policies/default-deny.yaml). Set globally so ArgoCD
    # doesn't need per-Application overrides that may not propagate through
    # ApplicationSet template rendering.
    kustomize.buildOptions: --load-restrictor LoadRestrictionsNone

# Components we don't need in the lab — trimmed to save RAM.
dex:
  enabled: false
notifications:
  enabled: false

# Found 2026-08-11 (systemic probe-timeout audit): both applicationSet and server
# below default to the chart's own timeoutSeconds: 1 on liveness/readiness (verified
# against the pinned chart's values.yaml, argo-cd-10.3.2) -- the same
# chart-default-too-tight footgun already found and fixed this repo for controller's
# readinessProbe and repoServer's liveness/readinessProbe just above (2026-08-07,
# #632/PR #1103), and for Harbor (PR #1040/#1102) and Kyverno's admissionController
# (PR #1115). Neither of these two components had been audited in that earlier pass.
# Bumped both to 15s, matching the convention already used for controller/repoServer
# in this same file.
applicationSet:
  enabled: true
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
  livenessProbe:
    timeoutSeconds: 15
  readinessProbe:
    timeoutSeconds: 15

# The cold-start of `make up` is a sync storm: ArgoCD renders + reconciles ~50
# Applications (many Helm/Kustomize) at once — far above steady-state load. With
# the chart-default tiny CPU requests and 1s health-probe timeouts, the two hot
# components (application-controller, repo-server) get CPU-starved, miss the 1s
# probe, and kubelet crashloops them, so ArgoCD never converges (ESO/garage/… stay
# Missing and the bootstrap scripts time out). Give them enough CPU for the storm
# and relax the probe timeout so transient cold-start slowness isn't fatal.
#
# metrics.enabled creates the *-metrics Services that Alloy scrapes for the
# stack-health dashboard (app sync/health, controller, repo-server, api).
#
# Explicit memory limit (found 2026-07-24, #632 investigation): with no
# `limits.memory` set here, the argocd namespace's `standard-limits` LimitRange
# (gitops/governance/argocd) filled in its `default` container limit of 512Mi —
# identical to the request above. The Application count has grown to 124 (from
# the ~50 this comment originally sized for); reconciling that many on
# controller restart spikes well past 512Mi, and the container OOMKills
# (exit 137) in ~13s, crashlooping indefinitely and leaving every Application
# stuck in "Unknown" health. 2Gi gives headroom for further growth while
# staying well inside the node's 12Gi budget and the LimitRange's 4Gi max.
controller:
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # application-controller has no livenessProbe by default; only readiness.
  readinessProbe:
    timeoutSeconds: 15

# 2026-08-07: repo-server was found crashlooping continuously for 24h+ (54+
# restarts) — its own healthz handler was missing the probe's timeout under
# sustained host latency, not the cold-start CPU-throttling the 5s value above
# was originally sized for (see configs.params comment): logs showed repeated
# "Error serving health check request ... duration=5.0-5.4s" right at/over the
# old 5s ceiling, with the probe cancelling the in-flight request and killing
# the container before it could ever finish a health check, on an indefinite
# loop (never converges — every sync/comparison this component serves fails
# while it's down, cascading to every Application, not just one). Bumped
# further, matching the margin already used for Harbor's identical failure
# mode (PR #1040).
repoServer:
  metrics:
    enabled: true
  # Found live 2026-08-11 (same investigation as the controller/server repo-server
  # call timeouts above): ARGOCD_EXEC_TIMEOUT governs how long repo-server gives any
  # single external CLI invocation (helm pull, git fetch, kustomize build, ...)
  # before killing it — defaults to 90s, a separate, lower ceiling than the 180s
  # gRPC-level deadline this file already bumps. Under this host's cold-cache
  # backlog, `helm pull` against even a same-host chart source repeatedly hit this
  # 90s wall and got killed mid-transfer — confirmed live: repo-server logs showed
  # `failed running helm: \`helm pull ... \` failed timeout after 1m30s` on every
  # attempt, independent of chart size or reachability. Bumped to 300s so a helm
  # pull actually gets to finish under sustained host latency instead of being
  # killed by an internal timeout tighter than the outer one already relaxed above.
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: "300s"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  livenessProbe:
    timeoutSeconds: 15
    initialDelaySeconds: 20
  readinessProbe:
    timeoutSeconds: 15
    initialDelaySeconds: 20

server:
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  # See the comment above `applicationSet:` -- same chart-default-1s finding.
  livenessProbe:
    timeoutSeconds: 15
  readinessProbe:
    timeoutSeconds: 15

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

# Found 2026-07-24 (#632 investigation): unlike every other component, the
# redis-secret-init pre-upgrade hook Job does NOT inherit `global.securityContext`
# — it has its own dedicated `redisSecretInit.securityContext` key (chart default:
# `{}`, i.e. no pod-level securityContext at all). With ADR-0017's
# require-pod-security-restricted Kyverno policy in Enforce mode, that empty
# pod-level securityContext blocks the hook Job outright, which blocks every
# `helm upgrade` (the pre-upgrade hook must succeed first) — this repo's `make
# argocd` bootstrap/upgrade path was silently broken until this was set explicitly.
redisSecretInit:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
