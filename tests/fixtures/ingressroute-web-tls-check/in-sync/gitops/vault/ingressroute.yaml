apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-ui
  namespace: vault
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`vault.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: vault
          port: 8200
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault-ui-tls
  namespace: vault
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`vault.127.0.0.1.nip.io`) && PathPrefix(`/`)
      services:
        - name: vault
          port: 8200
  tls: {}
