# fixture below), not the CHARTPIN_RESOLVER stub seam the other fixtures use.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: v-prefixed-chart
spec:
  source:
    repoURL: https://example.test/v-prefix-charts
    chart: widget
    targetRevision: 1.0.0
