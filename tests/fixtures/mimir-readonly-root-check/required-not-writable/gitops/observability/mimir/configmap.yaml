# Required-not-writable fixture: ruler.rule_path IS set (not the "unset" drift case) but
# points under /etc/mimir, the read-only configMap mount — distinct failure branch from
# the "unset, defaults to ./data-ruler/" case already covered by the drift fixture.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    multitenancy_enabled: true
    activity_tracker:
      filepath: /data/metrics-activity.log
    ruler:
      rule_path: /etc/mimir/ruler
    blocks_storage:
      backend: s3
      s3:
        endpoint: garage.storage.svc.cluster.local:3900
        bucket_name: mimir
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
