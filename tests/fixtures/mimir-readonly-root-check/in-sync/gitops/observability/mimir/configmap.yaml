# In-sync fixture: activity_tracker.filepath + ruler.rule_path set, every path under
# /data (writable) — both unset-default settings the guard requires.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    multitenancy_enabled: true
    activity_tracker:
      filepath: /data/metrics-activity.log
    ruler:
      rule_path: /data/ruler
    blocks_storage:
      backend: s3
      s3:
        endpoint: garage.storage.svc.cluster.local:3900
        bucket_name: mimir
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
