# No-writable-mounts fixture: every volumeMount is backed by a configMap (read-only) —
# no emptyDir/PVC volume exists at all, so every write path must fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
spec:
  template:
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:3.0.6
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
      volumes:
        - name: config
          configMap:
            name: mimir-config
