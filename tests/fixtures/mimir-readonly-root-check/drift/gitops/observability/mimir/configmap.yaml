# Drift fixture: activity_tracker.filepath is UNSET — exactly the incident. Mimir then
# defaults to ./metrics-activity.log on the read-only root and CrashLoopBackOffs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    multitenancy_enabled: true
    blocks_storage:
      backend: s3
      s3:
        endpoint: garage.storage.svc.cluster.local:3900
        bucket_name: mimir
      tsdb:
        dir: /data/tsdb
    compactor:
      data_dir: /data/compactor
