# TLS front door for the lab GitLab. Grafana's native Git Sync (Pure Git) only
# accepts HTTPS, but GitLab serves http on :8929 — so this terminates TLS on :8930
# (mkcert cert) and proxies git Smart HTTP to GitLab unchanged. ArgoCD and the git
# CLI keep using http://:8929; this is purely additive. See ADR-0006.
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log  /dev/stderr;
  # git clones/pushes: stream request bodies, no size cap, no buffering.
  client_max_body_size 0;
  server {
    listen 8930 ssl;
    server_name host.k3d.internal localhost gitlab.local;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    location / {
      proxy_pass http://gitlab:8929;
      proxy_http_version 1.1;
      proxy_set_header Host            $http_host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
