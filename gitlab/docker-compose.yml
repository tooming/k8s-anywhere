# GitLab CE (omnibus) — the GitOps source of truth.
# Runs OUTSIDE the cluster so its ~3-4 GB footprint stays off the k3d VM budget.
# Reachable from the Mac at http://localhost:8929 and from cluster pods at
# http://host.k3d.internal:8929 (both hit the same container via Colima's docker).
services:
  gitlab:
    # Pinned explicit version (not :latest) per ADR-0030's precedent — an
    # unpinned tag can silently jump major versions on a routine `docker
    # compose pull`, with no PR, no changelog review, and no rollback record.
    # 19.2.1-ce.0 is what `:latest` itself resolved to as of 2026-08-07
    # (confirmed via the Docker Hub tags API: the `latest` tag's
    # `tag_last_pushed` timestamp exactly matches `19.2.1-ce.0`'s) — pinning
    # to it changes nothing about what's actually running, it only removes
    # the floating-tag footgun. Bump deliberately via a future PR, not an
    # automatic `docker compose pull`.
    #
    # Bumped 19.2.1-ce.0 -> 19.2.2-ce.0 (2026-08-17, planner-fallback gap
    # analysis): confirmed via Docker Hub's tags API that 19.2.2-ce.0 is a
    # real, published tag (pushed 2026-08-12). The real CHANGELOG.md at tag
    # v19.2.2-ee (gitlab.com/gitlab-org/gitlab) shows a "Security (15
    # changes)" section with real, non-cosmetic fixes: "Fix
    # authorize_admin_project! being skipped on project update" (an
    # authorization-bypass fix), "Re-validate upload path traversal before
    # store", and "Filter unauthorized merge requests from global API
    # endpoint" among the fifteen -- clears this repo's own "ships with a
    # real fix" bar for a non-CVE-numbered currency bump.
    image: gitlab/gitlab-ce:19.2.2-ce.0
    container_name: gitlab
    hostname: gitlab.local
    restart: unless-stopped
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['initial_root_password'] = "${GITLAB_ROOT_PASSWORD:?set GITLAB_ROOT_PASSWORD in gitlab/.env}"
        # --- trims for a 16 GB lab ---
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 9
        prometheus_monitoring['enable'] = false
    ports:
      - "8929:8929"
      - "2222:22"
    # Named volumes (NOT Mac bind mounts): GitLab omnibus asserts the setgid bit
    # (mode 2770) on git-data/repositories during reconfigure. Colima's virtiofs
    # bind mounts drop setgid -> the dir lands as 0770 -> fatal reconfigure crash-loop.
    # Named volumes live on the VM's ext4 filesystem, where setgid works correctly.
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

  # TLS front door for Grafana's native Git Sync, which only accepts HTTPS git
  # URLs (ADR-0006). Terminates TLS on :8930 (mkcert cert from gitlab-tls-bootstrap.sh)
  # and proxies git to GitLab's http :8929. Additive — GitLab/ArgoCD/CLI still use http.
  gitlab-tls:
    # Pinned explicit version (not the floating `1.27-alpine` minor tag) — same
    # rationale as the omnibus service two blocks above: an unpinned tag can
    # silently jump patches on a routine `docker compose pull`, with no PR, no
    # changelog review, and no rollback record. `1.27.5-alpine` is what
    # `1.27-alpine` itself resolves to as of 2026-08-13 (confirmed via the
    # Docker Hub tags API: the two tags' image digests are byte-identical) —
    # pinning to it changes nothing about what's actually running, it only
    # removes the floating-tag footgun. Bump deliberately via a future PR, not
    # an automatic `docker compose pull`.
    image: nginx:1.27.5-alpine
    container_name: gitlab-tls
    restart: unless-stopped
    # Opt-in profile: only starts with `docker compose --profile tls up` (which
    # gitlab-tls-bootstrap.sh runs, after the cert exists), so a plain GitLab
    # `docker compose up` never crash-loops on a missing cert.
    profiles: ["tls"]
    depends_on:
      - gitlab
    ports:
      - "8930:8930"
    volumes:
      - ./nginx-tls.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro

  # CI runner for .gitlab-ci.yml (the capstone build/sign pipeline). Docker executor
  # with privileged mode so job-declared services (docker:29-dind) can run. Registered
  # against this GitLab instance via config.toml (gitignored — carries a live runner
  # auth token, generated by `make gitlab-runner-up`, not committed).
  # Without this, every pipeline sits in `pending` forever — no runner ever existed
  # to pick a job up (found live 2026-08-03 while verifying #631/#633: the CI variables,
  # Vault credentials, and Harbor registry were all correctly wired, but nothing had
  # ever actually executed a pipeline in this lab's history).
  gitlab-runner:
    # Pinned explicit version (not :latest) — same rationale as the `gitlab`
    # service above. v19.2.1 is the newest stable tag on Docker Hub as of
    # 2026-08-07 (confirmed via the Docker Hub tags API), aligned with the
    # gitlab-ce pin above.
    #
    # Bumped v19.2.1 -> v19.2.2 (2026-08-17, planner-fallback gap analysis):
    # confirmed via Docker Hub's tags API that v19.2.2 is a real, published
    # tag (pushed 2026-08-12), aligned with the server pin above. The
    # runner's own release is maintenance-only (its CHANGELOG.md has a
    # single entry: "Verify resources: authenticate Docker Hub image
    # checks") -- bumped for version parity with the server, not for a
    # runner-specific fix.
    image: gitlab/gitlab-runner:v19.2.2
    container_name: gitlab-runner
    restart: unless-stopped
    depends_on:
      - gitlab
    volumes:
      - ./runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
