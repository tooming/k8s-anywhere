name: auto-update-prs

# When main advances, rebase every open PR branch on top of it.
# Uses git rebase (not GitHub's merge-based updateBranch API) so that
# ROADMAP.md / dependency-tree.md — files every PR touches — never accumulate
# merge-conflict markers. Clean rebases are force-pushed; conflicted branches
# are left unchanged and the pr-up-to-date CI gate catches them.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  rebase-pr-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a token with push rights (default GITHUB_TOKEN is enough for
          # same-repo branches when "Allow GitHub Actions to create and approve
          # pull requests" is enabled in repo settings).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all PR branches
        run: git fetch --all --prune -q

      - name: Rebase open PR branches onto main
        uses: actions/github-script@v7
        env:
          MAIN_SHA: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });

            console.log(`Found ${pulls.data.length} open PR(s) targeting main`);
            let updated = 0, skipped = 0, failed = 0;

            for (const pr of pulls.data) {
              const branch = pr.head.ref;
              const headSha = pr.head.sha;
              const remote = `origin/${branch}`;

              // Check if already on top of main
              try {
                const mergeBase = execSync(
                  `git merge-base ${remote} origin/main`, { encoding: 'utf8' }
                ).trim();
                const mainHead = execSync(
                  'git rev-parse origin/main', { encoding: 'utf8' }
                ).trim();
                if (mergeBase === mainHead) {
                  console.log(`  skip PR #${pr.number} "${branch}" — already on top of main`);
                  skipped++;
                  continue;
                }
              } catch (e) {
                console.log(`  skip PR #${pr.number} "${branch}" — could not determine merge-base: ${e.message}`);
                skipped++;
                continue;
              }

              // Find the topmost non-merge commit on the branch
              // (skip any auto-update merge commits so we rebase the real work)
              let commitsToPick;
              try {
                const log = execSync(
                  `git log --no-merges --format=%H origin/main..${remote}`,
                  { encoding: 'utf8' }
                ).trim();
                commitsToPick = log ? log.split('\n').reverse() : [];
              } catch (e) {
                console.log(`  skip PR #${pr.number} "${branch}" — log failed: ${e.message}`);
                skipped++;
                continue;
              }

              if (commitsToPick.length === 0) {
                console.log(`  skip PR #${pr.number} "${branch}" — no non-merge commits above main`);
                skipped++;
                continue;
              }

              console.log(`  rebase PR #${pr.number} "${branch}" (${commitsToPick.length} commit(s))`);

              try {
                // Work on a detached HEAD from main
                execSync('git checkout --detach origin/main -q', { stdio: 'pipe' });
                execSync(`git cherry-pick ${commitsToPick.join(' ')} -q`, { stdio: 'pipe' });

                const newSha = execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim();
                execSync(
                  `git push origin HEAD:refs/heads/${branch} --force-with-lease="${branch}:${headSha}"`,
                  { stdio: 'pipe' }
                );
                console.log(`    ✓ force-pushed ${branch} → ${newSha.slice(0, 12)}`);
                updated++;
              } catch (e) {
                // cherry-pick conflict — abort and leave branch as-is
                try { execSync('git cherry-pick --abort', { stdio: 'pipe' }); } catch (_) {}
                try { execSync('git checkout main -q', { stdio: 'pipe' }); } catch (_) {}
                console.log(`    ⚠ conflict — ${branch} needs manual rebase`);
                failed++;
              }
            }

            // Return to main
            try { execSync('git checkout main -q', { stdio: 'pipe' }); } catch (_) {}

            const summary = `\nSummary: ${updated} rebased, ${skipped} already current, ${failed} need manual rebase`;
            console.log(summary);
            if (failed > 0) {
              core.warning(`${failed} PR branch(es) have conflicts and need manual rebase`);
            }
