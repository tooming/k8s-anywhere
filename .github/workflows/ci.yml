name: ci

# Fast, clusterless quality gates — the bottom of the test pyramid. The real
# end-to-end checks (make dr-verify / dr-test) need a live 16 GB lab and run on a
# Mac, not here. This catches lint, schema, IaC, and pure-logic regressions on
# every push/PR. Mirrors `make ci` in full — the local pre-push hook only runs the
# fast lint gate (seconds), so this workflow is what actually enforces the rest
# (bats/kustomize/terraform/drift) before a PR merges. See .githooks/pre-push.
#
# `push` is scoped to main only (not every branch): every non-main branch here
# gets a PR opened immediately (CLAUDE.md "Always open a PR"), and `pull_request`
# below already fires on opened/synchronize/reopened — including rebase pushes to
# an open PR's head. A `push: branches: ["**"]` on top of that ran this entire
# 7-job workflow TWICE, back-to-back, for every single commit on an open PR
# branch (once per event), for no coverage gain — confirmed 2026-07-17 on PR
# #453, where four failed check entries were actually one root cause hitting two
# jobs, doubled by this trigger overlap. `push: [main]` keeps the only case
# `pull_request` doesn't cover: a direct push straight to main.
#
# Every job sets an explicit timeout-minutes (well above its normal duration —
# lint/manifests/terraform/kustomize finish in well under a minute; unit/drift
# take a few minutes for the full bats suite / full drift sweep). Without one,
# GitHub Actions' default 360-minute job timeout applies: a network-dependent
# install step (apt-get, a release-binary curl, the helm install script) that
# hangs instead of failing would otherwise block a PR for hours with no
# automatic recovery — observed directly on PR #648 (2026-07-21), where the
# `unit` and `drift` jobs sat `in_progress` for 20+ minutes with zero progress
# across three separate attempts while every other job in the same run
# consistently finished in seconds, requiring a manual cancel+rerun each time.
# A tight timeout turns a silent multi-hour stall into a fast, visible
# failure that re-run/retry logic (human or agent) can act on quickly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck + yamllint
        # Retry with a bounded per-attempt timeout instead of one unbounded
        # apt-get call: a hung mirror fetch has silently eaten this job's
        # entire timeout-minutes budget three times in one 2026-08-19 run
        # (see the timeout-minutes comment at the top of this file, PR #648)
        # -- this fails an individual attempt fast and retries in-job.
        run: |
          for i in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get update -qq \
              && sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get install -y -qq shellcheck yamllint; then
              exit 0
            fi
            echo "attempt $i failed or timed out, retrying..." >&2
            sleep 5
          done
          echo "all attempts failed" >&2
          exit 1
      - run: bash scripts/lint.sh

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Cache kubeconform schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kubeconform-schemas
          key: kubeconform-schemas-v0.8.0-k8s1.30.0-${{ hashFiles('gitops/**/*.yaml') }}
          restore-keys: |
            kubeconform-schemas-v0.8.0-k8s1.30.0-
      - run: bash scripts/validate-manifests.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Bumped 1.15.8 -> 1.15.9 (2026-08-19, upgrade-drafter fallback):
          # CVE-2026-14978 — go-slug bumped to v0.18.3 to fix a Unicode-
          # normalization issue that could let a file meant to be excluded via
          # .terraformignore slip through during an upload to Terraform
          # Enterprise/HCP Terraform. This repo's own `make apply`/CI flow
          # never uploads to TFE/HCP Terraform (state lives in Garage S3 per
          # ADR-0007), so this pin isn't itself exposed to the vulnerable
          # path, but staying current on the CI tool matches this repo's
          # standing convention (kubeconform/kustomize pins above). Keep in
          # sync with oracle-cluster-apply.yml / oracle-cluster-apply-retry.yml.
          terraform_version: "1.15.9"
      - name: Install tflint
        run: curl -fsSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - run: bash scripts/validate-terraform.sh

  kustomize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kustomize
        run: |
          curl -fsSL -o /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install /tmp/kustomize /usr/local/bin/kustomize
      - run: bash scripts/validate-kustomize.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        # Same bounded-retry rationale as the lint job's install step above
        # -- this exact install hung and ate the full job timeout once in
        # the same 2026-08-19 run that motivated it.
        run: |
          for i in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get update -qq \
              && sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get install -y -qq bats; then
              exit 0
            fi
            echo "attempt $i failed or timed out, retrying..." >&2
            sleep 5
          done
          echo "all attempts failed" >&2
          exit 1
      - run: bash scripts/test.sh

  drift:
    # Every drift/structural check `make ci` runs, so this job is the full backstop
    # now that the local pre-push hook only runs the fast lint gate (see
    # .githooks/pre-push) — nothing here can be "only caught if someone runs make ci
    # by hand".
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history + main: routines-author-check derives the merge-base and the
      # commit author to decide whether an executor-authored (auto/*) change edited
      # a routine file. The other drift checks don't need it but it's harmless.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch main for drift comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
      - name: Install yq + helm (chart-pin / CRD-size checks need them)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run: bash scripts/readme-check.sh
      - run: bash scripts/lab-ui-check.sh
      - run: bash scripts/o5-dashboard-coverage-check.sh
      - run: bash scripts/envoy-egress-allowlist-check.sh
      - run: bash scripts/appset-list-coverage-check.sh
      - run: bash scripts/workflow-timeout-check.sh
      - run: bash scripts/roadmap-check.sh
      - run: bash scripts/markdown-links-check.sh
      - run: bash scripts/securitycontext-tests-check.sh
      - run: bash scripts/networkpolicy-tests-check.sh
      - run: bash scripts/observability-tests-check.sh
      - run: bash scripts/yq-raw-check.sh
      - run: bash scripts/yq-variant-guard-check.sh
      - run: bash scripts/git-fixture-isolation-check.sh
      - run: bash scripts/routines-check.sh
      - run: bash scripts/routines-author-check.sh
      - run: bash scripts/helm-chart-pin-check.sh
      - run: bash scripts/argocd-crd-ssa-check.sh
      - run: bash scripts/rollouts-plugin-list-check.sh
      - run: bash scripts/analysistemplate-step-count-check.sh
      - run: bash scripts/mimir-readonly-root-check.sh
      - run: bash scripts/probe-timeout-check.sh
      - run: bash scripts/adr-followup-check.sh
      - run: bash scripts/adr-chart-version-sync-check.sh
      - run: bash scripts/adr-image-pin-sync-check.sh
      - run: bash scripts/context-doc-version-sync-check.sh
      - run: bash scripts/dependency-register-check.sh
      - run: bash scripts/docs-done-pr-link-check.sh
      - run: bash scripts/kustomize-orphan-check.sh
      - run: bash scripts/yqs-lib-check.sh
      - run: bash scripts/ok-bad-lib-check.sh
      - run: bash scripts/drift-detectors-tests-check.sh
      - run: bash scripts/hook-scripts-coverage-tests-check.sh
      - run: bash scripts/ci-parity-check.sh
