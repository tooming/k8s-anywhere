name: ci

# Fast, clusterless quality gates — the bottom of the test pyramid. The real
# end-to-end checks (make dr-verify / dr-test) need a live 16 GB lab and run on a
# Mac, not here. This catches lint, schema, IaC, and pure-logic regressions on
# every push/PR. Mirrors `make ci` in full — the local pre-push hook only runs the
# fast lint gate (seconds), so this workflow is what actually enforces the rest
# (bats/kustomize/terraform/drift) before a PR merges. See .githooks/pre-push.
#
# `push` is scoped to main only (not every branch): every non-main branch here
# gets a PR opened immediately (CLAUDE.md "Always open a PR"), and `pull_request`
# below already fires on opened/synchronize/reopened — including rebase pushes to
# an open PR's head. A `push: branches: ["**"]` on top of that ran this entire
# 7-job workflow TWICE, back-to-back, for every single commit on an open PR
# branch (once per event), for no coverage gain — confirmed 2026-07-17 on PR
# #453, where four failed check entries were actually one root cause hitting two
# jobs, doubled by this trigger overlap. `push: [main]` keeps the only case
# `pull_request` doesn't cover: a direct push straight to main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - name: Install shellcheck + yamllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck yamllint
      - run: bash scripts/lint.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Cache kubeconform schemas
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/kubeconform-schemas
          key: kubeconform-schemas-v0.6.7-k8s1.30.0-${{ hashFiles('gitops/**/*.yaml') }}
          restore-keys: |
            kubeconform-schemas-v0.6.7-k8s1.30.0-
      - run: bash scripts/validate-manifests.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
      - name: Install tflint
        run: curl -fsSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
      - run: bash scripts/validate-terraform.sh

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - name: Install kustomize
        run: |
          curl -fsSL -o /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install /tmp/kustomize /usr/local/bin/kustomize
      - run: bash scripts/validate-kustomize.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats
      - run: bash scripts/test.sh

  drift:
    # Every drift/structural check `make ci` runs, so this job is the full backstop
    # now that the local pre-push hook only runs the fast lint gate (see
    # .githooks/pre-push) — nothing here can be "only caught if someone runs make ci
    # by hand".
    runs-on: ubuntu-latest
    steps:
      # Full history + main: routines-author-check derives the merge-base and the
      # commit author to decide whether an executor-authored (auto/*) change edited
      # a routine file. The other drift checks don't need it but it's harmless.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          fetch-depth: 0
      - name: Fetch main for drift comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
      - name: Install yq + helm (chart-pin / CRD-size checks need them)
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run: bash scripts/readme-check.sh
      - run: bash scripts/lab-ui-check.sh
      - run: bash scripts/roadmap-check.sh
      - run: bash scripts/markdown-links-check.sh
      - run: bash scripts/securitycontext-tests-check.sh
      - run: bash scripts/networkpolicy-tests-check.sh
      - run: bash scripts/observability-tests-check.sh
      - run: bash scripts/yq-raw-check.sh
      - run: bash scripts/git-fixture-isolation-check.sh
      - run: bash scripts/routines-check.sh
      - run: bash scripts/routines-author-check.sh
      - run: bash scripts/helm-chart-pin-check.sh
      - run: bash scripts/argocd-crd-ssa-check.sh
      - run: bash scripts/rollouts-plugin-list-check.sh
      - run: bash scripts/mimir-readonly-root-check.sh
      - run: bash scripts/adr-followup-check.sh
      - run: bash scripts/ci-parity-check.sh
