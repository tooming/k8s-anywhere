name: oracle-cluster-apply

# Manual-only bridge to a real OCI Always Free tenancy (issue #406 / ADR-0027). Exists
# because the claude.ai routine sandbox's egress proxy blocks registry.terraform.io and
# *.oraclecloud.com outright (network-level, independent of credentials) — GitHub
# Actions runners have normal egress, so this is the only automatable path to actually
# apply the oracle/ backend without a human at a local terminal.
#
# Deliberately scoped down from what a human running terragrunt locally could do:
#   - workflow_dispatch ONLY. Never runs on push/PR/schedule — nothing in this repo can
#     trigger a real cloud mutation just by existing or being opened.
#   - plan/apply only. No destroy action. Tearing down real infrastructure stays a
#     local-session, human-at-the-keyboard operation (`make tfstate-oracle-down`,
#     `terragrunt destroy`) until there's a deliberate reason to automate that too.
#   - Requires OCI_* and TFSTATE_ORACLE_* repo secrets to exist; until they're set this
#     workflow fails immediately at the "render credentials" step with no side effects.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: "Which infra/live/oracle/ unit to run against"
        required: true
        type: choice
        options: [cluster, argocd, gitlab]
      action:
        description: "terragrunt action"
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    environment: oracle-cloud
    # Without an explicit timeout, GitHub Actions' 360-minute default applies --
    # see ci.yml's matching comment (PR #648) for the incident that established
    # this as a recognized failure mode; propagated here 2026-08-07 (janitor sweep).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Matches ci.yml's pin. Must be >= 1.6 -- root.hcl's s3 backend block uses
          # use_path_style/endpoints/skip_requesting_account_id, args the s3 backend
          # only gained in 1.6; "~> 1.5" (this workflow's first version) resolved to
          # 1.5.x and failed "Unsupported argument" on all three at terraform init.
          # Bumped 1.9.8 -> 1.15.8 (2026-07-28, executor currency check): this had
          # silently drifted out of sync with ci.yml's own terraform_version (bumped
          # 2026-07-21) despite this file's stated intent to match it -- ci.yml's
          # `terraform` job has already run 1.15.8 against these same modules
          # repeatedly since that bump, so this is a previously-verified version, not
          # a fresh unknown.
          # Bumped 1.15.8 -> 1.15.9 (2026-08-19, upgrade-drafter fallback):
          # CVE-2026-14978 fix (go-slug .terraformignore bypass) -- matches
          # ci.yml's own same-day bump, keeping this file's stated
          # keep-in-sync intent true.
          # Bumped 1.15.9 -> 1.16.1 (2026-09-06, JANITOR-fallback currency
          # sweep): routine currency, no CVE -- matches ci.yml's own same-day
          # bump, keeping this file's stated keep-in-sync intent true.
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Install terragrunt
        run: |
          # Bumped v0.67.0 -> v1.1.1 (2026-07-28, executor currency check): v0.67.0 was
          # 0.x-line and long superseded; verified directly against Terragrunt's real
          # v1.0.0 release notes (github.com/gruntwork-io/terragrunt/releases/tag/v1.0.0)
          # before bumping -- none of its documented breaking changes (tflint removal,
          # .terragrunt-cache always generated, find/list hidden-dir discovery,
          # render --format=json dependent-discovery removed, Windows path handling,
          # terragrunt.stack.hcl warnings) touch anything this repo's infra/live/oracle/
          # units use (no tflint hook, no find/list/render calls, no *.stack.hcl files,
          # Linux runners only) -- and v1's own policy is no breaking changes in minor
          # releases, so 1.1.1 carries the same guarantee. This remote session cannot
          # run a real `terragrunt apply` against OCI regardless (no cloud credentials
          # reachable from here), so this workflow's own next real run is the actual
          # verification; flip condition: revisit if a v2.x line ships.
          # Bumped v1.1.1 -> v1.1.3 (2026-08-19, upgrade-drafter fallback): routine
          # currency bump, no CVE. Checked both intermediate releases' real notes
          # directly (v1.1.2, v1.1.3) -- neither documents any breaking change; v1.1.2
          # is bug fixes + new opt-in experiments (oci/otel-logs/profiling/
          # azure-backend, none enabled here) + a find_in_parent_folders() perf win;
          # v1.1.3 is bug fixes (autoinclude values.* handling, generate-block
          # no-trailing-newline handling, mock_outputs timing, provider-cache race,
          # filter-negation logic) + four new opt-in experiments (block-iteration/
          # bounded-discovery/browse-tui/optional-dependency-outputs, none enabled
          # here) + a Go toolchain bump. Same "no cloud credentials reachable from
          # this sandbox" caveat as the v1.1.1 entry above -- this workflow's own
          # next real run is the actual verification.
          # Bumped v1.1.3 -> v1.1.4 (2026-09-06, JANITOR-fallback currency sweep):
          # real security hardening, no breaking change -- generated files/dirs now
          # get restricted permissions (0600/0700, previously world-/group-readable
          # on a shared machine), registry credentials are no longer duplicated into
          # generated CLI config files, and the toolchain moved to Go v1.27. Checked
          # the real v1.1.4 release notes directly; no documented breaking change.
          # Same "no cloud credentials reachable from this sandbox" caveat as the
          # entries above -- this workflow's own next real run is the actual
          # verification.
          curl -fsSL -o /usr/local/bin/terragrunt \
            https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64
          chmod +x /usr/local/bin/terragrunt

      - name: Render OCI + SSH credential files from secrets
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/oracle-creds"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oracle-creds/oci_api_key.pem"
          printf '%s' "${{ secrets.OCI_SSH_PUBLIC_KEY }}" > "$RUNNER_TEMP/oracle-creds/oracle-lab.pub"
          printf '%s' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > "$RUNNER_TEMP/oracle-creds/oracle-lab"
          chmod 600 "$RUNNER_TEMP"/oracle-creds/*

      - name: terragrunt ${{ inputs.action }} (${{ inputs.unit }})
        working-directory: infra/live/oracle/${{ inputs.unit }}
        env:
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY_PATH: ${{ runner.temp }}/oracle-creds/oci_api_key.pem
          OCI_SSH_PUBLIC_KEY_PATH: ${{ runner.temp }}/oracle-creds/oracle-lab.pub
          OCI_SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/oracle-creds/oracle-lab
          TFSTATE_ORACLE_ENDPOINT: ${{ secrets.TFSTATE_ORACLE_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
        run: |
          terragrunt init
          if [ "${{ inputs.action }}" = "apply" ]; then
            terragrunt apply -auto-approve
          else
            terragrunt plan
          fi

      - name: Clean up rendered credential files
        if: always()
        run: rm -rf "$RUNNER_TEMP/oracle-creds"
